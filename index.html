red-and-black flag symbolized blood and mourning for martyrs.",cat:"au_castro_rise"},{id:"ca8",q:"Why was Castro's \"History Will Absolve Me\" speech effective?",a:"It identified Cuba's crises with statistics and examples — landlessness, starvation, housing inequality, corruption, educational neglect. It denounced these crises and offered bold, specific reforms. Turned a courtroom defense into a revolutionary manifesto that inspired hope and unified opposition.",cat:"au_castro_rise"},{id:"ca9",q:"What was the Granma expedition?",a:"Castro's 1956 attempt to return from Mexican exile with about 80 armed rebels aboard the overloaded yacht Granma, landing on Oriente's southern coast to launch guerrilla war against Batista. Despite delays, mechanical failures, loss of supplies in a swamp, and a devastating ambush at Alegría de Pío leaving only 12 survivors — the group regrouped in the Sierra Maestra to form the Rebel Army.",cat:"au_castro_rise"},{id:"ca10",q:"Who were the key figures of the Sierra Maestra Rebel Army?",a:"RAÚL CASTRO — Fidel's brother; Moncada attacker; co-planned Granma; later President 2008. CHE GUEVARA — Argentine doctor recruited in Mexico; led guerrilla fighting; later ran purges, Bank, Industry; killed in Bolivia 1967. CAMILO CIENFUEGOS — Granma survivor; won Sierra Maestra battles; army chief; died in 1959 plane crash. VILMA ESPÍN — Raúl's wife; led urban support; founded Cuban Women's Federation. HAYDÉE SANTAMARÍA — Moncada attacker; founded Casa de las Américas. CELIA SÁNCHEZ — arranged Granma logistics; women's \"Mariana Grajales\" unit.",cat:"au_castro_rise"},{id:"ca11",q:"What was the role of women in the Cuban revolution?",a:"The 26th of July Movement promised gender equality, social justice, and an end to Batista's oppression — attracting urban activists like Vilma Espín, Haydée Santamaría, and Celia Sánchez, plus rural supporters. They wielded influence through urban coordination, arms smuggling, propaganda, founding women's units like the Mariana Grajales Brigade, and shaping post-revolutionary policy on women's rights and culture.",cat:"au_castro_rise"},{id:"ca12",q:"Why did the 26th of July Movement gain nationwide support?",a:"Nearly all social classes backed it — either for its revolutionary program or as the most effective anti-Batista force. Advantages: fighting on familiar, rugged terrain ideal for guerrilla warfare; unpaid but ideologically motivated soldiers; humane, skilled leaders who treated captured enemies kindly. Castro's image as an approachable leader connected to the peasantry won him cross-class support.",cat:"au_castro_rise"},{id:"ca13",q:"What methods did the rebels use?",a:"Bombings in the capital and against electric plants. Armed attacks on stores that killed police and civilians. Assassinations of transport drivers and passengers. Sabotage of power infrastructure by cutting electricity and destroying unique cables to hinder repairs. Combined with guerrilla operations from Sierra Maestra.",cat:"au_castro_rise"},{id:"ca14",q:"How did Batista contribute to the revolution's success?",a:"His brutal repression — mass torture and killings after Moncada and Granma — alienated the population. Failed to address landlessness (200,000 families without land), 17% unemployment, extreme poverty. Relied on military force not political solutions. The 1957 US arms embargo was devastating. By 1958, army morale collapsed. Batista's corruption and brutality made Castro's reform promises appealing across classes.",cat:"au_castro_rise"},{id:"ca15",q:"What was Havana like before the revolution?",a:"Meyer Lansky — the mob's strategic architect — ran Havana's gambling empire cooperating with Batista. The real 1946 Havana Conference saw crime bosses planning Cuban operations. Deep entanglement of organized crime, corrupt government, and foreign business represented everything the revolutionaries opposed — and illustrated why Cuban nationalism was inherently anti-American.",cat:"au_castro_rise"},{id:"ca40",q:"How did the Spanish-American War shape modern Cuba?",a:"The 1898 war ended 400 years of Spanish rule but replaced it with US tutelage. The USS Maine exploded in Havana harbour in February 1898 (likely an accident), giving the US a pretext for war. The 1898 Treaty of Paris transferred Cuba to American \"occupation\" until 1902. The 1901 Platt Amendment then made Cuba a US protectorate. So independence from Spain produced quasi-colonial subordination to Washington — the original wound Castro's revolution would heal.",cat:"au_castro_rise"},{id:"ca41",q:"How unstable was Cuba before the 1933 revolution?",a:"Republican Cuba had revolving presidents — Estrada Palma (1902), José Gómez (1909), Mario Menocal (1913), Alfredo Zayas (1921), Gerardo Machado (1925). Machado built infrastructure but became dictatorial; the Great Depression collapsed sugar prices ~75% by 1932. The 1933 revolution overthrew Machado and produced a brief reformist government under Ramón Grau which abrogated the Platt Amendment from the Cuban side. US ambassador Sumner Welles brokered Grau's overthrow with a young army sergeant — Fulgencio Batista — beginning Batista's two-decade dominance.",cat:"au_castro_rise"},{id:"ca42",q:"What was the 1940 Cuban Constitution and why did it matter?",a:"A progressive constitution adopted under Batista's first (legitimate) presidency. Guaranteed: 8-hour day, minimum wage, paid vacations, social security, women's suffrage, agrarian reform (Article 90 banning latifundios), free public education, racial equality. One of the most advanced constitutions of its era — but largely unenforced. Castro and the 26 July Movement made restoration of the 1940 Constitution their central demand: their revolution claimed not radical innovation but enforcement of Cuba's own existing law.",cat:"au_castro_rise"},{id:"ca43",q:"How did Batista return to power in 1952?",a:"Trailing badly in polls for the June 1952 election, Batista launched a bloodless coup on 10 March 1952, three months before the vote. He suspended the 1940 Constitution, dissolved Congress, cancelled elections, and ruled by decree. Crucially: Castro had been a candidate for the Ortodoxo party in those cancelled elections — he had been pursuing a legal political career. The coup foreclosed legal politics for an entire generation of reformers, channelling them toward armed struggle.",cat:"au_castro_rise"},{id:"ca44",q:"Who was Eduardo Chibás and how did he influence Castro?",a:"Founder of the Cuban People's Party (Ortodoxos) in 1947 — anti-corruption, nationalist, with the slogan \"Vergüenza contra dinero\" (shame versus money). Hosted weekly radio broadcasts denouncing graft. In August 1951, after a failed attempt to expose government corruption on air, Chibás shot himself in the stomach during a live broadcast and died days later. Castro joined the Ortodoxos and built on Chibás's anti-corruption message. Chibás's suicide showed that legal reform was failing — pushing the radical wing of Cuban politics toward insurrection.",cat:"au_castro_rise"},{id:"ca45",q:"What was Fidel Castro's background?",a:"Born 13 August 1926 in Birán, Oriente province, illegitimate son of a wealthy Galician landowner (Ángel Castro). Sent to elite Jesuit schools (Belén College in Havana). Studied law at the University of Havana (graduated 1950). Active in radical student politics: travelled to Bogotá in 1948 (witnessed the Bogotazo riots) and Dominican Republic adventures. Married Mirta Díaz-Balart 1948 (daughter of a Batista official; divorced 1955). His privileged background contradicts populist legend but explains his cosmopolitan ideology.",cat:"au_castro_rise"},{id:"ca46",q:"How important was the urban resistance in Castro's revolution?",a:"Often overshadowed by Sierra Maestra mythology, the urban \"Llano\" wing did much of the work. Frank País organised the 26 July Movement underground in Santiago — recruiting, finance, sabotage, smuggling weapons. The 30 November 1956 Santiago uprising, meant to coincide with the Granma landing, drew police attention from the coast and may have saved Castro. País was killed by police on 30 July 1957, aged 22; his funeral became a mass anti-Batista protest. Without the Llano, the Sierra would have starved.",cat:"au_castro_rise"},{id:"ca47",q:"Who was the Civic Resistance Movement?",a:"Founded 1957, the Movimiento de Resistencia Cívica was a network of middle-class professionals (lawyers, doctors, teachers, businessmen) who supported the 26 July Movement clandestinely — providing money, safe houses, propaganda, and lobbying foreign press. Critical because it gave Castro respectability with the bourgeoisie and abroad. Its very existence proved Batista had alienated even the elite — limiting his coercive options and isolating him diplomatically.",cat:"au_castro_rise"},{id:"ca48",q:"How did Herbert Matthews's interview help Castro?",a:"After the disastrous Granma landing left only ~12 men alive, Batista announced Castro had been killed. In February 1957 New York Times reporter Herbert Matthews trekked into the Sierra and interviewed Castro. Castro's brother Raúl marched the same handful of men past the camp twice to fake numbers; Matthews wrote that Castro had a \"powerful force.\" The article — front-page in the world's most influential newspaper — proved Castro alive, made him a romantic figure, and discredited Batista's propaganda. A textbook propaganda coup.",cat:"au_castro_rise"},{id:"ca49",q:"How did the US arms embargo on Batista accelerate his fall?",a:"In March 1958 the Eisenhower administration suspended military shipments to Batista. The embargo was a response to congressional and media outrage at Batista's atrocities (~20,000 killed during his rule by some estimates). Although covert aid continued, the symbolic withdrawal of the regime's chief external backer was decisive — Cuban officers concluded Washington had abandoned Batista. The army's morale collapsed; key generals began secret talks with Castro. Without US air force, Batista's failed summer 1958 offensive sealed his fate.",cat:"au_castro_rise"},{id:"ca50",q:"What was the Battle of Santa Clara and why was it decisive?",a:"In late December 1958, Che Guevara's column (~340 fighters) attacked the central city of Santa Clara, defended by ~3,500 government troops with armour and an armoured train. Che derailed the train and city fell on 1 January 1959 after 5 days of fighting. Cut Cuba in two and demoralised Batista, who fled to the Dominican Republic that same night with $300m looted from the treasury. Made Che Guevara a global revolutionary icon.",cat:"au_castro_rise"},{id:"ca51",q:"How did the US initially respond to Castro?",a:"Eisenhower recognised the new Cuban government on 7 January 1959 — six days after Castro entered Havana. The CIA initially viewed Castro as nationalist rather than communist. But the trial and execution of ~550 batistianos in early 1959, plus Castro's April 1959 visit to the US (where Eisenhower snubbed him by playing golf), eroded relations rapidly. By March 1960 Eisenhower authorised the CIA plan that became the Bay of Pigs. The relationship soured in months — historians still debate whether Washington pushed Castro into Soviet arms or whether Castro intended that all along.",cat:"au_castro_rise"},{id:"ca52",q:"How did the 26 July Movement fund itself?",a:"Three streams: (1) Donations from Cuban exiles in the US, especially in Miami and New York (raised ~$300,000 by 1958). (2) \"Revolutionary taxes\" levied on sugar mills, cattle ranchers, and businesses in eastern Cuba — paid for protection from sabotage. (3) Bank robberies and ransoms (the June 1958 kidnapping of 47 US sailors and Marines from Guantánamo brought international attention plus ransom). This pragmatic financing showed organisational sophistication far beyond a purely peasant rebellion.",cat:"au_castro_rise"},{id:"ca53",q:"Was Castro a communist before 1959? — historiographical debate.",a:"ORTHODOX (Tad Szulc, Hugh Thomas): Castro was a pragmatic radical-nationalist before 1959; Soviet alignment came in response to US hostility. REVISIONIST (Brian Latell, declassified KGB files): Castro had Marxist sympathies from his student years and consciously concealed them to broaden his coalition; the \"communist turn\" of December 1961 was deliberate fulfilment, not improvisation. SYNTHESIS: Castro's ideology was eclectic — nationalist, Martí-inspired, anti-imperialist — but he chose communism strategically once the US embargo and CIA hostility forced a choice between Soviet alliance or political collapse.",cat:"au_castro_rise"},{id:"ca16",q:"How did Castro consolidate power between 1959 and 1962?",a:"Removed batistianos and liberals from government; crushed revolts in the provinces; implemented radical reforms (land, nationalization); eliminated rival figures so no one could challenge his authority; moved to a more radical position — sought Soviet assistance; publicly declared himself Marxist-Leninist (December 1961).",cat:"au_castro_power"},{id:"ca17",q:"Why did the PSP (Communist Party) gain influence under Castro?",a:"PSP was the only well-organized party with administrative experience. It had long-standing ties to the USSR — essential as US relations collapsed. Moderates and liberals left Cuba or were pushed out → PSP filled the vacuum. Castro's own radicalization made PSP the natural governing partner. Mutual benefit: PSP gained power, Castro gained a disciplined apparatus.",cat:"au_castro_power"},{id:"ca18",q:"Why did Castro found the PCC?",a:"Stated reasons: a single unified party to guide Cuba toward socialism; PCC would be \"the highest leading force of society and of the state.\" Other reasons: eliminated rival political organizations by merging them into one party; centralized all political control under Castro personally; followed the Soviet one-party model (pleasing the USSR); made all opposition legally \"counter-revolutionary.\"",cat:"au_castro_power"},{id:"ca19",q:"Who was Huber Matos and what does his case reveal?",a:"Revolutionary commander who fought in Sierra Maestra; military governor of Camagüey. Criticized growing communist influence (October 1959) and tried to resign — Castro had him arrested for treason instead. Sentenced to 20 years in a show trial; served the full term. Reveals: zero tolerance for dissent even from revolutionary heroes; no internal debate allowed; show trials as political tools; personal loyalty to Castro mattered more than revolutionary credentials.",cat:"au_castro_power"},{id:"ca20",q:"What were Castro's main reforms 1959–62?",a:"AGRARIAN REFORM — limited land ownership; state owned 70% by 1963. NATIONALIZATION — foreign businesses, sugar mills, banks. URBAN REFORM — rents cut 50% (1959), later abolished. CURRENCY REFORM (1962) — non-state savings wiped out. LITERACY (1961) — 170,000 brigadistas; illiteracy from ~23% to 4%; more schools in 3 years than previous 58. FMC (1960) — Federation of Cuban Women.",cat:"au_castro_power"},{id:"ca21",q:"What did Castro's literacy campaign achieve?",a:"170,000 volunteer brigadistas deployed to rural areas. Illiteracy dropped from ~23% to 4%. More schools built in 3 years than in the previous 58. Private schools nationalized after Bay of Pigs; religious education restricted. Education also became ideological — textbooks focused on revolutionary heroes (Fidel, Che, Camilo); pro-revolution teachers replaced anti-revolution ones.",cat:"au_castro_power"},{id:"ca22",q:"How did US-Cuba tensions escalate after 1959?",a:"Nationalization of US-owned properties provoked Washington. US imposed commercial/financial embargo. Diplomatic relations broken. CIA planned and launched Bay of Pigs invasion. Meanwhile USSR-Cuba relations improved: USSR bought Cuban sugar at subsidized prices; supplied oil, machinery, goods, and military equipment; Soviet technicians arrived. Castro's Marxist-Leninist declaration cemented the alliance. US hostility essentially pushed Cuba into Soviet arms.",cat:"au_castro_power"},{id:"ca23",q:"How did the Bay of Pigs strengthen Castro?",a:"April 1961 CIA invasion was a humiliating US defeat. For Castro: (1) validated warnings about US imperialism, (2) rallied entire population behind revolution as national survival, (3) justified crackdowns on opposition as fighting \"imperialist agents,\" (4) accelerated embrace of communism and USSR ties. Castro's stature as a leader who defeated the superpower became cornerstone of revolutionary mythology.",cat:"au_castro_power"},{id:"ca24",q:"How did the Cuban Missile Crisis affect Castro?",a:"Showed USSR was willing to defend Cuba (placed nuclear missiles). But Soviets removed missiles without consulting Castro — disappointing. US promised not to invade Cuba — good for Cuban security. Castro realized Cuba was a bargaining chip in superpower politics. Net result: secured against US invasion, but exposed dependence on USSR.",cat:"au_castro_power"},{id:"ca25",q:"What did Castro say about communism in February 1959?",a:"He explicitly denied being communist: \"the thinking of the movement is not communist thinking.\" He described the 26th of July Movement as broadly revolutionary, not communist. Presented the revolution as nationalist and democratic. Stayed deliberately vague — refused to commit to any fixed system. Suggests he either hadn't committed yet or was strategically concealing his intentions.",cat:"au_castro_power"},{id:"ca26",q:"Why did Castro embrace communism by December 1961?",a:"(1) US hostility (embargo, Bay of Pigs) forced him to seek Soviet protection. (2) Soviet aid required ideological alignment. (3) Liberals/moderates removed → PSP filled vacuum with administrative experience and USSR connections. (4) Influence of Che Guevara and other committed Marxists. (5) Marxism-Leninism justified one-party rule. (6) Bay of Pigs victory emboldened him — no reason to maintain ambiguity anymore.",cat:"au_castro_power"},{id:"ca27",q:"What was Che Guevara's vision of the \"new man\"?",a:"A \"new man\" who would work for the collective good rather than personal gain; voluntary work based on revolutionary consciousness, not material need; the individual should feel \"more complete, with much more internal richness.\" In practice this idealism led to absenteeism and low productivity. Voluntarism failed (Revolutionary Offensive, 10 Million Tons campaign). People generally need material incentives to sustain productivity long-term.",cat:"au_castro_power"},{id:"ca28",q:"What were the CDRs?",a:"Committees for the Defence of the Revolution — surveillance committees in every workplace and neighborhood block. One-third of the population enrolled by 1963. They reported \"counter-revolutionary\" behavior to authorities. The most pervasive instrument of surveillance and social control in revolutionary Cuba.",cat:"au_castro_power"},{id:"ca29",q:"What were the UMAP camps?",a:"Forced-labour camps that held ~25,000 people: dissidents, homosexuals, religious objectors, and youth imitating US culture. Disproportionately targeted Afro-Cuban religious practitioners. Closed in 1968 after international criticism. The most brutal episode of Castro's repression aside from the early executions.",cat:"au_castro_power"},{id:"ca30",q:"What was the Padilla affair?",a:"In 1971, poet Heberto Padilla was arrested, tortured, and forced into a public confession for critical poetry. Launched the \"grey years\" of Cuban culture: artists became afraid to create anything potentially counter-revolutionary. The 1976 constitution allowed artistic freedom only if content supported the revolution. Castro's \"Words to the Intellectuals\" speech: \"Within the Revolution, everything; against the Revolution, nothing.\"",cat:"au_castro_power"},{id:"ca31",q:"What cultural institutions did Castro create?",a:"ICAIC (Cuban Institute of Cinematographic Art and Industry, 1959) controlled film production. UNEAC (National Union of Writers and Artists) organized cultural workers. In 1961, the documentary PM was censored for showing \"decadent\" Afro-Cuban dancing in Havana nightlife — it conflicted with revolutionary ideals. Libraries purged of \"inappropriate material.\"",cat:"au_castro_power"},{id:"ca32",q:"What was the Mariel Boatlift?",a:"Over 125,000 Cubans fled via the port of Mariel. Castro used emigration as a safety valve — releasing prisoners and mentally ill people onto the boats and calling all emigrants \"scum.\" Repressive but pragmatic: letting dissatisfied people leave prevented pressure from building to revolution.",cat:"au_castro_power"},{id:"ca33",q:"What was the Special Period?",a:"Began 1991 after USSR collapse — Soviet trade, subsidies, oil, technicians, and loans ended overnight. Severe food shortages — large cuts to rations. Disease spreading (optic neuropathy from malnutrition). Energy crisis: limited working hours, long blackouts. Response: state farms converted to worker-managed cooperatives; Cuba opened to foreign investment and tourism; US dollar legalized (1993); farmers' markets and limited self-employment allowed.",cat:"au_castro_power"},{id:"ca34",q:"What was the status of women under Castro?",a:"BEFORE 1959: vote (1934), legal equality (1940 constitution), but society remained patriarchal. AFTER 1959: equal access to all jobs by law; FMC (1960) ran training, literacy, health campaigns; daycare centres for working mothers; 1970s Family Code mandated men share housework. LIMITATIONS: society remained patriarchal in practice; men refused to share housework; women expected to be workers, volunteers AND traditional housewives; very few women in top decision-making positions; real aim may have been workforce expansion.",cat:"au_castro_power"},{id:"ca35",q:"How were religious groups treated under Castro?",a:"Some Catholic sectors initially welcomed the revolution; others suspicious. Castro accused critical bishops of meddling in politics. Schools nationalized; religious education limited to churches. Many congregations entered \"internal exile\" — invisible, no influence. 1976 constitution: illegal to oppose revolution on religious grounds. Relations improved during Special Period; Pope visited 1998. Religious people eventually allowed to join PCC.",cat:"au_castro_power"},{id:"ca36",q:"Did Castro achieve racial equality for Afro-Cubans?",a:"Afro-Cubans (~50% of population) faced pre-revolution discrimination. Revolution claimed to eradicate racial inequality and did desegregate public spaces and institutions. Critics: revolution raised living standards for the poor but deeper inequality persisted. Very few non-whites in positions of power within PCC or government. UMAP camps disproportionately targeted Afro-Cuban religious practitioners.",cat:"au_castro_power"},{id:"ca37",q:"How did Castro treat political opposition?",a:"CDRs (1960) — surveillance in every workplace/block; 1/3 of population enrolled by 1963. UMAP camps (1965–68) — ~25,000 in forced labour. Show trials (Matos, Padilla) used to intimidate. All mass media state-controlled since the 1960s. Freedom of association against the government does not exist. Emigration as safety valve — Mariel Boatlift (1980).",cat:"au_castro_power"},{id:"ca38",q:"How did Castro use propaganda?",a:"Central to his rise, consolidation, and maintenance of power. Mythologized the revolution and created a cult of personality. Radio Rebelde → later radio + TV made revolution a constant presence. *Granma* and *Bohemia* promoted government ideals. High literacy made written propaganda very effective. Castro's speeches: long oratory projecting image of engaged, heroic leader. Every policy framed in heroic/military terms (harvests = \"battles,\" plans = \"liberation campaigns\"). Visual posters rallied support and celebrated successes.",cat:"au_castro_power"},{id:"ca39",q:"To what extent did Castro achieve full authoritarian rule?",a:"EVIDENCE FOR: one-party state (PCC); Castro held all key positions simultaneously; National Assembly met few days/year (rubber stamp); CDR surveillance; UMAP camps; show trials; total media control; nationalized economy; education for indoctrination; cult of personality. QUALIFICATIONS: did not rely on mass terror/purges like Stalin; emigration as safety valve; periods of relaxation (post-1970, Special Period); maintained genuine popular support through education/healthcare/equality gains; more pragmatic and adaptive than \"full authoritarian\" suggests.",cat:"au_castro_power"},{id:"ca54",q:"What did the first Agrarian Reform Law do?",a:"Signed in the Sierra Maestra on 17 May 1959. Capped private landholdings at 30 caballerías (~400 ha — generous compared to most Latin American reforms). Expropriated foreign-owned and most large estates: ~40% of Cuba's farmland (~5m ha) was redistributed by 1961, including the giant US-owned sugar centrales. Compensation in 20-year bonds at low interest — which the US declared inadequate. The law (a) destroyed the Cuban landed oligarchy, (b) placed the new state agrarian agency INRA at the heart of the regime, and (c) directly triggered the US economic break.",cat:"au_castro_power"},{id:"ca55",q:"What did the second Agrarian Reform Law (1963) achieve?",a:"Lowered the cap from 30 to 5 caballerías (~67 ha). Expropriated the remaining medium-sized farms, completing the elimination of the rural bourgeoisie. By 1963 ~70% of farmland was state-owned. The state-farm model that resulted was inefficient — productivity fell. Cuba had to import food it had once exported. Showed how revolutionary egalitarianism could undermine economic performance — a tension Castro never resolved.",cat:"au_castro_power"},{id:"ca56",q:"How did Castro nationalise Cuba's economy in 1960?",a:"A summer of expropriation. June 1960: Cuban refineries owned by Esso, Texaco, and Shell refused to refine Soviet crude — Castro nationalised them. July 1960: Eisenhower cut the US sugar quota by 700,000 tons; Castro retaliated by nationalising US sugar mills. August–October 1960: ~$1bn of US-owned property nationalised — utilities, banks, factories. By the end of 1960 essentially all foreign and large domestic enterprises were state-owned. The transformation was faster and more total than even the early USSR had managed.",cat:"au_castro_power"},{id:"ca57",q:"When and how did the US embargo on Cuba take shape?",a:"Began with partial measures: October 1960 export embargo (excluding food and medicine); January 1961 diplomatic break under Eisenhower. Kennedy made it total in February 1962 and added travel restrictions in 1963. The Helms-Burton Act (1996) entrenched it, codifying it as law (so only Congress can lift it). Cuban official estimates put cumulative damages at over $130 billion. Ironically the embargo strengthened Castro by giving him a permanent external scapegoat for any economic failure.",cat:"au_castro_power"},{id:"ca58",q:"When did Castro publicly declare the revolution socialist?",a:"At the funeral of victims of the US-backed bombing raids that preceded the Bay of Pigs (15 April 1961), Castro declared the revolution to be \"socialist\" and warned the imperialists they would have to fight a \"socialist revolution.\" It was the first explicit public declaration. Five days later the failed Bay of Pigs landing seemed to vindicate his alignment. December 1961 he made it explicit: \"I am a Marxist-Leninist and shall be one until the day I die.\"",cat:"au_castro_power"},{id:"ca59",q:"How did the Sino-Soviet split affect Cuba?",a:"From 1962 Castro had to choose between Beijing and Moscow. China offered ideological purity (permanent revolution, anti-imperialism); Moscow offered subsidies. Castro publicly criticised both at points (1965: tilted to China after Soviet \"betrayal\" at Cuban Missile Crisis; 1968: backed Soviet invasion of Czechoslovakia after Soviets agreed to maintain subsidies). After the 1968 \"Revolutionary Offensive\" failed, Cuba moved firmly into the Soviet orbit — at the cost of revolutionary autonomy.",cat:"au_castro_power"},{id:"ca60",q:"What was the \"Zafra de los Diez Millones\" of 1970?",a:"Castro's 1970 attempt to harvest 10 million tons of sugar — what he called a \"battle for the country's honour.\" Workers from every sector were drafted into cane fields; factories closed; even Castro cut cane. Final harvest fell short at 8.5 million tons; the rest of the economy was wrecked — industrial output collapsed ~25%. Cuba had to admit total failure and accept Soviet economic management. Marked the end of revolutionary voluntarism (Che's \"moral incentives\") and the move to Soviet-style central planning.",cat:"au_castro_power"},{id:"ca61",q:"Where did Cuba intervene militarily in Africa, and why?",a:"Cuban combat troops fought in: Algeria (1963 vs Morocco), Congo (1965 with Che), Guinea-Bissau (1966–74 against Portugal), Angola (Operation Carlota, 1975–91 — peak ~50,000 troops), Ethiopia (1977–88 — 17,000 troops in the Ogaden War). Cumulatively ~377,000 Cubans served abroad; ~2,000 died. Made Cuba a serious global power for a small island. Motivations: revolutionary internationalism (genuine), Soviet alignment (subsidised), and personal prestige for Castro on the world stage.",cat:"au_castro_power"},{id:"ca62",q:"What was the Mariel Boatlift?",a:"After ~10,000 Cubans rushed the Peruvian embassy in April 1980 seeking asylum, Castro opened the port of Mariel from 15 April to 31 October 1980. ~125,000 Cubans (later called \"Marielitos\") sailed to Florida. Castro emptied prisons and mental hospitals — ~2% of arrivals had criminal records, fuelling stigma. Demonstrated that 20 years of communism had not eliminated the desire to leave; ~10% of Florida arrivals were Black or mixed-race, contradicting Castro's \"everyone leaving is rich\" narrative. Dented Carter's re-election campaign.",cat:"au_castro_power"},{id:"ca63",q:"How severe was the Special Period in Peace?",a:"Following the USSR's collapse in 1991, Soviet aid (~$4–6bn/year, ~30% of GDP) vanished. Cuban GDP fell ~35% between 1989 and 1993. Imports collapsed ~80%. Average daily caloric intake fell from ~3,000 to ~1,860 kcal; the average Cuban lost ~5–10 kg in weight 1990–95. Petrol rationed; oxen replaced tractors; bicycles distributed by the million. Suicide and rafter departures (~30,000 in 1994 alone) spiked. Reforms (legalisation of US dollar 1993, joint ventures, family remittances, agromercados) saved the regime but created new inequalities.",cat:"au_castro_power"},{id:"ca64",q:"What did the 1976 Constitution institutionalise?",a:"Cuba's first post-revolution constitution. Created the Organs of People's Power (Poder Popular) — municipal, provincial, and national assemblies. Officially defined Cuba as a socialist state guided by Marxism-Leninism, with the PCC as \"the leading force of society and the State.\" Castro became President of the Council of State (head of state) and Council of Ministers (head of government), commander of the FAR, and First Secretary of the PCC — concentrating all formal power. National Assembly met just twice a year for a few days. Institutionalised personalism with a constitutional veneer.",cat:"au_castro_power"},{id:"ca65",q:"How significant is the Cuban exile community?",a:"~1.4 million Cuban-Americans by 2010, mostly in South Florida. Three main waves: (1) elite exodus 1959–62 (professionals, businessmen); (2) freedom flights 1965–73; (3) Mariel 1980; plus Special Period rafters 1990s. The Miami exile community wields decisive power in Florida and US Cuba policy via groups like the Cuban American National Foundation (founded 1981 by Jorge Mas Canosa). Their lobby helped pass the 1992 Torricelli Act and 1996 Helms-Burton Act. The exiles' political weight is itself a long-term consequence of Castro's decision to expel rather than accommodate dissent.",cat:"au_castro_power"},{id:"ca66",q:"What did Cuban healthcare achieve under Castro?",a:"Genuine successes: infant mortality fell from ~37/1000 (1959) to ~4.3/1000 (2018) — better than the US. Life expectancy rose from ~63 (1959) to ~78 (2018). Doctor-to-patient ratio became one of the world's highest. Universal free care from primary clinics to specialised hospitals. Medical internationalism: ~50,000 Cuban doctors served abroad by 2010. Limits: chronic shortages of medicines (especially during embargo and Special Period); aged equipment; foreign patients in special facilities while Cubans queued; brain drain — a doctor's salary ~$25/month in 2010s, less than tourism workers' tips.",cat:"au_castro_power"},{id:"ca67",q:"How transformative was Cuban education?",a:"1961 Literacy Campaign cut illiteracy from ~24% to ~4% in one year — UNESCO-verified. By 2018 adult literacy was ~99.7%. Free education through university; mass mobilisation of women into work and education; world-class share of GDP spent on education (~13%, one of the highest in the world). Limits: curriculum saturated with Marxist-Leninist content; political loyalty required for higher education; expression strictly bounded. Universidades populares spread but academic freedom did not.",cat:"au_castro_power"},{id:"ca68",q:"What was the General Ochoa case?",a:"General Arnaldo Ochoa was a hero of the Angola war. In June 1989 he was arrested with three other senior officers and charged with drug trafficking, corruption, and treason. Tried in 4 days, sentenced to death, and executed by firing squad on 13 July 1989. Defenders argued Ochoa was framed because his stature threatened Castro and because he had connections to Gorbachev-style reformers. The case purged the FAR of officers who might emulate Eastern European reform — and signalled that Cuba would not follow Gorbachev's path. Sealed Castro's response to the 1989 revolutions: \"Socialism or death.\"",cat:"au_castro_power"},{id:"ca69",q:"What was the Black Spring of 2003?",a:"In March 2003 Castro's regime arrested 75 dissidents — independent journalists, librarians, opposition leaders, including Oscar Espinosa Chepe and Raúl Rivero. Trials lasting only days; sentences up to 28 years. Three hijackers were executed within 10 days the same month. Triggered the EU \"Common Position\" sanctions and global outrage. Showed Castro's capacity for selective severe repression even in a post-Cold War world. The detained dissidents' wives founded \"Damas de Blanco\" (Ladies in White), a marching protest movement.",cat:"au_castro_power"},{id:"ca70",q:"How and why did Castro hand power to Raúl?",a:"31 July 2006: Castro, hospitalised for intestinal surgery, formally transferred his duties (President of the Council of State, First Secretary of PCC, Commander-in-Chief) to his brother Raúl Castro. The \"provisional\" handover became permanent on 24 February 2008 when the National Assembly elected Raúl president. Marked the end of 49 years of Fidel's direct rule. Raúl introduced cautious economic reforms (~500,000 small private licenses by 2013, US dollar-equivalent currency unification 2021). Fidel died 25 November 2016, aged 90.",cat:"au_castro_power"},{id:"ca71",q:"How did Castro feel about Khrushchev after the missile crisis?",a:"Furious. Khrushchev had withdrawn the missiles without consulting Castro — Castro learned via Radio Moscow on 28 October 1962. Castro reportedly broke a mirror and called Khrushchev a \"son of a bitch... no cojones.\" He demanded \"five points\" Khrushchev refused to meet (US withdrawal from Guantánamo, end of subversion, end of overflights, etc.). Cuba's brief tilt toward China in the mid-1960s was partly Castro's punishment for Soviet \"betrayal.\" Highlighted Cuba's inferior status in the Soviet alliance — the moment that radicalised Castro's revolutionary internationalism.",cat:"au_castro_power"},{id:"ca72",q:"How did Cuba support revolutionary movements in Latin America?",a:"Castro provided training, arms, and funds to: the Sandinistas in Nicaragua (FSLN, who won power July 1979); the FMLN in El Salvador; M-19 in Colombia; Tupamaros in Uruguay; Montoneros in Argentina; Allende's Popular Unity in Chile (state-to-state aid 1970–73). Che Guevara died trying to spark a Bolivian revolution (October 1967). The export of revolution made Cuba the most influential small state in Latin America — but also justified US Cold War intervention, prolonged Cuba's diplomatic isolation, and yielded few lasting victories outside Nicaragua.",cat:"au_castro_power"},{id:"ca73",q:"How did the regime's policy on religion change in 1991?",a:"From 1959 to 1991, religion was suppressed: religious schools nationalised (1961), believers excluded from PCC membership, ~131 priests expelled in 1961. In 1991, the 4th PCC Congress allowed religious believers to join the Party. The 1992 Constitution declared Cuba a secular (rather than atheist) state. John Paul II visited in January 1998; Pope Francis brokered the 2014 US-Cuba thaw. The shift coincided with Special Period crisis: Castro needed civil society institutions and Catholic charities (Caritas) for relief.",cat:"au_castro_power"},{id:"ca74",q:"What was the 2014–17 thaw and why did it matter?",a:"After 18 months of secret Vatican-mediated talks, Obama and Raúl Castro announced normalisation on 17 December 2014. Embassies re-opened in 2015. Obama visited Havana in March 2016 — the first US president since Coolidge (1928). Trump partially reversed (June 2017) and Biden only modestly relaxed restrictions. Showed that the Cuban regime survived its founder, but that the US embargo had failed to topple it after 55 years. Brought ~600,000 US visitors to Cuba in 2016 — short-lived prosperity.",cat:"au_castro_power"},{id:"ca75",q:"What did Helms-Burton do and why was it controversial?",a:"Passed after Cuba shot down two \"Brothers to the Rescue\" exile aircraft (Feb 1996, 4 dead). Codified the embargo as US law — only Congress (not the President) can lift it. Title III allows US nationals to sue foreign companies trafficking in confiscated Cuban property. The EU, Canada, Mexico denounced it as extraterritorial. Largely waived by every president until Trump partially activated Title III in 2019. Showed how US Cuba policy was hostage to the Florida exile lobby — and how the embargo had become more punitive even as the Cold War rationale evaporated.",cat:"au_castro_power"},{id:"ca76",q:"How does Castro compare to Mussolini and Perón?",a:"IDEOLOGY: Castro = explicit Marxism-Leninism (post-1961); Mussolini = Fascism (eclectic nationalist); Perón = \"Justicialism\" (vague third-position). PROPERTY: Castro nationalised; Perón regulated; Mussolini preserved private ownership. PARTY: Castro one-party (post-1965); Mussolini one-party (post-1926); Perón dominant party in formally pluralist system. LONGEVITY: Castro 49 years; Mussolini 21; Perón 9 + comeback. RESILIENCE: only Castro survived his founder by transitioning to a successor — partly because the embargo fed external legitimacy.",cat:"au_castro_power"},{id:"ca77",q:"How do historians interpret Castro's revolution?",a:"TRIUMPHALIST (early Latin American left, 1960s–70s): a heroic break with imperialism. ORTHODOX/LIBERAL (Hugh Thomas, Ted Henken): Cuba traded one form of dependency (USA) for another (USSR), with personalist authoritarianism inseparable from the revolution. REVISIONIST (Aviva Chomsky, Lillian Guerra): emphasises social gains (literacy, healthcare) and the structural impact of the US embargo. POST-COLONIAL (Alejandro de la Fuente, on race): the revolution undermined formal racism but preserved social inequalities and silenced Afro-Cuban civil society. Most current scholarship: a hybrid — genuine social transformation, real authoritarian repression, and a regime whose survival owed as much to US hostility as to its own legitimacy.",cat:"au_castro_power"},{id:"rc1",q:"Why was the Muslim conquest of Iberia so easy in 711?",a:"Division among the Goths — the Germanic rulers since Rome's decline — caused by struggles over kingship. The Moors defeated Roderic, the last Gothic king, and swept across nearly the entire peninsula in just a few years. The conquest's speed reflected Visigothic weakness rather than overwhelming Muslim military strength. Collaboration with local populations including Jews and disaffected Christians who saw Muslims as liberators from Visigothic oppression also played a role.",cat:"rc_islamic"},{id:"rc2",q:"How many men did Tariq ibn Ziyad have at the crossing of 711?",a:"Tariq crossed the Strait of Gibraltar with approximately 7,000 men, mostly Berber troops from North Africa. Roderick, the Visigoth monarch, had a much larger army of 20,000 to 40,000 men — but he was in the north fighting a rebellion among the Basques when Tariq crossed. By the time Roderick marched south to confront the invasion, he was too late. The Visigothic army's superior numbers counted for nothing against internal disunity.",cat:"rc_islamic"},{id:"rc3",q:"Why was the Muslim conquest of North Africa difficult?",a:"Unlike the rapid conquest of Iberia, North Africa proved extremely challenging. Muslim forces faced both vigorous resistance from the Berber tribes and the remaining garrisons of Byzantine cities. Internal conflict and political disputes among the Muslim commanders further complicated the campaign. This tells us the Muslim world was divided even during its period of expansion — unity of purpose didn't mean unity of command.",cat:"rc_islamic"},{id:"rc4",q:"Why are sources on the 711 conquest limited?",a:"No contemporary Arabic accounts of the 711 Muslim conquest of Iberia survive. Later accounts focus more on interesting stories than the careful ordering of events. Historians must rely on sources written decades or centuries after the events. The conquest's success owed partly to collaboration with local populations including Jews and disaffected Christians who saw the Muslims as liberators from Visigothic oppression.",cat:"rc_islamic"},{id:"rc5",q:"What were the Moors' contributions to Iberia and Western Europe?",a:"Transformative. New irrigation and water-lifting devices. New crops (sugar, cotton, silk). Paper and glass. Córdoba became one of Europe's largest cities. Mathematics (algebra, the zero), medicine, philosophy (Aristotle translations), architecture (the Alhambra, Great Mosque of Córdoba). The Islamic golden age preserved classical knowledge that Christian Europe had lost. The transfer of knowledge was so significant that without it, the Renaissance might never have happened.",cat:"rc_islamic"},{id:"rc6",q:"What was the political history of al-Andalus under Umayyads and Abbasids?",a:"The Iberian Peninsula became the westernmost tip of the Umayyad Caliphate of Damascus after 711. In 750, the Umayyads were overthrown by the Abbasids. But in 756, Abd ar-Rahman I — a survivor of the Umayyad dynasty — arrived in al-Andalus, seized power, and proclaimed himself emir. He founded an independent dynasty that survived until the 11th century, distancing al-Andalus from the Abbasid Caliphs. This independence allowed Córdoba to develop its own golden age in the 10th century.",cat:"rc_islamic"},{id:"rc7",q:"What was \"La Convivencia\" — and how true was it?",a:"Claimed period of religious harmony between Muslims, Christians, and Jews from the Moorish conquest to the 1492 expulsion of the Jews. Bernard Lewis: a \"golden age\" — despite second-class citizenship, non-Muslims were still citizens with rights, exceptional by medieval standards. David Nirenberg argues violence was \"central and systematic\" — e.g., the 1066 organized massacre of Jews in Granada. Truth lies between: tolerance was real but conditional, and deteriorated significantly over time.",cat:"rc_islamic"},{id:"rc8",q:"How were non-Muslims treated in Islamic Spain?",a:"Better than expected: not in separate districts, not slaves, could practice faith (with restrictions), could earn a living, could contribute to society. BUT: must acknowledge Islamic superiority, pay extra taxes (jizya), avoid blasphemy, not convert Muslims, wear a special badge, not carry weapons, not own Muslim slaves, not marry Muslim women (Muslim men could marry non-Muslim women). Oppression increased over time.",cat:"rc_islamic"},{id:"rc9",q:"Why were non-Muslims tolerated in Islamic Spain?",a:"Three key reasons: (1) Judaism and Christianity were monotheistic faiths recognized by Islam (\"People of the Book\"); (2) non-Muslims vastly outnumbered Muslims initially, making mass conversion or execution impractical; (3) Quranic passages mandated toleration of \"People of the Book\" under specific rules. However, tolerance deteriorated over time — the organized massacre of Jews in Granada in 1066 shows the limits.",cat:"rc_islamic"},{id:"rc10",q:"How did oppression in Islamic Spain worsen over time?",a:"Not all Muslim rulers were tolerant. As time passed, the position of non-Muslims deteriorated substantially due to threats from outside forces. The 1066 organized massacre of Jews in Granada was a stark example. By later periods, Christians could not display any sign of their faith outside their homes — there were persecutions and executions. As Christian rulers reconquered territory, Muslims in Christian regions started facing similar restrictions.",cat:"rc_islamic"},{id:"rc11",q:"What caused the decline and fall of Islamic al-Andalus?",a:"Not only increasing aggression from Christian states but also internal divisions among the caliphate and Islamic rulers. Unity was briefly restored under General Yusuf bin Tashfin with forces from Africa (Almoravids 1086, Almohads 1147). But internal rebellions in 1144–45 shattered any remaining Muslim unity permanently. Battle of Las Navas de Tolosa (1212) broke Muslim military power for good.",cat:"rc_islamic"},{id:"rc12",q:"Who were the Almoravids and Almohads?",a:"North African Muslim warrior groups called in to help defend al-Andalus against Christian advances. The Almoravids were invited in 1086 after the fall of Toledo to Christian forces. The Almohads were invited in 1147 after the fall of Lisbon. Both temporarily restored Muslim military strength, but neither could prevent the long-term fragmentation of Muslim territory. After 1144–45, internal rebellions shattered any remaining Muslim unity permanently.",cat:"rc_islamic"},{id:"rc13",q:"Why did the breakup of the Caliphate of Córdoba matter?",a:"Internal political and religious conflicts collapsed the Caliphate of Córdoba into numerous taifas — small, competing kingdoms individually too weak to resist Christian pressure. This was the critical turning point: Christian kingdoms in the north could now consolidate and launch the Reconquest. Christian survival became Christian advance.",cat:"rc_islamic"},{id:"rc14",q:"What does the Great Mosque of Córdoba reveal about al-Andalus?",a:"It was repeatedly extended by successive Muslim rulers, becoming one of the architectural wonders of the medieval world. After the Reconquista, Christians built a cathedral in the middle of the mosque rather than demolish it — acknowledging its architectural superiority. A 10th-century German visitor described Córdoba as \"the ornament of the world.\" The mosque exemplifies the cultural sophistication of al-Andalus.",cat:"rc_islamic"},{id:"rc98",q:"What was Visigothic Spain like in 711?",a:"A Christian kingdom ruled by a small Germanic Visigothic elite (~1–2% of population) over a much larger Hispano-Roman population. The 7th-century kings (Reccared, Sisebut) had unified the kingdom under Catholic Christianity, but inheritance was elective and contested. King Roderic had taken the throne in 710 amid civil war. The Jewish population (~150,000) had been viciously persecuted by laws of 612 and 694 — many welcomed the Muslim invasion. So Spain in 711 was a brittle, divided kingdom — not a fortress.",cat:"rc_islamic"},{id:"rc99",q:"What was the Battle of Guadalete?",a:"The decisive battle of the Muslim conquest, fought on 19 July 711 near the Río Guadalete in southern Spain. King Roderic met Tariq ibn Ziyad's force of ~12,000 Berbers; Roderic's army (~25,000) was betrayed when wings led by sons of King Witiza (Roderic's predecessor) defected mid-battle. Roderic disappeared (possibly killed). The Visigothic state collapsed within months. Showed that the conquest succeeded less because Berber armies were strong than because Visigothic politics was broken.",cat:"rc_islamic"},{id:"rc100",q:"Who was Pelayo and what was Covadonga?",a:"Pelayo (~685–737), a Visigothic noble who took refuge in the Asturian mountains, defeated a small Muslim force at Covadonga around 722. By Christian tradition this is the start of the Reconquest. The battle was probably more skirmish than victory — but Pelayo founded the Kingdom of Asturias, the seed of the future Christian kingdoms (León, Castile, Portugal). Later medieval chroniclers (the 9th-century Chronicle of Alfonso III) inflated Covadonga into a divinely guided turning point — a foundational myth of Spanish Christian identity.",cat:"rc_islamic"},{id:"rc101",q:"How did the Emirate of Córdoba form?",a:"When the Umayyad caliphate fell to the Abbasids in 750 (mass slaughter of the Umayyad family at Damascus), one prince — Abd al-Rahman I — escaped through North Africa and reached Spain in 755. Local Arab governors recognised him; in 756 he founded the independent Emirate of Córdoba. For the first time al-Andalus was politically separate from the eastern Islamic world. The dynasty he founded would last until 1031 and produce the most sophisticated state in 10th-century Europe.",cat:"rc_islamic"},{id:"rc102",q:"When did Córdoba become a Caliphate and what was its peak?",a:"Abd al-Rahman III declared himself Caliph in 929, creating the Caliphate of Córdoba — the high point of al-Andalus. Population of Córdoba reached ~250,000 to 500,000 by 1000 (compared to ~15,000 in contemporary Paris). 70 libraries (the royal library reportedly held ~400,000 volumes), 3,000 mosques, 700 public baths, paved and lit streets. Hospitals, observatories, and the Madinat al-Zahra palace complex. Income from agriculture and silver mines exceeded that of any contemporary European state. The 10th-century nun Hroswitha of Gandersheim called Córdoba \"the ornament of the world.\"",cat:"rc_islamic"},{id:"rc103",q:"Who were the great scholars of al-Andalus?",a:"Muslim: Averroes (Ibn Rushd, 1126–98), Aristotelian philosopher whose commentaries shaped Christian scholasticism; Ibn Hazm (994–1064), polymath; al-Zahrawi (936–1013), surgeon. Jewish: Maimonides (1138–1204), philosopher of the Guide for the Perplexed; Hasdai ibn Shaprut, court physician and patron of Hebrew poetry. Christian: the 12th–13th century Toledo School of Translators turned Arabic and Hebrew works (especially Greek philosophy preserved in Arabic) into Latin — the channel by which Aristotle returned to Western Europe. al-Andalus was the cosmopolitan bridge of medieval scholarship.",cat:"rc_islamic"},{id:"rc104",q:"How did Muslims transform Iberian agriculture?",a:"The \"Arab Agricultural Revolution\" introduced new crops: rice, sugar cane, cotton, oranges, lemons, bananas, spinach, eggplant, hard wheat. Sophisticated irrigation: qanats (underground channels), norias (water-wheels), acequias (canals) — many still in use in Valencia and Murcia. Productivity per hectare in irrigated valleys roughly doubled. Population of al-Andalus grew to ~7 million by ~1000 (vs ~3 million in Christian Spain). The farming techniques and water-rights traditions long outlived Muslim rule.",cat:"rc_islamic"},{id:"rc105",q:"How did the dhimma actually work?",a:"Christians and Jews (ahl al-kitab, \"People of the Book\") were dhimmis — protected non-Muslims. They could practise their religion, own property, and govern internal affairs through their own bishops, rabbis, and law courts. They paid the jizya (poll tax) and kharaj (land tax) — typically 1–2 dinars/year for adult men. They could not bear arms, ride horses, or build new churches/synagogues taller than mosques. They could not proselytise to Muslims; conversion away from Islam was punishable by death. Status was second-class but legally secure — far better than most contemporary Christian treatment of Jews and Muslims.",cat:"rc_islamic"},{id:"rc106",q:"Who were the Mozarabs?",a:"Arabised Christians of al-Andalus — derived from Arabic musta'rib (\"would-be Arab\"). Kept their faith and Latin liturgy but adopted Arabic language, dress, names, and culture. By the 10th century many spoke Arabic as their first language. Some moved north into Christian kingdoms after the 9th-century martyr movement and the 12th-century Almohad persecutions, carrying Andalusi culture and the Mozarabic Rite of liturgy. Showed that \"Christian\" and \"Muslim\" were not always sealed cultural worlds.",cat:"rc_islamic"},{id:"rc107",q:"What was the Cordoban martyrs movement?",a:"A radical Christian protest in Córdoba in the 850s. About 48 Christians (most prominent: priest Eulogius and the layman Albar) deliberately publicly insulted Muhammad — knowing the Maliki legal penalty was death. They sought martyrdom to revive a Christian community they saw as drifting into Arabised assimilation. The Caliph executed them. Eulogius wrote the \"Memorial of the Saints\" before his own execution in 859. Showed that even at the peak of \"convivencia,\" tensions over assimilation were sharp.",cat:"rc_islamic"},{id:"rc108",q:"How did al-Mansur dominate the late Caliphate?",a:"After 976 the boy-Caliph Hisham II was puppet to his chamberlain Muhammad ibn Abi Amir, known as al-Mansur (\"the Victorious\"). Al-Mansur led ~57 raids into Christian Spain (985 sacked Barcelona; 997 sacked Santiago de Compostela, taking the cathedral bells to Córdoba as trophies). His mother Subuh, a Basque slave-concubine of Caliph al-Hakam II, had elevated him through court politics. After al-Mansur's death (1002), his sons could not maintain his grip; civil war (the fitna) destroyed the Caliphate by 1031.",cat:"rc_islamic"},{id:"rc109",q:"What was the Fitna of al-Andalus and how did taifas emerge?",a:"The \"fitna\" (1009–31) was a civil war among Berber, Andalusi-Arab, and Slavic factions over the Caliphate. By 1031 the Caliphate of Córdoba had splintered into ~30 small kingdoms — the taifa kingdoms (from Arabic taifa, \"faction\"). Major taifas: Seville, Granada, Toledo, Zaragoza, Valencia. Politically they were weak — they paid parias (tribute) to the Christian kingdoms to avoid attack. Culturally a golden age — small courts competed in poetry, philosophy, and architecture. The political fragmentation invited the Christian advance.",cat:"rc_islamic"},{id:"rc110",q:"Why did the Almoravids invade and what was the result?",a:"After Alfonso VI of Castile took Toledo (1085), the taifa kings called for help from the Almoravid Berber dynasty of Morocco. Yusuf ibn Tashfin landed in 1086 and crushed Alfonso at the Battle of Sagrajas. By 1094 the Almoravids had absorbed most taifas — re-imposing strict Sunni Maliki orthodoxy, persecuting Jews, taxing Christians, banning wine and music. Many Mozarabs and Jews fled north to Christian Spain. Showed that \"saving\" al-Andalus from Christians meant ending the cosmopolitan culture that had made it distinctive.",cat:"rc_islamic"},{id:"rc111",q:"How were the Almohads even more rigid than the Almoravids?",a:"The Almohads (\"the affirmers of God's unity\") were a radical Berber reform movement under Ibn Tumart that overthrew the Almoravids in Morocco (1147) and crossed to Spain (1147–58). They rejected the dhimma — non-Muslims must convert, leave, or die. Many Jews (including the family of Maimonides) fled to Christian Spain or Egypt. Christian communities were destroyed. The Almohad capital was Seville; the Giralda tower (1184) survives as their monument. The Battle of Las Navas de Tolosa (1212) broke their power; they collapsed by ~1230.",cat:"rc_islamic"},{id:"rc15",q:"What was the Reconquest?",a:"Centuries-long Christian campaign to reclaim Iberia from Muslim rule. The discovery of St. James's tomb in northwest Spain gave the Christian kingdoms a warrior patron saint. Early stages saw political opportunism — El Cid fought for both sides. By the 13th century, Muslim territory was reduced to the small Kingdom of Granada. Final conquest under Ferdinand and Isabella in 1492.",cat:"rc_reconquest"},{id:"rc16",q:"What does El Cid reveal about the early Reconquest?",a:"Rodrigo Díaz de Vivar (\"El Cid\") was a Castilian nobleman who fought for both Christian and Muslim rulers — hiring his services to whichever side offered the best terms. He epitomizes the political opportunism of the early Reconquest, when alliances crossed religious lines and personal gain mattered more than ideology. The Reconquest was not a continuous holy war but a centuries-long process where pragmatism frequently trumped religion.",cat:"rc_reconquest"},{id:"rc17",q:"How did the Reconquest shape Spanish culture?",a:"Centuries of warfare made war almost a Castilian way of life, creating a large class of warrior-nobles (hidalgos) with contempt for manual labour. Sheep favoured over agriculture because constant raids made farmland vulnerable — the powerful Mesta guild dominated. \"The frontier wars against the Moors had bred a race of gentlemen proud of their Christian blood but without a penny. Their one resource was to go to the wars.\" This mentality was directly transferred to the New World.",cat:"rc_reconquest"},{id:"rc18",q:"What was the Mesta and how did warfare shape Castilian economy?",a:"A powerful guild of sheep owners dominating Castile's economy. Constant frontier warfare made farmland vulnerable to raids, so mobile property (sheep) was favoured over fixed agriculture. This created hidalgos — \"men proud of their Christian blood but without a penny, whose one resource was to go to the wars.\" This warrior culture and contempt for manual labour transferred directly to the New World.",cat:"rc_reconquest"},{id:"rc19",q:"How did Castile and Aragon differ?",a:"Castile was ruled by powerful land-holding nobles and aristocracy; agricultural region driven by large land ownership. Aragon was governed by industrial and commercial powers — merchants gained power through Mediterranean trade and commerce; trade region. These distinct identities still shape the regions today.",cat:"rc_reconquest"},{id:"rc20",q:"What was the Battle of Las Navas de Tolosa?",a:"A decisive turning point in the Reconquest. A coalition of Christian kingdoms defeated Muslim forces, breaking Muslim military power in Iberia for good. Soon after, Córdoba and Seville fell to Christian armies. By 1252, the Kingdom of Granada was the only remaining sovereign Muslim state in the peninsula. Las Navas de Tolosa turned the Reconquest from a slow territorial struggle into an accelerating Christian advance.",cat:"rc_reconquest"},{id:"rc21",q:"How did the Nasrid Kingdom of Granada survive so long (1230–1492)?",a:"\"The foundation of the Kingdom of Granada was laid by consent, not force.\" Muhammad I secured his position in 1232 by agreeing to become a tributary vassal of Castile under Ferdinand III — paying tribute (mostly in gold) and offering military support. This made Granada a useful buffer state for Castile. Castilian kings often preferred the tribute revenue over the cost of conquest. Internal noble revolts and succession crises in Castile repeatedly delayed aggression. Granada also exploited Christian rivalries — in 1406, Granada even supplied troops for a joint Castile-Granada operation against the Marinids in North Africa.",cat:"rc_reconquest"},{id:"rc22",q:"What were the \"golden years\" of Granada?",a:"Under rulers Yusuf I and Muhammad V, Granada maintained peace with Castile through skillful diplomacy. Trade in silk and other goods flourished. Muhammad V's reign saw the Alhambra adorned with stucco, tiles, and poetry — using Pythagorean geometry in the ground plan and wall decoration. A truce with Castile and trade with North Africa brought wealth, enabling funding of arts and architecture over military spending. These decades produced some of the most magnificent Islamic architecture ever built.",cat:"rc_reconquest"},{id:"rc23",q:"How did internal divisions weaken Granada in the 15th century?",a:"In the early 15th century, Granada's stability eroded as Nasrid rulers faced rebellions by kin, leading to coups and assassinations. These internal divisions drained resources and loyalty, undermining the Kingdom's ability to govern efficiently or resist external pressure. Externally, Castile posed a growing threat with raids and the 1410 capture of Antequera. Granada survived by exploiting Christian rivalries and paying tribute, but its borders shrank.",cat:"rc_reconquest"},{id:"rc24",q:"How did the 1410 Capture of Antequera affect Granada?",a:"The Castilian capture of Antequera in 1410 shrank Granada's borders significantly. Combined with shifting alliances — the Duke of Medina Sidonia's 1471 capture of Alhama sparked jealousy from the Marquess of Cadiz, showing that noble rivalries often overshadowed the supposed \"holy war.\" Christian nobles were as motivated by personal glory and territory as by religion. Granada's survival depended on Castile's internal divisions as much as its own defenses.",cat:"rc_reconquest"},{id:"rc25",q:"How did the events of 1471 reveal Christian rivalries?",a:"The Duke of Medina Sidonia's 1471 capture of Alhama sparked envy from the Marquess of Cadiz and other nobles, who prioritised personal gain over a unified push against Granada. This infighting delayed broader Christian momentum, showing that noble rivalries often overshadowed the ideological importance of the \"holy war.\" Christian noble rivalries sometimes outweighed Holy War throughout the Reconquest.",cat:"rc_reconquest"},{id:"rc26",q:"What was Boabdil's rebellion and why was it fatal?",a:"Internal betrayal was the fatal flaw. Boabdil rebelled against his father Abu'l-Hasan Ali in 1482, allying with Castile — splitting Granada's forces exactly when unity was needed. Ferdinand and Isabella systematically seized key towns: Ronda (1485), Málaga (1487), then besieged Granada itself. As Granada's history shows, \"it could defend itself against outside attack but not against internal dissension.\"",cat:"rc_reconquest"},{id:"rc27",q:"What caused the fall of Granada?",a:"Internal Nasrid disunity that fragmented the kingdom's defenses, combined with the unification of Castile and Aragon under Ferdinand and Isabella, providing a strong Christian force to capitalize on the weakness. Boabdil's 1482 rebellion was the fatal split. F&I systematically seized Ronda (1485), Málaga (1487), then besieged Granada. His mother allegedly said: \"You should weep like a woman for the land you could not defend like a man.\" Three world-changing events in 1492: fall of Granada, expulsion of the Jews, Columbus's voyage.",cat:"rc_reconquest"},{id:"rc28",q:"What did Ferdinand and Isabella achieve and fail?",a:"ACHIEVED: unified Spain, conquered Granada (1492), sponsored Columbus. FAILED: favoured aristocracy — by 1500, 2-3% owned 95% of land. 80% were impoverished peasants, crippling the domestic market. Limited industry (mainly iron and cloth) meant production never reached England's level. New World gold/silver led to dependence on extraction over industrial development. The empire was born \"half-crippled.\"",cat:"rc_reconquest"},{id:"rc29",q:"How did the Ottoman Empire affect Spanish exploration?",a:"The Ottoman capture of Constantinople (1453) controlled key trade routes to Asia. Ottoman taxes and blockages forced European nations to seek alternative routes. Columbus's 1492 voyage was a direct response. The Ottoman threat also sharpened Christian-Muslim identities, reinforcing Spain's religious zealotry — the expulsions partly a reaction to the Ottoman \"enemy at the gates.\"",cat:"rc_reconquest"},{id:"rc30",q:"How did Portugal's exploration weaken Granada?",a:"Portugal opened direct sea trade routes to Sub-Saharan Africa in the 1450s–60s, bypassing Granada entirely. This undercut Granada's role as a trade intermediary and weakened its Genoese banking connections. Combined with the Ottoman capture of Constantinople (1453) — which sharpened Christian-Muslim identities — Granada's economic and strategic importance faded just as Ferdinand and Isabella were consolidating Christian power.",cat:"rc_reconquest"},{id:"rc31",q:"What were the three world-changing events of 1492?",a:"(1) The fall of Granada — ending 781 years of Muslim presence in Iberia. (2) The expulsion of the Jews — removing a vital economic and intellectual community; Fuentes wrote the empire was born \"half-crippled.\" (3) Columbus's voyage — opening the Americas to Spanish colonization. These three events are deeply connected: the Reconquista freed resources for overseas conquest, while religious zeal drove the expulsions and became the engine of colonization.",cat:"rc_reconquest"},{id:"rc112",q:"Why was the capture of Toledo so important?",a:"Alfonso VI of León-Castile took Toledo on 25 May 1085 — the former Visigothic capital and one of the great cities of al-Andalus (~28,000 inhabitants). Symbolically: Toledo's recovery framed the Reconquest as a \"restoration.\" Strategically: it pushed the Christian frontier south of the Tagus, doubling Castilian territory. Culturally: Alfonso preserved the Mozarabic and Jewish communities, making Toledo the great translation centre that fed Greco-Arabic learning to Latin Europe. It also triggered the Almoravid invasion that nearly reversed Christian gains.",cat:"rc_reconquest"},{id:"rc113",q:"What is the Cantar de mio Cid and what does it reveal?",a:"The earliest surviving epic of the Spanish language (composed ~1140–1200, the only extant manuscript dated 1207). Tells the exiled-and-redeemed career of Rodrigo Díaz de Vivar, \"El Cid.\" Reveals: the messy reality of Iberian frontier politics — El Cid fought for Christian and Muslim lords; conquered Valencia (1094) for himself; respected Muslim populations he ruled. The poem's morally complex hero is unlike the rigid crusading legend developed later. Sources for the historical Cid include the Latin Historia Roderici and Arabic chronicles.",cat:"rc_reconquest"},{id:"rc114",q:"How did military orders shape the Reconquest?",a:"Founded mid-12th century — Santiago (1170), Calatrava (1158), Alcántara (1166) — modelled on the Templars and Hospitallers. Members were warrior-monks: Christian knights bound by religious vows, granted huge territories on the moving frontier. They built castles, organised resettlement, and fielded disciplined armies. By 1300 the orders controlled ~25% of Castilian territory and ~5,000 knights between them. Provided continuity of military pressure that secular lords could not maintain. Their wealth would later make them a target of royal centralisation under Ferdinand and Isabella.",cat:"rc_reconquest"},{id:"rc115",q:"What were the parias and how did they shape the Reconquest?",a:"Parias were tribute payments by taifa kings to Christian rulers in the 11th century in exchange for non-aggression. By the 1060s Castile, León, Aragon, and Navarre were collecting massive sums from Seville, Granada, Toledo, Zaragoza, etc. — Alfonso VI of Castile drew enough to fund stone castles and to pay for the army that took Toledo in 1085. Effects: (1) gold flowed from Muslim south to Christian north for the first time in 300 years; (2) Christian kings became economically dependent on al-Andalus existing; (3) when taifas could no longer pay, conquest became cheaper than tribute.",cat:"rc_reconquest"},{id:"rc116",q:"When was the Reconquista designated a crusade?",a:"From the late 11th century the Papacy began granting indulgences for fighting in Spain comparable to those for Jerusalem. Pope Urban II (1095) explicitly equated Spanish and Holy Land warfare. The Battle of Las Navas de Tolosa (1212) was a formally proclaimed crusade. The crusader framing transformed local frontier wars into a transcendent religious mission, recruited foreign knights, and steered Iberian Christianity toward militancy. But Spanish kings often resisted papal control — they wanted crusader status without crusader oversight.",cat:"rc_reconquest"},{id:"rc117",q:"What did Ferdinand III achieve for the Reconquest?",a:"King of Castile from 1217, then León from 1230 (permanently uniting the two crowns). Took Córdoba (1236), Jaén (1246), and Seville (1248) — reducing al-Andalus to the small Nasrid Kingdom of Granada in 50 years. Imposed the Castilian language and Roman law. Canonised in 1671. Under his son Alfonso X \"the Wise\" (1252–84), the Toledo School of Translators flourished and the Castilian vernacular became a literary language. By 1252 the Reconquest was essentially complete except for Granada — which would survive 240 years more.",cat:"rc_reconquest"},{id:"rc118",q:"What did the Treaty of Granada actually promise?",a:"Negotiated in November 1491 between Boabdil and Ferdinand and Isabella. Promised Muslims of Granada: (1) freedom of religion, language, and dress; (2) keep their property and laws; (3) Muslim judges for Muslim cases; (4) safe passage to North Africa for those who wished to leave; (5) no forced conversions; (6) no Jew or recent convert appointed over Muslims. Generous terms designed to secure surrender without prolonged siege. Almost every clause was systematically violated within a decade — beginning with Cisneros's forced conversions of 1499 and culminating in the 1502 expulsion order.",cat:"rc_reconquest"},{id:"rc119",q:"Who were the Mudéjars?",a:"Muslims living under Christian rule (from Arabic mudajjan, \"permitted to remain\"). After the 13th-century conquests, large Muslim populations stayed in Aragon, Valencia, and Castile — by 1500 perhaps 500,000 Mudéjars across Iberia. Worked as farmers, craftsmen (especially tilework, woodwork, the \"Mudéjar style\"), and silk weavers. Lived under Islamic law, paid extra taxes. Tolerated until 1502 (Castile) and 1525 (Aragon), when forced conversion turned them into Moriscos. Their craft styles persisted in Spanish architecture for centuries (the Alcázar of Seville, the Aljafería of Zaragoza).",cat:"rc_reconquest"},{id:"rc120",q:"What were the fueros?",a:"Local charters granted by Christian kings and lords during the Reconquest, defining rights, exemptions, and self-government for newly conquered or repopulated towns. The most famous (Sepúlveda 1076, Cuenca ~1190) gave settlers tax breaks, militia obligations, and judicial autonomy in return for moving to dangerous frontier territory. Fueros built a tradition of local liberties that limited royal power and shaped Spanish constitutional history. The Basque and Navarrese fueros survived into the 19th century — and ETA cited them in 20th-century separatist arguments.",cat:"rc_reconquest"},{id:"rc121",q:"How did Christian kings repopulate conquered land?",a:"After conquering a region, kings faced empty or hostile territory. Solutions: (1) presura (free occupation by anyone willing to clear land) in the early reconquest; (2) royal grants to nobles, monasteries, and military orders; (3) charter towns with fueros; (4) plantation by mass deportation — Granada was repopulated by ~40,000 Old Christian settlers after 1492. Population transfers shaped Spanish regional identities: Galician/Asturian repopulation in the north, Catalan in the east, and a thinly settled extremadura \"extreme\" frontier in the centre.",cat:"rc_reconquest"},{id:"rc122",q:"How powerful was the Mesta?",a:"The Honrado Concejo de la Mesta de los Pastores, founded 1273 by Alfonso X, was the guild of sheep ranchers. Privileges: free passage for ~3 million sheep along the cañadas reales (royal sheep-walks ~75m wide), tax exemptions, and exclusive jurisdiction. Castilian merino wool became Europe's premier luxury textile fibre. Royal income from Mesta taxes funded the Reconquest's late stages. But: huge flocks discouraged crop agriculture, depopulated arable land, and entrenched a \"wool oligarchy\" that retarded later industrialisation. A long-term curse on the Spanish economy.",cat:"rc_reconquest"},{id:"rc123",q:"How did Aragon's Reconquest differ from Castile's?",a:"Castile drove south on the central plateau — taking Toledo (1085), Córdoba (1236), Seville (1248). Aragon expanded south-east through the Mediterranean — Zaragoza (1118), Lleida (1149), Valencia (under James I, 1238), Mallorca (1229), and then beyond Iberia to Sicily (1282), Sardinia (1324), Naples (1442), and even briefly the Duchy of Athens. By 1492 Aragon was a Mediterranean trading empire; Castile was an Atlantic-facing power. The dynastic union of 1469 brought the two together — but their separate orientations shaped the Spanish Empire's split character.",cat:"rc_reconquest"},{id:"rc124",q:"What did the marriage of Ferdinand and Isabella achieve?",a:"Married in October 1469 at Valladolid. Ferdinand (heir to Aragon) and Isabella (claimant to Castile) united the crowns dynastically while keeping them legally separate (each kept its own laws, taxes, courts). Their joint rule (Tanto Monta — \"as much one as the other\") was the political foundation of unified Spain. Combined Castile's military weight with Aragon's commercial network and diplomatic experience. Their marriage agreement actually had to be backdated with a forged papal dispensation because they were second cousins — a contested legal start to a transformative reign.",cat:"rc_reconquest"},{id:"rc125",q:"What role did religious vow play in the war for Granada?",a:"Isabella reportedly vowed at Granada's outset (1482) not to wash her chemise until the city fell — possibly apocryphal but characteristic of the conquest's framing as a holy mission. The conquest was financed partly by papal Bulls of Crusade (selling indulgences in Spanish parishes) which raised perhaps 30% of war costs. Pope Sixtus IV granted \"Cruzada\" privileges in 1482; the title \"Catholic Monarchs\" (Reyes Católicos) was awarded by Pope Alexander VI in 1494. Isabella's personal piety made the war as much a spiritual as a political project — and pre-figured the religious zeal of the colonial conquests.",cat:"rc_reconquest"},{id:"rc126",q:"Why did Granada finally fall when earlier offensives had failed?",a:"Three factors. (1) Artillery: by the 1480s Castilian gunpowder cannon (lombards) could breach traditional walls — siege of Ronda (1485), Málaga (1487), Baza (1489). (2) Sustained financing through papal bulls and Mesta taxes meant Christian armies could fight year-round, not just summer raids. (3) Internal Granadan civil war (Boabdil vs his father Muley Hacén vs his uncle El Zagal) split Muslim resistance. Granada was the first major European war won decisively by gunpowder — a small revolution that opened a much larger one.",cat:"rc_reconquest"},{id:"rc32",q:"When and why was the Spanish Inquisition established?",a:"1478, by Ferdinand and Isabella. Primary purpose: ensure religious orthodoxy in the newly unified kingdom. Targeted conversos — Jews/Muslims who converted but were suspected of secretly practicing their old religions. The ideology of \"limpieza de sangre\" (purity of blood) demanded a Spain cleansed of non-Christian elements. The Inquisition had jurisdiction over baptized Christians — hence pressure to convert, then investigation of converts.",cat:"rc_expulsions"},{id:"rc33",q:"Who was Cardinal Cisneros?",a:"Isabella's confessor — key architect of religious persecution after 1492. Organized mass forced conversions of Muslims and ordered the burning of over 5,000 priceless Arabic manuscripts — an irreplaceable cultural catastrophe. When his agent was assassinated, it gave the Crown an excuse to revoke the Treaty of Granada entirely. His actions directly triggered the First Rebellion of the Alpujarras (1499–1500).",cat:"rc_expulsions"},{id:"rc34",q:"What was the Treaty of Granada?",a:"Signed November 25, 1491 between Boabdil and Ferdinand and Isabella. Formally ended the Reconquista by surrendering the Emirate of Granada. The first 4 articles practically stated that Muslims should keep their religious freedom and not lose their livelihood — they would preserve their mosques and religious institutions, retain the use of their language, and continue to abide by their own laws and customs. It was meant to maintain their legal autonomy. The Crown revoked it within a decade.",cat:"rc_expulsions"},{id:"rc35",q:"What did the 1492 Edict of Expulsion of the Jews say?",a:"It accused Jews of enticing Christians back to Judaism — \"instructing them in ceremonies, performing circumcisions, providing prayer books, telling them there is no other law or truth.\" Previous measures (banishing from Andalusia) had failed. Jews chose conversion or exile. Their loss crippled Spain: dominant in trade, finance, tax collection, medicine. As Fuentes wrote, the empire was born \"half-crippled\" — expelling the people who could have managed it.",cat:"rc_expulsions"},{id:"rc36",q:"How was the expulsion of the Jews driven by both ideological and economic factors?",a:"IDEOLOGICALLY: Catholic Monarchs pushed for a homogenous Christian identity. The ideology of \"limpieza de sangre\" demanded Spain free of non-Christian elements. ECONOMICALLY: Jews were a significant force in trade, finance, tax collection. Many were moneylenders and in royal courts. The expulsion allowed the Crown to confiscate Jewish property; conversos faced Inquisition scrutiny and asset seizure under heresy charges.",cat:"rc_expulsions"},{id:"rc37",q:"Why was the Spanish Empire born \"half-crippled\" in 1492?",a:"The Jews of Spain were a dynamic economic force before their expulsion — merchants, financiers, artisans, tax collectors, and dominant in medicine. In 1492, with the dual events of the expulsion AND the discovery of the Americas, the new empire carried an inherent weakness from the start. Expelling a group so integral to commerce and finance at this critical juncture weakened Spain's ability to sustain and manage its empire.",cat:"rc_expulsions"},{id:"rc38",q:"What were the Alpujarras Rebellions?",a:"FIRST (1499–1500): triggered by Cisneros's forced conversions and book-burning, violating the Treaty of Granada. The agent's assassination gave Crown an excuse to revoke promises. Muslims faced exile or baptism. SECOND (1567): Philip II banned Arabic, Islamic religion, dress, customs — erasing Moorish identity. Don John razed Galera: salt sprinkled on ruins, 2,500 slaughtered including 400 women and children.",cat:"rc_expulsions"},{id:"rc39",q:"What was the Sentence of Medina del Campo (1465)?",a:"A decree that ended the toleration of Muslims in Castile. Triggered by events 1450–1461: the Ottoman advance and fall of Constantinople (1453) revived crusading interest. Internally, Islamophile acculturation at the court of Enrique IV of Castile — where Mudéjar arts and Muslim customs were fashionable — provoked an anti-Islamic reaction. The Sentence marked the beginning of the end for Muslim tolerance in Castile, foreshadowing the post-1492 expulsions.",cat:"rc_expulsions"},{id:"rc40",q:"What did Boabdil's mother allegedly say to him?",a:"\"You should weep like a woman for the land you could not defend like a man.\" Said as they left Granada in 1492. Captures the gendered humiliation of defeat — and the bitter recognition that internal disunity, not external strength, had cost Granada.",cat:"rc_expulsions"},{id:"rc41",q:"When and why were the Moriscos expelled?",a:"Philip III's decree 4 April 1609; deportations from October. Majority settled on the Maghrib coast. The Moriscos had outwardly conformed to Christianity but secretly maintained their festivals and rituals — this \"refusal to renounce their cultural identity\" was what Old Christians found most offensive. Their numbers were growing; some had become successful merchants — adding fear and envy to religious hatred.",cat:"rc_expulsions"},{id:"rc42",q:"What was \"limpieza de sangre\"?",a:"\"Purity of blood\" — ideology demanding Spain be free of non-Christian racial elements. Even generations after conversion, descendants of Jews/Muslims were considered su

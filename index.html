<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revision Tool">
<title>Revision Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0f14;--bg2:#13171f;--bg3:#1a1f2b;--bg4:#222838;
  --text:#e8e6e1;--text2:#a09d96;--text3:#6b6860;
  --accent:#c9a84c;--accent2:#e8c96a;--accent-dim:#3d3420;
  --green:#4ade80;--green-dim:#0d2818;--red:#f87171;--red-dim:#2d1216;
  --blue:#60a5fa;--blue-dim:#121d2e;--orange:#fb923c;
  --cold-war:#5b8def;--auth-states:#e06c50;--reconquest:#50b87a;
  --radius:10px;--radius-lg:16px;
  --font-display:'Crimson Pro',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}
input,button,textarea{font-family:inherit;font-size:inherit}
input{font-size:16px!important}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::selection{background:var(--accent);color:var(--bg)}

.app-wrap{max-width:900px;margin:0 auto;padding:0 16px 100px}
@media(min-width:640px){.app-wrap{padding:0 24px 40px}}

.header{text-align:center;padding:28px 0 8px;position:relative}
.header h1{font-family:var(--font-display);font-size:1.9rem;font-weight:700;letter-spacing:-0.02em;color:var(--accent2)}
.header p{color:var(--text2);font-size:.82rem;margin-top:4px;letter-spacing:.03em;text-transform:uppercase}

.tab-bar{display:flex;gap:4px;justify-content:center;padding:12px 0 20px;flex-wrap:wrap}
.tab-btn{padding:8px 18px;border-radius:99px;font-size:.82rem;font-weight:600;color:var(--text2);transition:all .2s;position:relative;letter-spacing:.01em}
.tab-btn:hover{color:var(--text);background:var(--bg3)}
.tab-btn.active{color:var(--bg);background:var(--accent);box-shadow:0 2px 12px #c9a84c33}
.tab-btn .dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);display:none;box-shadow:0 0 6px var(--red)}
.tab-btn .dot.show{display:block;animation:pulse 2s infinite}

.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;transition:border-color .2s}
.card:hover{border-color:var(--accent-dim)}
.card-title{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin-bottom:6px}
.card-sub{color:var(--text2);font-size:.85rem;line-height:1.5}
.card-tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.btn{padding:10px 20px;border-radius:var(--radius);font-weight:600;font-size:.85rem;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:var(--bg);box-shadow:0 2px 8px #c9a84c22}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--bg4);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent-dim);color:var(--text)}
.btn-correct{background:var(--green);color:#000}
.btn-wrong{background:var(--red);color:#000}
.btn-sm{padding:6px 14px;font-size:.78rem}

.mode-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{padding:7px 16px;border-radius:var(--radius);font-size:.78rem;font-weight:600;color:var(--text3);border:1px solid var(--bg4);transition:all .2s;position:relative}
.mode-btn:hover{color:var(--text2);border-color:var(--text3)}
.mode-btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.mode-btn .srs-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 6px var(--orange)}

.cat-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cat-chip{padding:5px 14px;border-radius:99px;font-size:.75rem;font-weight:600;border:1px solid var(--bg4);color:var(--text3);transition:all .2s}
.cat-chip:hover{color:var(--text2)}
.cat-chip.active{color:#fff;border-color:transparent}

.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:10px 16px 10px 40px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem}

.flashcard{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;cursor:pointer;transition:all .3s;position:relative;text-align:center;user-select:none}
.flashcard:hover{border-color:var(--accent-dim);box-shadow:0 4px 20px #0003}
.flashcard .label{position:absolute;top:12px;left:16px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.flashcard .counter{position:absolute;top:12px;right:16px;font-size:.75rem;color:var(--text3);font-family:var(--font-mono)}
.flashcard .question{font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.4;max-width:600px}
.flashcard .answer{font-size:.95rem;line-height:1.6;color:var(--text2);max-width:600px}
.flashcard .flip-hint{position:absolute;bottom:12px;font-size:.7rem;color:var(--text3);letter-spacing:.03em}
.flashcard .srs-badge{position:absolute;bottom:12px;right:16px;font-size:.65rem;padding:2px 8px;border-radius:99px;font-weight:600;letter-spacing:.03em}

/* Split progress bar */
.split-progress{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-bottom:16px;background:var(--bg4);gap:1px}
.split-progress .seg{height:100%;transition:all .3s ease;min-width:0}
.split-progress .seg:first-child{border-radius:3px 0 0 3px}
.split-progress .seg:last-child{border-radius:0 3px 3px 0}

.stat-ring{width:140px;height:140px;position:relative;margin:0 auto 20px}
.stat-ring svg{transform:rotate(-90deg)}
.stat-ring .value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat-ring .value .num{font-family:var(--font-display);font-size:2.2rem;font-weight:700;color:var(--accent2)}
.stat-ring .value .label{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.stat-card .label{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

.type-input{width:100%;padding:12px 16px;background:var(--bg2);border:2px solid var(--bg4);border-radius:var(--radius);color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.type-input:focus{border-color:var(--accent)}
.type-input.correct{border-color:var(--green);background:var(--green-dim)}
.type-input.wrong{border-color:var(--red);background:var(--red-dim)}

.expandable{cursor:pointer}
.expandable .chevron{transition:transform .2s;display:inline-block;margin-left:6px;font-size:.7em}
.expandable.open .chevron{transform:rotate(180deg)}

.due-banner{background:linear-gradient(135deg,var(--accent-dim),var(--bg2));border:1px solid var(--accent-dim);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:.85rem;cursor:pointer;transition:border-color .2s}
.due-banner:hover{border-color:var(--accent)}
.due-banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.results-overlay{text-align:center;padding:40px 20px}
.results-overlay .score{font-family:var(--font-display);font-size:3rem;font-weight:700;margin:12px 0}
.results-overlay .msg{color:var(--text2);margin-bottom:24px}

.exam-q{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px}
.exam-q .q-text{font-family:var(--font-display);font-size:1.05rem;line-height:1.5;margin-bottom:10px}
.exam-q textarea{width:100%;min-height:120px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px;color:var(--text);font-size:.9rem;resize:vertical;outline:none}
.exam-q textarea:focus{border-color:var(--accent)}

.timer-display{font-family:var(--font-mono);font-size:2.5rem;font-weight:700;text-align:center;color:var(--accent2);margin:16px 0}

/* Criteria section */
.criteria-section{margin-bottom:20px}
.criteria-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px}
.criteria-card h3{font-family:var(--font-display);font-size:1.1rem;font-weight:700;margin-bottom:8px;color:var(--accent2)}
.criteria-card h4{font-family:var(--font-display);font-size:.95rem;font-weight:600;margin:12px 0 6px;color:var(--text)}
.criteria-card p,.criteria-card li{font-size:.85rem;color:var(--text2);line-height:1.6}
.criteria-card ul{padding-left:18px;margin:4px 0 8px}
.criteria-card li{margin-bottom:3px}
.band-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);margin-bottom:4px;font-size:.82rem}
.band-row .band-label{font-weight:700;min-width:60px;font-family:var(--font-mono);font-size:.78rem}
.band-row .band-desc{color:var(--text2);flex:1}

/* SRS schedule */
.srs-card-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);margin-bottom:6px;font-size:.82rem}
.srs-card-row .srs-q{flex:1;color:var(--text)}
.srs-card-row .srs-meta{color:var(--text3);font-family:var(--font-mono);font-size:.72rem;flex-shrink:0}
.srs-card-row .srs-status{padding:2px 8px;border-radius:99px;font-size:.68rem;font-weight:600;flex-shrink:0}

@media(max-width:639px){
  .header{padding:16px 0 4px}
  .header h1{font-size:1.4rem}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bg4);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:100;justify-content:space-around;flex-wrap:nowrap;gap:2px}
  .tab-btn{padding:6px 10px;font-size:.7rem}
  .app-wrap{padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:90px}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.slide-up{animation:slideUp .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}

/* Story timeline */
.story-wrap{max-width:720px;margin:0 auto}
.story-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--accent2);margin-bottom:4px}
.story-topic-tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:20px}
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--bg4)}
.tl-event{position:relative;margin-bottom:24px;animation:fadeIn .4s ease both}
.tl-event:nth-child(1){animation-delay:.05s}.tl-event:nth-child(2){animation-delay:.1s}.tl-event:nth-child(3){animation-delay:.15s}
.tl-event:nth-child(4){animation-delay:.2s}.tl-event:nth-child(5){animation-delay:.25s}.tl-event:nth-child(6){animation-delay:.3s}
.tl-event:nth-child(7){animation-delay:.35s}.tl-event:nth-child(8){animation-delay:.4s}
.tl-dot{position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.tl-year{font-family:var(--font-mono);font-size:.78rem;font-weight:600;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
.tl-text{font-size:.9rem;color:var(--text2);line-height:1.75;font-family:var(--font-display);font-weight:400}
.tl-text strong{color:var(--text);font-weight:600}
.story-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useContext,createContext,useMemo,useCallback}=React;

// ─── SOUND EFFECTS ───
const SFX={
  _ctx:null,
  _getCtx(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();return this._ctx},
  _play(freq,dur,type='sine',vol=.12){try{const c=this._getCtx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch(e){}},
  flip(){this._play(800,.08);setTimeout(()=>this._play(1200,.06),40)},
  correct(){this._play(523,.1);setTimeout(()=>this._play(659,.1),80);setTimeout(()=>this._play(784,.15),160)},
  wrong(){this._play(300,.15,'square',.08);setTimeout(()=>this._play(220,.2,'square',.06),100)},
  complete(){this._play(523,.12);setTimeout(()=>this._play(659,.12),100);setTimeout(()=>this._play(784,.12),200);setTimeout(()=>this._play(1047,.25),300)},
  tap(){this._play(600,.04,'sine',.06)}
};

// ─── CLOUD SYNC (Google Apps Script) ───
const CloudSync={
  _urlKey:'ib_history_cloud_url',
  _statusKey:'ib_history_cloud_status',
  getUrl(){try{return localStorage.getItem(this._urlKey)||''}catch(e){return''}},
  setUrl(url){try{localStorage.setItem(this._urlKey,url)}catch(e){}},
  getStatus(){try{return JSON.parse(localStorage.getItem(this._statusKey)||'{}')}catch(e){return{}}},
  _setStatus(s){try{localStorage.setItem(this._statusKey,JSON.stringify(s))}catch(e){}},

  async push(data){
    const url=this.getUrl();if(!url)return{ok:false,error:'No sync URL set'};
    try{
      const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:data}),redirect:'follow'});
      // Apps Script redirects — if we get a response at all, try to parse
      let result;
      try{result=await resp.json()}catch(e){result={success:resp.ok}}
      if(result.success||resp.ok){this._setStatus({lastPush:Date.now(),ok:true});return{ok:true}}
      return{ok:false,error:'Server returned error'}
    }catch(e){this._setStatus({lastPush:Date.now(),ok:false,error:e.message});return{ok:false,error:e.message}}
  },

  async pull(){
    const url=this.getUrl();if(!url)return{ok:false,error:'No sync URL set'};
    try{
      const resp=await fetch(url+'?action=load',{redirect:'follow'});
      const text=await resp.text();
      if(!text||text==='{}')return{ok:true,data:null,empty:true};
      const data=JSON.parse(text);
      if(data.attempts||data.srs){this._setStatus({lastPull:Date.now(),ok:true});return{ok:true,data}}
      return{ok:true,data:null,empty:true}
    }catch(e){return{ok:false,error:e.message}}
  },

  isConfigured(){return!!this.getUrl()},
};

// ─── DATA ───
// Schema: { id: { label, color, icon, shortLabel?: String } }
// shortLabel is the optional label shown on mobile (falls back to label)
const TOPICS={coldWar:{label:"Cold War",color:"var(--cold-war)",icon:"❄️",shortLabel:"Cold War"},authStates:{label:"Authoritarian States",color:"var(--auth-states)",icon:"⚔️",shortLabel:"Auth."},reconquest:{label:"Reconquest & Conquest",color:"var(--reconquest)",icon:"🌎",shortLabel:"Reconquest"}};

// Schema: { id: { label, topic: TopicId, color } }
const CATEGORIES={cw_origins:{label:"Origins 1945–47",topic:"coldWar",color:"#5b8def"},cw_containment:{label:"Containment in Asia",topic:"coldWar",color:"#4c7bd4"},cw_crises:{label:"Key Crises",topic:"coldWar",color:"#3d6aba"},cw_policy:{label:"US Foreign Policy",topic:"coldWar",color:"#6e9cf5"},cw_end:{label:"End of Cold War",topic:"coldWar",color:"#83aef7"},au_muss_rise:{label:"Mussolini: Rise",topic:"authStates",color:"#e06c50"},au_muss_power:{label:"Mussolini: In Power",topic:"authStates",color:"#d45a3e"},au_peron_rise:{label:"Perón: Rise",topic:"authStates",color:"#e8845e"},au_peron_power:{label:"Perón: In Power",topic:"authStates",color:"#d4724c"},au_castro_rise:{label:"Castro: Rise",topic:"authStates",color:"#f09070"},au_castro_power:{label:"Castro: In Power",topic:"authStates",color:"#c4563a"},rc_islamic:{label:"Islamic Iberia",topic:"reconquest",color:"#50b87a"},rc_reconquest:{label:"The Reconquest",topic:"reconquest",color:"#40a568"},rc_expulsions:{label:"Expulsions",topic:"reconquest",color:"#60c88a"},rc_mexico:{label:"Conquest of Mexico",topic:"reconquest",color:"#389258"},rc_peru:{label:"Conquest of Peru",topic:"reconquest",color:"#70d89a"},rc_colonial:{label:"Colonial Systems",topic:"reconquest",color:"#48b070"}};

// Schema: { id, q: question, a: answer, cat: CategoryId }
const CARDS=[{id:"cw1",q:"What was the Iron Curtain speech and what was its impact?",a:"Churchill's March 1946 speech at Fulton, Missouri, warning that a Soviet \"iron curtain\" had descended across Europe from Stettin to Trieste. Initially poorly received in the USA, but it announced the Western view of Soviet expansion and increased tensions between capitalism and communism. Stalin compared Churchill to Hitler and interpreted it as a \"call to arms.\" The speech crystallized the ideological split that would define the Cold War.",cat:"cw_origins"},{id:"cw2",q:"What was Kennan's Long Telegram and why did it matter?",a:"An 8,000-word analysis sent February 1946 from George Kennan at the US Embassy in Moscow, arguing the Soviet Union was inherently expansionist and would expand wherever it faced no resistance, but back down when confronted. It alarmed Washington, became the intellectual foundation of US containment policy for decades, and led directly to Churchill's Iron Curtain speech.",cat:"cw_origins"},{id:"cw3",q:"What was the state of the USSR after WWII?",a:"Devastated. Roughly 27 million Soviet citizens and soldiers killed — more than any other nation. Nearly 70,000 villages destroyed by the Nazis. Everything from the borders to Moscow lay in ruins; Stalin's 5-year plan was shattered. Yet Stalin was at the peak of his power and warned that capitalism made future wars \"inevitable\" — the West interpreted this as a prediction of WWIII.",cat:"cw_origins"},{id:"cw4",q:"How did the Soviets impose their rule on Eastern Europe after 1945?",a:"Leaders of opposing parties simply \"disappeared.\" Anyone suspected of straying from Soviet communism was arrested, including German POWs. The USSR shifted Poland westward as \"compensation\" for the German invasion route — Soviet troops seized Polish homes, Poles in turn seized German homes. Across Europe, ~12 million Germans were expelled. In the Soviet zone of Germany, the Red Army looted homes and hunted down women, even as Stalin ordered soldiers to feed Berliners.",cat:"cw_origins"},{id:"cw5",q:"What was the Truman Doctrine and why was it significant?",a:"Announced March 1947 when Britain told Washington it could no longer afford to support Greece and Turkey, both at risk of falling to communism. Congress approved $400 million in aid. Truman declared: \"It must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures.\" It established a clear US commitment to contain communism worldwide and marked the definitive ideological split between US democracy and Soviet communism.",cat:"cw_origins"},{id:"cw6",q:"What was the Marshall Plan?",a:"US economic aid program announced June 1947 (operational 1948). 17 countries participated, requesting $20 billion. The logic: hungry, unemployed people turn to communism — feed them and give them jobs. Stalin saw it as undermining Soviet influence; he ordered Eastern bloc countries to refuse and established COMECON (1949) as a counter, but it never matched American generosity. Churchill called it \"the most unselfish act in history\" — though it also served US strategic interests.",cat:"cw_origins"},{id:"cw7",q:"Give specific examples of how the Marshall Plan played out across Europe.",a:"France: $2.7 billion after cracking down on communist strikes (1947). Greece: nearly $700 million — projects included importing mules to replace lost farm animals. Italy: massive CIA campaign defeated communists in 1948 elections (letters from Italian-Americans, covert funding for Christian Democrats). Czechoslovakia: initially agreed but Stalin forced withdrawal; communists seized government in 1948. Yugoslavia: Tito accepted over $150 million after breaking with Stalin — a major Cold War victory for the US.",cat:"cw_origins"},{id:"cw8",q:"What was COMECON?",a:"Council for Mutual Economic Assistance (1949) — Soviet counter to the Marshall Plan. Promoted economic integration among communist countries, but functioned more as a tool of Soviet control than genuine cooperation. Never matched the Marshall Plan's scale or effectiveness. The USSR also withdrew from Bretton Woods institutions (IMF, World Bank), signaling economic separation from the West.",cat:"cw_origins"},{id:"cw9",q:"What was the role of the CIA in the early Cold War?",a:"The CIA sought authority for covert operations worldwide. In Italy's 1948 elections, they funded anti-communist campaigns and supported the Christian Democrats with covert money and a propaganda blitz. CIA operations became a cornerstone of US strategy — later overthrowing governments in Iran (1953) and Guatemala (1954) considered too left-wing. This marked a shift from open diplomacy to secret intervention.",cat:"cw_origins"},{id:"cw10",q:"What was the Iran crisis and why did it matter?",a:"During WWII, Soviet and British troops jointly occupied Iran for oil. After the war Britain withdrew, but Stalin refused to leave when due. International pressure eventually forced Soviet withdrawal, but the crisis convinced Truman that Stalin aimed for world domination. It was an early test of Soviet expansionism outside Europe and reinforced the US shift from compromise to containment.",cat:"cw_origins"},{id:"cw11",q:"What was the Berlin Blockade and how was it resolved?",a:"The first major Cold War crisis. After the West introduced a new currency (Deutschmark) in West Berlin, Stalin blocked all land transport to the city. The West organized a massive airlift supplying 2 million West Berliners for nearly a year. Stalin eventually backed down — a major morale boost for the West and proof that containment could work without war. Directly led to the FRG (Sept 1949), GDR (Oct 1949), and NATO (April 1949).",cat:"cw_origins"},{id:"cw12",q:"What three events in 1949 transformed the Cold War?",a:"(1) Germany formally divided — FRG (Sept) and GDR (Oct). (2) NATO founded as a Western military alliance. (3) USSR detonated its first atomic bomb, ending America's nuclear monopoly. Combined with Mao's victory in China, 1949 made the Cold War global, militarized, and nuclear.",cat:"cw_origins"},{id:"cw13",q:"What were the wartime conferences and what did they reveal about the Grand Alliance?",a:"TEHRAN (Nov 1943) — Stalin, Roosevelt, Churchill agreed on D-Day. YALTA (Feb 1945) — agreed on UN, division of Germany/Berlin into occupation zones, \"free elections\" in Eastern Europe, USSR joining war vs Japan; main disagreement was Poland (Stalin installed communist government). POTSDAM (July 1945) — Truman replaces Roosevelt (died April 1945), atomic bomb revealed to Stalin; Truman's harder line vs Roosevelt's compromise made tensions visible. Attlee replaced Churchill mid-conference after UK elections, continuing the hostile stance.",cat:"cw_origins"},{id:"cw14",q:"What was the Atlantic Charter and why does it matter for the Cold War?",a:"Signed by Roosevelt and Churchill in August 1941, declaring all peoples had a right to self-determination. This had enormous implications: it directly challenged imperialism, meaning the UK and France would eventually lose their colonies. The USSR would later cite self-determination to justify its influence in Eastern Europe; the West used it to argue against Soviet expansion. It exposed contradictions within the Grand Alliance before the war was even won.",cat:"cw_origins"},{id:"cw15",q:"What was the Non-Aggression Pact and why was it shocking?",a:"The Molotov–Ribbentrop Pact between the USSR and Nazi Germany — a shocking agreement between ideological enemies. It allowed Hitler to attack the West without fear of a two-front war and gave Stalin time to build up Soviet military strength. Communism and fascism were supposed to be mortal enemies; the pact deepened Western distrust of Stalin, which carried directly into post-war tensions.",cat:"cw_origins"},{id:"cw16",q:"How did Appeasement shape the Cold War?",a:"Britain's 1930s policy of making concessions to Hitler is usually regarded as a failure that emboldened Nazi aggression. For the Cold War: Truman explicitly did not want to repeat Chamberlain's \"soft approach,\" so Appeasement became a cautionary tale that pushed US containment toward firmness. Every time the US faced Soviet pressure, the memory of Appeasement pushed leaders toward firmness rather than compromise.",cat:"cw_origins"},{id:"cw17",q:"Why did the US and USSR clash over Germany's future?",a:"Soviet view: keep Germany weak and divided to prevent future invasion, extracting reparations to rebuild the USSR. US view: a strong, reunited Germany was essential for Western European recovery — a weak Germany would create a power vacuum. This fundamental disagreement led directly to Germany's partition and to the Berlin crises.",cat:"cw_origins"},{id:"cw18",q:"What were Stalin's \"salami tactics\"?",a:"Stalin's method of gradually taking control of Eastern European governments slice by slice. He insisted on coalition governments including communists, then systematically eliminated non-communist parties through intimidation, rigged elections, and disappearances of opposition leaders. The technique replaced democracy in Eastern Europe between 1945 and 1948.",cat:"cw_origins"},{id:"cw19",q:"How did Soviet negotiators operate at post-war conferences?",a:"A deliberate \"good cop / bad cop\": stubborn negotiators exhausted opponents and extracted information for hours. Then Stalin personally intervened with a friendly smile, appearing reasonable by comparison. This pattern was used repeatedly and made Western diplomats wary of Soviet good faith.",cat:"cw_origins"},{id:"cw20",q:"What was the Warsaw Rising and how did it affect Allied trust?",a:"In 1944, Polish nationalists rose against German forces in Warsaw before the Soviet advance into Poland. The Germans crushed the uprising while Soviet troops nearby deliberately did not intervene. This calculated inaction increased British and American distrust of Stalin's intentions and foreshadowed Soviet domination of Poland after the war.",cat:"cw_origins"},{id:"cw21",q:"What are the main schools of Cold War historiography?",a:"ORTHODOX (dominant until ~1970): Cold War caused by aggressive Soviet/Stalinist expansion. REVISIONIST (after 1970, during Vietnam protest): Cold War caused by provocative US actions — American self-analysis. POST-REVISIONIST: avoids blaming either side, examines wider factors objectively. POST-COLD WAR historians: access to newly opened Soviet archives, examination of states beyond the two superpowers.",cat:"cw_origins"},{id:"cw22",q:"Historians give three plausible start dates for the Cold War. What are they and why?",a:"1917 — for those who see it as an ideological conflict (capitalism vs the new communist state). 1945 — most common: end of wartime cooperation and post-war settlement made tension unavoidable. 1947 — for those who focus on the breakdown of diplomatic mechanics: with the Truman Doctrine and Marshall Plan, compromise became impossible.",cat:"cw_origins"},{id:"cw66",q:"What were Soviet WWII casualties and why do they matter for understanding Stalin's post-war policy?",a:"~27 million Soviet citizens dead — more than any other nation, ~13% of pre-war population. ~1,710 cities and towns destroyed; ~70,000 villages razed; over 25 million homeless. Stalingrad alone cost ~1.1 million Soviet casualties. The USSR had been invaded three times in 30 years (1914, 1918 by Allied intervention, 1941). This trauma made Stalin's obsession with creating a buffer zone of friendly states in Eastern Europe a security imperative — but indistinguishable to Western eyes from aggressive expansionism.",cat:"cw_origins"},{id:"cw67",q:"How did Roosevelt's death change US-Soviet relations?",a:"Roosevelt died 12 April 1945, less than three weeks before German surrender. Truman, his Vice-President, had been in office only 82 days and had been deliberately kept ignorant of major foreign policy decisions and the Manhattan Project. Briefed only after Roosevelt's death, Truman took a far harder line — reading Kennan's analysis, suspicious of Stalin's \"salami tactics,\" and determined never to repeat Chamberlain's \"Appeasement.\" The Roosevelt-Stalin personal relationship (which had survived enormous strain during the war) ended abruptly; Truman and Stalin never developed comparable trust.",cat:"cw_origins"},{id:"cw68",q:"What was decided about Poland at Yalta and why was it the central problem?",a:"Poland was the central wartime Allied disagreement. Britain had gone to war in 1939 to defend Polish independence; the legitimate Polish government was in exile in London. Stalin had installed a communist \"Lublin Committee\" as government during 1944 liberation. At Yalta (Feb 1945) Stalin agreed in principle to \"reorganize\" the Lublin government to include London Poles AND hold \"free and unfettered\" elections soon. He had no intention of honoring this — non-communist Polish leaders were arrested and the elections (when finally held in January 1947) were rigged to give the communists 80%. Poland became the first major test case of Soviet trustworthiness — and Stalin failed it.",cat:"cw_origins"},{id:"cw69",q:"How did Stalin manage Soviet negotiation tactics?",a:"A deliberate two-stage strategy. Soviet negotiators (Molotov was famously stubborn — nicknamed \"Mr. Nyet\" by Western diplomats) would for hours or days hold rigid positions, exhausting Western counterparts and extracting concessions. Then Stalin would personally appear with a friendly smile, ready to \"compromise.\" The \"compromise\" was always close to what Stalin had originally wanted, but Western diplomats — relieved at apparent flexibility — would accept terms they would have rejected at the start. The pattern was used at Tehran, Yalta, and Potsdam, and made Western diplomats wary of all Soviet good faith.",cat:"cw_origins"},{id:"cw70",q:"What was the Iran Crisis and why was it the first Cold War test?",a:"Britain and the USSR had jointly occupied Iran from 1941 to secure oil supplies and supply routes to the USSR. They agreed to withdraw 6 months after war's end. Britain withdrew on schedule (March 1946). The USSR refused, used its troops to support Azerbaijani and Kurdish separatist movements aimed at detaching northern Iran. Truman, with British support, took it to the new UN Security Council — the first major UN crisis. Combined with private US diplomatic pressure (and possibly an implicit threat in Truman's later memoir), Stalin withdrew Soviet forces in May 1946. Truman became convinced Stalin sought \"world domination\" if not resisted — confirming Kennan's analysis just before the Long Telegram.",cat:"cw_origins"},{id:"cw71",q:"What was the Greek Civil War and what role did it play in the Cold War?",a:"After Nazi withdrawal in 1944, communist (KKE/EAM) and royalist forces fought for control of Greece. Britain initially supported the royalist government with troops (1944–47, including the brutal Dekemvriana fighting in Athens, December 1944). When Britain — bankrupt — informed the US in February 1947 it could no longer support Greece, Truman's response was the Truman Doctrine. US aid arrived March 1947; the communists were defeated by 1949 (Tito's break with Stalin in 1948 cut off their main supply line through Yugoslavia). The civil war killed ~150,000 and left Greece traumatized. Crucially, the Greek government wasn't a model democracy — but it was anti-communist, and that became the new criterion.",cat:"cw_origins"},{id:"cw72",q:"What happened in Czechoslovakia in February 1948?",a:"Czechoslovakia had a coalition government with significant non-communist participation; PM Klement Gottwald was communist but Foreign Minister Jan Masaryk was a respected centrist. In February 1948, communists demanded centralization of police; non-communist ministers resigned in protest expecting elections to vindicate them. President Beneš under pressure accepted a communist-only government. Two weeks later Masaryk's body was found below his Foreign Ministry window — official verdict suicide; widespread suspicion of murder (\"Czechoslovak defenestration\"). Czechoslovakia (which had tried to accept Marshall Aid the previous summer before Stalin pressured it to refuse) became fully communist. The 1948 coup terrified Western Europe — a democratic country had fallen to communism in days.",cat:"cw_origins"},{id:"cw73",q:"What were the key statistics of the Berlin Airlift?",a:"The blockade ran 24 June 1948 to 12 May 1949 (318 days, though airlift continued until September 1949). Over 277,000 flights delivered ~2.3 million tons of supplies — food, coal, medicine. At peak, a plane landed at Tempelhof Airport every 30 seconds; pilots flew exhaustion-inducing schedules. ~101 people died in airlift accidents (~70 American/British). The cost was ~$224 million. Average daily delivery climbed from ~750 tons (early summer) to over 8,000 tons (peak). Stalin lifted the blockade having achieved nothing — and the airlift became a propaganda triumph (Allied pilots dropping candy parachutes to children — \"Operation Little Vittles\").",cat:"cw_origins"},{id:"cw74",q:"What was NATO and what made it different from previous alliances?",a:"The North Atlantic Treaty Organization, founded 4 April 1949 with 12 founding members: US, UK, France, Belgium, Netherlands, Luxembourg, Italy, Portugal, Norway, Denmark, Iceland, Canada. Article 5: an attack on any one member is an attack on all (collective defence). Article 5 has only been invoked once — after 9/11 in 2001. NATO was historically unprecedented for the US: the country that had refused to join the League of Nations and had retreated to isolationism after WWI was now committing to permanent peacetime alliance and military bases in Europe. NATO's formation marked the death of US isolationism and made the European Cold War's military shape permanent.",cat:"cw_origins"},{id:"cw75",q:"How did the USSR get the atomic bomb so quickly?",a:"US estimates predicted the USSR would not have a bomb until 1953–54. The actual Soviet test came in August 1949 — four years early. Soviet espionage was crucial: Klaus Fuchs (German-born British physicist on the Manhattan Project) provided detailed bomb designs to Soviet intelligence 1942–47; Theodore Hall (American physicist at Los Alamos) and David Greenglass (machinist at Los Alamos) also supplied data; the Rosenbergs (executed 1953) helped coordinate the network. The first Soviet bomb (RDS-1, \"First Lightning,\" tested 29 August 1949) was a near-replica of the US Fat Man bomb. Fuchs was caught and confessed in 1950; his arrest exposed much of the network and accelerated US Red Scare paranoia.",cat:"cw_origins"},{id:"cw76",q:"What were the most important phrases from Truman's 12 March 1947 speech?",a:"Three key sentences. (1) Defining the doctrine: \"I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures.\" (2) Defining the stakes: \"The free peoples of the world look to us for support in maintaining their freedoms. If we falter in our leadership, we may endanger the peace of the world.\" (3) Defining the choice: a choice between \"alternative ways of life\" — democracy with free institutions or rule by terror with controlled press and elections. The speech generalized the Greek-Turkish situation into a permanent global commitment.",cat:"cw_origins"},{id:"cw77",q:"What was the Cominform?",a:"The Communist Information Bureau, founded September 1947, headquartered in Belgrade (until Tito's break in 1948, then Bucharest). A formalized coordination body for European communist parties — including the French and Italian communist parties (which were not in power but were significant political forces). Cominform was Stalin's response to the Marshall Plan: it tightened Soviet ideological control over Eastern bloc parties and aimed to disrupt Marshall Plan implementation in Western Europe through strikes (especially the November 1947 communist strikes in France and Italy). Dissolved in 1956 after Khrushchev's de-Stalinization began.",cat:"cw_origins"},{id:"cw78",q:"Why did Tito break with Stalin?",a:"Yugoslavia had liberated itself from Nazi occupation through Tito's Partisan resistance — without Soviet troops on its soil. Tito was therefore not personally beholden to Stalin and ran his own communist regime independently. Tensions grew over Yugoslav ambitions in Albania and Greece, Tito's federal aspirations in the Balkans, and Soviet attempts to recruit Yugoslav communists as informants. In June 1948, Cominform formally expelled Yugoslavia. Stalin reportedly said \"I will shake my little finger and there will be no more Tito\" — but Tito survived. He accepted ~$150M in US Marshall Aid (a major Cold War win for the West, demonstrating that communism need not align with Moscow), founded the Non-Aligned Movement (1961), and ruled until his death in 1980. The break also led Stalin to purge Eastern European communist parties of suspected \"Titoists.\"",cat:"cw_origins"},{id:"cw79",q:"What were the contradictions in the Atlantic Charter?",a:"Roosevelt and Churchill signed the Atlantic Charter (Aug 1941, off Newfoundland) before the US entered WWII. It declared all peoples had a right to self-determination — a principle that would later cut against the British Empire (which Churchill defended) and the French colonial empire. Stalin signed up too in 1942. The contradiction: Roosevelt expected self-determination would dismantle European colonial empires and create democratic nations; Churchill insisted it didn't apply to Britain's existing colonies (the Atlantic Charter shouldn't undermine Imperial Preference); Stalin would later cite self-determination to justify Soviet sphere of influence in Eastern Europe. Each great power read the charter selectively. Its rhetorical power outlasted its actual diplomatic effect.",cat:"cw_origins"},{id:"cw80",q:"What were the Bretton Woods institutions and why did the USSR refuse to join?",a:"The 1944 Bretton Woods conference (US, with 44 nations) created the IMF (International Monetary Fund), the World Bank (initially the IBRD — International Bank for Reconstruction and Development), and the dollar-gold standard system. They were designed to prevent the inter-war economic collapse from recurring. The USSR signed the agreements but refused to ratify in 1946, recognizing that joining would mean accepting US-dominated economic governance. This refusal was an early concrete sign of the coming economic split. Bretton Woods became the financial architecture of the capitalist world; the USSR built its own (COMECON, 1949) and never integrated into the global financial system until after 1991.",cat:"cw_origins"},{id:"cw81",q:"How did Marshall Plan implementation create a Western European economic alliance?",a:"Beyond the money, the Marshall Plan required recipients to coordinate. The Organisation for European Economic Cooperation (OEEC, 1948 — later OECD) was created to administer the aid. Recipients had to remove some trade barriers among themselves, harmonize currencies, and accept American oversight. This forced cooperation laid the groundwork for the European Coal and Steel Community (ECSC, 1951), the Treaty of Rome (1957), and ultimately the European Union. The Cold War's economic division thus directly created Western European integration — Stalin's refusal of Marshall Aid meant Eastern Europe never integrated similarly.",cat:"cw_origins"},{id:"cw82",q:"What was Kennan's \"X article\" and how did it shape containment?",a:"Following the Long Telegram, Kennan was brought back to Washington and published \"The Sources of Soviet Conduct\" anonymously (signed \"X\") in Foreign Affairs (July 1947). Building on the Long Telegram, it called for \"long-term, patient but firm and vigilant containment of Russian expansive tendencies\" through the \"adroit and vigilant application of counter-force at a series of constantly shifting geographical and political points.\" This 25-page article gave containment its name and theoretical structure. Kennan later (1948+) regretted that Truman had militarized his concept — he had originally meant primarily political and economic containment, not the military buildup of NSC-68.",cat:"cw_origins"},{id:"cw83",q:"What was the Kennan-Lippmann debate?",a:"Walter Lippmann (the leading US journalist of the era) wrote a series of 14 columns (1947) attacking Kennan's containment doctrine — published as the book \"The Cold War\" (the term originated with Lippmann's title). Lippmann argued containment would force the US to defend \"client states\" indiscriminately, draining resources and committing to peripheral conflicts. He warned containment would lead to a permanent national-security state and erosion of US freedoms. Kennan, in private, partly agreed with Lippmann's worries about militarization. The debate previewed many of the criticisms that would be levelled at containment over the next 40 years (Vietnam, support for dictators, military-industrial complex).",cat:"cw_origins"},{id:"cw84",q:"How did the US influence the 1948 Italian elections?",a:"Italy's first post-war election was scheduled for April 1948. Pre-election polls suggested the Italian Communist Party (PCI, then Western Europe's largest Communist Party) and Socialists in alliance might win. The CIA ran one of its first major covert operations — direct funding of the Christian Democrats (~$10M+, channelled through US-Italian businessmen and Catholic networks); coordinated mass-letter campaigns from Italian-Americans to relatives in Italy urging anti-communist votes; Voice of America propaganda; food and economic aid contingent on a Christian Democrat victory. Pope Pius XII excommunicated communists. The Christian Democrats won 48% to the Communists' 31%. The CIA's \"successful\" Italian campaign became a template for later interventions in Latin America and elsewhere.",cat:"cw_origins"},{id:"cw85",q:"Who was Jan Masaryk and what did his death symbolize?",a:"Jan Masaryk (1886–1948) was Czechoslovakia's Foreign Minister from 1940 (in exile) and son of the country's founding father Tomáš Masaryk. He was the public face of post-war Czechoslovakia — a centrist non-communist who tried to balance East and West. After the February 1948 communist coup, he stayed in office briefly. On 10 March 1948 his body was found in pajamas below his bathroom window at the Foreign Ministry. Official verdict: suicide. Suspicion (later strengthened by post-1989 investigations): murder by Soviet/Czech security services. His death became a symbol of what Soviet domination meant — even prominent figures could be eliminated and the cover-up sustained. Czech police reopened the investigation in 1968 and 1995; the 2003 verdict was probable murder.",cat:"cw_origins"},{id:"cw86",q:"How did the Soviets impose their model on Eastern Europe?",a:"A deliberate process roughly 1944–48. (1) Establish coalition governments that include non-communist parties but place communists in key ministries (especially Interior/police). (2) Use the security apparatus to intimidate and arrest non-communist leaders, often on fabricated charges. (3) Force mergers — usually of social democratic parties with communist parties (creating \"United Workers' Parties\" controlled by communists). (4) Show trials to eliminate even loyal communists deemed insufficiently Stalinist (the 1949 Rajk trial in Hungary, the 1952 Slánský trial in Czechoslovakia, both featured anti-Semitic elements). (5) Force collectivization of agriculture and nationalize industry. The pattern was applied with variations across the bloc — Poland (1947), Hungary (1949), Romania, Bulgaria, Czechoslovakia. Yugoslavia and Albania escaped because they liberated themselves.",cat:"cw_origins"},{id:"cw87",q:"Why did the Berlin Airlift become more important symbolically than militarily?",a:"Stalin's blockade was meant to force the Western powers to abandon West Berlin or accept Soviet currency in their sectors. He calculated they couldn't supply 2.5 million Berliners by air — a reasonable assumption. The airlift's success — keeping a city alive entirely from the air for nearly a year — proved Western technology, organization, and commitment in a way that even military victory might not have. For Berliners specifically, \"Rosinenbomber\" pilots (especially Gail Halvorsen, the \"Candy Bomber\" who dropped chocolate parachutes to children) created lasting goodwill that reshaped German attitudes from former enemy to permanent ally. The blockade-breaking moment converted the German question from \"what to do with the defeated enemy\" to \"how to integrate the new ally\" — and arguably saved Berlin as a free city for the next 40 years.",cat:"cw_origins"},{id:"cw23",q:"What was NSC-68 and what did it mean?",a:"National Security Council Report 68 (April 1950) — tripled the US defence budget and called for massive military buildup to contain the Soviets globally. It marked the shift \"from passive to pro-active containment\" and called for the official US position: USSR is bent on worldwide revolution and understands only strength. The Korean War, starting two months later, ensured NSC-68 was implemented in full.",cat:"cw_containment"},{id:"cw24",q:"Why did Truman call Korea \"the Greece of the Far East\"?",a:"Just as $400 million had saved Greece from communism in Europe (Truman Doctrine), Korea was equally critical in Asia. The comparison signaled that the Cold War had gone global — containment was now a worldwide commitment, not just a European policy.",cat:"cw_containment"},{id:"cw25",q:"What was the significance of the Korean War for the Cold War?",a:"(1) First armed conflict between capitalist and communist forces. (2) Globalized the Cold War beyond Europe. (3) One of the first instances of the UN leading a military coalition. (4) Massively increased US military spending. Charles \"Chip\" Bohlen claimed: \"It was the Korean War and not WWII that made us a world military-political power.\" David Reynolds wrote that Truman's decisions \"redefined the Cold War.\"",cat:"cw_containment"},{id:"cw26",q:"How successful was US containment in Korea?",a:"Partially — at enormous cost. South Korea was saved from invasion, but ~2.5 million Korean civilians died. The peninsula remained divided at roughly the same line. The war enabled the rise of China as a major communist power. It ended in armistice (1953), not a peace treaty — technically the war never ended.",cat:"cw_containment"},{id:"cw27",q:"How did Japan fit into US containment strategy?",a:"Occupied by the US after WWII, Japan was rebuilt as a capitalist democracy and never seriously at risk of communism — its booming economy brought nationalist rather than communist movements. The 1952 American–Japanese Security Treaty formalized US protection, allowing Japan to develop economically without a large military. It became the protector of capitalism in Asia and a crucial counterweight to China.",cat:"cw_containment"},{id:"cw28",q:"What was the Formosa Resolution?",a:"After Chinese bombardment of Taiwan (1953), Congress authorized \"whatever military action deemed necessary\" to defend Taiwan. Eisenhower explicitly threatened nuclear weapons against China — textbook brinkmanship. It worked: Taiwan remained non-communist, demonstrating that nuclear deterrence could succeed where conventional means might not.",cat:"cw_containment"},{id:"cw29",q:"Why was Vietnam a failure for US containment?",a:"The Gulf of Tonkin Resolution (1964) gave unlimited presidential military authority. Operation Rolling Thunder caused 30,000 civilian casualties. The first uncensored televised war — images of napalm reached American living rooms, sparking massive protests. The US lost and withdrew (1973). The Domino Theory came true: Laos and Cambodia fell to communism in 1975. But the war did relieve Chinese pressure from Malaysia, Thailand, and Singapore.",cat:"cw_containment"},{id:"cw30",q:"What was the Domino Theory?",a:"Eisenhower's idea (1954): if one country fell to communism, neighbours would follow like dominoes. Used to justify Southeast Asian intervention. Partially came true after 1975 — Vietnam fell, Laos and Cambodia followed within months. But Thailand, Malaysia, and Singapore resisted, suggesting the theory was too simplistic.",cat:"cw_containment"},{id:"cw31",q:"How did Cold War ideology distort the West's reading of Ho Chi Minh?",a:"Ho was a Vietnamese communist AND nationalist who led independence against French colonial rule. The Cold War lens flattened him: \"As the Cold War intensified, Ho's Communist rather than nationalist credentials were emphasized, and the assumption grew that he was being directed from Moscow\" (textbook). This misreading helped lock the US into a war it was politically and strategically unsuited to win.",cat:"cw_containment"},{id:"cw32",q:"What was the Geneva Conference (1954)?",a:"After French defeat at Dien Bien Phu, the Conference agreed: French withdrawal from Indochina; temporary division of Vietnam at the 17th parallel (Ho Chi Minh in the north); \"free elections\" to unite Vietnam in 1956; no foreign bases. Crucially, the US did NOT sign the Geneva Accords. South Vietnam fell under a brutal US-backed dictatorship — setting up the wider war.",cat:"cw_containment"},{id:"cw33",q:"How did the Korean War redefine the Cold War?",a:"Before Korea, the Cold War was primarily European political/economic competition. After Korea, it was a global military confrontation. US military budget tripled, SEATO created, US committed to worldwide military bases. As Reynolds wrote, Truman's decisions \"redefined the Cold War\" — from cold to hot in the East.",cat:"cw_containment"},{id:"cw34",q:"What were the Red Scare and McCarthyism?",a:"The 1950s anti-communist crusade in the USA. Senator Joseph McCarthy claimed communists had infiltrated the government, army, and entertainment industry. HUAC targeted Hollywood (the \"Hollywood Ten\"). It created a climate of fear and suspicion domestically and reinforced political pressure on presidents to be tough on communism abroad — heightened by the 1949 events: China falling to communism and the Soviet atomic bomb.",cat:"cw_containment"},{id:"cw35",q:"How did China falling to communism change the Cold War?",a:"Mao Zedong's Communist forces won the Chinese Civil War. Acheson explained: \"The Nationalist armies did not have to be defeated; they disintegrated.\" This terrified America — the world's most populous nation was now communist. Combined with the Soviet atomic bomb (also 1949) and the Red Scare, it shifted the US from passive to pro-active containment, leading directly to NSC-68 and the Korean War.",cat:"cw_containment"},{id:"cw88",q:"What was the Inchon Landing and why did it matter?",a:"After North Korean forces had pushed UN troops into the small Pusan Perimeter at the southern tip of Korea (by August 1950), General Douglas MacArthur executed Operation Chromite — an audacious amphibious landing at Inchon (15 September 1950), 200 km behind enemy lines on the west coast near Seoul. ~75,000 troops landed despite extreme tides (one of the world's largest tidal ranges, ~10 m), narrow channels, and seawalls. It cut the North Korean army's supply lines and recaptured Seoul within two weeks. By October UN forces had reached the 38th parallel and pushed north. MacArthur's most brilliant operation — but his ambition to push to the Yalu River would soon trigger Chinese intervention.",cat:"cw_containment"},{id:"cw89",q:"When and why did China intervene in the Korean War?",a:"After UN forces crossed the 38th parallel and approached the Yalu River (the Chinese border) in October 1950, Mao decided China could not tolerate a hostile US-allied state on its border. ~300,000 \"People's Volunteers\" (officially not Chinese army to maintain plausible deniability) crossed the Yalu in late October and November 1950, achieving complete tactical surprise. They drove UN forces back below the 38th parallel by January 1951. Total Chinese forces eventually exceeded 1 million; ~600,000–1 million Chinese died. The Chinese intervention turned a near-victory for the UN/US into a permanent stalemate at roughly the original border.",cat:"cw_containment"},{id:"cw90",q:"Why did Truman dismiss MacArthur?",a:"General Douglas MacArthur publicly demanded escalation against China — including atomic weapons against Manchuria, a blockade, support for Chiang Kai-shek's Nationalists to invade mainland China. He bypassed Truman by communicating directly with Republican opponents and made public statements contradicting administration policy. Truman, fearing a wider war (possibly with the USSR if China was attacked), fired MacArthur on 11 April 1951 for insubordination. MacArthur returned to a hero's welcome in the US — a ticker-tape parade and a famous Congressional address (\"Old soldiers never die; they just fade away\"). But the firing established civilian control of the military as more important than victory in Korea — a precedent.",cat:"cw_containment"},{id:"cw91",q:"Who were the Hollywood Ten?",a:"Ten Hollywood writers and directors — including Dalton Trumbo (later screenwriter of Spartacus, Roman Holiday) — who refused to testify before HUAC (House Un-American Activities Committee) about their alleged Communist Party membership in October 1947. They were cited for contempt of Congress, sentenced to up to a year in prison, and added to the Hollywood Blacklist (run by studios), which prevented their employment. The blacklist eventually included 300+ writers, directors, and actors — many had to write under pseudonyms or in exile. The blacklist crumbled in 1960 when Kirk Douglas openly credited Trumbo for Spartacus. The Hollywood Ten became symbols of Red Scare excess and First Amendment violations.",cat:"cw_containment"},{id:"cw92",q:"Who were Julius and Ethel Rosenberg?",a:"A married couple of New York Communists arrested in 1950 for atomic espionage. Ethel's brother David Greenglass, a machinist at Los Alamos, gave the FBI testimony (later partly recanted) implicating them in coordinating Soviet atomic spy networks. Julius was clearly involved (decoded Venona project intercepts confirmed this); Ethel's role is debated — recent evidence suggests she was less involved than the prosecution claimed. Despite international protests including Pope Pius XII, they were executed in the electric chair at Sing Sing on 19 June 1953 — the only US civilians ever executed for espionage in peacetime. They became polarizing symbols: the right viewed them as guilty traitors; the left as victims of anti-communist hysteria. Their case marked the peak of Red Scare prosecutions.",cat:"cw_containment"},{id:"cw93",q:"How did the CIA overthrow Iran's elected PM?",a:"Mohammad Mossadegh became PM in 1951 and nationalized the Anglo-Iranian Oil Company (formerly British Petroleum) — Britain's most valuable foreign asset. Britain's blockade and embargo collapsed Iran's economy. Eisenhower (taking office Jan 1953) was convinced — partly through British framing of Mossadegh as pro-communist — to authorize a coup. Operation Ajax (CIA Kermit Roosevelt; British MI6 partner; ~$1M budget) bribed politicians, organized riots in Tehran, and won army support. Mossadegh was arrested 19 August 1953; the Shah, who had briefly fled, was reinstated. Iran's oil was renationalized but with US/British/Dutch consortium control. Long-term: the 1979 Iranian Revolution and the lasting US-Iran hostility were direct consequences. At the time, the CIA saw it as cheap, fast containment success.",cat:"cw_containment"},{id:"cw94",q:"How did the CIA overthrow Guatemala's elected president?",a:"Jacobo Árbenz, elected 1951, proposed Decree 900 (1952) — a land reform that expropriated unused United Fruit Company land at the under-reported tax-value Compensation. United Fruit (then dominant in Guatemala's economy) lobbied Eisenhower's administration heavily; Secretary of State John Foster Dulles had been a United Fruit lawyer. Eisenhower authorized PBSUCCESS — CIA-trained Guatemalan exiles led by Carlos Castillo Armas crossed from Honduras (June 1954); CIA radio broadcasts faked army defeats; pressure on the army caused Árbenz's resignation (27 June 1954). Castillo Armas became dictator; reversed land reform; killed thousands of opponents. Long-term: triggered 36 years of civil war and military dictatorships in Guatemala (~200,000 dead). Che Guevara was personally radicalized observing the coup and would carry the lesson to Cuba.",cat:"cw_containment"},{id:"cw95",q:"What was Eisenhower's exact Domino Theory speech and how was it later used?",a:"At a 7 April 1954 press conference about Indochina, Eisenhower said: \"You have a row of dominoes set up; you knock over the first one, and what will happen to the last one is the certainty that it will go over very quickly. So you could have a beginning of a disintegration that would have the most profound influences.\" Used to justify support for South Vietnam, intervention in Vietnam, support for authoritarian regimes across Southeast Asia, even involvement in Latin America (where dominoes might fall to Castroism). The theory partly came true after 1975 — Laos and Cambodia did fall — but its broader prediction (regional collapse) failed; Thailand, Malaysia, Singapore, Indonesia did not fall.",cat:"cw_containment"},{id:"cw96",q:"What happened at Dien Bien Phu and why did it matter?",a:"French forces — desperate to draw the Viet Minh into a decisive battle they could win — built a fortified base at Dien Bien Phu in northwest Vietnam (November 1953). Vietnamese commander General Giap brought heavy artillery overland through \"impossible\" terrain, surrounded the base, and besieged it for 56 days (March–7 May 1954). 11,721 French troops surrendered. The defeat ended French willingness to fight; the US — which had funded ~80% of French costs — refused to intervene with airpower (despite Dulles considering atomic options under \"Operation Vulture\"). Within weeks, the Geneva Conference partitioned Vietnam at the 17th parallel. Dien Bien Phu was the first major colonial-era defeat of a Western power by a non-Western army using conventional methods.",cat:"cw_containment"},{id:"cw97",q:"What were the Geneva Accords and why didn't the US sign?",a:"The Geneva Conference (April–July 1954) was attended by France, USSR, UK, China, US, and Vietnamese factions. Agreements: French withdrawal from Indochina; temporary partition of Vietnam at the 17th parallel (Ho Chi Minh's communists in the north, the State of Vietnam under Bao Dai in the south); all-Vietnam elections to be held by July 1956 to reunify; no foreign military bases; recognition of Laos and Cambodia. The US (Dulles) refused to sign — believing the elections would be won by Ho Chi Minh (Eisenhower himself estimated Ho would have won 80% if elections had been held). The 1956 elections were never held. South Vietnam under the brutal Catholic dictator Ngo Dinh Diem (US-backed) refused. The 17th parallel became another permanent Cold War border.",cat:"cw_containment"},{id:"cw98",q:"What was the \"Geneva Spirit\" of 1955?",a:"A brief thaw in superpower relations. After Stalin's death (March 1953) and Korean armistice (July 1953), Eisenhower and the new Soviet leadership (the post-Stalin troika of Khrushchev, Bulganin, Molotov) met at the Geneva Summit (July 1955) — the first East-West summit since Potsdam 1945. No concrete agreements but Eisenhower's \"Open Skies\" proposal (mutual aerial reconnaissance, rejected by Soviets) and goodwill gestures. The \"Spirit of Geneva\" was widely felt as relaxation of tensions. It collapsed with the Hungarian invasion (1956), the U-2 incident (1960), and the Berlin Crisis. Showed that even at the height of brinkmanship, both sides recognized direct war must be avoided.",cat:"cw_containment"},{id:"cw99",q:"What was the Hungarian Revolution of 1956?",a:"After Khrushchev's \"Secret Speech\" (Feb 1956) denouncing Stalin's crimes raised hopes for liberalization across the bloc, Hungarian students demonstrated 23 October 1956 demanding democratic reforms. The protests escalated into a national uprising; Hungarian Communist reformer Imre Nagy returned to power, declared neutrality, announced withdrawal from the Warsaw Pact. Soviet tanks invaded 4 November 1956. ~2,500 Hungarians killed, ~13,000 wounded, ~200,000 fled abroad. Nagy was lured out of asylum and executed (June 1958). The CIA-funded Radio Free Europe had encouraged the uprising — but the US did NOT intervene, betraying Hungarian hopes. Eisenhower's \"roll-back\" rhetoric was exposed as empty. Showed both that satellite states might revolt AND that the West would not actually liberate them — a lesson Eastern Europeans would not forget until 1989.",cat:"cw_containment"},{id:"cw100",q:"What was Khrushchev's Secret Speech and why did it matter?",a:"At the 20th Party Congress on 25 February 1956, Khrushchev delivered a 4-hour speech to a closed session denouncing Stalin's crimes — the cult of personality, the purges, the wartime errors, deportations, secret police excesses. Officially secret (delivered without notes circulated), the text was leaked within months — first by Polish communists, eventually published in the New York Times (June 1956). Consequences: shock to communist parties worldwide, many members quitting; encouragement to satellite-state reformers (Polish October 1956, Hungarian Revolution 1956); Sino-Soviet tensions (Mao felt undermined by an attack on a fellow Communist leader and on the cult of personality model); a partial liberalization in the USSR (the \"Thaw\") that would last until Khrushchev's removal in 1964.",cat:"cw_containment"},{id:"cw36",q:"What caused the Berlin Crisis (1958–61)?",a:"Three interlocking problems. (1) Brain drain — over 300,000 skilled East Germans crossed freely to West Berlin for higher pay in identical positions. (2) Economic exploitation — West Berliners bought cheap goods in East Berlin, causing scarcity for East Berliners. (3) Military — FRG was in NATO and equipped with tactical nuclear weapons, alarming Khrushchev. Khrushchev demanded Western troop withdrawal and Berlin as a \"Free City.\" Geneva and Paris Conferences produced no resolution.",cat:"cw_crises"},{id:"cw37",q:"Why was the Berlin Wall built?",a:"Khrushchev was compelled by the economic crisis — the brain drain (300,000+ fleeing) was unsustainable. Overnight on 13 August 1961, barbed wire was erected between East and West Berlin, then a permanent concrete wall. Despite the propaganda damage, the Wall achieved its goals: the GDR's existence was assured, and Western powers implicitly recognized East Germany by tolerating the Wall.",cat:"cw_crises"},{id:"cw38",q:"How was the Berlin Wall a mild success for Khrushchev despite its propaganda cost?",a:"The Wall ended the brain drain, secured East Germany's existence, and forced the Western powers to tolerate the GDR — implicitly recognizing it. With the resolution, Germany was no longer a constant pressure point in US-Soviet relations. The propaganda cost, however, was huge: the Wall became the defining symbol of the Cold War — an admission communism couldn't compete if people were free to choose.",cat:"cw_crises"},{id:"cw39",q:"What were the lasting impacts of the Berlin Crisis?",a:"German-American relations suffered; Berlin relied more on France. The Wall was a massive propaganda loss for communism worldwide. It resolved the Berlin question — Germany was no longer a constant pressure point. Kennedy initially appeared weak, which emboldened Khrushchev to act in Cuba.",cat:"cw_crises"},{id:"cw40",q:"What happened at Checkpoint Charlie in October 1961?",a:"After the Wall went up in August 1961, US and Soviet tanks faced off directly at Checkpoint Charlie in October 1961 for 16 hours — the closest direct military confrontation between US and Soviet forces during the Cold War. The standoff de-escalated, but it demonstrated how quickly the Berlin situation could spiral into war.",cat:"cw_crises"},{id:"cw41",q:"What were the three main causes of the Cuban Missile Crisis?",a:"(1) Cuban Revolution (1959) — Castro overthrew US-backed Batista and established a communist regime 90 miles from Florida; Cuba grew closer to the USSR, extending the Soviet sphere to the American continent. (2) Bay of Pigs failure (April 1961) — Kennedy's modified CIA invasion was a humiliating disaster; it strengthened Castro and made Kennedy look weak to Khrushchev. (3) Soviet missiles (October 1962) — US U-2 planes discovered nuclear missile construction sites in Cuba — placed in response to US missiles in Turkey.",cat:"cw_crises"},{id:"cw42",q:"How was Kennedy viewed after the Cuban Missile Crisis?",a:"ORTHODOX — calm and decisive; chose naval blockade (\"quarantine\" to avoid the legal implications of war) over invasion or airstrikes. REVISIONIST — reckless and self-interested; provoked the crisis through Bay of Pigs and escalated unnecessarily when private diplomacy might have worked sooner.",cat:"cw_crises"},{id:"cw43",q:"How was Khrushchev viewed after the Cuban Missile Crisis?",a:"His relationships with the Soviet military and Cuban allies were strained. Domestically humiliated; the climbdown contributed to his removal in 1964. China saw the Soviet retreat as proof the USSR was \"no longer a revolutionary state,\" deepening the Sino-Soviet split.",cat:"cw_crises"},{id:"cw44",q:"What were the impacts of the Cuban Missile Crisis?",a:"(1) Direct hotline established between Washington and Moscow. (2) Limited Test Ban Treaty (1963). (3) Nuclear Non-Proliferation Treaty. (4) Khrushchev humiliated; contributed to his removal 1964. (5) China-USSR split deepened. (6) US promised not to invade Cuba — strengthened Castro's regime. (7) Arms race escalated, but the world became more secure through arms control.",cat:"cw_crises"},{id:"cw45",q:"How close was the Cuban Missile Crisis to nuclear war?",a:"For 13 days (16–28 Oct 1962) — the closest humanity has come to nuclear war. Soviet ships sailed toward the US blockade. A US U-2 was shot down over Cuba. Kennedy used \"quarantine\" to avoid formal war implications. The deal: Soviets remove Cuba missiles; US quietly removes Turkey missiles and promises not to invade Cuba.",cat:"cw_crises"},{id:"cw46",q:"Compare the Berlin Crisis and Cuban Missile Crisis. Which was more dangerous?",a:"Cuba was more dangerous — closest direct military confrontation between superpowers, with nuclear weapons in play and the world on the brink of nuclear war. Berlin was more propaganda-focused, with economic pressure and the Wall as resolution. Berlin had longer-running tension; Cuba had higher peak danger over 13 days.",cat:"cw_crises"},{id:"cw47",q:"What was the East German uprising of 1953?",a:"In June 1953, East German workers rioted against poor conditions and forced collectivization. Soviet tanks were sent in to crush the protests. The West German \"economic miracle\" — driven by larger population, greater industrial output, Marshall Aid — contrasted sharply with East Germany's forced socialization. This disparity drove the brain drain that later caused the Berlin Crisis.",cat:"cw_crises"},{id:"cw101",q:"What was the Vienna Summit and how did it set up the Berlin Wall?",a:"Kennedy met Khrushchev for the first time in Vienna 3–4 June 1961, two months after the Bay of Pigs disaster. Khrushchev was aggressive — he demanded Western withdrawal from Berlin, threatened a separate peace treaty with East Germany, dismissed Kennedy's appeals. Kennedy left rattled and reportedly told reporters: \"It will be a cold winter.\" Khrushchev concluded Kennedy was weak. The exodus from East Germany accelerated — over 30,000 fled in July 1961 alone. Khrushchev decided he could act unilaterally on Berlin. Kennedy's apparent weakness at Vienna directly enabled the construction of the Wall in August.",cat:"cw_crises"},{id:"cw102",q:"What was the U-2 Incident and how did it affect Cold War diplomacy?",a:"On 1 May 1960 a US U-2 high-altitude reconnaissance plane was shot down by a Soviet SA-2 surface-to-air missile over Sverdlovsk. Pilot Francis Gary Powers ejected and was captured alive. Eisenhower initially denied the espionage flight, claiming a weather plane had been lost. Khrushchev then produced both the wreckage AND the pilot, embarrassing Eisenhower internationally. The Paris summit scheduled for 16 May 1960 collapsed when Khrushchev demanded an apology Eisenhower refused. Powers was tried, sentenced to 10 years, exchanged for Soviet spy Rudolf Abel in 1962. The incident ended the \"Spirit of Camp David\" and showed both the depth of US espionage AND Soviet capacity to detect it.",cat:"cw_crises"},{id:"cw103",q:"What was ExComm and how did it function?",a:"ExComm (Executive Committee of the National Security Council) was the small group Kennedy convened on 16 October 1962 to manage the Cuban Missile Crisis. Members included his brother Robert Kennedy (Attorney General), Secretary of Defense McNamara, Secretary of State Dean Rusk, military Joint Chiefs, ambassadors. Six days of intense debate (16–22 October) considered options: airstrike to destroy missile sites, full invasion, blockade, diplomatic pressure. The Joint Chiefs (especially Air Force chief Curtis LeMay) favored airstrike or invasion. McNamara advocated blockade as least escalatory. Kennedy chose blockade (\"quarantine\"). Robert Kennedy's later book \"Thirteen Days\" (1969) shaped the public's view as Kennedy as cool decision-maker — though the book underplayed Kennedy's earlier Bay of Pigs and Operation Mongoose responsibility for provoking the crisis.",cat:"cw_crises"},{id:"cw104",q:"What was the secret Turkey deal in the Cuban Missile Crisis resolution?",a:"In addition to the public agreement (Soviets remove Cuba missiles in exchange for US public no-invasion pledge), Robert Kennedy met Soviet ambassador Anatoly Dobrynin on 27 October 1962 with a secret commitment: the US would remove its Jupiter intermediate-range missiles from Turkey within 4–5 months, but this commitment must remain secret — if disclosed, the deal was off. The Jupiters were obsolete and Kennedy had wanted to remove them anyway. The secrecy was crucial because publicly trading Cuba for Turkey would have looked like a US concession and damaged NATO confidence. The secret was kept for nearly 30 years; revealed only after 1989. Khrushchev got two strategic concessions — but the public face was a Soviet retreat that humiliated him domestically.",cat:"cw_crises"},{id:"cw105",q:"What was Operation Mongoose?",a:"A CIA covert operation against Castro's Cuba, authorized by Kennedy after the Bay of Pigs failure (November 1961). Code-named \"the Cuban Project,\" led by General Edward Lansdale. Activities: paramilitary raids by Cuban exiles, sabotage of Cuban sugar production and infrastructure, attempts to assassinate Castro (~8 documented attempts including poisoned cigars, exploding seashells, contaminated diving suits, Mafia hit contracts). Mongoose contributed directly to Khrushchev's decision to deploy missiles — Castro had real reason to expect another invasion. Mongoose was wound down after the Missile Crisis (US no-invasion pledge made it incompatible) but anti-Castro CIA operations continued for years. Released documents (Church Committee, 1975) exposed many operations to public outrage.",cat:"cw_crises"},{id:"cw106",q:"What was the \"Hotline\" and why was it created?",a:"The Washington-Moscow Direct Communications Link, established 20 June 1963. Both sides recognized after the Cuban Missile Crisis that the slow speed of standard diplomatic communication (Khrushchev's October 26 letter took 12 hours to reach Washington) had nearly caused catastrophe. The hotline was initially a teletype (NOT a \"red telephone\" as in popular imagination — that was a Hollywood invention). It allowed leaders to communicate immediately during crises, reducing risk of miscalculation. First used by Johnson during the 1967 Six-Day War. Updated to satellite links in 1971. Its existence symbolized the institutionalization of crisis-management between superpowers — both recognizing they shared an interest in NOT triggering nuclear war.",cat:"cw_crises"},{id:"cw107",q:"What was the Limited Test Ban Treaty?",a:"Signed 5 August 1963 by the US, USSR, and UK; eventually ratified by 100+ countries. Banned nuclear weapons tests in the atmosphere, in outer space, and underwater — but allowed underground testing. Driven by the Cuban Missile Crisis shock and growing concern about radioactive fallout (Strontium-90 in milk; the 1962 \"Children's Crusade\" of mothers worried about fallout). It was the first major arms control agreement of the Cold War. Limitations: France and China refused to sign and continued atmospheric testing into the 1970s and 1980s respectively. The Comprehensive Test Ban Treaty (1996) extended the ban underground but has not entered force (US, China, others have not ratified).",cat:"cw_crises"},{id:"cw108",q:"What was the NPT and what did it commit signatories to?",a:"The Treaty on the Non-Proliferation of Nuclear Weapons, opened for signature 1 July 1968, in force 1970. Three pillars: (1) Non-proliferation — non-nuclear states agree not to acquire nuclear weapons. (2) Disarmament — the five recognized nuclear states (US, USSR, UK, France, China) commit to \"good faith\" disarmament. (3) Peaceful use — non-nuclear states have right to develop nuclear energy under safeguards. ~191 states have joined — making it the most successful arms control treaty in history. Notable holdouts: India, Pakistan, Israel (never joined); North Korea (joined, withdrew 2003). The \"good faith\" disarmament commitment has been only partially honored — though arsenal sizes have been reduced dramatically from peaks (~70,000 warheads in 1986 to ~12,500 today).",cat:"cw_crises"},{id:"cw109",q:"What was the Prague Spring and how did it produce the Brezhnev Doctrine?",a:"Czechoslovakia's reformist communist leader Alexander Dubček launched \"socialism with a human face\" in early 1968 — relaxing censorship, expanding civil liberties, reducing secret police powers, planning multi-party elections. The \"Prague Spring.\" Brezhnev feared this would spread across the Warsaw Pact. On 21 August 1968, ~250,000 Warsaw Pact troops (USSR, Poland, East Germany, Hungary, Bulgaria) invaded — the largest military operation in Europe since WWII. ~137 Czechoslovaks killed. Dubček was abducted to Moscow, forced to roll back reforms, eventually replaced. Brezhnev articulated the new doctrine in November 1968: socialist states had limited sovereignty; the USSR could intervene to \"protect socialism.\" It would govern until Gorbachev abandoned it (1988) — making the Sinatra Doctrine the END of the Brezhnev Doctrine.",cat:"cw_crises"},{id:"cw110",q:"What were the key escalation points and statistics of the Vietnam War?",a:"Key milestones: November 1963 — Diem assassinated (with US complicity). August 1964 — Gulf of Tonkin Incident (USS Maddox, partly fabricated reports of NV attack); Resolution authorized open-ended escalation. February 1965 — Operation Rolling Thunder (sustained bombing of North Vietnam) begins. March 1965 — first US combat troops land at Da Nang. 1965–73 — US dropped ~7 million tons of bombs on Indochina (more than all WWII bombing combined); used 19 million gallons of Agent Orange defoliant. Peak US troops 543,000 (April 1969). Total US dead: ~58,000. Vietnamese dead: estimates 1.3–3.4 million. Cambodia and Laos casualties: hundreds of thousands. Cost to US: ~$168 billion (1965 dollars; multiple times that adjusted). Drove the inflation that ended Bretton Woods (1971) and shifted the Cold War's economic balance.",cat:"cw_crises"},{id:"cw111",q:"What was the Tet Offensive and why was it so signific

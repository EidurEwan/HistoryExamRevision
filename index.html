const EXAM_QUESTIONS=[{q:"To what extent was the US policy of containment in Asia successful?",topic:"coldWar",hints:"Korea (partial success — South saved but ~2.5M civilian deaths, peninsula divided), Japan (success — 1952 Security Treaty, capitalist counterweight to China), Taiwan (success — Formosa Resolution + nuclear threat), Vietnam (failure — Domino Theory partly realized, Laos/Cambodia fell). Argue 3+1 or 2+2 with transition words. Consider Bohlen and Reynolds quotes."},{q:"Discuss the causes of the Cuban Missile Crisis.",topic:"coldWar",hints:"Three main causes: (1) Cuban Revolution 1959 — communist 90 miles from Florida, deepened US hostility; (2) Bay of Pigs failure 1961 — strengthened Castro, weakened Kennedy; (3) Soviet missiles October 1962 — placed in response to US missiles in Turkey. Link to broader Cold War tensions and Berlin context."},{q:"Compare the Berlin Crisis and the Cuban Missile Crisis. Which was more dangerous?",topic:"coldWar",hints:"Berlin: propaganda-focused, economic pressure (brain drain), Wall built; Checkpoint Charlie 16-hour standoff. Cuba: naval \"quarantine,\" nuclear brinkmanship, 13 days on the edge, Soviet ships sailing toward blockade. Cuba was more dangerous in peak nuclear risk; Berlin had longer-running tension."},{q:"Evaluate the roles of Gorbachev and Reagan in ending the Cold War.",topic:"coldWar",hints:"Compare: both saw nuclear dangers, worked through summits (1985–88), discussed \"zero option,\" both reversed previous positions. Contrast: Reagan's hardline spending vs Gorbachev's conciliatory approach. Gorbachev's reforms (Perestroika/Glasnost) had larger impact (USSR collapse). Reagan's SDI created pressure. Both essential — Reagan applied pressure, Gorbachev responded with transformation not escalation."},{q:"To what extent was the Korean War more significant than WWII in shaping US global policy?",topic:"coldWar",hints:"Bohlen: \"Korean War, not WWII, made us a world military-political power.\" Reynolds: Truman's decisions \"redefined the Cold War.\" NSC-68 tripled budget. Korea globalized the Cold War, made it militarized. Counter: WWII created the superpower structure; Truman Doctrine/Marshall Plan/NATO preceded Korea. WWII set the conditions; Korea cemented the militarization."},{q:"How did the Long Telegram and the Iron Curtain speech crystallize the Cold War?",topic:"coldWar",hints:"Kennan's 8,000 words from Moscow argued USSR was inherently expansionist and must be contained. Churchill's Fulton speech named the division. Stalin compared Churchill to Hitler. The two together provided the intellectual foundation and public framing for Western containment. Came in early 1946 — defining the next 45 years."},{q:"Evaluate the impact of the Marshall Plan.",topic:"coldWar",hints:"$20B for 17 countries; Churchill called it \"the most unselfish act in history\" though it served US strategic interests. Successes: rebuilt Western Europe, defeated Italian communists 1948 (CIA campaign), Yugoslavia broke with Stalin. Stalin's COMECON counter never matched it. Bound Western Europe to the US economically. Eastern bloc forced to refuse — deepened the divide."},{q:"To what extent does the Berlin Crisis demonstrate US containment success?",topic:"coldWar",hints:"Successes: Berlin airlift broke Stalin's blockade (1948–49); Wall (1961) was a propaganda gift to the West. Failures: communism kept East Germany; brain drain only stopped because the Wall trapped people in. The Wall was a \"mild success\" for Khrushchev (Williamson) — GDR's existence assured. Containment \"worked\" but at moral cost."},{q:"The conditions in which Mussolini rose to power were mainly determined by economic factors. To what extent do you agree?",topic:"authStates",hints:"FOR: post-WWI economic crisis — 2 million unemployed, inflation, lost savings, the Red Biennium terrified elites and middle class. Industrialists/landowners funded Blackshirts to break strikes. AGAINST: political factors — weak parliament (30 governments in 40 years, transformism), nationalist factor (Mutilated Victory), propaganda and use of violence, the King's choice not to declare martial law in 1922. Argue economy was a necessary but not sufficient condition."},{q:"Compare and contrast the rise to power of Mussolini and Perón.",topic:"authStates",hints:"Both: exploited economic crises, used populist rhetoric, military connections, charismatic leaders. Mussolini: violence (squadristi), March on Rome, anti-communist alignment, middle-class base. Perón: labour reforms (paid vacations, severance, pensions), 17 October demonstration, working-class base, GOU military coup, NO systematic political violence. Both admired Mussolini's organizational methods."},{q:"The conditions in which Juan Perón rose to power were mainly determined by economic factors. To what extent do you agree?",topic:"authStates",hints:"FOR: Great Depression aftermath, Infamous Decade corruption, WWII economic instability, pro-labour reforms by Perón at Labour Department. AGAINST: political dynamics (GOU coup), military support, charismatic leadership, fear of communism, Mussolini influence, the spontaneous 17 October demonstration showed Perón had built personal loyalty beyond economic interest."},{q:"Evaluate the domestic policies of one authoritarian state leader you have studied.",topic:"authStates",hints:"For Castro: Agrarian Reform (state owned 70% by 1963), literacy campaign (illiteracy 23% → 4%), nationalization, FMC for women, healthcare, education. Balance: achievements vs repression (CDRs, UMAP camps, press censorship, Huber Matos show trial, Mariel Boatlift, Padilla affair). For Mussolini: IRI nationalization, Pontine Marshes, Dopolavoro, Lateran Accords vs autarky inefficiency, \"Battles\" as rhetoric, suppression of unions."},{q:"To what extent did Castro achieve full authoritarian rule?",topic:"authStates",hints:"FOR: one-party state (PCC), CDR surveillance (1/3 enrolled), UMAP camps, media control, cult of personality, all key positions held simultaneously, education for indoctrination. AGAINST: not mass terror like Stalin, emigration as safety valve (Mariel), genuine social achievements (literacy, healthcare), pragmatic adaptations during Special Period (foreign investment, US dollar legalized, self-employment). More pragmatic than \"full authoritarian\" suggests."},{q:"Compare the methods of consolidation used by Mussolini and Castro.",topic:"authStates",hints:"Both: media control, opposition suppression, cult of personality, single-party dominance. Mussolini: Acerbo Law, Matteotti Crisis, corporativism, Lateran Accords, retained King and Church as separate powers. Castro: CDRs, UMAP, nationalization, Bay of Pigs as justification for crackdowns, Huber Matos show trial, abolished alternative power centres. Key difference: Castro achieved more complete one-party rule."},{q:"Evaluate the extent to which Perón's economic policies benefited Argentina.",topic:"authStates",hints:"FOR: labor rights expansion (paid vacations, severance, pensions), ISI industrialization, nationalization (Central Bank, railways), social security creation, rising real wages, FEP welfare. AGAINST: \"purely statist\" policy, IAPI taxed farmers to pay for industry, inflation after 1951, oppressive regulations, ISI gains evaporated, economy declined leading to 1955 coup. Short-term gains, long-term costs."},{q:"To what extent was propaganda essential to maintaining authoritarian rule in your chosen state?",topic:"authStates",hints:"Mussolini: cult of Il Duce, Roman symbols, Battles framed as heroic struggles, Balilla youth, censorship via OVRA. Perón: state-controlled radio, La Razón de mi Vida required reading, transformation of \"Obrero Ayer Oprimido\" to \"Hoy dignificado.\" Castro: speeches as constant presence, military language for everything (\"battles,\" \"liberation campaigns\"), ICAIC and UNEAC controlling culture, Padilla as warning. Argue propaganda was essential but always combined with material gains and coercion."},{q:"Discuss the role of women in maintaining or challenging authoritarian rule.",topic:"authStates",hints:"Mussolini: \"Battle for Births,\" women confined to domestic roles. Perón: Eva as emotional face — \"absolute fidelity\" to Perón, but Peronism granted women the vote (1947). Castro: FMC, formal equality, but few women in top PCC, double burden of work + housework. Reconquest comparison: Boabdil's mother, Malintzin. Women's liberation rhetoric vs lived experience."},{q:"How true was \"La Convivencia\"? Argue for and against.",topic:"reconquest",hints:"FOR: relative tolerance by era's standards (Bernard Lewis), Jews/Christians could worship and earn a living, cultural flourishing, transfer of knowledge to Christian Europe, Córdoba \"ornament of the world.\" AGAINST: second-class citizenship, special taxes (jizya), wear special badges, no weapons, oppression increased over time, 1066 massacre of Jews in Granada (Nirenberg: \"violence was central and systematic\"). Truth lies between — real but conditional, deteriorated."},{q:"How is the Conquest of the New World a continuation of the Reconquest in Iberia?",topic:"reconquest",hints:"Warrior culture and contempt for labour transferred from hidalgos to conquistadors. Trinity of God/Gold/Glory inherited from crusading ideology. Cortés explicitly compared indigenous architecture to Granada. Extremaduran poverty drove conquest abroad (\"a race of gentlemen proud of their Christian blood but without a penny\"). Encomienda echoed Reconquista feudalism. Requerimiento mirrored crusading ideology. Religious purification template (1492 expulsions → forced conversions in New Spain)."},{q:"How did a \"handful of Spaniards\" conquer two empires?",topic:"reconquest",hints:"Five factors all needed: (1) Superior military technology — steel swords, guns, horses. (2) Indigenous alliances — Tlaxcalans against Aztecs, rival Inca factions. (3) Disease — smallpox killed Huayna Capac before Pizarro arrived; devastated Tenochtitlán defenders. (4) Internal divisions/centralized rule — capturing the divine ruler paralyzed everything. (5) Religious/cultural misunderstandings — Quetzalcoatl prophecy, Aztec ritual warfare prioritizing capture, Felipillo's bad translation at Cajamarca. Remove one factor and conquest may have failed."},{q:"Evaluate the role of Bartolomé de Las Casas in colonial history.",topic:"reconquest",hints:"Former encomendero turned reformer (1514 conversion). Influenced New Laws 1542–43 (encomiendas couldn't be inherited, slavery banned). Valladolid Debate vs Sepúlveda — argued indigenous peoples were rational humans with rights. \"Short Account\" (1542) described atrocities for reform but ironically fueled the Black Legend. Limited success — laws weakly enforced after Gonzalo Pizarro's revolt. Long-term: precursor to Liberation Theology, planted seeds of human rights discourse."},{q:"Evaluate the significance of the fall of Granada (1492) for Spanish and world history.",topic:"reconquest",hints:"Three world-changing events in 1492: fall of Granada, expulsion of Jews, Columbus's voyage. Internal betrayal (Boabdil's 1482 rebellion). Empire born \"half-crippled\" — expulsions removed skilled citizens (trade, finance, medicine). Template of domination transferred to New World. Ottoman threat context (Constantinople 1453). Reconquista mentality shaped colonial policy for centuries."},{q:"How reliable are the sources for the Conquest of Mexico?",topic:"reconquest",hints:"Cortés's letters: strategic, self-aggrandizing, aimed at impressing Charles V; every detail crafted to legitimize unauthorized conquest. Bernal Díaz: raw, detailed, less motive to distort for political reasons. The Broken Spears: indigenous accounts from surviving codices (only ~40 of original codices survive — most burned). All three biased differently — but together provide a fuller picture. Most reliable: Bernal Díaz for narrative; Broken Spears for the conquered perspective; Cortés for what he wanted Charles V to believe."},{q:"To what extent was the fall of Granada caused by internal Muslim divisions rather than Christian strength?",topic:"reconquest",hints:"FOR INTERNAL DIVISIONS: Caliphate broke into taifas (1031); Almoravids and Almohads couldn't restore unity; 1144–45 rebellions; Boabdil's 1482 rebellion against his father split forces. \"It could defend itself against outside attack but not against internal dissension.\" FOR CHRISTIAN STRENGTH: Las Navas de Tolosa (1212) broke Muslim military power; F&I marriage (1469) unified force; Ottoman threat sharpened crusading zeal; Portuguese trade routes weakened Granada. Both, but internal disunity decisive throughout."},{q:"How did the Spanish Crown's relationship with the conquistadors evolve?",topic:"reconquest",hints:"Initial: rewarded with encomiendas, governorships (Cortés New Spain, Pizarro Peru), noble titles — needed conquistadors for conquest. Then: feared they'd become rival powers; Council of the Indies (1524), viceroys imposed direct rule. New Laws (1542–43) curbed encomiendas — Gonzalo Pizarro's 1544–48 revolt killed the viceroy. Crown reasserted control through Gasca, replaced conquistadors with professional administrators. Many rank-and-file got little. Conquistadors operated semi-autonomously then were curbed."},{q:"To what extent was the Reconquest a \"Holy War\"?",topic:"reconquest",hints:"FOR HOLY WAR: discovery of St. James's tomb provided warrior patron saint; Inquisition (1478) and \"limpieza de sangre\"; mass forced conversions; expulsion of Jews (1492) and Muslims (1499, 1609). AGAINST: El Cid fought for both sides; Granada survived as tributary vassal of Castile (paid tribute in gold); 1406 Castile-Granada joint operation; 1471 Christian noble rivalries (Medina Sidonia vs Cádiz) outweighed Holy War; political opportunism rampant in early Reconquest. Religious framing was rhetoric for what was often pragmatic territorial expansion."}];

const STORIES={cw_origins:{title:"The Birth of the Cold War (1917–1949)",events:[{year:"1917–39",text:"Ideological pre-history. The Cold War began as ideology long before it became confrontation. Since the Russian Revolution of October 1917, two systems existed as rivals — capitalist liberal democracy and communist Marxism-Leninism. The 1918–22 Allied intervention in the Russian Civil War (US, UK, France, Japan, others sent troops to support the Whites against the Bolsheviks) bred a permanent Soviet distrust of the West. In the 1920s the US retreated into isolationism while the USSR rebuilt under Lenin's NEP and Stalin's first Five-Year Plan (1928–32). The 1930s saw the US absorbed in the Depression (25% unemployment by 1933) and Stalin paranoid about Western intentions. The Munich Agreement (Sept 1938), where Britain and France handed Hitler the Sudetenland without consulting the USSR — the only Great Power then containing Nazi Germany — convinced Stalin the West was steering Hitler east. The Molotov-Ribbentrop Non-Aggression Pact (23 Aug 1939) shocked the world: ideological enemies cooperating, with secret protocols dividing Eastern Europe into spheres. It freed Hitler to invade Poland nine days later, and gave Stalin time and territory to prepare. The pact's cynicism would poison Western trust permanently."},{year:"1941–43",text:"The Grand Alliance. The alliance was forced, not chosen. Hitler's Operation Barbarossa (22 June 1941) — 3.8 million Axis troops across a 2,900 km front — drove Stalin into Western arms. The Atlantic Charter (Aug 1941, signed by Roosevelt and Churchill before the US even entered the war) declared all peoples had a right to self-determination — a principle that would later cut both ways. After Pearl Harbor (7 Dec 1941), the Big Three formed the Grand Alliance against the Axis. But fissures appeared by 1942: Stalin demanded a Second Front in France to relieve pressure on the USSR, where the Wehrmacht was advancing on Moscow and Stalingrad. Churchill and Roosevelt instead invaded North Africa (1942) and Italy (1943) — Stalin saw this as deliberately letting the Soviets bleed. Stalingrad (Aug 1942–Feb 1943) cost the USSR ~1.1 million casualties but turned the war. At Tehran (Nov 1943), the first Big Three meeting, D-Day was finally agreed for May 1944. Stalin's obsession with security — the USSR had been invaded three times in 30 years (1914, 1918, 1941) — was indistinguishable to Western eyes from aggressive expansionism."},{year:"1944",text:"The Warsaw Rising and Soviet inaction. As Soviet forces approached Warsaw in August 1944, the Polish Home Army (Armia Krajowa) — loyal to the London-based government-in-exile — rose against the Germans, expecting Soviet support. Stalin halted his advance. For 63 days the Germans systematically destroyed the city; ~200,000 Poles died and Warsaw was reduced to rubble. The pause allowed Stalin to wipe out the non-communist Polish leadership without firing a shot, leaving a vacuum the Soviet-backed Lublin Committee would fill. To the West the inaction was conclusive: Stalin would impose communism wherever the Red Army went, regardless of \"free elections\" promises."},{year:"Feb 1945",text:"Yalta Conference. With victory in Europe near, the Big Three met at Yalta in Soviet Crimea. Agreements: a United Nations Organization (with veto power for permanent members); Germany would be divided into four occupation zones (US, UK, USSR, France) — Berlin similarly divided; \"Declaration on Liberated Europe\" promised free elections in occupied territories; the USSR would join the war against Japan within three months of Germany's defeat. The bitter argument was Poland: Stalin had already installed the Lublin (communist) committee as government; the West wanted free elections and the London-Polish exiles included. Stalin accepted a face-saving formula but had no intention of honoring it. Roosevelt, terminally ill (he would die two months later), accepted compromises Churchill thought naive. The Polish exile leaders were never given real power."},{year:"Jul 1945",text:"Potsdam Conference. Truman, who had been Vice-President for only 82 days when Roosevelt died (12 April 1945), entered office knowing nothing about the Manhattan Project. He was briefed two weeks in. By Potsdam (17 Jul–2 Aug 1945) he had a far harder line than Roosevelt — and was determined never to repeat Chamberlain's \"Appeasement.\" Britain saw a leadership change mid-conference: Churchill lost the 5 July election; the new Labour PM Clement Attlee replaced him on 26 July, continuing the hostile stance. The atomic bomb was successfully tested at Trinity (16 July, Day 1 of Potsdam). Truman casually told Stalin the US had a \"new weapon of unusual destructive force\" — withholding details. Stalin (whose intelligence had detailed knowledge from spies including Klaus Fuchs) appeared unimpressed but was deeply offended by the lack of transparency, taking it as proof the West would use the bomb against the USSR. The conference's central failure was Germany: the US wanted reunification and recovery; the USSR wanted Germany kept weak and reparations extracted. The Hiroshima bomb fell four days after Potsdam ended."},{year:"1945–46",text:"Salami tactics and Stalin's Eastern Europe. Across Eastern Europe, Stalin sliced opposition away \"salami-style.\" The pattern: insist on coalition governments including communists; use the security ministry (always communist-controlled) to intimidate or arrest non-communist leaders; rig elections; eliminate the remaining opposition. Country by country: Bulgaria (1944), Romania (1945), Poland (1947), Hungary (1948), Czechoslovakia (Feb 1948 communist coup). Population transfers were enormous: ~12 million ethnic Germans expelled westward from Poland, Czechoslovakia and elsewhere; Poland physically shifted west by ~200 km, gaining German territory and losing eastern lands to the USSR. In Soviet-occupied Germany, the Red Army systematically looted (whole factories shipped east as reparations) and an estimated 1.4 million German women were raped. Yet Stalin simultaneously ordered soldiers to feed Berliners. In Iran (1946 crisis), Stalin refused to withdraw Soviet troops at the war's agreed end date — the UN's first major test, and the moment Truman became convinced Stalin sought \"world domination.\" Soviet negotiators deliberately exhausted Western counterparts for hours, then Stalin would appear with a friendly smile, ready to \"compromise\" — a \"good cop / bad cop\" deliberately practiced."},{year:"Feb–Mar 1946",text:"Long Telegram + Iron Curtain. George Kennan, then chargé d'affaires at the Moscow embassy, sent his 8,000-word telegram on 22 February 1946. It argued the Kremlin's \"neurotic\" worldview was rooted in Russian insecurity and Marxist ideology, and that the USSR was \"impervious to the logic of reason\" but \"highly sensitive to the logic of force.\" Soviet expansion would proceed wherever it met no resistance and retreat when confronted. Washington was electrified; Kennan was promoted, brought home, and his analysis became the intellectual foundation of containment. Just two weeks later (5 March 1946), Churchill — out of office but still influential — gave his Iron Curtain speech at Westminster College in Fulton, Missouri (introduced by Truman): \"From Stettin in the Baltic to Trieste in the Adriatic, an iron curtain has descended across the Continent.\" Stalin responded with an interview comparing Churchill to Hitler and calling the speech a \"call to war.\" US public opinion, initially uncomfortable with Churchill's belligerence, was shifting."},{year:"Mar 1947",text:"Truman Doctrine. In February 1947 Britain — bankrupt, having borrowed $3.75B from the US (1946 Anglo-American Loan) — informed Washington it could no longer afford to support the Greek government against communist insurgents or Turkey under Soviet pressure for Black Sea access. Without an Anglo-American replacement, both would likely fall. Truman went to a joint session of Congress on 12 March 1947: \"I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures.\" Congress approved $400 million ($300M Greece, $100M Turkey). The doctrine generalized: the US would now contain communism worldwide, regardless of whether the targets were \"free peoples.\" Greece's monarchy and Turkey's authoritarian government were not democracies — but they were anti-communist, and that was now what counted."},{year:"Jun 1947",text:"Marshall Plan. Secretary of State George Marshall announced the European Recovery Program in his Harvard commencement speech (5 June 1947). The reasoning: starving, jobless people turn to communism — feed and employ them, and they don't. Sixteen Western European nations plus West Germany joined the program; over 1948–52 they received about $13.3 billion (closer to $20B in pledges; Churchill called it \"the most unselfish act in history\" though it also bound recipients to the US). Country specifics: Britain $3.3B, France $2.7B (after cracking down on the November 1947 communist strikes), Italy $1.5B (with a parallel CIA campaign — letters from Italian-Americans, covert payments to Christian Democrats — defeating communists in the April 1948 election), Greece nearly $700M (US even imported mules to replace lost farm animals), Yugoslavia $150M after Tito's break with Stalin (1948). Stalin saw it as economic imperialism designed to bind Eastern Europe to the West and ordered all Soviet bloc states to refuse — Czechoslovakia tried to accept and was forced to withdraw (Feb 1948 communist coup followed). His COMECON counter (1949) never matched Marshall's scale."},{year:"1948–49",text:"Berlin Blockade and three earthquakes. When the Western occupiers introduced a new currency (Deutschmark) in their German zones in June 1948, threatening the Soviet zone's economy, Stalin retaliated. From 24 June 1948 he blocked all road, rail, and water access to the Western sectors of Berlin (which lay 160 km inside the Soviet zone). The 2.5 million West Berliners faced starvation. Truman authorized the Berlin Airlift — at peak, a plane landed at Tempelhof every 30 seconds; over 277,000 flights delivered 2.3 million tons of supplies (food, coal, medicine) over 318 days. Stalin lifted the blockade on 12 May 1949 having achieved nothing. Crucially, the failure forced the West to formalize the division: in April 1949 NATO was founded (12 founding members); in September the Federal Republic of Germany (FRG, West) was created; in October the German Democratic Republic (GDR, East). Two more earthquakes that year: the USSR detonated its first atomic bomb (29 Aug 1949) — about four years before US estimates predicted — and Mao Zedong's communists won the Chinese Civil War (proclaiming the People's Republic 1 October 1949). The Cold War was now global, militarized, and nuclear."}]},cw_containment:{title:"Containment Goes Global: Asia (1949–1975)",events:[{year:"1949",text:"Two Asian shocks. Two events the same year transformed the Cold War. On 29 August 1949 the USSR tested \"First Lightning\" (RDS-1) — a near-replica of the US Fat Man, built with intelligence supplied by spies including Klaus Fuchs. American projections had estimated Soviet capability by 1953 or 1954; the US nuclear monopoly was over four years early. Then on 1 October 1949 Mao Zedong proclaimed the People's Republic of China after Communist victory in the Civil War — Chiang Kai-shek's Nationalists fled to Taiwan with about $400M in gold. Acheson's \"China White Paper\" (Aug 1949) explained the loss bluntly: \"The Nationalist armies did not have to be defeated; they disintegrated. History has proved again and again that no regime which loses the support of its people can long survive.\" But Republicans demanded scapegoats — \"Who lost China?\" — and Senator Joseph McCarthy's February 1950 Wheeling speech (claiming 205 known communists in the State Department) launched McCarthyism. The HUAC (House Un-American Activities Committee) targeted Hollywood, the State Department, and the army. The 1950 conviction of Alger Hiss for perjury (over earlier espionage) and the 1953 execution of Julius and Ethel Rosenberg for atomic espionage seemed to confirm the panic. Any politician who looked \"soft on communism\" was finished."},{year:"Apr 1950",text:"NSC-68. Drafted under Paul Nitze (Kennan's successor as Director of Policy Planning), NSC-68 (\"United States Objectives and Programs for National Security\") was a 60-page top-secret document calling for a tripling of US defence spending — from ~$13B (1950) to $35–50B annually — and a global military buildup. It declared the USSR was \"animated by a new fanatic faith\" and \"bent on imposing its absolute authority over the rest of the world.\" Truman initially balked at the cost; the document sat awaiting funding. Two months later, the Korean War would force its full implementation."},{year:"25 Jun 1950",text:"Korea begins. Kim Il-sung's North Korean army (~135,000 troops, Soviet-equipped with T-34 tanks) crossed the 38th parallel at 4 a.m. and overwhelmed South Korean forces. Stalin had given Kim a green light only after Mao approved (Apr 1950). Truman saw it as the test: would the West defend a non-communist state against Soviet-backed aggression? \"Korea is the Greece of the Far East\" — meaning $400M had saved Greece from communism in Europe; whatever it took would have to save Korea in Asia. Critically, the USSR was boycotting the UN Security Council (in protest of Taiwan rather than Beijing holding China's seat) — without the Soviet veto, the US pushed through UNSC Resolution 84 authorizing UN military intervention. 16 nations contributed troops under American command (UN Forces)."},{year:"1950–53",text:"Korean War. General MacArthur's amphibious landing at Inchon (15 Sep 1950) cut off the North Korean army; UN forces drove almost to the Chinese border. China responded — Mao sent ~300,000 \"People's Volunteers\" across the Yalu River in October–November 1950, pushing UN forces back below the 38th parallel. The war turned into a brutal stalemate along roughly the original border. MacArthur publicly demanded escalation including atomic strikes on China; Truman fired him for insubordination (April 1951). Total cost: ~36,000 American dead, ~415,000 South Korean military dead, ~600,000–1.5 million Chinese dead, and around 2.5 million Korean civilians killed (some estimates higher). The 27 July 1953 armistice fixed roughly the 38th-parallel division — never replaced by a peace treaty, leaving Korea legally still at war today."},{year:"1952–54",text:"Japan, Taiwan, Indochina. Japan, occupied since 1945 and rebuilt as a capitalist democracy under General MacArthur (1948 reverse course toward economic recovery, the 1947 \"MacArthur Constitution\" with Article 9 renouncing war), was formalized as an American protector through the September 1951 San Francisco Treaty (effective April 1952) and the Japan-US Security Treaty allowing US bases. The Korean War boom drove Japan's economic recovery. In Taiwan, Eisenhower's first major brinkmanship: when China bombarded the offshore islands of Quemoy and Matsu (1953 and again 1958), the Formosa Resolution (Jan 1955) authorized \"such use of the armed forces as he deems necessary.\" Eisenhower threatened nuclear weapons publicly and privately — Mao backed off. In Indochina, the French had been fighting Ho Chi Minh's communist-led nationalists (the Viet Minh) since 1946. The US was funding ~80% of French costs by 1954. The French defeat at Dien Bien Phu (May 1954) — 11,000 surrendered after a 56-day siege — ended French Indochina. The Geneva Conference (July 1954) agreed: French withdrawal, temporary division of Vietnam at the 17th parallel (Ho's Viet Minh in the north, the State of Vietnam in the south), all-Vietnam elections in 1956, no foreign bases. Critically, the US did NOT sign the Geneva Accords. South Vietnam under Ngo Dinh Diem (a Catholic in a Buddhist country, brutal, US-backed) refused the 1956 elections — Ho would have won easily."},{year:"1954",text:"Domino Theory and SEATO. Eisenhower's 7 April 1954 press conference articulated the Domino Theory — \"you have a row of dominoes set up; you knock over the first one and what will happen to the last one is the certainty that it will go over very quickly.\" Used to justify Southeast Asian intervention. SEATO (Southeast Asia Treaty Organization, Sept 1954) was the Asian counterpart of NATO — but weaker, including only Thailand and the Philippines as Asian members alongside the US, UK, France, Australia, New Zealand and Pakistan."},{year:"1964–73",text:"Vietnam War. After Diem's assassination (Nov 1963, with US connivance) and increasing North Vietnamese support for the southern Viet Cong insurgency, the Gulf of Tonkin Incident (Aug 1964 — partly fabricated) gave Johnson the pretext he wanted. The Gulf of Tonkin Resolution (passed unanimously in the House, 88–2 in the Senate) authorized \"all necessary measures.\" Operation Rolling Thunder (1965–68) dropped more bombs on North Vietnam than the entire Pacific theatre of WWII; ~30,000 civilian deaths. US troop strength peaked at 543,000 (1969). The 1968 Tet Offensive — though a tactical defeat for the Viet Cong, who took 30,000+ casualties — was a strategic shock to American opinion: the war was clearly not being won. The first uncensored televised war, images of napalm strikes (the 1972 Phan Thi Kim Phuc photograph) and atrocities (My Lai 1968, exposed 1969) brought the war into American living rooms. Mass protests, Nixon's gradual \"Vietnamization,\" and the 1973 Paris Peace Accords ended direct US involvement. Total cost: ~58,000 American dead, between 1.3 and 3.4 million Vietnamese dead."},{year:"1975",text:"Saigon falls; Domino Theory partly vindicated. On 30 April 1975, North Vietnamese tanks broke through the gates of the Presidential Palace in Saigon. The famous photograph of US helicopters evacuating from rooftops captured the humiliation. Within months: Cambodia fell to the Khmer Rouge (April 1975, leading to ~1.7 million deaths under Pol Pot); Laos fell to the Pathet Lao (December 1975). The Domino Theory was partly vindicated — three dominoes did fall. But Thailand, Malaysia, Singapore, Indonesia and the Philippines did NOT fall, and the Sino-Soviet split (1960s) and Sino-Vietnamese border war (1979) showed communism was no monolith. Containment in Asia was a mixed legacy: Korea saved at staggering cost; Japan thriving; Taiwan defended; Vietnam lost spectacularly."}]},cw_crises:{title:"On the Brink: Berlin and Cuba",events:[{year:"1949–53",text:"Two Germanys. After the FRG (Sept 1949) and GDR (Oct 1949) were founded, the two Germanys diverged sharply. West Germany received Marshall Aid ($3.5B+) and undertook Erhard's social market economy reforms — by 1955 industrial production had doubled from 1936 levels (the \"Wirtschaftswunder\" or economic miracle). East Germany was forced into Soviet-style central planning, paid heavy reparations to the USSR (estimated $14B in dismantled equipment and goods 1945–53), and saw forced collectivization of agriculture. On 17 June 1953, after the SED government raised work norms, East German workers struck in over 700 cities — Soviet tanks crushed the uprising, killing 50+ and arresting ~10,000. The contrast — visible to anyone within walking distance of West Berlin — became the central propaganda crisis of the GDR."},{year:"1949–61",text:"The brain drain becomes existential. Because Berlin was governed jointly and the inner-Berlin border was effectively open, East Germans could simply walk into West Berlin. By the late 1950s ~300,000 East Germans were leaving annually — the cumulative total reached ~3.5 million between 1945 and 1961, roughly 1 in 5 of the original GDR population. Disproportionately the leavers were doctors, engineers, teachers and skilled workers. The 1959–60 wave was the largest yet. East Germany was hemorrhaging the very people needed to make socialism work. There was a second economic problem: West Berliners crossed east to buy goods at heavily subsidized communist prices, creating shortages for actual East Berliners."},{year:"Nov 1958",text:"Khrushchev's ultimatum. Khrushchev added a strategic worry to East Germany's economic crisis. West Germany joined NATO in May 1955 and was being equipped with US tactical nuclear weapons (Honest John missiles, atomic artillery) just 100 km from Soviet forces. On 27 November 1958 Khrushchev issued an ultimatum: within six months the Western powers must withdraw from West Berlin and accept it as a demilitarized \"Free City,\" or the USSR would sign a separate peace treaty with East Germany — handing over control of access. Khrushchev wanted to force Western recognition of the GDR's legitimacy and stop the bleeding."},{year:"1959–60",text:"Diplomacy fails. The May 1959 Geneva Foreign Ministers' Conference produced no agreement. Eisenhower invited Khrushchev to the US (Sept 1959, \"spirit of Camp David\"). The Paris summit was scheduled for May 1960 — but on 1 May 1960 a US U-2 spy plane was shot down over the USSR. Pilot Francis Gary Powers was captured alive; the wreckage included reconnaissance equipment. Eisenhower initially denied espionage; Khrushchev produced the pilot. The Paris summit collapsed. With Kennedy succeeding Eisenhower (Jan 1961) and looking weak after the April Bay of Pigs, Khrushchev decided he could act unilaterally on Berlin."},{year:"Aug 1961",text:"The Wall. Kennedy and Khrushchev met at the Vienna Summit (3–4 June 1961). Khrushchev was aggressive; Kennedy was rattled, telling reporters \"It will be a cold winter.\" The exodus accelerated — over 30,000 East Germans fled in July 1961 alone. Khrushchev and East German leader Walter Ulbricht decided to act. On the morning of Sunday 13 August 1961 (Sunday chosen because Berlin was emptier), East German police and army units sealed the inner-Berlin border with barbed wire. Within days a permanent concrete wall began going up. The Wall would eventually grow to 155 km, 3.6 m high in places, with a \"death strip\" (mines, watchtowers, dogs, automatic guns), and would last 28 years. At least 140 people would die trying to cross. The Wall was a propaganda catastrophe — a permanent confession that communism could only retain its citizens by imprisoning them — but it solved East Germany's immediate crisis: the brain drain stopped overnight."},{year:"Oct 1961",text:"Checkpoint Charlie. A dispute over diplomats' access rights led to a tank standoff. From 27 October, US M48 Patton tanks and Soviet T-55s faced each other at Checkpoint Charlie just metres apart, guns loaded — for 16 hours, the closest direct US-Soviet military confrontation of the Cold War. Both sides quietly withdrew on 28 October. Long-term: the Wall achieved Khrushchev's goal — the GDR's existence was now secure, Berlin was no longer a constant pressure point, and Western powers, by tolerating the Wall, implicitly recognized East Germany. German-American relations cooled (Adenauer felt let down by Kennedy); Berlin relied more on French support."},{year:"1959",text:"Castro takes Havana. 90 miles from Florida, 26-year-old Fidel Castro and his guerrillas (only 12 had survived the Granma landing in 1956) had spent two years building a Sierra Maestra base. Combined with urban resistance (especially in Santiago), and Batista's loss of the US arms embargo (March 1958, after Batista misused weapons internally), Batista's army collapsed. He fled to the Dominican Republic on 1 January 1959 with stolen millions. Castro's column entered Havana 8 January 1959 to enormous crowds. The new regime was nationalist and reformist, not initially openly communist — Castro publicly denied being a communist in February 1959. But Agrarian Reform (May 1959) and nationalization of US-owned property triggered American hostility."},{year:"1960–61",text:"Cuba pulled toward USSR. Eisenhower imposed an embargo on Cuban sugar (July 1960). The USSR stepped in to buy the surplus and supply oil, machinery and weapons. Diplomatic relations broke (Jan 1961). Eisenhower had already approved a CIA plan for invasion using Cuban exiles. Kennedy inherited it. The Bay of Pigs landing (17 April 1961, 1,500 exiles) was a disaster — Kennedy had withdrawn promised US air support to maintain plausible deniability; Castro's forces (with intelligence warning) crushed the landing within 72 hours; ~100 exiles killed, ~1,200 captured. Three consequences crucial to the missile crisis: (1) it strengthened Castro — he had defeated the superpower; (2) made Kennedy look weak — particularly to Khrushchev, who began testing him at Vienna and over Berlin; (3) pushed Cuba decisively into Soviet arms. Castro declared himself Marxist-Leninist in December 1961 — a reversal from his February 1959 denial."},{year:"Oct 1962",text:"13 days on the brink. In summer 1962 Khrushchev secretly began deploying ~40 medium-range nuclear missiles (R-12 and R-14, range 2,000 and 4,500 km respectively) to Cuba. They could reach most US cities within minutes, dramatically shifting the strategic balance. On 14 October 1962 a US U-2 reconnaissance plane photographed missile sites under construction at San Cristóbal. Kennedy convened ExComm; debate raged for six days between airstrike, invasion, and blockade. On 22 October Kennedy went on TV announcing a naval \"quarantine\" (deliberately not \"blockade,\" which would have been an act of war) and demanding withdrawal. The world stood on the brink. On 24 October Soviet ships approached the line; some turned back, but tensions rose. On 27 October — \"Black Saturday\" — a US U-2 was shot down over Cuba; Castro urged Khrushchev to launch a first strike. The deal was struck overnight: Soviets would remove the missiles in exchange for a US public promise not to invade Cuba and a SECRET US agreement to remove Jupiter missiles from Turkey within 6 months. Khrushchev announced the withdrawal on 28 October."},{year:"Late Oct 1962",text:"Aftermath. The orthodox view celebrates Kennedy as calm and decisive. The revisionist view (since the 1980s, with new evidence) sees him as reckless — he provoked the crisis through Bay of Pigs and Operation Mongoose (CIA sabotage operations against Cuba), then escalated through the public quarantine when private diplomacy might have worked sooner. Khrushchev was domestically humiliated; he was removed in October 1964. China saw the Soviet retreat as proof the USSR was \"no longer truly revolutionary,\" widening the Sino-Soviet split. But the crisis bore institutional fruit: a Washington-Moscow \"hotline\" established (June 1963); the Limited Test Ban Treaty (Aug 1963) banning atmospheric, underwater and outer-space nuclear tests; the Nuclear Non-Proliferation Treaty followed in 1968. The world had glimpsed nuclear war and stepped back."}]},cw_policy:{title:"How America Fought the Cold War",events:[{year:"1947–53",text:"Truman's Containment. The doctrine fell into place between 1946 and 1950 — Kennan's Long Telegram providing the analysis, the Truman Doctrine (March 1947) the public declaration, the Marshall Plan (June 1947) the economic instrument, NATO (April 1949) the military structure, and NSC-68 (April 1950) the comprehensive blueprint for a tripled defence budget and global military buildup. Truman's containment was global in ambition — supporting \"free peoples\" everywhere — but principally focused on preventing Soviet advance in Europe and a few critical Asian flashpoints (Korea, Iran, Greece, Turkey). The Korean War (1950–53) tested and validated containment: South Korea was held, but at the cost of ~36,000 American dead and ~2.5 million Korean civilians, and a tripled defence budget that institutionalized the national security state."},{year:"1953–61",text:"Eisenhower's New Look. Eisenhower came to office (Jan 1953) determined to control runaway defence spending. The \"New Look\" (NSC 162/2, Oct 1953) recalibrated containment around three principles: (1) reliance on nuclear weapons for deterrence — a single bomber wing could destroy a Soviet city far more cheaply than maintaining the equivalent army divisions (\"more bang for the buck\"); (2) covert action through the CIA to overthrow inconvenient governments at relatively low cost; (3) regional alliances (SEATO 1954, CENTO 1955) to encircle the USSR with locally-funded military structures."},{year:"1953",text:"Iran (Operation Ajax). When Iran's elected PM Mossadegh nationalized the Anglo-Iranian Oil Company (1951), the CIA — together with British intelligence — engineered his overthrow (August 1953) and reinstalled the Shah. Cost: a few million dollars, no US troops. Long-term: the 1979 Iranian Revolution and 40+ years of US-Iran hostility were direct consequences. But at the time it looked like a triumph of containment on the cheap."},{year:"1954",text:"Guatemala (PBSUCCESS). When Guatemala's elected President Jacobo Árbenz proposed land reform that affected United Fruit Company holdings, the CIA orchestrated his overthrow (June 1954). It set a pattern for Latin America for decades and contributed to the leftward radicalization of the Cuban revolutionaries (Che Guevara was personally radicalized observing the Guatemalan coup)."},{year:"1953–61",text:"Brinkmanship and Massive Retaliation. Secretary of State John Foster Dulles articulated the doctrine. \"Brinkmanship\" — advancing to the very edge of war without crossing it, using nuclear threats to force adversaries to back down. Massive Retaliation — meeting any Soviet aggression, conventional or nuclear, with overwhelming nuclear response. Applied: Eisenhower's nuclear threats over Korea (Mar 1953, before the armistice) and Taiwan (1955, 1958) appeared to work — both China and the USSR backed off. Dulles also proposed \"roll-back\" — actively liberating communist Eastern Europe through war or insurgency. Roll-back rhetoric was loud but Eisenhower never carried it out: when Hungarians rose in October–November 1956 (after CIA-funded Radio Free Europe encouraged resistance), Eisenhower did NOT intervene — Soviet tanks crushed the uprising, killing ~2,500 Hungarians and sending 200,000+ into exile. The gap between roll-back rhetoric and reality was permanent."},{year:"Comparison",text:"Truman vs Eisenhower. Both shared the same goal (stop communism spreading) and used the same defensive logic (assist anti-communist forces, protect vulnerable areas). Differences: Truman built up conventional forces for direct confrontation (NSC-68); Eisenhower deliberately avoided that, betting on nuclear deterrence as cheaper. Truman launched the great containment institutions; Eisenhower used the CIA to act covertly where direct US troops would be too costly. Eisenhower's bet was that, if denied opportunities to expand, the Soviet system would eventually collapse on its own. The prediction was correct — but it took another 30 years."},{year:"1961–69",text:"Kennedy's \"flexible response\" and Johnson's Vietnam. Kennedy critiqued Massive Retaliation as inflexible — what if the Soviets did something too small to justify nuclear response but too big to ignore? \"Flexible Response\" added counter-insurgency, Special Forces, and conventional military options. Increased US advisors in South Vietnam from ~900 to 16,000 by 1963. Johnson's Vietnam escalation (1965–68) was the limits of flexible response made visible — neither nuclear deterrence nor conventional war nor counter-insurgency could win against committed nationalist guerrillas with sanctuaries (Cambodia, Laos) and Chinese/Soviet supply."},{year:"1969–77",text:"Détente (Nixon, Ford, Carter). Henry Kissinger and Nixon shifted strategy: Sino-American rapprochement (Nixon's 1972 China visit) exploited the Sino-Soviet split, putting strategic pressure on the USSR. SALT I (1972) capped strategic missiles. The 1975 Helsinki Accords swapped Western recognition of post-WWII borders for Soviet human-rights commitments — which dissident movements would later use to delegitimize their own regimes. But détente was undercut by the Soviet invasion of Afghanistan (Dec 1979) and post-Vietnam US conservatism."},{year:"1981–89",text:"Reagan's confrontation and dialogue. Reagan ramped up confrontation (defence spending up 50% real terms by 1985, \"evil empire\" rhetoric, SDI 1983, support for anti-Soviet insurgencies in Afghanistan/Nicaragua) — but proved a surprisingly effective negotiator once Gorbachev was willing. The arc from Reagan's 1981 hardline to the 1987 INF Treaty showed that pressure and dialogue together — not either alone — produced results."}]},cw_end:{title:"The Cold War Ends (1985–1991)",events:[{year:"1970s–80s",text:"Soviet structural decline. Under Brezhnev (1964–82) ~25% of Soviet GDP went to military spending versus ~6% in the US. The growth-rate gap widened: Soviet GDP grew ~5% in the 1960s, fell to under 2% by the late 1970s, and stagnated by the early 1980s. Consumer goods scarce, technology lagging Western IT/semiconductor revolutions, agriculture inefficient (USSR became net food importer in the 1970s). The 1979 invasion of Afghanistan (~115,000 troops at peak, ~15,000 Soviet dead, ~$50B cost over 10 years) became \"Russia's Vietnam\" and absorbed scarce resources. The 1986 OPEC oil-price collapse — from $30/barrel to under $10 — devastated USSR hard-currency earnings (oil and gas were the primary export) at exactly the wrong moment."},{year:"Early 1980s",text:"Reagan's pressure campaign. Defence spending under Reagan climbed from $144B (1980) to $290B (1985) — a 50% real-terms increase. He labeled the USSR an \"evil empire\" (March 1983). Supported anti-Soviet insurgencies — the Afghan mujahideen received Stinger missiles (1986) that devastated Soviet helicopters; the Nicaraguan Contras fought the Sandinistas; UNITA fought Cuban-backed forces in Angola. The 23 March 1983 SDI announcement (\"Star Wars\") — proposing space-based missile defence — threatened to undermine Mutually Assured Destruction. Whether SDI would actually work was almost irrelevant: the USSR could not afford to develop a counter-system and needed a way out. Deudney and Ikenberry argue SDI gave the US a \"decisive technological advantage.\"."},{year:"1985",text:"Gorbachev. Three Soviet General Secretaries had died in three years (Brezhnev Nov 1982, Andropov Feb 1984, Chernenko Mar 1985). The Politburo, recognizing the system's drift, elevated 54-year-old Mikhail Gorbachev — a younger reformer — on 11 March 1985. Gorbachev had already concluded as Agriculture Secretary that the centrally-planned economy was failing. He was the first Soviet leader born after the Revolution and the first with significant Western contact (he had visited Britain in 1984; Thatcher famously said \"I like Mr. Gorbachev. We can do business together.\")."},{year:"1985–86",text:"Perestroika and Glasnost. Gorbachev's two interlocking reforms. Perestroika (\"restructuring,\" from April 1985) decentralized state enterprises, allowed limited cooperatives (1987 law) and joint ventures with foreign firms (1987), and tried to introduce market mechanisms. Glasnost (\"openness,\" from 1986) allowed press criticism of party officials, the publication of previously banned writers (Solzhenitsyn, Pasternak), and a partial accounting of Stalinist crimes. The 26 April 1986 Chernobyl nuclear disaster — and the regime's initial week-long cover-up before Western detection forced disclosure — accelerated Glasnost. Within a few years, Soviet citizens could openly compare their living standards to the West and discuss why their system was failing. Glasnost was meant to build pressure for reform; instead it delegitimized the entire system."},{year:"1985–88",text:"The Reagan-Gorbachev summits. Five summits (Geneva 1985, Reykjavik 1986, Washington 1987, Moscow 1988, plus a brief 1986 Iceland follow-up). Reykjavik (Oct 1986) almost produced the radical \"zero option\" — eliminating all nuclear weapons within 10 years. Reagan refused to accept restrictions on SDI; the deal collapsed but laid the groundwork. The INF (Intermediate-Range Nuclear Forces) Treaty was signed at the December 1987 Washington summit — eliminating an entire class of weapons (range 500–5,500 km) from Europe; the first arms control treaty to actually reduce arsenals rather than cap their growth. By 1991 ~2,700 missiles had been destroyed under intrusive on-site verification both sides accepted."},{year:"1988",text:"Sinatra Doctrine. At the December 1988 UN General Assembly, Gorbachev announced unilateral cuts of 500,000 troops and 10,000 tanks. He privately abandoned the Brezhnev Doctrine — the post-1968 (Czechoslovakia) policy that the USSR would use military force to keep Eastern Europe communist. Soviet Foreign Ministry spokesman Gennadi Gerasimov jokingly named the new policy after Frank Sinatra's \"My Way\" — Eastern European countries could now choose their own path. Gorbachev believed reformist Communist governments could survive without coercion. He was wrong about whether they would survive — but right that he would not send tanks."},{year:"1989",text:"The year of revolutions. Once the Sinatra Doctrine became credible, satellite states erupted. Poland — June 1989 partly-free elections, Solidarity won every contested seat; Lech Walesa-led non-communist government installed by September. Hungary — May 1989 Hungary opened its border with Austria, allowing East Germans to escape via Hungary–Austria–West Germany; thousands fled by August. East Germany — protests in Leipzig (October), Honecker forced out (18 October), and on 9 November a botched press conference led East Berliners to swarm the Wall — guards stood down, the Wall fell, ordinary Germans demolished it with hammers. Czechoslovakia — the Velvet Revolution (17 November–28 December), Václav Havel installed as president by year's end. Bulgaria — Zhivkov ousted (10 November). Romania — the only violent revolution: Ceaușescu and his wife executed by firing squad on Christmas Day after a televised show trial. By year's end, every Warsaw Pact state outside the USSR had non-communist governments."},{year:"1990",text:"German reunification. An issue Stalin had bitterly resisted in 1945–47 was now urgent. Kohl's \"Ten-Point Plan\" (Nov 1989) proposed gradual reunification; events forced acceleration. The 2+4 Treaty (Sept 1990, the two Germanys plus the four occupying powers) formally ended occupation and authorized reunification on 3 October 1990. NATO membership of the unified Germany was the key concession — Gorbachev, having lost Eastern Europe, accepted it in exchange for assurances NATO would not expand \"one inch eastward\" (an oral assurance whose meaning is still disputed). The Cold War's defining division — Germany — was over."},{year:"1991",text:"USSR dissolves. Gorbachev's reforms had unleashed forces he could not control. The Baltic states declared independence (Lithuania first, March 1990) and were violently suppressed (Vilnius, January 1991, 14 dead). On 19 August 1991 communist hardliners launched a coup against Gorbachev (vacationing in Crimea), placing him under house arrest. Boris Yeltsin — president of the Russian Federation — climbed onto a tank outside the White House (parliament) in Moscow and rallied resistance. The coup collapsed within three days. Gorbachev returned but was politically dead; Yeltsin was the new authority. On 8 December 1991 the leaders of Russia, Ukraine, and Belarus signed the Belavezha Accords dissolving the USSR; on 25 December Gorbachev resigned and the Soviet flag came down from the Kremlin. The Cold War's institutions — Warsaw Pact, COMECON, USSR — all dissolved."},{year:"Legacy",text:"Who ended the Cold War?. A lasting historiographical debate. The \"Reagan victory\" school credits Reagan's military pressure that bankrupted the Soviets; SDI was the killer. The \"Gorbachev\" school argues only a reformer of his courage could have chosen peace over force when the system collapsed — a different Soviet leader (a Ligachev or Andropov) might have crushed the 1989 revolutions like Tiananmen Square. The \"structural\" school points to Soviet economic decline that would have forced change regardless of who was in charge. Most historians now combine all three: Soviet structural failure created the conditions; Reagan's pressure intensified them; Gorbachev's individual choice — to reform rather than repress, to negotiate rather than escalate — determined the outcome was peaceful rather than violent. The collapse cost a uni-polar moment for the US, an economically devastating \"Special Period\" for Cuba, civil wars in former-Soviet states (Tajikistan, Georgia, Chechnya), and the disappearance of the ideological framework that had shaped global politics for 45 years."}]},au_muss_rise:{title:"From Chaos to Fascism: Mussolini's Rise (1871–1922)",events:[{year:"1871–1914",text:"A unified state without a unified people. Italian unification (the Risorgimento) was completed in 1871 with the seizure of Rome from the Pope. But the new state was deeply flawed. The 1848 Statuto Albertino gave Vittorio Emanuele II broad personal powers — appointing ministers, declaring war, controlling the army. Suffrage was extremely narrow: in the 1882 election only 7% of adult men could vote (about 2% of total population); even after 1912 reforms, voter turnout hovered around 50%. The political system was dominated by \"transformism\" (trasformismo) — politicians switching alliances opportunistically to stay in office — perfected by Agostino Depretis (PM 1876–87). Over 30 governments came and went between 1871 and 1914 (one new government every ~18 months). The economic divide hardened the political divide: northern industry (Pirelli rubber, Fiat 1899, Olivetti, Falck steel; coal output reached 3.6 million tons by 1913) coexisted with a desperately poor agricultural south (Mezzogiorno). About 6 million Italians emigrated 1880–1914, mostly southerners, mostly to the Americas. Italy's foreign policy reached for great-power status with limited results: Triple Alliance (1882) with Germany and Austria, Eritrea (1885), Somalia, and Libya (1911) — but the catastrophic Adowa defeat (1896, ~7,000 Italians killed by Ethiopian forces) was a national humiliation. Italy was widely regarded as the weakest of the great powers."},{year:"1915–18",text:"WWI and the \"Mutilated Victory\". Italy was initially neutral in 1914 (Triple Alliance was \"defensive only\"). The secret Treaty of London (April 1915) lured Italy into the war on the Allied side with promises of South Tyrol, Trentino, Trieste, Istria, much of Dalmatia, and colonial expansion. Italy entered May 1915 and fought a brutal mountain war against Austria-Hungary on the Isonzo front. The 1917 disaster at Caporetto (~300,000 Italian casualties or prisoners) nearly broke the army. By war's end Italy had ~600,000 military dead and over 1 million wounded — proportionally worse than Britain or France. At Versailles Italy got South Tyrol, Trentino, and Trieste — but Fiume and most of Dalmatia were denied (Wilson's principle of self-determination favoured the new Yugoslavia). Poet-warrior Gabriele D'Annunzio coined \"vittoria mutilata\" (Mutilated Victory) and seized Fiume by force in September 1919 with 2,000 followers, holding it for 15 months. The grievance discredited liberal democratic politicians — exactly the opening Mussolini exploited."},{year:"1919–20",text:"The Red Biennium (Biennio Rosso). Post-war economic catastrophe drove two \"red years.\" 2 million soldiers returned to no jobs; the cost of living index nearly doubled 1918–20; savings were wiped out. Over 1 million workers occupied northern factories (Turin, Milan, Genoa) in September 1920 alone, raising red flags and trying to run production themselves. Landless peasants seized estates across the Po valley and the south. The PSI (Italian Socialist Party) won 156 seats in the November 1919 elections — the largest single party. The new Catholic Popolari (Italian People's Party) won 100 seats. The traditional liberal centre had collapsed — and the middle class, industrialists, landowners, and military looked at events in Russia (1917 Revolution, 1919 Bolshevik consolidation) and feared communist revolution had crossed the Alps. They began looking for a counter-force willing to use violence the state would not."},{year:"1919",text:"Mussolini's Fasci di Combattimento. Mussolini, born 1883 in Predappio (Romagna), had been a leading figure in the PSI before the war and editor of its main newspaper Avanti! (1912–14). He broke with the party in 1914 over WWI (he wanted intervention; the PSI was neutralist), founded his own paper Il Popolo d'Italia, and served as a corporal at the front. On 23 March 1919 in a small meeting at Piazza San Sepolcro in Milan, he founded the Fasci di Combattimento (\"combat fascists\") — a movement combining nationalism, anti-socialism, anti-clericalism, and demands for a republic and women's suffrage. Initial reception was limited; Mussolini's list got virtually no votes in the November 1919 election. The breakthrough came when Mussolini pivoted right."},{year:"1920–22",text:"Squadrismo and the dual strategy. Mussolini's Blackshirt squads (squadristi) — often led by ex-army officers (\"ras\") — attacked socialist offices, broke strikes, beat union leaders, force-fed castor oil to opponents, destroyed leftist printing presses. Industrialists (FIAT's Agnelli, Pirelli) and landowners funded the squads precisely because they crushed worker organization the state would not. By 1921 the Fasci had ~250,000 members. Simultaneously Mussolini played the parliamentary game — the November 1921 deal with liberal PM Giolitti's bloc (the \"national bloc\") gave Fascists 35 parliamentary seats. The dual strategy of legality + terror was deliberate."},{year:"Oct 1922",text:"The March on Rome. By autumn 1922, Mussolini commanded a paramilitary force and 35 deputies. He demanded power. About 30,000 Blackshirts converged on Rome on 27–29 October 1922 — far smaller and worse-equipped than later propaganda claimed. Most were soaking wet from rain and inadequately armed. PM Luigi Facta drafted a martial-law decree that the king refused to sign. King Victor Emmanuel III could have crushed the march — the army garrison in Rome alone (28,000 men) outnumbered the marchers and was loyal. But the king feared civil war, doubted his constitutional position, was advised that Facta couldn't govern anyway, and worried that his cousin (the Duke of Aosta) was sympathetic to Fascism and might supplant him. On 29 October he invited 39-year-old Mussolini — then in Milan — to form a government. Mussolini took the night train south in a sleeping car, arrived in Rome the next morning. Only THEN did the Blackshirts march in for the propaganda photos. The \"seizure of power\" was a bluff that worked because the king, the army, the Church, and big business decided to let it work."}]},au_muss_power:{title:"Il Duce: Mussolini's Italy (1922–1943)",events:[{year:"1922–24",text:"PM but not yet dictator. At 39 Mussolini was Italy's youngest-ever PM, but his cabinet had only 4 Fascists out of 14 ministers. He needed liberals (Giolitti's faction), nationalists, and Catholic Popolari support. Parliament still functioned; the king could dismiss him; the army could suppress him; the Church had strong cultural authority. He needed a way to entrench Fascist control without provoking the establishment. He moved cautiously: courted the Vatican (early conciliation); placated the army; preserved the monarchy in the constitution; tolerated continued non-Fascist press. Behind the scenes the Fascist Party expanded membership rapidly (~700,000 by 1923) and the squadristi continued unchecked violence in the provinces."},{year:"Nov 1923",text:"Acerbo Law. Architect Giacomo Acerbo (Fascist economist) proposed this rigged electoral system: any party (or list) winning at least 25% of the vote would receive two-thirds of parliamentary seats. Mussolini justified it as ensuring \"stable government\" after 30 years of weak coalitions. Liberals (including Salandra and Orlando) and Catholic Popolari supported it — partly out of fear of Fascist violence, partly out of the naive belief they could control Mussolini within the parliamentary system. The April 1924 election under Acerbo's rules and amid widespread Fascist intimidation gave the Fascist-led \"national list\" 64.9% of the vote — a manufactured supermajority that destroyed the parliamentary opposition."},{year:"30 May–10 Jun 1924",text:"The Matteotti Crisis. Socialist deputy Giacomo Matteotti, leader of the Reformist Socialists, had spent weeks gathering documented evidence of Fascist intimidation, fraud, and violence in the April election. On 30 May 1924 he gave a scathing parliamentary speech listing specific cases. He told colleagues afterward: \"Now you may write my eulogy.\" On 10 June 1924, eleven days later, Matteotti was kidnapped in broad daylight near his home by a five-man Fascist squad including Amerigo Dumini (a Fascist enforcer) and bundled into a Lancia Lambda. His body was found two months later in a shallow grave 23 km outside Rome. Public outrage was massive. Police seized incriminating documents in Mussolini's offices implicating his press secretary Cesare Rossi. For several weeks the regime was politically vulnerable — the king received petitions calling for Mussolini's dismissal."},{year:"Jun–Dec 1924",text:"Aventine Secession backfires. Most opposition deputies — Socialists, Popolari, liberals (about 150 deputies) — withdrew from parliament in protest, retreating to the symbolic \"Aventine Hill\" (referencing the Roman plebeians' protest of 494 BC). They hoped public outrage would force the king to dismiss Mussolini. It did not. Without an organised opposition INSIDE parliament to vote no confidence or pressure ministers, the king and elites were left to choose between Mussolini and chaos. They chose Mussolini. The Aventine had handed him a free hand."},{year:"3 Jan 1925",text:"Mussolini's defiance speech. Mussolini gave a defiant address to parliament accepting \"political, moral, and historical\" responsibility for everything that had happened — including, by implication, Matteotti's murder. He dared his opponents to act. They did not. Over the next 18 months he systematically dismantled democracy: opposition parties banned (Nov 1926); free press abolished (most non-Fascist papers shut by 1926); the OVRA (Organizzazione per la Vigilanza e la Repressione dell'Antifascismo) secret police established (1927); the Special Tribunal for State Security created (1926, 4,500 sentenced 1927–43); mayors replaced by appointed podestà (1926); independent trade unions absorbed into Fascist syndicates; the Aventine deputies expelled. By 1926 Mussolini was responsible only to the king (in theory) and \"Il Duce\" (in fact)."},{year:"1926–34",text:"The Corporate State and the \"Battles\". Italy's economy was reorganized into 22 sector corporations, each containing employers, workers, and state representatives under Fascist control. The Charter of Labour (1927) formalized corporatism — strikes outlawed, unions banned, class conflict supposedly replaced by \"national unity.\" Reality: businesses dominated, workers were controlled. Mussolini called economic programs \"battles\" — Battle for Grain (1925, food self-sufficiency: wheat output rose ~50% but at cost to other crops, raising prices), Battle for Births (1927, prizes for large families, taxes on bachelors, ban on contraceptive sales: birth rate actually FELL from ~28 per 1,000 in 1925 to 21 by 1936), Battle for the Lira / Quota 90 (1926, currency revaluation to 90 lire per pound: hurt exports, deepened deflation). The Balilla youth groups (founded 1926) indoctrinated children from age 8; by 1937 over 7 million children were enrolled. The Institute for Roman Studies glorified ancient Rome and linked Fascism to imperial grandeur."},{year:"11 Feb 1929",text:"Lateran Accords. Mussolini's greatest diplomatic achievement, signed with Cardinal Gasparri on behalf of Pius XI. Three documents resolved the \"Roman Question\" outstanding since 1870. (1) The Treaty: Vatican City (~44 hectares) recognized as a sovereign state under papal rule. (2) The Concordat: Catholicism became Italy's official state religion; religious education mandatory in primary and secondary schools; Church control over marriage law; bishops swore loyalty to the Italian state. (3) The Financial Convention: Italy paid the Vatican 750 million lire in cash plus 1 billion lire in 5% government bonds (~$92M total, equivalent to several billion today) as compensation for the lost Papal States. Fascists gained the Church's endorsement, ending Catholic political opposition; control over Church appointments and youth organizations. Won over millions of traditional rural Italians instantly. Pius XI called Mussolini \"the man of providence.\"."},{year:"1930s",text:"Depression and IRI. The Great Depression hit Italy hard — by 1932 industrial production had fallen 25%, unemployment exceeded 1 million. Mussolini's response was massive state intervention. The IRI (Istituto per la Ricostruzione Industriale, founded 1933) nationalized failing banks and industries; by 1939 it controlled 80% of Italian banking and 50% of steel production. Public works expanded: draining the Pontine Marshes (Agro Pontino) created ~750,000 hectares of farmland and the planned town of Littoria/Latina; railway electrification proceeded. The Dopolavoro (founded 1925) — a workers' leisure organization providing recreation, sports, holidays — was the regime's most genuinely popular institution; by 1939 it had 4 million members. Compulsory education raised literacy from ~73% (1921) to ~83% (1936). But the bigger picture was disappointing: Italian GDP grew only ~1.5% per year on average 1922–39 — below the European average and well below pre-war Italian growth. Autarky (self-sufficiency) led to inefficiency and shortages; the South remained desperately poor; women were pushed out of the workforce (\"Battle for Births\"). By the late 1930s the regime was, in one assessment, \"rigid and isolated, relying on bluff and lies rather than substance.\"."},{year:"1935–43",text:"Empire, Axis, and collapse. The 1935 invasion of Ethiopia (~250,000 Italian troops, mustard gas used against Ethiopian civilians) achieved Mussolini's revenge for Adowa but isolated Italy diplomatically — the League of Nations imposed sanctions, pushing Mussolini into Hitler's arms. The 1936 Rome-Berlin Axis was followed by intervention in the Spanish Civil War (~75,000 Italian troops to Franco) and the 1939 Pact of Steel with Germany. Italy entered WWII in June 1940 — disastrously: defeat in Greece (1940), loss of East Africa (1941), defeat at El Alamein (1942), invasion of Sicily (July 1943). On 24 July 1943 the Fascist Grand Council voted 19–7 to remove Mussolini; the king arrested him next day. He was rescued by German commandos (12 Sept 1943) and installed as puppet head of the Italian Social Republic (Salò Republic) in the German-occupied north. Captured by partisans 27 April 1945 trying to flee to Switzerland; executed and his body hung upside down in Piazzale Loreto, Milan, the next day."}]},au_peron_rise:{title:"The Rise of Perón (1880–1946)",events:[{year:"1880–1916",text:"The conservative Argentine Republic. General Julio Roca (PM 1880–86, 1898–1904) consolidated the modern Argentine state — completed the \"Conquest of the Desert\" subduing Patagonian Amerindian tribes (~1,300 indigenous killed, thousands enslaved or displaced), crushed Buenos Aires' last federalist insurrection (1880), federalized the city. Built coalitions with army, provincial governors, and the great landowners. Argentina became one of the world's wealthiest countries — by 1913 per capita income exceeded France or Germany. The pampas agricultural revolution: cultivated land expanded 15-fold (1872–1895); Argentina became the world's #3 grain exporter, #1 frozen beef exporter. Buenos Aires was the \"Paris of South America\" with electric trams (1890), the Teatro Colón (1908), an underground railway (1913 — the first in the Southern Hemisphere). But the so-called oligarchy (~2-3% of population) owned ~95% of arable land. Wealthy estancieros lived in French-designed mansions in Buenos Aires's Barrio Norte; European immigrants (~6 million arrivals 1870–1930, mostly Italians and Spaniards) crowded into conventillos — tenement courtyards housing up to 350 people. Argentine elites learned French and English to seem more \"civilized\" while looking down on the working class as \"barbarian.\"."},{year:"1916–30",text:"Radical interlude. The 1912 Sáenz Peña Law introduced universal male suffrage and the secret ballot. The Radical Civic Union (UCR) under Hipólito Yrigoyen won the 1916 presidential election — the first peaceful transfer of power to a non-conservative. Yrigoyen represented urban middle-class and immigrant aspirations. But the UCR was internally divided, and the 1919 Tragic Week (Semana Trágica — week of bloody anti-strike repression by police and right-wing paramilitaries against metallurgical workers in Buenos Aires; ~100–700 killed) showed working-class anger had no political home."},{year:"1930–43",text:"The Infamous Decade. The 1929 Wall Street Crash devastated Argentina — beef and grain exports plunged ~70%; the cost of living index fell but real incomes for workers fell harder. On 6 September 1930 General José Félix Uriburu led the first military coup since 1930, overthrowing Yrigoyen. The \"Infamous Decade\" followed: the conservative \"Concordancia\" governed through rigged elections (the \"patriotic fraud\" — fraude patriótico — was openly defended). The 1933 Roca-Runciman Pact with Britain — desperate to keep British markets for Argentine beef — was widely seen as a humiliating sellout: Argentina granted preferential treatment to British imports and bondholders in exchange for guaranteed beef quotas. Industrial development (Import Substitution Industrialization, ISI) began organically as imports dried up — sectors like textiles and food processing grew, drawing rural migrants to Buenos Aires. By 1943 the urban working class was much larger than in 1930 — and entirely without political representation in a system that had been openly fraudulent for 13 years. People had lost faith in democracy itself."},{year:"4 Jun 1943",text:"GOU coup. A secret military lodge — the GOU (Grupo de Oficiales Unidos), young nationalist, anti-communist, ultra-Catholic officers including Colonel Juan Perón — seized power, overthrowing the corrupt civilian government of Ramón Castillo. Their stated aims: end corruption, restore the constitution, strengthen Argentine industry to reduce foreign dependency, maintain WWII neutrality (popular among many Argentines but seen as pro-Axis by the Allies), and crucially, prevent communist infiltration of the labour movement. Perón understood what most officers did not: the urban working class was the decisive untapped political force."},{year:"1943–45",text:"Perón at the Labour Department. Perón asked for and got an apparently obscure post: Secretary of Labour and Welfare. Before him, no laws protecting workers' rights existed nationally — to employers' total advantage. Perón changed everything in 24 months: paid vacations (statutory), severance pay (the indemnización), minimum wages for many sectors, the Estatuto del Peón (1944) for agricultural workers (the first such law in Argentine history), pensions for railway workers, hotel workers, journalists, and others, plus enforcement of the existing 8-hour workday. He recognized previously persecuted unions, mediated favourable settlements, and made union recognition flow personally through HIM. Source C's \"He was using them, not the reverse\" captured it: union leaders supported Perón because their members supported him; members supported him because his reforms had transformed their lives. Wages rose ~20% in real terms 1943–46. Perón also took advantage of his concurrent role as Vice-President and Minister of War (from October 1943) to consolidate military support."},{year:"9–17 Oct 1945",text:"Perón arrested, then liberated. Because Perón was building an independent power base outside military control, alarmed elites (industrialists fearful of his pro-labour rhetoric, military officers jealous of his ambition, the US ambassador Spruille Braden) had General Eduardo Ávalos arrest Perón on 9 October 1945, holding him on Martín García island. Within days, the CGT (General Confederation of Labour) called for a general strike on 18 October. But on 17 October — driven by spontaneous worker initiative as much as union organization — a massive demonstration of workers, the descamisados (\"shirtless ones\"), flooded into the Plaza de Mayo demanding Perón's release. Estimates ranged from 200,000 to over 1 million. Workers cooled their feet in Plaza de Mayo's fountains in the summer heat. The army would not fire on workers. Perón was released that evening and addressed the crowd from the Casa Rosada balcony — the founding moment of Peronism. 17 October became \"Loyalty Day\" (Día de la Lealtad), the sacred holiday of the movement."},{year:"24 Feb 1946",text:"Election landslide. With workers as his organized base and the Labour Party (CGT-aligned, soon to be merged into the Peronist movement) plus dissident Radicals and military backing, Perón ran for president. The US ambassador Spruille Braden published the \"Blue Book\" attacking Perón as a fascist sympathizer just before the election; Perón made it the centerpiece of his campaign — \"Braden o Perón!\" (Braden or Perón!) — turning Yankee interference into a winning issue. Perón won 52.4% of the vote against the UCR's José Tamborini (43.5%). His coalition took all but two national senators, two-thirds of the Chamber of Deputies, and every provincial governorship except Corrientes. Despite this overwhelming mandate, Perón still felt insecure — he lacked complete endorsement from all sectors of the armed forces and civilian establishment. His next move would be to consolidate this electoral victory into permanent control."}]},au_peron_power:{title:"Perón in Power (1946–1955)",events:[{year:"1946–47",text:"Consolidation of one-party control. Perón's first major step was dissolving all parties that had supported him — including the Labour Party — and replacing them with a single party under his personal control: the Partido Único de la Revolución, later renamed Partido Justicialista (Peronista). Civil servants were required to join the Peronist Party as a condition of employment. The Supreme Court was purged: 3 of 5 justices impeached (1947) on flimsy grounds; loyalists appointed. The Secretariat of Information controlled the press; ~110 publications were closed between 1943–46 through fake inspections, paper-supply disruption, and pressure on advertisers. Criminal laws against dissent passed; participants in illegal strikes punished. The 1947 Sanción Disciplinaria gave the executive sweeping powers."},{year:"1946–49",text:"Statist economy. Perón nationalized aggressively — the Central Bank (1946) ended foreign banking influence; British-owned railways (purchased 1947 for £150M, mostly using accumulated wartime sterling balances); telecommunications (purchased from American & Foreign Power and ITT); foreign trade through the IAPI (Instituto Argentino de Promoción del Intercambio, 1946) which monopolized grain and beef exports, capturing the difference between low producer prices and high export prices to fund urban industrialization. Import Substitution Industrialization (ISI) was protected by tariffs, subsidies, and state credits. Wages rose; prices and rents controlled; subsidized bakeries and utilities reduced cost of living. Real wages rose ~25% by 1948. The corporatist system maintained capitalism under state oversight — Mussolini's Charter of Labour (1927) explicitly studied and adapted. Source O described it as \"purely statist\" — public agents proliferated, regulations grew oppressive, leaving little room for private autonomy. Argentina's foreign reserves fell from ~$1.7B in 1946 to near depletion by 1949."},{year:"1947",text:"Women's suffrage. Eva Perón championed Law 13.010 (September 1947) granting Argentine women the vote — about 30 years after some European countries but ahead of most Latin America. She founded the Partido Peronista Femenino (1949), which organized women voters. In the 1951 election (the first in which women could vote), Perón won 62.5% — women voted for him at a higher rate than men."},{year:"Late 1940s",text:"The Eva Perón Foundation. The FEP (Fundación Eva Perón, founded 1948) eclipsed most government ministries within years — assets exceeded $200 million by 1950, employed ~14,000 people, ran ~1,000 schools, multiple hospitals (the Eva Perón Children's Hospital), nursing schools, low-cost housing (the Ciudad Evita and other developments). Eva personally received hundreds of petitioners daily, many days from morning until past midnight. She handed out money, sewing machines, pots and pans, jobs, hospital admissions. The foundation was funded by mandatory contributions from unions, businesses, and special \"lottery\" taxes. It was both genuine welfare and personal political control — every benefit reminded recipients that their improved lives depended on the Peróns staying in power."},{year:"1949",text:"New Constitution. A Peronist-controlled Constituent Convention drafted a new constitution allowing presidential re-election (enabling Perón's continued rule), nationalizing public services and energy sources, enabling state intervention in trade, and emphasizing social rights and

// ─── SMART SHUFFLE: prioritize weak/due cards ───
function smartShuffle(cards,stats){
  const now=Date.now();
  const scored=cards.map(c=>{
    const srs=stats.getSrs(c.cat);
    const prof=stats.getSubtopicProf(c.cat);
    let priority=0;
    // Due cards get highest priority
    if(srs&&srs.next<=now)priority+=50;
    // Low proficiency cards get higher priority
    if(prof<40)priority+=30;
    else if(prof<60)priority+=20;
    else if(prof<75)priority+=10;
    // New/untracked cards get moderate priority
    if(!srs)priority+=25;
    // Add randomness so it's not always the same order
    priority+=Math.random()*15;
    return{card:c,priority};
  });
  scored.sort((a,b)=>b.priority-a.priority);
  return scored.map(s=>s.card);
}

// ─── BULLET ANSWER (formatted for flashcard/practice modes) ───
function BulletAnswer({text}){
  const parsed=useMemo(()=>{
    const splitSentences=s=>s.split(/(?<=[.!?])\s+(?=[A-Z'"(])/).filter(s=>s.length>8);
    const trimEnd=s=>s.replace(/\.\s*$/,'');
    const isAnalysis=s=>/^(This (shows?|meant|reveals?|highlights?|illustrates?|suggests?|demonstrates?|was|became|made|ensured|proved|created|transformed|contributed|established|represented|combined)|The (significance|result|irony|paradox|consequence|implication|impact|effect|legacy|key|central)|In (practice|reality|truth|retrospect|short|effect)|Whether|Without|Despite|Overall|Crucially|Ironically|Combined|Arguably|It (was|became|marked|set|crystallized|demonstrated|proved|established|revealed|shows)|As a result|For (the first time|Paper 2|IB)|Remove any)/.test(s);

    // Pattern 1: Numbered (1)...(2)... — only match small sequential numbers, not years
    const nums=[...text.matchAll(/\((\d{1,2})\)/g)].filter(m=>parseInt(m[1])<=20);
    if(nums.length>=2){
      const first=parseInt(nums[0][1]);
      const sequential=nums.every((m,i)=>parseInt(m[1])===first+i);
      if(sequential){
        const intro=text.substring(0,nums[0].index).trim().replace(/[:\s—–-]+$/,'');
        const bullets=[];
        for(let i=0;i<nums.length;i++){
          const s=nums[i].index+nums[i][0].length;
          const e=i+1<nums.length?nums[i+1].index:text.length;
          bullets.push(trimEnd(text.substring(s,e).trim()));
        }
        const lastBulletSents=splitSentences(bullets[bullets.length-1]);
        let analysis='';
        if(lastBulletSents.length>1){
          const tail=lastBulletSents.findIndex((s,i)=>i>0&&isAnalysis(s));
          if(tail>0){
            bullets[bullets.length-1]=trimEnd(lastBulletSents.slice(0,tail).join(' '));
            analysis=lastBulletSents.slice(tail).join(' ');
          }
        }
        return{intro,bullets,analysis};
      }
    }

    // Pattern 2: Labeled sections — broad pattern for ALL-CAPS labels followed by colon/dash
    const labelRe=/(?:^|(?<=\.)\s+)([A-Z][A-Z /&]{2,})\s*[:\-—–]+\s*/g;
    const labels=[...text.matchAll(labelRe)];
    if(labels.length>=2){
      const intro=text.substring(0,labels[0].index).trim().replace(/\.\s*$/,'');
      const bullets=[];
      for(let i=0;i<labels.length;i++){
        const label=labels[i][1].trim();
        const cs=labels[i].index+labels[i][0].length;
        const ce=i+1<labels.length?labels[i+1].index:text.length;
        bullets.push(label+': '+trimEnd(text.substring(cs,ce).trim()));
      }
      return{intro,bullets,analysis:''};
    }

    // Pattern 3: Sentence-based — smart grouping with analysis detection
    const sents=splitSentences(text);
    if(sents.length<=2)return{intro:text,bullets:[],analysis:''};
    if(sents.length===3)return{intro:sents[0],bullets:[trimEnd(sents[1])],analysis:isAnalysis(sents[2])?sents[2]:''};

    const intro=sents[0];
    let analysisIdx=sents.length;
    for(let i=sents.length-1;i>=Math.max(2,sents.length-2);i--){
      if(isAnalysis(sents[i]))analysisIdx=i;else break;
    }
    const bullets=sents.slice(1,analysisIdx).map(trimEnd);
    const analysis=analysisIdx<sents.length?sents.slice(analysisIdx).join(' '):'';
    return{intro,bullets,analysis};
  },[text]);

  if(!parsed.bullets.length&&!parsed.analysis){
    return <div style={{fontSize:'.93rem',color:'var(--text2)',lineHeight:1.7,textAlign:'left'}}>{text}</div>;
  }
  return <div style={{textAlign:'left',maxWidth:620,margin:'0 auto'}}>
    {parsed.intro&&<p style={{fontSize:'.9rem',color:'var(--text)',lineHeight:1.6,marginBottom:10,fontWeight:500}}>{parsed.intro}</p>}
    {parsed.bullets.length>0&&<ul style={{paddingLeft:0,margin:'8px 0',listStyle:'none'}}>
      {parsed.bullets.map((b,i)=><li key={i} style={{fontSize:'.84rem',color:'var(--text2)',lineHeight:1.55,marginBottom:6,paddingLeft:14,borderLeft:'2px solid var(--bg4)'}}>{b}</li>)}
    </ul>}
    {parsed.analysis&&<div style={{fontSize:'.82rem',color:'var(--accent2)',lineHeight:1.55,marginTop:10,padding:'8px 12px',background:'var(--accent-dim)',borderRadius:'var(--radius)'}}>
      <span style={{fontWeight:600,marginRight:6}}>Analysis:</span>{parsed.analysis}
    </div>}
  </div>;
}

// ─── TYPE IT ───
function TypeItMode({items,topicFilter}){
  const stats=useStats();const [cf,setCf]=useState(null);const session=useSession();
  const pool=useMemo(()=>{let p=items;if(cf)p=p.filter(c=>c.cat===cf);else if(topicFilter)p=p.filter(c=>CATEGORIES[c.cat]?.topic===topicFilter);return smartShuffle(p,stats)},[items,topicFilter,cf]);
  const [idx,setIdx]=useState(0);const [input,setInput]=useState('');const [st,setSt]=useState('typing');

  return <div className="fade-in"><SubtopicPicker active={cf} setActive={setCf} topicFilter={topicFilter}/><SplitProgress correct={sc} wrong={sw} total={total}/><div className="card" style={{borderLeft:`3px solid ${cat?.color}`}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><span className="card-tag" style={{background:cat?.color+'22',color:cat?.color}}>{cat?.label}</span><SrsTimer catId={card.cat}/></div><div className="card-title" style={{marginBottom:16}}>{card.q}</div><input ref={iRef} className={`type-input ${st==='correct'?'correct':st==='wrong'?'wrong':''}`} placeholder="Type key points..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){if(st==='typing')check();else next()}}} disabled={st!=='typing'}/>{st==='typing'&&<button className="btn btn-primary" style={{marginTop:12}} onClick={check}>Check ↵</button>}{st!=='typing'&&<div style={{marginTop:12}}><div style={{padding:12,background:st==='correct'?'var(--green-dim)':'var(--red-dim)',borderRadius:'var(--radius)',marginBottom:10}}><div style={{fontSize:'.78rem',fontWeight:600,color:st==='correct'?'var(--green)':'var(--red)',marginBottom:4}}>{st==='correct'?'✓ Good!':'✕ Review:'}</div><div><BulletAnswer text={card.a}/></div></div><button className="btn btn-primary" onClick={next}>{idx+1>=total?'Results':'Next →'}</button></div>}</div></div>
}

// ─── STORY MODE ───
function StoryMode({topicFilter}){
  const [activeCat,setActiveCat]=useState(null);
  const [readCats,setReadCats]=useState(()=>{try{return JSON.parse(localStorage.getItem('ib_story_read')||'[]')}catch(e){return[]}});
  const cats=Object.entries(CATEGORIES).filter(([,v])=>!topicFilter||v.topic===topicFilter);
  const markRead=(k)=>{const nr=[...new Set([...readCats,k])];setReadCats(nr);try{localStorage.setItem('ib_story_read',JSON.stringify(nr))}catch(e){}};
  const story=activeCat?STORIES[activeCat]:null;
  const cat=activeCat?CATEGORIES[activeCat]:null;
  const topic=cat?TOPICS[cat.topic]:null;

  if(!activeCat){
    return(<div className="fade-in">
      <div style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:'2rem',marginBottom:6}}>📖</div>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.3rem',color:'var(--accent2)',marginBottom:4}}>Story Mode</h2>
        <p style={{color:'var(--text3)',fontSize:'.85rem',maxWidth:500,margin:'0 auto'}}>Read the narrative before drilling flashcards. Building the story in your head is key to remembering historical events.</p>
      </div>
      {Object.entries(TOPICS).filter(([k])=>!topicFilter||k===topicFilter).map(([tk,tv])=>{
        const topicCats=cats.filter(([,v])=>v.topic===tk);
        const readCount=topicCats.filter(([k])=>readCats.includes(k)).length;
        return(<div key={tk} style={{marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.05rem'}}>{tv.icon} {tv.label}</h3>
            <span style={{fontSize:'.72rem',color:readCount===topicCats.length?'var(--green)':'var(--text3)',fontFamily:'var(--font-mono)'}}>{readCount}/{topicCats.length} read</span>
          </div>
          {topicCats.map(([k,v])=>{
            const s=STORIES[k];const isRead=readCats.includes(k);
            return(<div key={k} className="card" onClick={()=>setActiveCat(k)} style={{cursor:'pointer',borderLeft:`3px solid ${v.color}`,background:isRead?'var(--bg2)':'linear-gradient(135deg,var(--bg2),#1a1f2b)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'1rem',fontWeight:600,marginBottom:2}}>{s?.title||v.label}</div>
                  <div style={{fontSize:'.78rem',color:'var(--text3)'}}>{s?.events?.length||0} sections · ~{Math.ceil((s?.events||[]).reduce((a,e)=>a+e.text.length,0)/1000)} min read</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {isRead&&<span style={{fontSize:'.7rem',padding:'2px 8px',borderRadius:99,background:'var(--green-dim)',color:'var(--green)',fontWeight:600}}>READ</span>}
                  <span style={{color:'var(--text3)',fontSize:'1.1rem'}}>→</span>
                </div>
              </div>
            </div>)
          })}
        </div>)
      })}
    </div>)
  }

  // ─── Reading view ───
  return(<div className="fade-in story-wrap">
    <button className="btn btn-ghost btn-sm" onClick={()=>setActiveCat(null)} style={{marginBottom:16}}>← All Stories</button>
    <span className="story-topic-tag" style={{background:topic?.color+'22',color:topic?.color,marginLeft:8}}>{topic?.label}</span>
    <div className="story-title">{story?.title||cat?.label}</div>
    <div style={{fontSize:'.82rem',color:'var(--text3)',marginBottom:24}}>{story?.events?.length} sections · {CARDS.filter(c=>c.cat===activeCat).length} flashcards on this topic</div>

    <div className="timeline">
      {story?.events?.map((e,i)=>(
        <div key={i} className="tl-event">
          <div className="tl-dot" style={{borderColor:cat?.color}}/>
          <div className="tl-year">{e.year}</div>
          <div className="tl-text">{e.text}</div>
        </div>
      ))}
    </div>

    <div style={{marginTop:32,padding:20,background:'var(--bg2)',borderRadius:'var(--radius-lg)',border:'1px solid var(--bg4)',textAlign:'center'}}>
      <div style={{fontSize:'.85rem',color:'var(--text2)',marginBottom:12}}>Finished reading? Now test yourself.</div>
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={()=>{markRead(activeCat);setActiveCat(null)}}>✓ Mark as Read</button>
      </div>
    </div>
  </div>)
}

// ─── MINI RING ───
function MiniRing({value,size=52,stroke=4,color='var(--accent)'}){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c-(value/100)*c;
  return <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg4)" strokeWidth={stroke}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={o} style={{transition:'stroke-dashoffset .6s ease'}}/></svg>
}

        <div style={{width:8,height:8,borderRadius:'50%',background:isDue?'var(--orange)':s.streak>=3?'var(--green)':'var(--blue)',flexShrink:0}}/><span className="srs-q" style={{color:v.color}}>{v.label}</span><span className="srs-meta">×{s.streak} lvl {SRS_LABELS[s.level]}</span><span className="srs-status" style={{background:isDue?'#fb923c22':'var(--green-dim)',color:isDue?'var(--orange)':'var(--green)'}}>{isDue?'DUE':formatCountdown(s.next-now)}</span>
      </div>}).filter(Boolean)}{Object.keys(srs).length===0&&<p style={{color:'var(--text3)',fontSize:'.82rem',textAlign:'center',padding:20}}>Practice to start tracking</p>}</div>}

      return <div key={m} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}><div style={{width:70,fontSize:'.82rem',color:'var(--text2)'}}>{m}</div><div style={{flex:1,height:6,background:'var(--bg4)',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:`${avg}%`,background:avg>=70?'var(--green)':avg>=40?'var(--accent)':'var(--red)',borderRadius:3,transition:'width .5s'}}/></div><div style={{width:55,textAlign:'right',fontSize:'.78rem',fontFamily:'var(--font-mono)',color:a.length?'var(--text)':'var(--text3)'}}>{avg}% ({a.length})</div></div>})}

    <ResetButton stats={stats}/>

function ResetButton({stats}){
  const [step,setStep]=useState(0);// 0=idle, 1=first confirm, 2=type confirm
  const [typed,setTyped]=useState('');
  const iRef=useRef();
  useEffect(()=>{if(step===2)setTimeout(()=>iRef.current?.focus(),100)},[step]);
  if(step===0)return <div style={{marginTop:24}}><button className="btn btn-ghost btn-sm" onClick={()=>setStep(1)}>Reset Progress</button></div>;
  if(step===1)return(<div style={{marginTop:24,padding:16,background:'var(--red-dim)',border:'1px solid #3d1a1a',borderRadius:'var(--radius-lg)'}}>
    <div style={{fontSize:'.9rem',fontWeight:600,color:'var(--red)',marginBottom:6}}>⚠️ Are you sure?</div>
    <div style={{fontSize:'.82rem',color:'var(--text2)',marginBottom:12}}>This will permanently delete all your practice history, SRS progress, and cloud save data. This cannot be undone.</div>
    <div style={{display:'flex',gap:8}}>
      <button className="btn btn-sm" style={{background:'var(--red)',color:'#000'}} onClick={()=>setStep(2)}>Yes, I'm sure</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>setStep(0)}>Cancel</button>
    </div>
  </div>);
  return(<div style={{marginTop:24,padding:16,background:'var(--red-dim)',border:'1px solid #3d1a1a',borderRadius:'var(--radius-lg)'}}>
    <div style={{fontSize:'.9rem',fontWeight:600,color:'var(--red)',marginBottom:6}}>⚠️ Final confirmation</div>
    <div style={{fontSize:'.82rem',color:'var(--text2)',marginBottom:10}}>Type <strong style={{color:'var(--red)'}}>RESET</strong> to confirm.</div>
    <div style={{display:'flex',gap:8,alignItems:'center'}}>
      <input ref={iRef} style={{padding:'8px 12px',background:'var(--bg3)',border:`2px solid ${typed==='RESET'?'var(--red)':'var(--bg4)'}`,borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.85rem',width:120,outline:'none',fontFamily:'var(--font-mono)',letterSpacing:'.1em'}}
        placeholder="RESET" value={typed} onChange={e=>setTyped(e.target.value.toUpperCase())}
        onKeyDown={e=>{if(e.key==='Enter'&&typed==='RESET'){stats.reset();location.reload()}}}/>
      <button className="btn btn-sm" style={{background:typed==='RESET'?'var(--red)':'var(--bg4)',color:typed==='RESET'?'#000':'var(--text3)',transition:'all .2s'}} disabled={typed!=='RESET'} onClick={()=>{stats.reset();location.reload()}}>Confirm Reset</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{setStep(0);setTyped('')}}>Cancel</button>
    </div>
  </div>);
}
function ImportExport(){
  const stats=useStats();
  const [showImport,setShowImport]=useState(false);
  const [showSetup,setShowSetup]=useState(false);
  const [importText,setImportText]=useState('');
  const [importResult,setImportResult]=useState(null);
  const [syncUrl,setSyncUrl]=useState(CloudSync.getUrl());
  const [syncStatus,setSyncStatus]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const fileInputRef=useRef();

  // Auto-pull on mount if cloud is configured (skip if just reset)
  useEffect(()=>{
    if(CloudSync.isConfigured()){
      try{if(sessionStorage.getItem('ib_history_just_reset')){sessionStorage.removeItem('ib_history_just_reset');return}}catch(e){}
      setSyncing(true);
      stats.pullFromCloud().then(r=>{setSyncStatus(r);setSyncing(false);if(r.replaced)setTimeout(()=>location.reload(),1000)});
    }
  },[]);

  const handleExport=()=>{
    const json=stats.exportData();
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    const d=new Date();
    a.download=`ib-history-save-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  const handleCopyExport=()=>{
    navigator.clipboard.writeText(stats.exportData()).then(()=>alert('Save data copied to clipboard!')).catch(()=>{
      const ta=document.createElement('textarea');ta.value=stats.exportData();document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Save data copied!')
    });
  };

  const handleImportText=()=>{
    if(!importText.trim())return;
    const result=stats.importData(importText);
    setImportResult(result);
    if(result.success)setTimeout(()=>location.reload(),1500);
  };

  const handleImportFile=(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const result=stats.importData(ev.target.result);
      setImportResult(result);
      if(result.success)setTimeout(()=>location.reload(),1500);
    };
    reader.readAsText(file);
  };

  const handleSaveUrl=()=>{
    const trimmed=syncUrl.trim();
    CloudSync.setUrl(trimmed);
    if(trimmed){setSyncStatus({ok:true,msg:'URL saved! Testing connection...'});setSyncing(true);
      stats.pullFromCloud().then(r=>{setSyncStatus(r);setSyncing(false);if(r.replaced)setTimeout(()=>location.reload(),1200)})}
    else setSyncStatus({ok:true,msg:'Cloud sync disabled.'});
  };

  const handlePush=async()=>{setSyncing(true);const r=await stats.pushToCloud();setSyncStatus(r.ok?{ok:true,msg:'Pushed to cloud!'}:{ok:false,error:r.error});setSyncing(false)};
  const handlePull=async()=>{setSyncing(true);const r=await stats.pullFromCloud();setSyncStatus(r);setSyncing(false);if(r.replaced)setTimeout(()=>location.reload(),1200)};

  const lastPush=CloudSync.getStatus().lastPush;
  const timeSince=lastPush?Math.round((Date.now()-lastPush)/60000):null;

  return(<div style={{marginTop:20}}>
    {/* ═══ CLOUD SYNC ═══ */}
    <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',margin:'16px 0 12px'}}>☁️ Cloud Sync (Google Drive)</h3>
    <div className="card" style={{background:CloudSync.isConfigured()?'linear-gradient(135deg,#121d2e,var(--bg2))':'var(--bg2)'}}>
      {CloudSync.isConfigured()&&<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <div style={{width:8,height:8,borderRadius:'50%',background:syncing?'var(--orange)':'var(--green)',animation:syncing?'pulse 1s infinite':'none'}}/>
        <span style={{fontSize:'.82rem',color:syncing?'var(--orange)':'var(--green)',fontWeight:600}}>{syncing?'Syncing...':'Connected'}</span>
        {timeSince!==null&&<span style={{fontSize:'.72rem',color:'var(--text3)',marginLeft:'auto'}}>Last push: {timeSince<1?'just now':timeSince<60?`${timeSince}m ago`:`${Math.round(timeSince/60)}h ago`}</span>}
      </div>}

      <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:10}}>
        <input style={{flex:1,padding:'8px 12px',background:'var(--bg3)',border:'1px solid var(--bg4)',borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.82rem',outline:'none',fontFamily:'var(--font-mono)'}}
          placeholder="Paste your Apps Script URL here..." value={syncUrl} onChange={e=>setSyncUrl(e.target.value)}/>
        <button className="btn btn-primary btn-sm" onClick={handleSaveUrl} style={{flexShrink:0}}>{CloudSync.isConfigured()?'Update':'Connect'}</button>
      </div>

{`function doGet(e) {

      JSON.stringify({success: false, error: err.toString()}))

  }
}`}

// ─── EXAM CRITERIA ───
function ExamCriteria(){
  return(<div className="criteria-section fade-in">
    <div className="criteria-card">
      <h3>📄 Paper 1 — Source-based Paper</h3>
      <p><strong>Duration:</strong> 1 hour &nbsp;|&nbsp; <strong>Weighting:</strong> 30% of final grade &nbsp;|&nbsp; <strong>Max marks:</strong> 24</p>
      <h4>Structure</h4>
      <p>Based on a prescribed subject with 4–5 written sources (primary and secondary). You answer 4 compulsory questions of increasing difficulty.</p>
      <ul>
        <li><strong>Q1 (3 marks):</strong> Comprehension — identify information from one source</li>
        <li><strong>Q2 (4 marks):</strong> Comprehension — identify information from two sources</li>
        <li><strong>Q3 (6 marks):</strong> Cross-referencing — compare and contrast two sources (values and limitations using origin, purpose, content)</li>
        <li><strong>Q4 (9 marks):</strong> Mini-essay — evaluate sources AND use own knowledge. "Using the sources and your own knowledge, assess/evaluate/discuss…"</li>
      </ul>
      <h4>Key Skills</h4>
      <ul>
        <li>OPCVL (Origin, Purpose, Content, Value, Limitation) for source analysis</li>
        <li>Cross-reference sources with each other and your own knowledge</li>
        <li>For Q4: integrate source evidence with detailed own knowledge, reach a supported conclusion</li>
        <li>Time management: spend roughly 5 min on Q1, 5 min on Q2, 15 min on Q3, 25 min on Q4</li>
      </ul>
    </div>

    <div className="criteria-card">
      <h3>📝 Paper 2 — Essay Paper</h3>
      <p><strong>Duration:</strong> 1 hour 30 minutes &nbsp;|&nbsp; <strong>Weighting:</strong> 45% of final grade &nbsp;|&nbsp; <strong>Max marks:</strong> 30 (15 per essay)</p>
      <h4>Structure</h4>
      <p>Choose <strong>2 essay questions</strong> from different topics. Each essay is marked out of 15. For SL: Topics 1–5 from the syllabus. You must answer from TWO different topics.</p>
      <h4>Marking Bands (per essay, /15)</h4>
      <div>
        {[
          {band:"13–15",color:"var(--green)",desc:"Clearly focused, well-structured analytical response. Detailed, relevant, accurate knowledge. Different perspectives evaluated. Arguments supported by evidence throughout."},
          {band:"10–12",color:"#86efac",desc:"Mostly focused and analytical. Relevant, detailed knowledge used to support arguments. Some evaluation of different perspectives. Clear structure with mostly supported arguments."},
          {band:"7–9",color:"var(--accent2)",desc:"Some relevant knowledge but limited analysis. May be partly descriptive/narrative. Arguments only partially developed. Some attempt at structure."},
          {band:"4–6",color:"var(--orange)",desc:"Limited knowledge and understanding. Mostly descriptive or generalised. Little awareness of the question demands. Weak structure."},
          {band:"1–3",color:"var(--red)",desc:"Very little relevant knowledge. No analysis. Does not address the question meaningfully."},
          {band:"0",color:"var(--text3)",desc:"Does not reach a standard described by the descriptors, or is not relevant."}
        ].map((b,i)=><div key={i} className="band-row" style={{background:b.color+'11'}}>
          <span className="band-label" style={{color:b.color}}>{b.band}</span>
          <span className="band-desc">{b.desc}</span>
        </div>)}
      </div>
    </div>

    <div className="criteria-card">
      <h3>✍️ Essay Writing Tips</h3>
      <h4>Structure every essay:</h4>
      <ul>
        <li><strong>Introduction:</strong> Define key terms, outline your argument, state your thesis (the extent to which you agree/disagree)</li>
        <li><strong>Body paragraphs (3–4):</strong> One clear argument per paragraph. Use PEE/PEEL: Point → Evidence → Explanation → Link back to question</li>
        <li><strong>Balance:</strong> Use 3+1 (three for, one against) or 2+2 structure for "to what extent" questions</li>
        <li><strong>Conclusion:</strong> Weigh arguments, give a clear, supported judgement. Never introduce new evidence</li>
      </ul>
      <h4>Command terms to watch:</h4>
      <ul>
        <li><strong>"To what extent"</strong> — demands a balanced argument with a clear judgement</li>
        <li><strong>"Discuss"</strong> — consider different perspectives and reach a conclusion</li>
        <li><strong>"Evaluate"</strong> — make an appraisal, weighing strengths and limitations</li>
        <li><strong>"Compare and contrast"</strong> — identify similarities AND differences</li>
      </ul>
      <h4>Transition words for high-band essays:</h4>
      <p style={{lineHeight:1.8}}>
        <span style={{background:'var(--green-dim)',color:'var(--green)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>Furthermore</span>
        <span style={{background:'var(--green-dim)',color:'var(--green)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>Moreover</span>
        <span style={{background:'var(--red-dim)',color:'var(--red)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>However</span>
        <span style={{background:'var(--red-dim)',color:'var(--red)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>On the other hand</span>
        <span style={{background:'var(--red-dim)',color:'var(--red)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>Conversely</span>
        <span style={{background:'var(--blue-dim)',color:'var(--blue)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>In contrast</span>
        <span style={{background:'var(--blue-dim)',color:'var(--blue)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>Consequently</span>
        <span style={{background:'var(--accent-dim)',color:'var(--accent2)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>To a large extent</span>
        <span style={{background:'var(--accent-dim)',color:'var(--accent2)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>Ultimately</span>
        <span style={{background:'var(--accent-dim)',color:'var(--accent2)',padding:'2px 8px',borderRadius:4,margin:'2px',display:'inline-block',fontSize:'.8rem'}}>It can be argued that</span>
      </p>
    </div>

    <div className="criteria-card">
      <h3>🕐 Internal Assessment (IA)</h3>
      <p><strong>Weighting:</strong> 25% of final grade &nbsp;|&nbsp; <strong>Word limit:</strong> 2,200 words</p>
      <p>A historical investigation on a topic of your choice. Marked on: identification and evaluation of sources (6), investigation (15), reflection (4). Total: 25 marks.</p>
    </div>
  </div>)
}

// ─── EXAM TAB ───
function ExamTab(){
  const [topicFilter,setTopicFilter]=useState(null);
  const [mode,setMode]=useState('criteria');
  const [timerActive,setTimerActive]=useState(false);
  const [timeLeft,setTimeLeft]=useState(45*60);
  const [answers,setAnswers]=useState({});
  const timerRef=useRef();

  const filteredQs=EXAM_QUESTIONS.filter(q=>!topicFilter||q.topic===topicFilter);

  useEffect(()=>{
    if(timerActive&&timeLeft>0){timerRef.current=setInterval(()=>setTimeLeft(t=>t-1),1000);return()=>clearInterval(timerRef.current)}
    if(timeLeft<=0)clearInterval(timerRef.current);
  },[timerActive,timeLeft]);

  const formatTime=s=>{const m=Math.floor(s/60);const sec=s%60;return`${m}:${sec<10?'0':''}${sec}`};

  return(<div className="fade-in">
    <div className="mode-bar">
      <button className={`mode-btn ${mode==='criteria'?'active':''}`} onClick={()=>setMode('criteria')}>Exam Criteria</button>
      <button className={`mode-btn ${mode==='questions'?'active':''}`} onClick={()=>setMode('questions')}>Essay Questions</button>
      <button className={`mode-btn ${mode==='timed'?'active':''}`} onClick={()=>setMode('timed')}>Timed Practice</button>
    </div>

    {mode==='criteria'&&<ExamCriteria/>}

    {mode==='timed'&&<div style={{textAlign:'center',marginBottom:20}}>
      <div className="timer-display" style={{color:timeLeft<60?'var(--red)':timeLeft<300?'var(--orange)':'var(--accent2)'}}>{formatTime(timeLeft)}</div>
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
        {[{l:'Paper 1 (1h)',v:60},{l:'Paper 2 (1h30)',v:90},{l:'45 min',v:45},{l:'25 min',v:25}].map(p=>
          <button key={p.v} className="btn btn-ghost btn-sm" onClick={()=>{setTimeLeft(p.v*60);setTimerActive(false)}}>{p.l}</button>)}
      </div>
      <button className="btn btn-primary" style={{marginTop:12}} onClick={()=>setTimerActive(!timerActive)}>{timerActive?'⏸ Pause':'▶ Start'}</button>
    </div>}

    {(mode==='questions'||mode==='timed')&&<>
      <TopicFilter active={topicFilter} setActive={setTopicFilter}/>
      {filteredQs.map((q,i)=>{
        const topic=TOPICS[q.topic];
        return(<div key={i} className="exam-q">
          <span className="card-tag" style={{background:topic?.color+'22',color:topic?.color,marginBottom:10,display:'inline-block'}}>{topic?.label}</span>
          <div className="q-text">{q.q}</div>
          <details style={{marginBottom:10}}>
            <summary style={{fontSize:'.8rem',color:'var(--accent)',cursor:'pointer',marginBottom:6}}>💡 Planning hints</summary>
            <div style={{fontSize:'.82rem',color:'var(--text2)',lineHeight:1.5,padding:'8px 0'}}>{q.hints}</div>
          </details>
          <textarea placeholder="Write your essay plan or response here..." value={answers[i]||''} onChange={e=>setAnswers(p=>({...p,[i]:e.target.value}))}/>
        </div>)
      })}
    </>}
  </div>)
}


// ─── STUDY DASHBOARD ───
function StudyDashboard({topic,onAction}){
  const stats=useStats();const session=useSession();
  const dueCats=stats.getDueCats().filter(k=>!topic||CATEGORIES[k]?.topic===topic);
  const cats=Object.entries(CATEGORIES).filter(([,v])=>!topic||v.topic===topic);
  const weakCats=cats.filter(([k])=>{const p=stats.getSubtopicProf(k);return p>0&&p<60}).sort((a,b)=>stats.getSubtopicProf(a[0])-stats.getSubtopicProf(b[0]));
  const freshCats=cats.filter(([k])=>stats.getByCat(k).length===0);
  const totalCards=cats.reduce((s,[k])=>s+CARDS.filter(c=>c.cat===k).length,0);
  const trackedCats=cats.filter(([k])=>stats.getSrs(k)).length;
  const readCats=(()=>{try{return JSON.parse(localStorage.getItem('ib_story_read')||'[]')}catch(e){return[]}})();
  const unreadStories=cats.filter(([k])=>STORIES[k]&&!readCats.includes(k));

  // Determine recommended action
  let rec=null;
  if(unreadStories.length>0&&freshCats.length>cats.length/2){
    rec={action:'story',label:'Read stories first',desc:`${unreadStories.length} stories unread — build the narrative before drilling`,icon:'📖'};
  }else if(dueCats.length>0){
    rec={action:'srs',label:`Review ${dueCats.length} due topic${dueCats.length>1?'s':''}`,desc:'SRS items are due — review now for best retention',icon:'🔥'};
  }else if(weakCats.length>0){
    rec={action:'recall',label:`Strengthen weak areas`,desc:`${weakCats[0][1].label} is at ${stats.getSubtopicProf(weakCats[0][0])}% — focus here`,icon:'🎯'};
  }else if(freshCats.length>0){
    rec={action:'recall',label:`Start new subtopics`,desc:`${freshCats.length} subtopic${freshCats.length>1?'s':''} not yet practiced`,icon:'✨'};
  }else{
    rec={action:'mastery',label:'Master your knowledge',desc:'All topics started — push for mastery',icon:'🏆'};
  }

  return <div style={{marginBottom:16}} className="fade-in">
    {/* Session counter */}
    {session.reviewed>0&&<div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,padding:'8px 14px',background:'var(--bg2)',border:'1px solid var(--bg4)',borderRadius:'var(--radius)',fontSize:'.8rem'}}>
      <span style={{color:'var(--accent2)',fontWeight:700,fontFamily:'var(--font-mono)'}}>{session.reviewed}</span>
      <span style={{color:'var(--text3)'}}>cards reviewed this session</span>
      <span style={{marginLeft:'auto',color:'var(--text3)',fontSize:'.72rem'}}>{trackedCats}/{cats.length} subtopics tracked</span>
    </div>}

    {/* Recommended action */}
    {rec&&<div onClick={()=>onAction(rec.action)} style={{cursor:'pointer',padding:'14px 18px',background:'linear-gradient(135deg,var(--accent-dim),var(--bg2))',border:'1px solid var(--accent-dim)',borderRadius:'var(--radius-lg)',marginBottom:12,transition:'border-color .2s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--accent-dim)'}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:'1.3rem'}}>{rec.icon}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:'.9rem',fontWeight:700,color:'var(--accent2)'}}>Recommended: {rec.label}</div>
          <div style={{fontSize:'.78rem',color:'var(--text3)',marginTop:2}}>{rec.desc}</div>
        </div>
        <span style={{color:'var(--accent)',fontWeight:600,fontSize:'.82rem'}}>Go →</span>
      </div>
    </div>}
  </div>
}

// ─── CONTENT TAB ───
function ContentTab({topic}){
  const stats=useStats();
  // Smart default: story if mostly unread, recall if practiced
  const smartDefault=useMemo(()=>{
    const cats=Object.entries(CATEGORIES).filter(([,v])=>!topic||v.topic===topic);
    const practiced=cats.filter(([k])=>stats.getByCat(k).length>0).length;
    const readCats=(()=>{try{return JSON.parse(localStorage.getItem('ib_story_read')||'[]')}catch(e){return[]}})();
    const unread=cats.filter(([k])=>STORIES[k]&&!readCats.includes(k)).length;
    if(unread>cats.length/2&&practiced<cats.length/3)return'story';
    if(stats.getDueCats().filter(k=>!topic||CATEGORIES[k]?.topic===topic).length>0)return'recall';
    return'recall';
  },[topic]);
  const [mode,setMode]=useState(smartDefault);const [srsReview,setSrsReview]=useState(false);
  const topicCards=useMemo(()=>topic?CARDS.filter(c=>CATEGORIES[c.cat]?.topic===topic):CARDS,[topic]);
  const dueCards=useMemo(()=>{const dueCats=stats.getDueCats().filter(k=>!topic||CATEGORIES[k]?.topic===topic);return dueCats.flatMap(cat=>CARDS.filter(c=>c.cat===cat))},[topic,stats]);

  const handleDashAction=(action)=>{
    if(action==='srs'){setSrsReview(true)}
    else{setMode(action);setSrsReview(false)}
  };

  if(srsReview&&dueCards.length>0)return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'var(--orange)'}}>🔁 SRS Review — {dueCats.length} subtopic{dueCats.length>1?'s':''}</h3>
      <button className="btn btn-ghost btn-sm" onClick={()=>setSrsReview(false)}>← Back</button>
    </div>
    <RecallMode items={topicCards} topicFilter={topic} modeName="SRS Review" forcedCards={dueCards} key={'srs-'+dueCards.length}/>
  </div>;

  return <div>
    <StudyDashboard topic={topic} onAction={handleDashAction}/>
    <DueBanner topicFilter={topic} onStart={()=>setSrsReview(true)}/>
    <div className="mode-bar">
      {['story','browse','recall','mastery','typeIt','timeline','causeEffect','dates'].map(m=>{
        const labels={story:'📖 Story',browse:'Browse',recall:'Recall',mastery:'Mastery',typeIt:'Type It',timeline:'🕰️ Timeline',causeEffect:'🔗 Cause & Effect',dates:'📅 Dates'};
        const descs={story:'Read first',browse:'Search',recall:'Flashcards',mastery:'Until perfect',typeIt:'Write it',timeline:'Order events',causeEffect:'Trace causal chains',dates:'Type the year'};
        return <button key={m} className={`mode-btn ${mode===m?'active':''}`} onClick={()=>{setMode(m);setSrsReview(false)}} title={descs[m]}>
          {labels[m]}
        </button>
      })}
    </div>
    {mode==='story'&&<StoryMode topicFilter={topic}/>}
    {mode==='browse'&&<BrowseMode items={topicCards} topicFilter={topic}/>}
    {mode==='recall'&&<RecallMode items={topicCards} topicFilter={topic} key={topic+'r'}/>}
    {mode==='mastery'&&<MasteryMode items={topicCards} topicFilter={topic} key={topic+'m'}/>}
    {mode==='typeIt'&&<TypeItMode items={topicCards} topicFilter={topic} key={topic+'t'}/>}
    {mode==='timeline'&&<TimelineMode topicFilter={topic} key={topic+'tl'}/>}
    {mode==='causeEffect'&&<CauseEffectMode topicFilter={topic} key={topic+'ce'}/>}
    {mode==='dates'&&<DatesMode topicFilter={topic} key={topic+'d'}/>}
  </div>
}

// ─── EMPTY STATE HELPER ───
function EmptyState({icon,title,msg}){
  return <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text3)'}}>
    <div style={{fontSize:'2.4rem',marginBottom:10,opacity:.5}}>{icon}</div>
    <div style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'var(--text2)',marginBottom:6}}>{title}</div>
    <div style={{fontSize:'.85rem',maxWidth:420,margin:'0 auto',lineHeight:1.5}}>{msg}</div>
  </div>;

// ─── TIMELINE MODE — construct chronological order ───
function TimelineMode({topicFilter}){
  const puzzles=useMemo(()=>TIMELINE_PUZZLES.filter(p=>!topicFilter||p.topic===topicFilter),[topicFilter]);
  const [puzzleIdx,setPuzzleIdx]=useState(0);
  const puzzle=puzzles[puzzleIdx];

  // Shuffle display order; chronological order computed with stable tie-break
  const displayOrder=useMemo(()=>{
    if(!puzzle)return[];
    return [...puzzle.events].map((_,i)=>i).sort(()=>Math.random()-.5);
  },[puzzle?.id]);

  const chronoOrder=useMemo(()=>{
    if(!puzzle)return[];
    return [...puzzle.events].map((e,i)=>({e,i})).sort((a,b)=>a.e.year-b.e.year||a.i-b.i).map(x=>x.i);
  },[puzzle?.id]);

  const [placed,setPlaced]=useState([]);
  const [wrongFlash,setWrongFlash]=useState(null);
  const [mistakes,setMistakes]=useState(0);
  const [done,setDone]=useState(false);

  useEffect(()=>{
    setPlaced([]);setWrongFlash(null);setMistakes(0);setDone(false);
  },[puzzle?.id]);

  if(!puzzles.length){
    return <EmptyState icon="🕰️" title="No timeline puzzles yet"
      msg="Timeline puzzles will appear here once added to TIMELINE_PUZZLES. Each puzzle is a set of events to arrange in chronological order."/>;
  }

  const nextCorrectIdx=chronoOrder[placed.length];

  const pick=(idx)=>{
    if(placed.includes(idx)||wrongFlash!==null)return;
    if(idx===nextCorrectIdx){
      const np=[...placed,idx];setPlaced(np);SFX.correct();
      if(np.length===puzzle.events.length){SFX.complete();setDone(true)}
    }else{
      SFX.wrong();setWrongFlash(idx);setMistakes(m=>m+1);
      setTimeout(()=>setWrongFlash(null),500);
    }
  };

  const reset=()=>{setPlaced([]);setMistakes(0);setDone(false)};

  return <div className="fade-in">
    {puzzles.length>1&&<div className="cat-bar">
      {puzzles.map((p,i)=>
        <button key={p.id} className={`cat-chip ${puzzleIdx===i?'active':''}`}
          style={puzzleIdx===i?{background:'var(--accent)',color:'var(--bg)'}:{}}
          onClick={()=>setPuzzleIdx(i)}>{p.title}</button>)}
    </div>}

    <div className="card" style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,marginBottom:6}}>
        <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.1rem',color:'var(--accent2)'}}>{puzzle.title}</h3>
        <span style={{fontSize:'.78rem',color:'var(--text3)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>
          {placed.length}/{puzzle.events.length} · {mistakes} miss{mistakes===1?'':'es'}
        </span>
      </div>
      <div style={{fontSize:'.82rem',color:'var(--text2)'}}>Click events in chronological order — earliest first.</div>
    </div>

    {placed.length>0&&<div className="timeline" style={{marginBottom:20}}>
      {placed.map((idx)=>{
        const ev=puzzle.events[idx];
        return <div key={idx} className="tl-event fade-in">
          <div className="tl-dot" style={{background:'var(--green)',borderColor:'var(--green)'}}/>
          <div className="tl-year">{ev.year}</div>
          <div className="tl-text" style={{fontSize:'.88rem'}}>{ev.label}</div>
        </div>;
      })}
    </div>}

    {!done&&<div>
      <div style={{fontSize:'.72rem',color:'var(--text3)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.06em'}}>Pick the next earliest</div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {displayOrder.filter(idx=>!placed.includes(idx)).map(idx=>{
          const ev=puzzle.events[idx];
          const isWrong=wrongFlash===idx;
          return <button key={idx} className={isWrong?'shake':''} onClick={()=>pick(idx)}
            style={{textAlign:'left',padding:'12px 16px',background:isWrong?'var(--red-dim)':'var(--bg2)',
              border:`1px solid ${isWrong?'var(--red)':'var(--bg4)'}`,borderRadius:'var(--radius)',
              color:'var(--text)',fontSize:'.9rem',transition:'all .2s',cursor:'pointer'}}>
            {ev.label}
          </button>;
        })}
      </div>
    </div>}

    {done&&<div className="results-overlay slide-up">
      <div style={{fontSize:'3rem'}}>🕰️</div>
      <div className="score" style={{color:mistakes===0?'var(--green)':mistakes<3?'var(--accent2)':'var(--orange)'}}>
        {mistakes===0?'Perfect!':`${mistakes} mistake${mistakes>1?'s':''}`}
      </div>
      <div className="msg">Timeline complete.</div>
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={reset}>Try Again</button>
        {puzzleIdx<puzzles.length-1&&
          <button className="btn btn-ghost" onClick={()=>setPuzzleIdx(puzzleIdx+1)}>Next Puzzle →</button>}
      </div>
    </div>}
  </div>;
}

// ─── CAUSE & EFFECT MODE — step through causal chains ───
function CauseEffectMode({topicFilter}){
  const chains=useMemo(()=>CAUSAL_CHAINS.filter(c=>!topicFilter||c.topic===topicFilter),[topicFilter]);
  const [chainIdx,setChainIdx]=useState(0);
  const chain=chains[chainIdx];

  const [step,setStep]=useState(1); // steps revealed (first cause shown)
  const [picked,setPicked]=useState(null);
  const [correct,setCorrect]=useState(0);
  const [wrong,setWrong]=useState(0);
  const [done,setDone]=useState(false);

  // Generate 3 options: 1 correct + 2 distractors drawn from OTHER chains in the same topic.
  // Falls back to other topics only if same-topic distractors are exhausted.
  const options=useMemo(()=>{
    if(!chain||step>=chain.steps.length)return null;
    const correctStep=chain.steps[step];
    const sameTopic=CAUSAL_CHAINS
      .filter(c=>c.id!==chain.id && c.topic===chain.topic)
      .flatMap(c=>c.steps)
      .filter(s=>s.event!==correctStep.event);
    const pool=sameTopic.sort(()=>Math.random()-.5);
    let distractors=pool.slice(0,2);
    if(distractors.length<2){
      const otherTopic=CAUSAL_CHAINS
        .filter(c=>c.topic!==chain.topic)
        .flatMap(c=>c.steps)
        .filter(s=>s.event!==correctStep.event)
        .sort(()=>Math.random()-.5);
      distractors=[...distractors,...otherTopic].slice(0,2);
    }
    return [correctStep,...distractors].sort(()=>Math.random()-.5);
  },[chain?.id,step]);

  useEffect(()=>{
    setStep(1);setPicked(null);setCorrect(0);setWrong(0);setDone(false);
  },[chain?.id]);

  if(!chains.length){
    return <EmptyState icon="🔗" title="No causal chains yet"
      msg="Cause-and-effect chains will appear here once added to CAUSAL_CHAINS. Each chain links events showing how one led to the next."/>;
  }

  const pick=(opt)=>{
    if(picked)return;
    setPicked(opt);
    const isRight=opt.event===chain.steps[step].event;
    if(isRight){SFX.correct();setCorrect(c=>c+1)}else{SFX.wrong();setWrong(w=>w+1)}
    setTimeout(()=>{
      setPicked(null);
      if(step+1>=chain.steps.length){setDone(true);SFX.complete()}
      else setStep(step+1);
    },1400);
  };

  const reset=()=>{setStep(1);setPicked(null);setCorrect(0);setWrong(0);setDone(false)};
  const topic=TOPICS[chain.topic];

  return <div className="fade-in">
    {chains.length>1&&<div className="cat-bar">
      {chains.map((c,i)=>
        <button key={c.id} className={`cat-chip ${chainIdx===i?'active':''}`}
          style={chainIdx===i?{background:'var(--accent)',color:'var(--bg)'}:{}}
          onClick={()=>setChainIdx(i)}>{c.title}</button>)}
    </div>}

    <div className="card" style={{marginBottom:16,borderLeft:`3px solid ${topic?.color}`}}>
      <span className="card-tag" style={{background:topic?.color+'22',color:topic?.color,marginBottom:8,display:'inline-block'}}>{topic?.label}</span>
      <h3 style={{fontFamily:'var(--font-display)',fontSize:'1.15rem',color:'var(--accent2)',marginBottom:4}}>{chain.title}</h3>
      <div style={{fontSize:'.78rem',color:'var(--text3)',fontFamily:'var(--font-mono)'}}>
        Step {Math.min(step+1,chain.steps.length)}/{chain.steps.length} · ✓{correct} ✗{wrong}
      </div>
    </div>

    {/* Revealed chain so far */}
    <div className="timeline" style={{marginBottom:20}}>
      {chain.steps.slice(0,step).map((s,i)=>(
        <div key={i} className="tl-event fade-in">
          <div className="tl-dot" style={{background:'var(--accent)',borderColor:'var(--accent)'}}/>
          <div className="tl-year" style={{textTransform:'uppercase',letterSpacing:'.05em'}}>Step {i+1}</div>
          <div className="tl-text" style={{fontSize:'.9rem',marginBottom:4}}><strong>{s.event}</strong></div>
          <div style={{fontSize:'.82rem',color:'var(--text3)',lineHeight:1.5}}>{s.detail}</div>
        </div>
      ))}
    </div>

    {/* Options for next step */}
    {!done&&options&&<div>
      <div style={{fontSize:'.72rem',color:'var(--text3)',marginBottom:10,textTransform:'uppercase',letterSpacing:'.06em'}}>What happened next?</div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {options.map((opt,i)=>{
          const isCorrect=picked&&opt.event===chain.steps[step].event;
          const isPickedWrong=picked===opt&&!isCorrect;
          let bg='var(--bg2)',bd='var(--bg4)';
          if(picked){
            if(isCorrect){bg='var(--green-dim)';bd='var(--green)'}
            else if(isPickedWrong){bg='var(--red-dim)';bd='var(--red)'}
          }
          return <button key={i} disabled={!!picked} onClick={()=>pick(opt)}
            style={{textAlign:'left',padding:'12px 16px',background:bg,border:`1px solid ${bd}`,
              borderRadius:'var(--radius)',color:'var(--text)',fontSize:'.88rem',
              transition:'all .2s',cursor:picked?'default':'pointer',opacity:picked&&!isCorrect&&!isPickedWrong?.5:1}}>
            <div style={{fontWeight:600}}>{opt.event}</div>
            {picked&&(isCorrect||isPickedWrong)&&
              <div style={{fontSize:'.78rem',color:'var(--text3)',marginTop:4,lineHeight:1.4}}>{opt.detail}</div>}
          </button>;
        })}
      </div>
    </div>}

    {done&&<div className="results-overlay slide-up">
      <div style={{fontSize:'3rem'}}>🔗</div>
      <div className="score" style={{color:wrong===0?'var(--green)':correct>=wrong?'var(--accent2)':'var(--orange)'}}>
        {correct}/{chain.steps.length-1}
      </div>
      <div className="msg">Chain complete.</div>
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={reset}>Try Again</button>
        {chainIdx<chains.length-1&&
          <button className="btn btn-ghost" onClick={()=>setChainIdx(chainIdx+1)}>Next Chain →</button>}
      </div>
    </div>}
  </div>;
}

// ─── DATES MODE — practice date recall ───
function DatesMode({topicFilter}){
  const session=useSession();
  const pool=useMemo(()=>{
    let p=DATE_EVENTS;
    if(topicFilter)p=p.filter(e=>e.topic===topicFilter);
    return [...p].sort(()=>Math.random()-.5);
  },[topicFilter]);

  const [idx,setIdx]=useState(0);
  const [input,setInput]=useState('');
  const [status,setStatus]=useState('typing'); // typing | correct | wrong
  const [correct,setCorrect]=useState(0);
  const [wrong,setWrong]=useState(0);
  const [done,setDone]=useState(false);
  const inputRef=useRef();

  useEffect(()=>{setIdx(0);setInput('');setStatus('typing');setCorrect(0);setWrong(0);setDone(false)},[topicFilter]);
  useEffect(()=>{setTimeout(()=>inputRef.current?.focus(),60)},[idx,topicFilter]);

  if(!pool.length){
    return <EmptyState icon="📅" title="No dates yet"
      msg="Date events will appear here once added to DATE_EVENTS. Each entry pairs a year with an event description."/>;
  }

  const ev=pool[idx];
  const total=pool.length;

  const check=()=>{
    if(status!=='typing')return;
    const guess=parseInt(input,10);
    if(isNaN(guess))return;
    session.add();
    if(guess===ev.year){SFX.correct();setCorrect(c=>c+1);setStatus('correct')}
    else{SFX.wrong();setWrong(w=>w+1);setStatus('wrong')}
  };

  const next=()=>{
    if(idx+1>=total){SFX.complete();setDone(true)}
    else{setIdx(idx+1);setInput('');setStatus('typing')}
  };

  const reset=()=>{
    setIdx(0);setInput('');setStatus('typing');setCorrect(0);setWrong(0);setDone(false);
    setTimeout(()=>inputRef.current?.focus(),60);
  };

  if(done){
    const pct=Math.round(correct/total*100);
    return <div className="results-overlay slide-up">
      <div style={{fontSize:'3rem'}}>📅</div>
      <div className="score" style={{color:pct>=80?'var(--green)':pct>=50?'var(--accent2)':'var(--orange)'}}>{correct}/{total}</div>
      <SplitProgress correct={correct} wrong={wrong} total={total}/>
      <div className="msg">{pct>=80?'Excellent date recall!':pct>=50?'Solid foundation — keep drilling.':'Dates take repetition. Try again.'}</div>
      <button className="btn btn-primary" onClick={reset}>Again</button>
    </div>;
  }

  const topic=TOPICS[ev.topic];
  const guess=parseInt(input,10);
  const off=!isNaN(guess)?Math.abs(guess-ev.year):null;

  return <div className="fade-in">
    <SplitProgress correct={correct} wrong={wrong} total={total}/>
    <div className="card" style={{borderLeft:`3px solid ${topic?.color||'var(--accent)'}`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span className="card-tag" style={{background:(topic?.color||'var(--accent)')+'22',color:topic?.color||'var(--accent)'}}>
          {topic?.label||'—'}
        </span>
        <span style={{fontSize:'.78rem',color:'var(--text3)',fontFamily:'var(--font-mono)'}}>{idx+1}/{total}</span>
      </div>
      <div className="card-title" style={{marginBottom:16,fontSize:'1.1rem'}}>{ev.event}</div>
      <div style={{fontSize:'.72rem',color:'var(--text3)',marginBottom:6,textTransform:'uppercase',letterSpacing:'.06em'}}>What year?</div>
      <input ref={inputRef} type="number" inputMode="numeric"
        className={`type-input ${status==='correct'?'correct':status==='wrong'?'wrong':''}`}
        placeholder="e.g. 1947" value={input}
        onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>{if(e.key==='Enter'){if(status==='typing')check();else next()}}}
        disabled={status!=='typing'}
        style={{maxWidth:220,fontFamily:'var(--font-mono)',fontSize:'1.2rem',textAlign:'center',letterSpacing:'.05em'}}/>

      {status==='typing'&&<button className="btn btn-primary" style={{marginTop:12}} onClick={check} disabled={!input.trim()}>Check ↵</button>}

      {status!=='typing'&&<div style={{marginTop:12}}>
        <div style={{padding:12,background:status==='correct'?'var(--green-dim)':'var(--red-dim)',borderRadius:'var(--radius)',marginBottom:10}}>
          <div style={{fontSize:'.85rem',fontWeight:600,color:status==='correct'?'var(--green)':'var(--red)'}}>
            {status==='correct'?`✓ Correct — ${ev.year}`:`✗ The answer was ${ev.year}`}
          </div>
          {status==='wrong'&&off!==null&&off<=2&&
            <div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:4}}>So close — only off by {off} year{off>1?'s':''}.</div>}
          {ev.hint&&<div style={{fontSize:'.78rem',color:'var(--text2)',marginTop:6,lineHeight:1.5}}>{ev.hint}</div>}
        </div>
        <button className="btn btn-primary" onClick={next}>{idx+1>=total?'Results':'Next →'}</button>
      </div>}
    </div>
  </div>;
}

// ─── THEMES TAB — cross-topic recurring ideas ───
function ThemesTab(){
  const [activeTheme,setActiveTheme]=useState(null);
  const [exp,setExp]=useState({});
  const themeEntries=Object.entries(THEMES);

  if(!themeEntries.length){
    return <EmptyState icon="🧵" title="No themes yet"
      msg="Themes connect cards across topics by recurring ideas — nationalism, propaganda, religious persecution, foreign intervention, and so on. Add entries to THEMES to populate this view."/>;
  }

  if(!activeTheme){
    return <div className="fade-in">
      <div style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:'2rem',marginBottom:6}}>🧵</div>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.3rem',color:'var(--accent2)',marginBottom:4}}>Themes</h2>
        <p style={{color:'var(--text3)',fontSize:'.85rem',maxWidth:520,margin:'0 auto'}}>
          Recurring ideas that connect events across topics. See how the same forces shape different historical moments.
        </p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12}}>
        {themeEntries.map(([k,t])=>(
          <div key={k} className="card" onClick={()=>setActiveTheme(k)}
            style={{cursor:'pointer',borderLeft:`3px solid ${t.color}`}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
              <span style={{fontSize:'1.3rem'}}>{t.icon}</span>
              <div className="card-title" style={{marginBottom:0}}>{t.label}</div>
            </div>
            <div className="card-sub">{t.desc}</div>
            <div style={{marginTop:10,fontSize:'.72rem',color:t.color,fontFamily:'var(--font-mono)'}}>
              {(t.cards||[]).length} card{(t.cards||[]).length===1?'':'s'} →
            </div>
          </div>
        ))}
      </div>
    </div>;
  }

  const theme=THEMES[activeTheme];
  const cards=(theme.cards||[]).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
  const byTopic={};
  cards.forEach(c=>{
    const tk=CATEGORIES[c.cat]?.topic;
    if(!tk)return;
    if(!byTopic[tk])byTopic[tk]=[];
    byTopic[tk].push(c);
  });

  return <div className="fade-in">
    <button className="btn btn-ghost btn-sm" onClick={()=>{setActiveTheme(null);setExp({})}} style={{marginBottom:16}}>← All Themes</button>
    <div style={{marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style={{fontSize:'2rem'}}>{theme.icon}</span>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:'1.4rem',color:theme.color}}>{theme.label}</h2>
      </div>
      <p style={{color:'var(--text2)',fontSize:'.88rem',lineHeight:1.5}}>{theme.desc}</p>
    </div>

    {cards.length===0&&<EmptyState icon="📭" title="No cards mapped yet"
      msg={`Add card IDs to THEMES.${activeTheme}.cards to populate this theme.`}/>}

    {Object.entries(byTopic).map(([tk,tcards])=>{
      const topic=TOPICS[tk];
      return <div key={tk} style={{marginBottom:24}}>
        <h3 style={{fontFamily:'var(--font-display)',fontSize:'1rem',marginBottom:10,color:topic?.color}}>
          {topic?.icon} {topic?.label} <span style={{color:'var(--text3)',fontSize:'.78rem',fontWeight:400}}>({tcards.length})</span>
        </h3>
        {tcards.map((c,i)=>{
          const cat=CATEGORIES[c.cat];
          const key=`${tk}-${i}`;
          return <div key={c.id} className={`card expandable ${exp[key]?'open':''}`}
            onClick={()=>setExp(p=>({...p,[key]:!p[key]}))}
            style={{borderLeft:`3px solid ${cat?.color}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
              <div className="card-title" style={{fontSize:'.95rem'}}>{c.q}<span className="chevron">▼</span></div>
              <span className="card-tag" style={{background:cat?.color+'22',color:cat?.color,flexShrink:0}}>{cat?.label}</span>
            </div>
            {exp[key]&&<div className="card-sub" style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--bg4)'}}>{c.a}</div>}
          </div>;
        })}
      </div>;
    })}
  </div>;
}

// ─── APP ───
function App(){
  const [tab,setTab]=useState('all');const [isMobile,setIsMobile]=useState(window.innerWidth<640);
  const [stats]=useState(()=>createStatsStore());
  const [sessionReviewed,setSessionReviewed]=useState(0);
  const sessionCtx=useMemo(()=>({reviewed:sessionReviewed,add:()=>setSessionReviewed(c=>c+1)}),[sessionReviewed]);
  useEffect(()=>{const h=()=>setIsMobile(window.innerWidth<640);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h)},[]);
  const topicTabs=Object.entries(TOPICS).map(([id,t])=>({id,label:isMobile&&t.shortLabel?t.shortLabel:t.label,icon:t.icon||'📂',isTopic:true}));
  const tabs=[
    {id:'all',label:'All Topics',icon:'📚'},
    ...topicTabs,
    {id:'themes',label:'Themes',icon:'🧵'},
    {id:'exam',label:'Exam',icon:'📝'},
    {id:'stats',label:'Stats',icon:'📊'}
  ];
  const dueCats=stats.getDueCats();
  const tabHasDue=tabId=>{
    if(tabId==='all')return dueCats.length>0;
    if(TOPICS[tabId])return dueCats.some(k=>CATEGORIES[k]?.topic===tabId);
    return false;
  };

  return <MobileContext.Provider value={isMobile}><StatsContext.Provider value={stats}><SessionContext.Provider value={sessionCtx}>
    {!isMobile&&<div className="header"><h1>Revision Tool</h1></div>}
    <div className="tab-bar">{tabs.map(t=><button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>{setTab(t.id);SFX.tap()}}>
      {isMobile?t.icon:<>{t.icon} {t.label}</>}
      <span className={`dot ${tabHasDue(t.id)?'show':''}`}/>
    </button>)}</div>
    <div className="app-wrap">
      {tab==='all'&&<ContentTab topic={null}/>}
      {TOPICS[tab]&&<ContentTab topic={tab} key={tab}/>}
      {tab==='themes'&&<ThemesTab/>}
      {tab==='exam'&&<ExamTab/>}
      {tab==='stats'&&<StatsTab/>}
    </div>
    <KeyboardHelp/>
  </SessionContext.Provider></StatsContext.Provider></MobileContext.Provider>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

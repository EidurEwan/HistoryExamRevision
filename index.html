 state-protected family institutions. Article 40 declared all natural resources, public services, and foreign trade as inalienably belonging to the nation. New textbooks delivered Peronist messages without permitting criticism; teachers were trained to transmit Peronist doctrine. Eva's ghost-written autobiography La razón de mi vida (1951) became required school reading in many provinces — defining women's role as loyal supporters of Perón \"within the home.\"."},{year:"1951",text:"La Prensa expropriated. Argentina's most prestigious daily newspaper — independent, internationally respected — was shut by mob action of the typesetters' union (a Peronist front), then expropriated by Congress and reopened under CGT control. The expropriation embarrassed even sympathetic foreign press and signalled growing repression. Cultural figures like Jorge Luis Borges were demoted (Borges, an outspoken critic, was reassigned from a librarian's post to inspector of poultry markets) — a humiliation he never forgot."},{year:"1952–55",text:"Decline begins. Eva died of cervical cancer on 26 July 1952, aged 33. Her body was embalmed by the Spanish anatomist Dr. Pedro Ara. ~3 million Argentines viewed her body in state; ~7 million attended the funeral in Buenos Aires. Her death removed the regime's emotional connection to the descamisados at exactly the moment economic decline was eroding their material gains. Inflation accelerated — by 1952 over 30% annually; a 1951–52 drought devastated agriculture; foreign reserves were depleted. Perón signed the controversial 1953 Standard Oil contract (allowing US oil exploration in Argentina) — a humiliating reversal of his economic nationalism that alienated the left. He attacked the Catholic Church (1954–55): legalized divorce (Dec 1954), legalized prostitution, ended state subsidies for Catholic schools, expelled two bishops in June 1955. The Church responded by excommunicating him."},{year:"16 Jun 1955",text:"Bombing of Plaza de Mayo. A naval aviation revolt attempted to assassinate Perón by bombing his Casa Rosada office while he gave a speech to a workers' rally. About 30 navy aircraft dropped bombs and strafed the plaza for hours, leaving ~308 killed (mostly civilians, including children) and over 700 wounded — the worst peacetime massacre in Argentine history. Perón survived (he had left through a tunnel). Peronist mobs burned down ~10 Catholic churches in Buenos Aires that night, including the historic San Francisco. The bombing showed how deep the opposition ran — including within the armed forces."},{year:"16 Sep 1955",text:"Revolución Libertadora. General Eduardo Lonardi led the \"Liberating Revolution.\" After three days of fighting, Perón resigned on 19 September and took refuge on a Paraguayan gunboat in the harbour. He went into 18 years of exile (Paraguay → Panama → Venezuela → Dominican Republic → Spain). The new junta banned mentioning his name, removed Eva's body from public display (it would disappear for 16 years), repealed the 1949 Constitution. But by destroying his political organization rather than addressing the underlying inequality, the junta only deepened Peronism as a permanent identity for millions of workers — guaranteeing his eventual return in 1973 (Perón won that year's election with 62%). His third term ended with his death on 1 July 1974; succeeded by his third wife Isabel; overthrown 1976 by the brutal junta that began the Dirty War."}]},au_castro_rise:{title:"Revolution in Cuba (1952–1959)",events:[{year:"Pre-1952",text:"A semi-colonial paradox. Cuba had achieved nominal independence in 1902 after the 1898 Spanish-American War — but the Platt Amendment (1901–34) granted the US legal right to intervene in Cuban affairs to \"protect property\" or maintain \"stability\"; the US repeatedly used it (interventions 1906–09, 1912, 1917–22). The Platt Amendment also secured a permanent US naval lease at Guantánamo Bay. By the 1950s, US companies controlled key sectors of the Cuban economy — United Fruit (sugar), Esso and Texaco (oil), Cuban Electric Company (utilities), American & Foreign Power (telecom). About 75% of arable land was owned by foreigners or large Cuban estates; sugar provided ~80% of export earnings, locking Cuba into a vulnerable monoculture. High per capita income (~$370 in 1957, second-highest in Latin America after Venezuela) masked extreme inequality: 200,000 peasant families had no land; rural unemployment exceeded 30% during the dead season between sugar harvests; rural illiteracy was ~40%. Meyer Lansky and American organized crime ran Havana's casinos and prostitution under Batista's protection — by the 1950s Havana was nicknamed \"Latin Las Vegas.\" José Martí — poet, journalist, revolutionary leader of the 1895 War of Independence killed in battle that year — remained the national hero whose anti-imperial nationalism both Castro and his opponents would claim."},{year:"1940–52",text:"Two Batistas. Fulgencio Batista (b. 1901, mixed-race son of a sugarcane cutter) led a 1933 sergeants' revolt and was the power behind Cuban politics 1933–40, then elected president 1940–44 in a relatively populist first term — he legalized the Communist Party (PSP, Partido Socialista Popular), enacted Cuba's progressive 1940 constitution (which on paper gave women the vote, established workers' rights, and limited large landholdings). After living in Florida 1944–48, he returned to Cuban politics and ran for president again — but realizing he would lose, on 10 March 1952 he seized power in a bloodless military coup, cancelling the upcoming election. The post-1952 Batista was, as the textbook describes, \"lazy and corrupt\" — failed to curb corruption while engaging in it; suspended constitutional guarantees; relied on torture and murder to suppress opposition. Among the candidates whose campaigns the coup ended that day was a 25-year-old lawyer named Fidel Castro."},{year:"26 Jul 1953",text:"Moncada Assault. With legal political activity closed, Castro turned to armed insurrection. He led 165 rebels (including his brother Raúl, female activists like Haydée Santamaría and Melba Hernández) in a dawn attack on the Moncada barracks in Santiago de Cuba — Cuba's second-largest army installation, ~1,000 troops — hoping to seize weapons and trigger a national uprising. The plan failed catastrophically: a diversion truck got lost, surprise was lost, the army responded immediately. ~80 attackers were killed (about half were captured alive and tortured to death, including some who had their eyes gouged out). Castro and a few others escaped to the mountains; he was captured days later. At trial in October 1953 he gave a 4-hour defence speech — \"La historia me absolverá\" (\"History Will Absolve Me\") — laying out specific reform demands using statistics on landlessness, illiteracy, hunger, and disease. Sentenced to 15 years on the Isle of Pines. Released under Batista's May 1955 amnesty (a politically motivated gesture that backfired) and went into exile in Mexico. The \"26th of July Movement\" took its name from the failed attack; its red-and-black flag symbolized blood (red, sacrifice) and mourning (black, the martyrs)."},{year:"Dec 1956",text:"Granma expedition. After 18 months in Mexico recruiting and training (under former Spanish Republican officer Alberto Bayo), Castro and ~82 fighters — including Raúl Castro, the Argentine doctor Ernesto \"Che\" Guevara (recruited in Mexico City), and Camilo Cienfuegos — sailed from Tuxpan, Mexico on 25 November 1956 aboard the yacht Granma (designed for 12 passengers). The boat arrived 2 December 1956, two days late and at the wrong landing point — a swamp at Las Coloradas. Batista's army had been alerted by an uprising attempt in Santiago a few days earlier (Frank País's 30 November rising) and was hunting them. They were ambushed at Alegría de Pío on 5 December. Of ~82 who landed, only 12 survived to regroup in the Sierra Maestra. Newspapers reported Castro dead. The disaster looked like a finishing blow."},{year:"1957–58",text:"Sierra Maestra guerrilla war. The 12 survivors built a guerrilla force from a tiny Sierra Maestra base. Three factors made the rebellion succeed where it should have failed: (1) familiar rugged terrain — the Sierra Maestra mountains were impenetrable to large army units; (2) ideologically motivated soldiers fighting for cause not pay, with strict discipline; (3) Castro's deliberate humane treatment of captured enemies (publicized to demoralize Batista's troops and recruit defectors), contrasting sharply with army atrocities. New York Times reporter Herbert Matthews's Sierra interview with Castro (17 Feb 1957) electrified Cuban opinion — proving Castro was alive and resisting; Castro deliberately walked his small force back and forth in front of Matthews to suggest larger numbers. Cross-class urban resistance (the 26th of July Movement's underground \"llano\" cells, especially in Santiago led by Frank País until his murder in July 1957) bombed power stations, sabotaged railways, and assassinated police informants. Women — Vilma Espín (Raúl's future wife), Haydée Santamaría, Celia Sánchez (Castro's lifelong companion and chief of staff), Melba Hernández — played crucial roles in urban coordination, arms smuggling, propaganda, and (in Sierra) combat units like the Mariana Grajales Platoon."},{year:"1957–59",text:"Batista's collapse. Mass torture and killings after Moncada and Granma alienated nearly all social classes. As Source C noted, \"nearly all social classes backed [the revolution]\" by 1958, either for its program or as the most effective anti-Batista force. The 14 March 1958 US arms embargo (Eisenhower discovered Batista was using US-supplied weapons against Cubans, in violation of Mutual Defence Pact terms) was — in Batista's own words — \"a severe psychological blow.\" Even his American backers had lost confidence. A summer 1958 government offensive against the Sierra Maestra failed; rebel columns under Che Guevara and Camilo Cienfuegos broke out and marched west across Cuba. Che's column captured Santa Clara on 30 December 1958 after derailing an armoured train — the decisive battle. Batista's army, demoralized and corrupt, suffered defeats throughout 1958. On New Year's Eve 1958, Batista fled to the Dominican Republic with stolen millions (estimates $300M–$700M). Castro's column reached Havana on 8 January 1959 to massive crowds — and immediately had to navigate transition."}]},au_castro_power:{title:"Castro's Cuba (1959–present)",events:[{year:"Jan–May 1959",text:"Provisional government and the first reforms. Castro initially installed a moderate liberal, Manuel Urrutia (anti-Batista judge), as president; José Miró Cardona as PM. Castro himself took the title of Commander-in-Chief and toured the US (April 1959, where Eisenhower refused to meet him; Vice-President Nixon did and reported back his impression Castro was \"incredibly naïve about communism\"). Behind the scenes Castro consolidated military power through the Rebel Army. Trials and executions of Batista officials began — over 600 executed in the first year, often in stadiums before crowds; international human rights criticism began but Castro framed it as \"revolutionary justice.\" On 13 February 1959 Castro replaced Miró Cardona as PM. The Agrarian Reform Law (17 May 1959) limited landholdings to 1,000 acres maximum, expropriated estates above that with compensation in 20-year bonds at 4.5% interest based on under-reported tax-value assessments — devastating US sugar interests. ~70% of land would be state-owned by 1963."},{year:"Jul 1959",text:"Urrutia resigns; July 1960 — total US break. When President Urrutia denounced communist influence in the new government in July 1959, Castro went on TV, accused Urrutia of conspiring with the US, and demanded his resignation — which Urrutia tendered. Osvaldo Dorticós replaced him as figurehead president. Huber Matos — revolutionary commander and military governor of Camagüey — sent a private resignation letter in October 1959 protesting communist infiltration. Castro had him arrested for treason; he was sentenced to 20 years in a 4-day show trial. The message was clear: dissent from any direction, even from heroes of the revolution, would be crushed. By July 1960 Eisenhower suspended the Cuban sugar quota. Cuba nationalized US-owned oil refineries (June 1960, after they refused to process Soviet oil), then all US-owned property in October 1960 (~$1B). The full US embargo followed (October 1960); diplomatic relations broke (3 January 1961)."},{year:"17–20 Apr 1961",text:"Bay of Pigs. ~1,500 CIA-trained Cuban exiles (Brigade 2506) landed at Playa Girón on the Bay of Pigs. Eisenhower had approved the plan; Kennedy inherited it and modified it — fatally — by withdrawing the promised US air support to maintain plausible deniability. Castro's forces (with intelligence from Cuban infiltrators) crushed the landing within 72 hours: ~118 exiles killed, ~1,200 captured (later ransomed for $53M in food and medicine). The disaster had three consequences crucial to Cuban history: (1) validated Castro's warnings about US imperialism, rallying the entire population behind the revolution as national survival; (2) made Kennedy look weak — particularly to Khrushchev, who began testing him in Berlin and over Cuba; (3) pushed Cuba decisively into Soviet arms. On 16 April 1961 (during the invasion), Castro publicly declared the revolution \"socialist\" for the first time. On 2 December 1961 he proclaimed himself a Marxist-Leninist — a reversal from his February 1959 denial."},{year:"1961",text:"The literacy campaign. A massive social mobilization. ~270,000 volunteer brigadistas (mostly young, ~40% women) deployed to rural areas for 8 months, living with peasant families they were teaching to read. Illiteracy fell from ~23% to ~4% — UNESCO confirmed the result. ~1 million Cubans learned to read in a single year. More schools were built in 3 years than in the previous 58. Private schools (mostly Catholic) were nationalized after the Bay of Pigs (April 1961). Religious education was restricted; many religious congregations entered \"internal exile\" — invisible without political voice. Education served the dual purpose of fighting illiteracy AND ideological formation: textbooks centered revolutionary heroes (Fidel, Che, Camilo); pro-revolution teachers replaced anti-revolution ones; some teachers were trained in the USSR."},{year:"Sept 1960",text:"CDRs founded. Committees for the Defence of the Revolution (Comités de Defensa de la Revolución) — surveillance committees in every workplace and city block. By 1963 ~1/3 of the adult population was enrolled (~2 million members); the most pervasive surveillance system in Cuba's history. Officially they organized health campaigns, vaccination drives, education programs, and neighborhood watch — but their key function was reporting \"counter-revolutionary\" behavior (suspicious meetings, listening to foreign radio, religious practice) to authorities."},{year:"Oct 1962",text:"Cuban Missile Crisis (from Cuba's perspective). Khrushchev secretly began deploying ~40 nuclear missiles to Cuba in summer 1962. Castro accepted them eagerly — they would deter US invasion. After US discovery (14 October), 13 days of crisis followed. Khrushchev resolved the crisis WITHOUT consulting Castro — Soviets removed the missiles in exchange for a US public no-invasion pledge and (secret) US removal of Jupiter missiles from Turkey. Castro was bitterly humiliated — Cuba had been a bargaining chip in superpower politics. He vented to a Soviet ambassador and refused to allow UN inspectors. But the US no-invasion pledge secured the regime; Soviet subsidies (worth ~$5 billion/year by the 1980s) sustained Cuba for nearly three decades."},{year:"1962–80s",text:"Authoritarian consolidation and the \"grey years\". All media became state-controlled by the mid-1960s. Castro's speeches — long (often 4–6 hours), didactic, broadcast simultaneously across all stations — became a constant presence. Every policy was framed in military language: harvests were \"battles,\" plans were \"liberation campaigns.\" The Revolutionary Offensive (1968) nationalized the remaining ~58,000 small businesses, producing severe shortages. The 10 Million Tons sugar campaign (1970) — Castro's attempt to produce 10 million tons of sugar in a single harvest — fell short at 8.5 million and devastated other sectors as resources were diverted (mass voluntary labour drives). ICAIC (Cuban Institute of Cinematographic Art and Industry, 1959) and UNEAC (National Union of Writers and Artists) controlled cultural production. The film PM was censored in 1961 for showing \"decadent\" Afro-Cuban dancing in Havana nightlife; Castro then delivered \"Words to the Intellectuals\" (June 1961): \"Within the Revolution, everything; against the Revolution, nothing.\" UMAP camps (1965–68) sent ~25,000 to forced labour: dissidents, homosexuals, religious objectors, youth imitating US culture (long hair, rock music). The Padilla Affair (1971) — poet Heberto Padilla was arrested for writing \"counter-revolutionary\" poetry, tortured into a public confession denouncing his own work and naming other intellectuals — launched the \"grey years\" (quinquenio gris, 1971–76) where artists feared creating anything potentially counter-revolutionary. The 1976 constitution stated artistic freedom only existed if content supported the revolution."},{year:"1980",text:"Mariel Boatlift. After ~10,000 Cubans crowded into the Peruvian Embassy in Havana seeking asylum (April 1980), Castro opened the port of Mariel and announced anyone could leave. Over 5 months, ~125,000 Cubans fled to Florida — Castro shrewdly forced exile families to take prisoners and mentally ill patients onto their boats, and called all emigrants \"scum\" (escoria). Repressive but pragmatic: letting dissatisfied people leave prevented internal pressure from building toward revolution."},{year:"1991–",text:"The Special Period. USSR collapse (December 1991) was catastrophic. Soviet trade, subsidies, oil, technicians, and loans ended within months. Cuban GDP contracted ~35% by 1993. Severe food shortages — average daily caloric intake fell from ~2,900 to ~1,800; an epidemic of optic neuropathy (60,000+ cases 1992–93) was caused by malnutrition. Energy crisis: limited working hours, long blackouts (up to 16 hours/day in some areas), restricted transport (gasoline rationed; horse-drawn carts and Chinese bicycles became common). In response Castro adapted pragmatically: state farms converted to worker-managed cooperatives (1993); foreign investment encouraged in tourism (Spanish hotel chains entered); the US dollar legalized (1993, banned again 2004); farmers' markets allowed (1994); limited self-employment permitted (~140 occupations). Some subsidies cut, taxes increased. Cuba survived — but the pure socialist vision was gone. By 2008 Fidel handed power to brother Raúl; Pope Benedict XVI visited 2012; the Obama-Castro thaw 2014–16 reopened diplomatic relations briefly before Trump reversed it. Fidel died 25 November 2016, aged 90."}]},rc_islamic:{title:"When the Moors Ruled Iberia (711–1492)",events:[{year:"711",text:"The fragile Visigothic Spain. Iberia had been ruled by the Visigoths since the early 5th century AD. The kingship was elective, not hereditary — every succession risked civil war between rival noble factions. By 710 the kingdom was in crisis: King Wittiza had died and the throne was disputed; Roderick won election but Wittiza's family rejected him. The Visigoths had also alienated key minorities — the Jews had been forcibly converted and persecuted under King Sisebut (612–620) and again under King Egica (694), and the Hispano-Roman peasantry had been heavily taxed. Tariq ibn Ziyad, a Berber commander serving the Umayyad governor of North Africa, crossed the Strait of Gibraltar with ~7,000 men in April 711. Roderick was in the north of the peninsula suppressing a Basque rebellion. By the time Roderick's army reached the south (after a force-march), Tariq had been reinforced. At the Battle of Guadalete (~July 711), Wittiza's family allies allegedly defected at a critical moment; Roderick was defeated and likely killed. Toledo, the Visigothic capital, fell 712. By 714 most of the peninsula was under Muslim control. Crucial point: the conquest's speed reflected Visigothic disunity AND collaboration from local Jews and disaffected Christians who saw Muslims as liberators — confirmed by the SLOWNESS of the Muslim conquest of North Africa, which had taken decades against Berber resistance. Resistance against the new Muslim rulers survived only in the rugged north — the small kingdom of Asturias under Pelayo (Battle of Covadonga, ~722), the symbolic seed of the Reconquest."},{year:"756–1031",text:"Independent al-Andalus. After 711, the Iberian Peninsula was the westernmost province of the Umayyad Caliphate of Damascus. When the Abbasid revolution overthrew the Umayyads in 750 and massacred most of the dynasty in Damascus, a 20-year-old Umayyad prince named Abd ar-Rahman survived and fled. Across North Africa with a price on his head, he reached al-Andalus in 755 and seized power in Córdoba (756), proclaiming himself emir. The independent Umayyad dynasty he founded would last until 1031. Under his great-great-grandson Abd ar-Rahman III (912–961) — who proclaimed himself caliph in 929 — Córdoba became the largest, wealthiest, and most learned city in Western Europe. Estimates of its population vary from 100,000 to 500,000 (likely several hundred thousand), with paved streets, street lighting, sewers, ~70 libraries (the caliph's library reportedly held 400,000 books — at a time when the largest Christian European library held a few hundred). The Saxon nun Hroswitha called Córdoba \"the ornament of the world.\"."},{year:"8th–10th C",text:"Al-Andalus's golden age. Moorish contributions transformed Western Europe. Agriculture was revolutionized: irrigation systems (acequias) using the noria (water-wheel) and qanat (underground canal); new crops including sugar cane, rice, cotton, citrus, eggplant, spinach; commercial silk production. Industry: paper-making (a Chinese technology transmitted via the Islamic world; al-Andalus had paper mills by the 11th century, ~150 years before Christian Europe); glass-making; high-quality steel (Toledo blades). Architecture: the Great Mosque of Córdoba (built 785, expanded for two centuries; 856 columns); Madinat al-Zahra (Abd ar-Rahman III's palatial city, 936–1010, destroyed in the 11th-century civil war); the Giralda of Seville. Mathematics: Arabic numerals (replacing Roman), zero, algebra (al-Khwarizmi's work transmitted via al-Andalus), trigonometry. Medicine: Cordoban physician Albucasis (al-Zahrawi, 936–1013) wrote the foundational surgical text \"Kitab al-Tasrif,\" used in European medical schools for 500 years. Philosophy: Averroes (Ibn Rushd, 1126–98) of Córdoba and Maimonides (Jewish philosopher of Córdoba, 1135–1204) — the transmission of Aristotle to Christian Europe came overwhelmingly through al-Andalus. Without this transfer of knowledge, the European Renaissance might not have happened."},{year:"Reality of La Convivencia",text:"The \"Coexistence\" was real but complicated and deteriorated over time. Non-Muslims (Jews and Christians, \"People of the Book\") were treated better than most conquered peoples in the medieval world — they were not in ghettos, not slaves, not prevented from earning a living, not banned from practicing their faith. They held positions in al-Andalus's administration: the Jewish vizier Hasdai ibn Shaprut served Abd ar-Rahman III; the diplomat-poet Samuel ibn Naghrillah was vizier of Granada. BUT they were \"dhimmi\" (protected subjects) under specific restrictions: paid the jizya (poll tax — heavier than Muslim taxes); had to acknowledge Islamic superiority; couldn't try to convert Muslims; couldn't carry weapons; couldn't own Muslim slaves; couldn't marry Muslim women (though Muslim men could marry non-Muslim women); had to wear distinctive clothing or badges in some periods. Bernard Lewis called al-Andalus a \"golden age\" of relative tolerance by medieval standards. David Nirenberg argued violence was \"central and systematic\" — citing the 1066 organized massacre of Jews in Granada (~4,000 killed after Joseph ibn Naghrillah, son of Samuel, was lynched) and progressive deterioration. Both can be true: real tolerance compared to medieval Christian Europe (which was simultaneously expelling Jews from England, France, etc.) but with permanent inferior status that hardened over time, especially under Almoravid (1090s+) and Almohad (1140s+) rule which was much more rigorist."},{year:"1031–1212",text:"Fragmentation and decline. The Caliphate of Córdoba dissolved into ~30 competing taifa kingdoms after Almanzor's death (1002) and the destructive fitna civil war (1009–31). Christian kingdoms — initially weak and divided themselves — exploited the fragmentation, demanding tribute (parias) from taifa rulers. When Toledo fell to Castile under Alfonso VI (1085), the panicking Seville taifa invited Berber Almoravid warriors from Morocco. Almoravids defeated Alfonso at Sagrajas (1086) and unified al-Andalus, but their religious puritanism alienated sophisticated Andalusi Muslims. The Almoravid empire collapsed in the 1140s; the Almohads (another Moroccan Berber dynasty) replaced them. The Almohads were even more rigorist — under them, Maimonides and other Jewish scholars fled al-Andalus. The Battle of Las Navas de Tolosa (16 July 1212) — fought by a coalition of Castile (Alfonso VIII), Aragon, Navarre, plus knights from across Europe under papal indulgence — broke Almohad military power permanently. Estimates of forces are unreliable but Christian numerical and tactical victory was decisive. Soon after, Córdoba fell (1236) and Seville (1248) to Castile under Ferdinand III the Saint."},{year:"1252–1492",text:"Granada alone. By 1252 the Nasrid Kingdom of Granada was the only remaining Muslim state in Iberia — surviving 240 more years not through military strength but through diplomacy and tribute. Muhammad I had already secured this position in 1232 by becoming a tributary vassal of Castile. Granada's territory was reduced to roughly modern Granada, Málaga, and Almería provinces — about 30,000 km². Under rulers Yusuf I (1333–54) and Muhammad V (1354–91) — the \"golden years\" — silk production and trade with North Africa brought wealth. Muhammad V built most of the surviving Alhambra palace complex (begun 1238, expanded extensively 1354–91): the Court of the Lions, the Hall of the Ambassadors, intricate stuccowork, tile mosaics with Pythagorean geometry, calligraphic poetry on the walls. Granada became one of medieval Europe's most beautiful cities. Bettany Hughes argues in her documentary \"When the Moors Ruled in Europe\" that this period has been \"systematically written out of history\" — after the fall of Granada (1492), ~300,000 Muslims were eventually expelled and approximately 1 million books burned (Cisneros's burnings included entire libraries of Arabic manuscripts; only the medical books were spared). The image of Moors as \"barbaric, savage, uncivilized and dirty aliens\" persisted from the Crusades through the modern era — despite their cultural and scientific achievements that helped trigger the Renaissance."}]},rc_reconquest:{title:"The Reconquest and Spain's Transformation",events:[{year:"9th C",text:"The discovery of St James's tomb at Santiago de Compostela. According to legend, around 813 a hermit named Pelagius was led by stars (the \"campus stellae\" → Compostela) to the tomb of the Apostle James (Santiago) in northwestern Galicia. Bishop Theodemir verified the relics; King Alfonso II of Asturias visited and built a church on the site. Whether or not the bones were actually the Apostle's, the discovery gave the small Christian kingdoms of the north a warrior patron saint and a powerful pilgrimage destination — Santiago de Compostela became the third-most important Christian pilgrimage after Rome and Jerusalem. Santiago \"Matamoros\" (\"Moor-killer\") would be invoked in battles against Muslims for centuries (the legend of Santiago appearing on a white horse at the Battle of Clavijo, ~844, became iconic)."},{year:"9th–11th C",text:"A warrior society forms. Centuries of frontier warfare made war a Castilian way of life, creating a large class of warrior-nobles (hidalgos — \"hijos de algo,\" sons of something) who regarded manual labour with contempt and saw martial valour as the only honourable career. Mobile property — particularly sheep — was favoured over fixed agriculture because sheep could be driven away from raiding parties. The Mesta (founded 1273) was a powerful royal-chartered guild of sheep-owners with extensive transhumance rights — at peak about 3 million sheep moved seasonally between summer pastures in the north and winter pastures in the south, dominating Castilian economics. As Carlos Fuentes wrote, \"the frontier wars against the Moors had bred a race of gentlemen proud of their Christian blood but without a penny, whose one resource was to go to the wars.\" This warrior culture and contempt for productive labour would later transfer almost intact to the New World."},{year:"11th C",text:"El Cid and political opportunism. Rodrigo Díaz de Vivar (~1043–1099, \"El Cid\" from the Arabic \"al-Sayyid,\" \"the lord\") epitomized the early Reconquest's pragmatism. A Castilian nobleman, he served Alfonso VI of León-Castile, was exiled for political reasons, then served the Muslim emir of Zaragoza (1081–86), then returned to Christian service, then conquered Valencia and ruled it as his own (1094–99). He fought for and against Muslims and Christians alike, depending on contracts and politics. The medieval epic \"Cantar de Mio Cid\" (~1140) idealized him as a Christian hero, but the historical figure was more mercenary than crusader. El Cid's career shows the Reconquest was NOT a continuous holy war but a centuries-long process where pragmatism frequently trumped religion."},{year:"1212",text:"Las Navas de Tolosa. A coalition of Castile (Alfonso VIII), Aragon (Pedro II), and Navarre (Sancho VII), plus French and Portuguese knights, crusaded against the Almohads in central Iberia. Pope Innocent III had granted crusade indulgences. The Almohad caliph Muhammad al-Nasir was defeated decisively. Almohad military power broke permanently. Córdoba fell to Castile (1236) and Seville (1248) — the Reconquest accelerated dramatically."},{year:"1252–1410",text:"The status quo. By 1252, Granada (under the Nasrid dynasty) was the only remaining Muslim state. Christian kingdoms were dominant but divided. Castile was ruled by powerful land-holding nobles whose private armies often acted independently. Aragon was governed by merchants who had gained power through Mediterranean commerce — Aragon's empire eventually included the Balearic Islands, Sardinia, Sicily (1282), Naples (1442), and Greek territories. Each was its own kind of state. Castile periodically demanded tribute from Granada; Granada's payments (estimated 20,000 gold doblas/year at peak) were lucrative."},{year:"1230s–1390s",text:"The Nasrid golden years. \"Its foundation was laid by consent, not force.\" Granada survived by exploiting Christian rivalries and paying tribute. Under Yusuf I (1333–54) and Muhammad V (1354–91) the kingdom enjoyed peace and economic prosperity — silk production, North African commerce. Muhammad V's building program at the Alhambra produced some of medieval Islam's greatest architecture. In a striking 1406 incident, Granada actually supplied troops for a JOINT operation with Castile against the Marinids in North Africa — proof that political interests could trump religious enmity."},{year:"1410–80s",text:"External pressures gather, Christian rivalries delay. Stability gradually eroded as Nasrid rulers faced rebellions, coups, and assassinations. Castile's 1410 capture of Antequera shrank Granada's borders. Christian rivalries delayed full assault on Granada — the Duke of Medina Sidonia's 1471 capture of Alhama sparked envy from his rival the Marquess of Cádiz, and Castilian noble feuds repeatedly stalled momentum. Externally, the Ottoman capture of Constantinople (29 May 1453) revived crusading interest across Europe and sharpened Christian-Muslim identities. The Sentence of Medina del Campo (1465) ended Muslim toleration in Castile. Portugal's caravels opened direct sea trade routes to Sub-Saharan Africa in the 1450s–60s, undercutting Granada's role as trade intermediary."},{year:"1469–92",text:"Ferdinand and Isabella. The October 1469 marriage of Ferdinand of Aragon and Isabella of Castile created what would become a united Spanish monarchy. Isabella inherited Castile in 1474 (after a civil war 1474–79 against supporters of her niece \"La Beltraneja\"); Ferdinand inherited Aragon in 1479. Together they commanded the resources of nearly all Iberia (Portugal, Granada, and Navarre remained independent). They reorganized royal finances, broke down feudal autonomy, founded the Spanish Inquisition (1478), and turned attention south. Modern historians criticize them for favouring the aristocracy — by 1500 about 2-3% of the population owned 95% of arable land; 80% were impoverished peasants; Spain's industrial base remained limited (mainly iron and cloth) and never reached England's level. New World gold and silver after 1492 led to dependence on extraction over industrial development. The empire, Fuentes wrote, was born \"half-crippled.\"."},{year:"1482–92",text:"Granada falls. When Granada refused to pay tribute (1481) and raided Christian territory, Ferdinand exploited Granada's internal weakness. Boabdil (Muhammad XII) rebelled against his father Abu'l-Hasan Ali in 1482 — Granada's civil war split the kingdom three ways (father, son, and uncle al-Zaghal). Ferdinand systematically reduced the kingdom: Alhama (1482), Ronda (1485), Loja (1486), Málaga (1487, with massacre of defenders), Almería (1489), then encircling Granada itself. The 7-month siege of Granada (1491–92) ended with negotiated surrender on 25 November 1491. Boabdil formally handed the keys of the city to Ferdinand on 2 January 1492. As his mother allegedly said: \"You should weep like a woman for the land you could not defend like a man.\" Three world-changing events that year were causally connected: the fall of Granada (2 January) ended 781 years of Muslim presence; the Edict of Expulsion of the Jews (31 March) removed a vital economic and intellectual community; Columbus's voyage (October–March 1493, financed partly by Granada's spoils) opened the Americas. The Reconquista's mentality of conquest, conversion, and exclusion would now be transferred to a new continent."}]},rc_expulsions:{title:"Purging the Peninsula (1478–1609)",events:[{year:"1391",text:"Anti-Jewish pogroms across Iberia. The chain of events leading to the Expulsions began a century before 1492. In June 1391 anti-Jewish riots erupted in Seville (after years of incitement by the demagogue Archdeacon Ferrán Martínez) and spread to ~70 cities across Castile and Aragon. ~50,000–100,000 Jews were killed; many more were forcibly baptized to save their lives, becoming \"conversos\" or \"New Christians.\" Jewish communities that had thrived for centuries were destroyed. Over the following century the converso population grew large (estimates 100,000–250,000), prosperous, and increasingly resented by Old Christians who suspected (often correctly) that many conversos secretly maintained Jewish practices."},{year:"1478",text:"The Spanish Inquisition. Ferdinand and Isabella obtained papal authorization (Sixtus IV's bull \"Exigit sincerae devotionis affectus,\" 1 November 1478) to establish a Spanish Inquisition under royal — not papal — control. This was a key innovation: the Inquisition served the Crown's political agenda while wearing religious authority. Its initial target was conversos suspected of \"Judaizing\" — secretly continuing Jewish practices. The first auto-da-fé was held in Seville (6 February 1481), executing 6 conversos. Tomás de Torquemada was appointed Grand Inquisitor (1483) and intensified persecution. Estimates of total Inquisition victims over four centuries (until 1834): ~3,000–5,000 executions, ~150,000 prosecutions. The ideology of \"limpieza de sangre\" (purity of blood) hardened — even baptized descendants of Jews and Muslims faced ongoing suspicion, with \"limpieza\" certificates required for many positions."},{year:"31 Mar 1492",text:"Edict of Expulsion of the Jews. Issued from the Alhambra Palace just three months after Granada's fall. Drafted by Torquemada. The edict accused Jews of enticing Christians (especially conversos) back to Judaism — \"instructing them in ceremonies, performing circumcisions, providing prayer books, telling them there is no other law or truth.\" Jews had until 31 July 1492 to convert or leave; those who left could not take gold, silver, or coined money. Estimates of how many left vary widely — most modern scholarship suggests 40,000–100,000 Jews left (down from earlier estimates of 200,000+ that may have inflated original community size). Many went to Portugal (where they were expelled in 1497, having been forcibly baptized first), the Ottoman Empire (Sultan Bayezid II welcomed them: \"You call Ferdinand a wise king — he who has impoverished his country to enrich mine?\"), North Africa, the Netherlands. The Sephardic diaspora preserved Ladino (medieval Castilian) for centuries. Spain lost a community that had dominated medicine, finance, tax administration, and trade. Carlos Fuentes wrote the empire was born \"half-crippled.\"."},{year:"25 Nov 1491",text:"Treaty of Granada. Signed between Boabdil and Ferdinand and Isabella to secure peaceful surrender. Sometimes called the Capitulations of Granada. The first 4 articles practically stated that Muslims should keep their religious freedom — preservation of mosques and religious institutions, use of Arabic language, the right to follow their own laws and customs. Boabdil and his followers received an estate in the Alpujarras mountains. The treaty seemed designed to integrate the Muslim population. For about 8 years, this promise was largely kept. Then it broke — Cisneros's actions would test whether the treaty meant anything."},{year:"1499–1500",text:"Cisneros and the First Alpujarras Rebellion. Cardinal Francisco Jiménez de Cisneros — Isabella's confessor and Archbishop of Toledo — was sent to Granada in 1499 with sweeping authority after the slower-moving conciliatory archbishop Hernando de Talavera was sidelined. Frustrated by slow voluntary conversion of Muslims, Cisneros organized mass forced baptisms; declared Muslim religious books \"heretical\"; and ordered the burning of over 5,000 priceless Arabic manuscripts in Granada's main square in 1499 — only medical books were spared. This was an irreplaceable cultural catastrophe (centuries of philosophy, science, medicine, history, poetry destroyed). When one of his agents was assassinated, Cisneros and the Crown treated this as breaking the Treaty of Granada's terms. Outraged Muslims rose against the broken treaty (the First Rebellion of the Alpujarras, 1499–1500); royal forces crushed the rebellion. The Crown declared the Treaty void; Muslims now faced exile or baptism. Most accepted forced baptism rather than abandon their lands; they became \"Moriscos\" — the converted Muslim community. The same choice was extended to Castile in 1502 and to Aragon in 1525."},{year:"1567",text:"Philip II's edict and the Second Alpujarras. Philip II (king 1556–98) sought to complete what his great-grandparents had begun. His January 1567 edict banned Arabic language (Moriscos had three years to learn Castilian); banned Islamic religious practice (already illegal but now enforced more rigorously); banned traditional Muslim dress (especially veils and clothing styles); banned traditional names; banned visits to Muslim public baths; required Christian-style names for children. Moriscos who outwardly conformed but secretly maintained festivals and rituals were now criminalized for cultural identity even after religious compliance. The Granada Moriscos rose in revolt on Christmas Eve 1568 — the Second Alpujarras Rebellion. The Crown's response was savage: Don John of Austria (Philip's half-brother and later victor of Lepanto) led the suppression. At Galera (October 1569), he razed the town entirely, sprinkled salt over the ruins, and slaughtered 2,500 including 400 women and children. The rebellion was crushed by 1571. ~80,000 Granada Moriscos were forcibly relocated to other parts of Castile (1570) — breaking up the cohesive community, dispersing them where they would be more easily watched and assimilated."},{year:"4 Apr 1609",text:"Morisco Expulsion. Philip III (king 1598–1621) and his minister the Duke of Lerma signed the final expulsion decree. Beginning October 1609, ~300,000 Moriscos were expelled over 4–5 years, mostly to North Africa where they were often viewed with suspicion as Christianized Muslims. The reason for final expulsion was complex: religious zeal mixed with envy (some Moriscos had become successful merchants), with fears about birth rates (Morisco populations were growing faster than Old Christian), and with suspicions of Ottoman or Barbary pirate sympathies. Aragon and Valencia were hit hardest economically — Valencia lost up to 1/3 of its agricultural workforce; vineyards and irrigation systems collapsed; the Aragonese economy never fully recovered. Spain had now achieved \"limpieza\" — a religiously homogeneous Christian state — at the cost of having driven out two of its most economically productive minorities. Spain's relative decline against England and the Netherlands over the following century was partly the consequence."}]},rc_mexico:{title:"The Fall of the Aztecs (1519–1521)",events:[{year:"Before 1519",text:"The Aztec world. The Mexica (Aztecs) had risen from migrant outsiders to imperial rulers in just ~200 years. Their migration story (recorded in codices) had them coming from \"Aztlán\" and \"Chicomoztoc\" (Place of Seven Caves) in legendary northern lands. Settling in the Valley of Mexico in the early 14th century, they were initially despised newcomers; tradition has them founding Tenochtitlán in 1325 on a small island in Lake Texcoco where they saw their prophesied sign — an eagle perched on a cactus devouring a serpent (still on Mexico's flag). Through alliance with Texcoco and Tlacopan (the Triple Alliance, 1428) and military expansion, they built an empire of perhaps 5–6 million subjects across central and southern Mexico. By 1519 Tenochtitlán was one of the largest cities in the world — population estimates 200,000–400,000 (larger than any city in Europe except possibly Paris and Constantinople). Built on engineered land in a salt-water lake, connected by 3 great causeways and supplied with fresh water by the 11-km Chapultepec aqueduct. Wide streets, half on land and half canals navigated by canoe (Cortés would describe it as \"another Venice\"). The central Templo Mayor reached ~60 m high. The market at Tlatelolco served 60,000 traders daily according to Cortés — selling gold, silver, feathers, vegetables, slaves, with items priced by number and size, not weight. As Bernal Díaz wrote, the Spaniards wondered \"whether what we saw was real.\"."},{year:"1517–18",text:"First Spanish expeditions. Hernández de Córdoba's 1517 expedition reached the Yucatán; he was killed by Maya resistance (a poisoned arrow at the battle of Champotón), but his survivors brought back gold artifacts. Grijalva's 1518 follow-up explored the eastern coast as far as central Mexico, traded with Moctezuma's emissaries (who had come down from the highlands to monitor the strangers), and confirmed reports of a vast wealthy empire inland. These reports made Mexico irresistible to Spanish adventurers — and convinced Cuban governor Diego Velázquez to send a third, larger expedition."},{year:"Feb 1519",text:"Cortés sails (defying orders). Hernán Cortés (b. 1485 in Medellín, Extremadura) had permission from Velázquez to explore and trade — but EXPLICITLY not to colonize. Cortés's appointment had been engineered by Velázquez's accountant Amador de Lares and the merchant Andrés de Duero, who had taken financial stakes in the expedition. When Velázquez tried to revoke the appointment days before departure (suspicious that Cortés would exceed his authority), Cortés sailed early (10 February 1519) with 11 ships, ~500 men, 16 horses, 32 crossbows, 13 arquebuses, and 14 small cannons. Once in Mexico, Cortés's only path to legal legitimacy was to conquer enough wealth to buy royal forgiveness directly from Charles V — bypassing Velázquez. Cortés had enrolled at the University of Salamanca's law faculty at age 14 (didn't graduate, but absorbed enough) and his letters to Charles V are masterful legal arguments — every detail crafted to legitimize the unauthorized conquest. He famously scuttled (or beached) his ships at Veracruz in summer 1519 to prevent his men from retreating — a story partly mythologized but rooted in fact."},{year:"March 1519",text:"Malintzin (La Malinche) and translation as power. When Cortés landed at Tabasco (March 1519), local Maya gave him 20 enslaved women including a young woman of perhaps 16 named Malinalli (later baptized Marina, called Malintzin or La Malinche). She had been born to a Nahua noble family in central Mexico, sold into slavery in Yucatán as a child — so she spoke Nahuatl (Aztec) AND Mayan. Combined with the Spaniard Jerónimo de Aguilar (a survivor of a 1511 shipwreck who had lived among the Maya for 8 years and spoke Mayan), the chain Spanish→Aguilar→Mayan→Malintzin→Nahuatl gave Cortés communication with the Aztec world. Malintzin quickly learned Spanish too and became Cortés's chief interpreter, advisor, and lover — they had a son, Martín Cortés, one of the first mestizos. She remains one of the most controversial figures in Mexican history: traitor (chingada — the \"screwed-over\" mother of Mexico) or survivor and pragmatic agent."},{year:"Sept 1519",text:"Tlaxcalan alliance. Cortés's strategy depended on finding allies among Aztec enemies. He found them in the Tlaxcalans — a confederacy that had remained independent of the Aztecs and was the target of perpetual \"flower wars\" (xochiyaoyotl) by which Aztecs captured victims for sacrifice. After initial battles in which Tlaxcalan warriors fought the Spanish to a draw and impressed each other, Tlaxcalan leaders concluded the Spaniards were the better immediate option. They became Cortés's most loyal indigenous allies; eventually thousands of Tlaxcalan warriors fought alongside the Spanish. Without them, Cortés could never have conquered alone."},{year:"Oct 1519",text:"Cholula massacre as terror weapon. On the road to Tenochtitlán, Cortés stopped at the holy city of Cholula (a Toltec religious center loyal to the Aztecs). Warned by Malintzin of an alleged ambush plan (the historicity of the plot is debated by historians), Cortés ordered a preemptive massacre — Spanish forces and Tlaxcalan allies killed thousands of unarmed Cholulans in the city's main square (estimates 3,000–6,000 dead). The terror sent a message to all of Mexico that the Spaniards were not bound by ritual warfare's restraints. Some historians see Cholula as Cortés's most coldly strategic act — guaranteeing that further resistance would be costly."},{year:"8 Nov 1519",text:"Cortés enters Tenochtitlán. Cortés entered the Aztec capital by invitation, on the Iztapalapa Causeway. Moctezuma greeted him as guest. Bernal Díaz described soldiers wondering \"whether what we saw was real\" — the city was beyond their experience. Cortés attempted to embrace Moctezuma but was stopped by the lords (Aztec protocol forbade physical contact with the divine emperor). Cortés placed a necklace of pearls and cut glass around Moctezuma's neck; Moctezuma offered necklaces of red snail shells with golden shrimp. For about 7 months Spanish forces lived in Tenochtitlán as guests in the palace of Axayácatl; Cortés took Moctezuma hostage in his own palace (mid-November 1519), ruling indirectly through him while sending shipments of gold to Charles V."},{year:"30 Jun 1520",text:"La Noche Triste (the Night of Sorrows). While Cortés was on the coast confronting a punitive expedition sent by Velázquez (under Pánfilo de Narváez, which Cortés bribed and defeated), his lieutenant Pedro de Alvarado massacred ~600 Aztec nobles at the Templo Mayor festival of Tóxcatl (May 1520). The Aztecs revolted. Cortés returned to find Spanish forces besieged in their palace. He brought Moctezuma to a balcony to calm the crowd; Moctezuma was killed (sources disagree — Cortés says by his own people's stones; Bernal Díaz says one stone struck him fatally; some indigenous accounts blame the Spanish). The Spanish had to flee on the night of 30 June–1 July 1520 across the Tacuba Causeway under fire. ~600 Spaniards (about 2/3 of the force) drowned under the weight of stolen gold or were killed. Many Tlaxcalan allies died. Cortés survived by the skin of his teeth and reportedly wept under a tree (the \"Árbol de la Noche Triste\" survives in Mexico City). The situation looked like total defeat."},{year:"1520–21",text:"Smallpox arrives. A Spanish soldier from Narváez's force had smallpox (probably brought from Cuba). The disease spread to the Aztec population, which had no acquired immunity. Smallpox swept through Mexico, killing perhaps 30–50% of the population in the first year. Among the dead was the new emperor Cuitláhuac (who had organized the resistance) — he was succeeded by his cousin Cuauhtémoc. Smallpox arguably killed more Aztecs than Spanish swords ever could, and weakened the empire at the moment Cortés was rebuilding his forces."},{year:"May–Aug 1521",text:"Siege and fall of Tenochtitlán. Cortés rebuilt his force with Tlaxcalan reinforcements (eventually ~150,000 indigenous warriors fighting under his command) and constructed 13 brigantines (small ships) on Lake Texcoco to control the water and cut the city's supply causeways. The siege began 22 May 1521. Aztec defenders, weakened by smallpox and starvation, fought desperately for 75 days. Aqueducts cut, water unavailable, dead bodies piling up, Tenochtitlán fell on 13 August 1521 — Cuauhtémoc, the last emperor, was captured trying to escape by canoe. He was tortured (his feet burned in oil) to reveal the location of hidden treasure, kept alive as a humiliated puppet for years, finally executed in 1525 during Cortés's expedition to Honduras. The Aztec Empire was over; Spanish Mexico (New Spain) had begun. The Broken Spears, compiled from indigenous sources, records these events from the perspective of the conquered — preserving what the conquerors' accounts leave out."}]},rc_peru:{title:"The Conquest of the Inca Empire (1532–1548)",events:[{year:"Before 1532",text:"The Inca world. Tawantinsuyu — \"The Four Quarters\" — was the largest pre-Columbian empire, stretching from southern Colombia to central Chile (~4,000 km north-south) at its peak under Huayna Capac (~1493–1525). Estimated population 9–16 million. Over 25,000 miles (40,000 km) of stone roads connected the empire, with rope suspension bridges spanning Andean canyons; runners (chasquis) could carry messages 240 km/day along these roads. The Sapa Inca was a divine ruler descended from the sun god Inti; royal mummies were preserved and consulted. There was no writing — records used quipu, knotted strings encoding numerical and possibly narrative data. There was no money — labour was extracted via the mit'a system, in which subject communities owed work-service to the state (building, farming, military service) on a rotating basis. There was no slavery as Europeans understood it. Mastery of high-altitude agriculture: terraced fields (andenes), advanced irrigation, freeze-drying potatoes (chuño), llamas as pack animals. Cuzco was the imperial capital. Cities like Machu Picchu (built ~1450, \"rediscovered\" by Hiram Bingham in 1911) showcase Inca masonry — stones cut so precisely that mortar was unnecessary and joints could not fit a knife. The Inca army fielded tens of thousands of warriors — but armed with slings, clubs, bronze weapons, and quilted cotton armor; no steel, no horses, no firearms."},{year:"c.1525",text:"Smallpox arrives before any Spaniard. The most devastating blow fell before any Spaniard had seen Peru. A smallpox epidemic — brought by earlier European contact in Central America and spread through indigenous trade networks — reached the Inca Empire around 1525. Emperor Huayna Capac died (probably of smallpox or a related disease, c. 1525) along with his designated heir Ninan Cuyochi. Estimates suggest the disease killed up to half the population in some regions over the following decade. The empire was suddenly without a clear leader at the worst possible moment."},{year:"1529–32",text:"Inca civil war (Atahualpa vs Huáscar). Two of Huayna Capac's sons claimed the throne. Huáscar in the south held Cuzco and the traditional power base — backed by the Cuzco priestly class. Atahualpa in the north (Quito) held the loyalty of the empire's standing army, which had been campaigning in the northern Andes. War between the two devastated the empire — armies marched across regions, towns were sacked, the population was demoralized. Atahualpa won decisively at the Battle of Quipaipan (April 1532), capturing Huáscar and reuniting the empire under his rule. But the empire was divided in loyalty (many Cuzco elites still favoured Huáscar's faction), depleted in manpower, and Atahualpa himself was on the move from Quito to Cuzco when the Spanish arrived."},{year:"Apr 1532",text:"Pizarro lands at Tumbes. Francisco Pizarro had been preparing this expedition for nearly a decade. Born ~1471 in Trujillo (Extremadura, Spain's poorest region), the illegitimate son of an army officer and a peasant, illiterate but ambitious. He had served under Balboa in Panama (witnessing the Pacific in 1513). After two reconnaissance voyages (1524–25, 1526–28) he had returned to Spain (1529) and obtained royal authorization (the Capitulación de Toledo, signed by the Empress Isabella in Charles V's absence) to conquer Peru — receiving titles of governor, captain-general, and adelantado. He landed at Tumbes (northern Peru) in April 1532 with 168 men: 62 horse, 106 foot, plus 1 priest (Vicente de Valverde), the interpreter Felipillo, and trained dogs. Compared to Cortés's 500+ men, this was a tiny force. But timing was everything."},{year:"15–16 Nov 1532",text:"Cajamarca ambush. Pizarro marched inland to the highland town of Cajamarca where Atahualpa was camped with ~80,000 troops, having just won the civil war and en route to Cuzco. Pizarro requested a meeting in the town's plaza. On 16 November 1532, Atahualpa came in great state, in a litter borne by 80 nobles, surrounded by several thousand mostly unarmed retainers and lavishly dressed honour guards (he had dismissed the small Spanish force as no military threat). The Dominican friar Vicente de Valverde delivered the Requerimiento — a legalistic Spanish demand to accept Christianity and Spanish rule. The interpreter Felipillo translated badly (La Vega's chronicle says the translation distorted Valverde's speech). Atahualpa, presented with a Bible (or breviary), examined it briefly and discarded it (he could not read it; some accounts say he held it to his ear and was offended that it did not \"speak\"). Valverde signaled Pizarro to attack. The Spanish had hidden cannons in surrounding buildings and cavalry behind walls. They opened fire; cavalry charged into the densely packed unarmed crowd. Within hours, several thousand Inca were killed; not a single Spaniard died (one was wounded, by a Spanish weapon). Atahualpa was captured alive — far more valuable than dead."},{year:"Nov 1532–Jul 1533",text:"Atahualpa's ransom and execution. Atahualpa offered an extraordinary ransom for his release: filling a room ~22 ft × 17 ft × 8 ft once with gold and twice with silver. Over the next 8 months, Inca subjects delivered ~13,000 lbs (~6,000 kg) of 22-carat gold and ~26,000 lbs (~12,000 kg) of silver — the largest ransom in history (~$300M+ in modern equivalent, depending on calculation method). Pizarro and his men distributed it according to rank: Pizarro received 5 times what a foot soldier got; cavalry got double infantry; the priest Valverde got priestly portions. After receiving the ransom, Pizarro had Atahualpa tried by a kangaroo court on charges of \"treason against Charles V\" (absurd, since Atahualpa was not a Spanish subject), idolatry, and ordering Huáscar's murder. He was sentenced to be burned alive. Atahualpa, terrified of having his body destroyed (Inca religion required preservation for the afterlife), accepted last-rites baptism — and was instead garroted on 26 July 1533. Sources broadly agree on strangulation, though details vary."},{year:"Nov 1533",text:"Capture of Cuzco. Pizarro marched on Cuzco, the Inca capital, taking it with relatively little resistance — many Incas saw the Spanish as liberators from Atahualpa's victorious northern faction. The looting of Cuzco's temples and palaces was massive; the Coricancha (Temple of the Sun) was stripped of gold sheets. Pizarro installed Manco Inca (Huáscar's brother) as a puppet emperor, founding Lima as the new Spanish capital (1535) on the coast."},{year:"1536",text:"Manco's rebellion nearly succeeds. Manco escaped Spanish control and led a massive insurrection. He besieged Cuzco for ~10 months (May 1536–March 1537) with up to 100,000 Inca warriors, nearly starving out the ~190 Spanish defenders led by Hernando Pizarro. Lima was besieged simultaneously. With reinforcements arriving and Inca armies unable to maintain a long siege (Inca soldiers were also farmers needing to return for harvest), the Spanish broke out and crushed the rebellion. Manco retreated to Vilcabamba in the cloud forest, founding a small \"neo-Inca state\" that would survive until 1572 (when Túpac Amaru I, the last Sapa Inca, was captured and beheaded)."},{year:"1538–48",text:"Conquistadors turn on each other. With the Inca Empire defeated, the conquistadors fell into civil war among themselves. Pizarro and his junior partner Diego de Almagro had quarreled over the division of spoils since the start. After Almagro's failed Chilean expedition (1535–37, where he found mostly desert and hostile Mapuche), open war erupted over control of Cuzco. At the Battle of Las Salinas (1538), Pizarro's forces defeated Almagro; Almagro was strangled. His embittered son and supporters (\"Almagrists\" or \"knights of the cape\" — they had been left poor and had to wear cloaks for lack of clothes) assassinated Francisco Pizarro in his Lima palace on 26 June 1541. Charles V's appointed governor Cristóbal Vaca de Castro defeated the Almagrists at Chupas (1542). Then the New Laws (1542–43, restricting the encomienda) provoked a third civil war — Gonzalo Pizarro (Francisco's half-brother) led Peru's encomenderos in revolt against the Crown. He killed the new viceroy Blasco Núñez Vela at the Battle of Iñaquito (1546), and briefly ruled Peru as governor. Charles V sent Pedro de la Gasca, a priest with sweeping pardon powers, who turned Pizarro's lieutenants by offering pardons; Gonzalo was defeated and beheaded at Jaquijahuana (April 1548)."},{year:"The Spanish bureaucrat-historian Agustín de Zárate",text:"Zárate (b. ~1492) arrived in Peru in 1543 as treasury auditor and witnessed the chaotic post-conquest civil wars. He wrote one of the key chronicles, \"Historia del descubrimiento y conquista del Perú\" (~1556) — but he could not write safely in Peru itself, fearing Gonzalo Pizarro's men. The Crown learned that conquistadors, once enriched, were as dangerous as enemies. Subsequent Spanish administration would rely on professional bureaucrats (viceroys, audiencias) rather than conqueror-governors."},{year:"How a handful of Spaniards conquered two empires (the five factors)",text:"(1) Superior military technology — steel swords/armour, harquebuses, cannons, and especially horses (terrifying to peoples who had never seen them); (2) indigenous alliances — Tlaxcalans against the Aztecs, anti-Atahualpa factions against the new emperor; (3) disease — smallpox devastated both empires before full-scale fighting (perhaps killing more than 50% of both populations within decades); (4) centralized rule — capturing the divine emperor (Moctezuma, Atahualpa) paralyzed the entire command structure; (5) religious/cultural misunderstandings the Spanish exploited — Quetzalcoatl prophecy, Aztec ritual warfare prioritizing live capture (which slowed killing of Spaniards), Felipillo's bad translation at Cajamarca. Remove any single factor and the conquests might have failed — particularly disease, which arguably killed more indigenous people than all the swords combined."}]},rc_colonial:{title:"God, Gold, and Glory (1502–1551)",events:[{year:"Connection to the Reconquest",text:"The Conquest of the Americas was a direct continuation of the Reconquest in Iberia. Centuries of warfare against the Moors had bred a warrior aristocracy (hidalgos) in Extremadura and Castile — proud of their Christian blood but landless and impoverished. When the Reconquista ended in 1492, these men found themselves with no moors left to fight at home. They turned to the New World, carrying the same trinity of motives — God, Gold, and Glory — and the same templates: the Requerimiento (a legalistic demand for surrender, used in the Americas, mirrored crusading ideology); the encomienda (mirrored Reconquista feudalism, granting rights over conquered populations); the rapid imposition of Christianity through forced conversion. As Carlos Fuentes wrote in The Buried Mirror, \"America was not discovered, it was invented.\" Cortés explicitly compared indigenous architecture to Granada (he wrote that the markets at Tenochtitlán were like Salamanca; the Aztec lattice-work at the temples reminded him of Granada). Extremadura's poverty drove its men abroad — Cortés, the Pizarros, Balboa, Valdivia (conqueror of Chile), De Soto (explorer of the US Southeast) all came from this poor frontier province."},{year:"Early 1500s",text:"The Encomienda. The encomienda became the backbone of colonial exploitation. Spanish settlers (encomenderos) were granted authority over a specific group of indigenous people, who were required to provide labour, tribute, or goods in exchange for supposed protection and Christian instruction. Legally not slavery, but in practice the distinction was often meaningless. The Laws of Burgos (1512) tried to regulate it weakly. The Mita system in the Andes went further — adapting the Inca mit'a labour tax, indigenous communities had to provide rotating shifts of workers for mines (especially the Potosí silver mines, the engine of Spanish empire), plantations, or public projects. The mita killed many — death rates at Potosí mines were notorious. Bartolomé de Las Casas estimated that 40% of indigenous workers in Hispaniola died within years of Spanish arrival."},{year:"1502–14",text:"Las Casas's conversion. Bartolomé de Las Casas (b. ~1484, Seville) accompanied Nicolás de Ovando's expedition to Hispaniola in 1502 — initially as an ordinary colonist. He participated in colonial life — receiving an encomienda, participating in the brutal \"pacification\" campaigns. He was ordained a Catholic priest in 1510, the first European ordained in the Americas. Initially he saw nothing wrong with the encomienda. He was present in Hispaniola when Dominican friar Antonio de Montesinos delivered a furious 1511 Christmas sermon denouncing colonial abuses: \"Are these Indians not men? Have they not rational souls?\" Colonists got the sermon suppressed but it planted seeds. While preparing a Pentecost sermon in Cuba (1514), Las Casas was reading Ecclesiasticus 34:18–22 (\"If one sacrifices ill-gotten goods, the offering is blemished... To take away a neighbor's living is to murder him\") and combined with what he had personally witnessed (a Spanish massacre at Caonao in Cuba, ~1513), the passage struck him with the force of revelation. He renounced his encomienda, freed his indigenous laborers, and committed to defending Native rights. He later wrote: \"I saw with my own eyes things so cruel that no kind of cruelty could equal them.\" He joined the Dominican Order in 1522 and spent the next ~50 years lobbying the Crown, traveling between New World and Spain."},{year:"1542",text:"A Short Account of the Destruction of the Indies. Las Casas's most influential work (Brevísima Relación de la destrucción de las Indias). Submitted to Crown Prince Philip (later Philip II), this short polemic documented colonial atrocities region by region — Hispaniola, Cuba, Tierra Firme, Yucatán, Guatemala — with vivid, sometimes exaggerated descriptions. He claimed ~12–15 million indigenous deaths from Spanish colonialism by 1542 (modern estimates of total long-term deaths from disease + violence range from ~50–90% population decline; the absolute numbers debated). Aimed at moving the Crown to reform."},{year:"1542–43",text:"The New Laws. Charles V, influenced by Las Casas, enacted comprehensive reform: new encomiendas were prohibited; existing ones could not be inherited (would revert to the Crown on the holder's death); indigenous slavery banned; labour burdens reduced; Crown officials sent to inspect colonial conditions. Las Casas was briefly appointed Bishop of Chiapas (1544) to enforce them, but encomenderos refused to confess to him and he had to retreat to Mexico City. He resigned the bishopric in 1547 to return to Spain and lobby the Crown directly."},{year:"1544–48",text:"Gonzalo Pizarro's revolt forces Crown retreat. The encomenderos of Peru — and outraged colonists across the Americas — could not be reformed by laws alone because they had armies. Gonzalo Pizarro killed Viceroy Blasco Núñez Vela in 1546 over the New Laws. Mexico's encomenderos lobbied furiously through the Council of the Indies. The Crown — desperate not to lose its colonies — quietly retreated: the inheritance restriction was effectively suspended (1545–46); indigenous labour continued under different names (mita, repartimiento). Las Casas had won laws but not enforcement."},{year:"1550–51",text:"The Valladolid Debate. A high-profile theoretical confrontation, ordered by Charles V to determine whether Spanish conquest of the Americas was just. In Valladolid (Spain), Las Casas debated Juan Ginés de Sepúlveda before a junta of theologians and jurists. Sepúlveda — a humanist scholar, Aristotle translator — defended just war against indigenous peoples on grounds of their \"natural slavery\" (Aristotle's category of peoples naturally suited to be ruled by superior nations) and their \"barbarism\" (cannibalism, human sacrifice, idolatry). He argued they would benefit from Spanish rule. Las Casas argued indigenous peoples were rational humans with inherent rights deserving peaceful evangelization, and that Spanish atrocities had been worse than anything indigenous societies had done. Las Casas spoke for 5 days; the debate continued in writing afterwards. The debate had no formal verdict, but Las Casas's arguments influenced subsequent Crown policy and planted seeds of what would later become modern human-rights discourse."},{year:"The Black Legend (paradoxical legacy)",text:"The Brevísima Relación was translated and published in Protestant countries (England, Netherlands, France, Germany) from the 1570s onward, exaggerated and weaponized as anti-Spanish propaganda — depicting Spaniards as uniquely cruel, fanatical Catholics. This \"Black Legend\" (Leyenda Negra) served the imperial interests of Spain's rivals (England and the Netherlands had their own colonial atrocities to deflect) and persisted into modern times. Las Casas's reformist intent had thus been turned against Spain itself."},{year:"The Church's complex role",text:"Spanish missionaries arrived alongside the conquistadors but were not always their allies. Initial friars — shaped by Cardinal Cisneros's reforms in Spain (1490s–1500s, restoring discipline and asceticism) — were unusually elite, educated, and reform-minded. Some envisioned utopian indigenous communities: Vasco de Quiroga (Bishop of Michoacán, 1538–65) tried to organize indigenous communities along the lines of Thomas More's Utopia. The Franciscan Bernardino de Sahagún (1499–1590) compiled the encyclopedic \"Florentine Codex\" (12 books in Nahuatl with Spanish translation, recording Aztec history, religion, and culture) — a unique anthropological achievement for its time. But reformist friars always clashed with encomenderos who prioritized profit. Under the patronato real, the Spanish Crown had absolute authority over colonial clergy — the Church served the state. Power rivalled royalty under the Habsburgs (1516–1700); was later curbed by the Bourbons after 1700."},{year:"Indigenous syncretism and survival",text:"As Louise Burkhart observed of the Aztecs, indigenous peoples found ways to become \"just Christians enough to get by in the colonial setting without compromising their basic ideological and moral orientation.\" They adopted Christian practices to navigate the system while preserving core beliefs. The Day of the Dead — merging Aztec rituals honouring Mictecacihuatl (the goddess of death) with Catholic All Saints' Day and All Souls' Day (1 and 2 November) — survives as living proof the conquered were never truly conquered in spirit. The 1531 apparition of the Virgin of Guadalupe to indigenous peasant Juan Diego at Tepeyac (the site of an Aztec temple to the mother-goddess Tonantzin) merged Catholic and indigenous religious traditions in ways that helped Christianity become Mexican. Las Casas is now considered a precursor to Latin American Liberation Theology — the 20th-century theological movement (Gustavo Gutiérrez and others) emphasizing Christian commitment to defending the oppressed against systemic violence. Las Casas died in Madrid in 1566, aged ~82, after ~50 years fighting for indigenous rights. The battle is still ongoing."}]}};

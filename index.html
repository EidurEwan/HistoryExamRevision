// ─── CAUSAL CHAINS — cause-and-effect sequences ───
// Schema: { id, title, topic, steps: [{ event, detail }, ...] }
// `topic` matches a key in TOPICS (coldWar | authStates | reconquest)
const CAUSAL_CHAINS=[{id:"chain_cw_origins",title:"How the Cold War Began",topic:"coldWar",steps:[{event:"Grand Alliance fractures (1942–45)",detail:"The US-UK-USSR alliance was held together only by the common enemy of Nazi Germany. The USSR had been invaded three times in the 20th century and lost ~27 million people in WWII alone — Stalin's obsession with security meant building a Soviet sphere in Eastern Europe at any cost. When Polish nationalists rose against the Germans in the 1944 Warsaw Rising, Soviet troops a few miles away deliberately stood by as the Germans crushed them — confirming Western fears that Stalin's \"liberation\" of Eastern Europe meant subjugation. By 1945 the alliance had no shared post-war vision."},{event:"Potsdam exposes the rift (Jul 1945)",detail:"Because there was no common vision, Potsdam became confrontational. Roosevelt was dead (April 1945) and Truman — with little foreign-policy experience — took a much harder line, determined never to repeat Chamberlain's \"Appeasement.\" Truman casually mentioned a \"new weapon of unusual destructive force\" but withheld details; Stalin (whose intelligence already knew about the Manhattan Project) was deeply offended by the lack of transparency. The Allies could not agree on Germany — the US wanted a strong reunited Germany for European recovery; Stalin wanted Germany kept weak so it could never invade the USSR a third time."},{event:"Long Telegram + Iron Curtain (Feb–Mar 1946)",detail:"Out of the Potsdam stalemate came the intellectual case for confrontation. George Kennan's 8,000-word telegram from the Moscow embassy argued the USSR was inherently expansionist and would only retreat when met with force. Washington was electrified — containment now had a doctrine. Weeks later Churchill at Fulton, Missouri delivered the public version: an \"iron curtain\" had descended from Stettin to Trieste. Stalin compared Churchill to Hitler, calling it a \"call to arms.\" The intellectual and rhetorical foundations of the Cold War were now in place."},{event:"Truman Doctrine forced by British collapse (Mar 1947)",detail:"Because Britain — bankrupt after the war — informed Washington in February 1947 that it could no longer afford to support Greece and Turkey against communist pressure, Truman had to step into the vacuum or watch the eastern Mediterranean fall. Greece's communist insurgency and Turkey's Soviet-pressured borders made them the test cases. Truman went to Congress: \"It must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures.\" Congress approved $400 million. Notably, neither Greece nor Turkey was a model democracy — anti-communism now trumped genuine democracy."},{event:"Marshall Plan triggers Berlin Blockade (1947–49)",detail:"The Truman Doctrine needed economic muscle. The Marshall Plan (announced June 1947, $20 billion for 17 countries) targeted the root cause of Western European communism: poverty. Country specifics: France $2.7 billion (after cracking down on communist strikes), Greece nearly $700 million (US even imported mules to replace farm animals), Italy a massive CIA campaign that defeated communists in the 1948 elections, Yugoslavia's Tito $150 million after breaking with Stalin. Stalin saw it as economic imperialism and ordered Eastern Europe to refuse, founding COMECON as a counter (which never matched Marshall's scale). When the West introduced the Deutschmark in their Berlin sectors in 1948, Stalin retaliated by blocking all land transport — but the West organized a massive airlift supplying 2 million West Berliners for nearly a year, and Stalin had to back down."},{event:"1949 — Cold War goes nuclear and global",detail:"The Berlin Blockade's failure forced the West to formalize the division: in September 1949 the FRG (West Germany) was created, in October the GDR (East Germany), and NATO was founded that April as a Western military alliance. Then two earthquakes: the USSR detonated its first atomic bomb (ending America's nuclear monopoly four years earlier than US estimates predicted) and Mao Zedong's communists won the Chinese Civil War. Acheson explained: \"The Nationalist armies did not have to be defeated; they disintegrated.\" The world's most populous nation was now communist, the USSR could match American nukes, and the Cold War had become global, militarized, and existential — setting the stage for NSC-68 and the Korean War in 1950."}]},{id:"chain_cw_korea",title:"Why Korea Redefined the Cold War",topic:"coldWar",steps:[{event:"China falls to Mao + Soviet bomb (1949)",detail:"Two events the same year shocked America: the world's most populous nation went communist, and the USSR detonated its first atomic bomb four years ahead of US estimates. Suddenly containment in Europe alone was inadequate — communism was now a global, nuclear-armed force. Domestic panic surged: Senator McCarthy claimed communists had infiltrated the State Department, Hollywood, and the army; the HUAC interrogated suspected sympathizers. Any president who looked \"soft on communism\" was politically dead."},{event:"NSC-68 redefines US strategy (April 1950)",detail:"Because Acheson and Nitze concluded after the 1949 shocks that diplomatic containment was no longer enough, NSC-68 called for tripling the US defence budget (from ~$13B to $35–50B) and a global military buildup. The document declared: USSR was \"bent on worldwide revolution and understands only strength.\" Truman initially balked at the cost — but two months later Korea would force his hand and turn NSC-68 from theory into policy."},{event:"North Korea invades (25 June 1950)",detail:"With the USSR boycotting the UN Security Council (over China's UN seat) and Stalin having green-lit Kim Il-sung's invasion plan, North Korean forces poured across the 38th parallel. The vacant Soviet seat let the US push through a UN resolution authorizing military intervention without Soviet veto. Truman saw it as the test case for global containment: \"Korea is the Greece of the Far East\" — just as $400 million had saved Greece from communism in Europe, Korea would have to be defended in Asia."},{event:"UN intervenes — first armed superpower clash (1950)",detail:"Because Truman framed the war as a UN police action rather than US war, 16 nations contributed troops under American command — making it the first UN-led military coalition and the first armed conflict between capitalist and communist forces. The war globalized the Cold War: it crossed from Europe into Asia, drew in Communist China after MacArthur pushed too close to its border, and demonstrated that the conflict would now be fought through proxy wars rather than direct US-USSR confrontation."},{event:"Three years of brutal stalemate (1950–53)",detail:"The war's enormous cost — ~2.5 million Korean civilians killed, millions of soldiers from both sides — and the inability of either side to win decisively, locked the Cold War into a permanent military posture. The 1953 armistice was never followed by a peace treaty, leaving Korea technically still at war and divided at roughly the original 38th parallel. The stalemate proved containment could \"work\" — but only at staggering cost."},{event:"Cold War now global and militarized",detail:"Korea redefined US foreign policy. The US tripled defence spending (NSC-68 fully implemented), built a global network of military bases, and founded SEATO (1954) to encircle Asian communism. As Charles \"Chip\" Bohlen put it: \"It was the Korean War and not World War Two that made us a world military-political power.\" David Reynolds called Truman's Korean decisions \"redefining the Cold War\" — from a primarily European political-economic competition into a global militarized confrontation that would last another 38 years."}]},{id:"chain_cu_missile",title:"Road to the Cuban Missile Crisis",topic:"coldWar",steps:[{event:"Decades of US dominance breed resentment (1901–58)",detail:"The Platt Amendment (1901–34) gave the US legal right to intervene in Cuban affairs and secured Guantánamo Bay; US companies (United Fruit, Esso, Texaco, Cuban Electric) controlled sugar, oil, utilities and telecom; Meyer Lansky's mob ran Havana as \"Latin Las Vegas\" with Batista's protection. As Hugh Thomas wrote, Cuban nationalism was defined as anti-Americanism. With 200,000 peasant families landless and 17% unemployment, the conditions for revolution were ripe — and Batista's brutal post-1952 dictatorship alienated every social class."},{event:"Castro's revolution (1 Jan 1959)",detail:"Because Batista's US-backed corruption had alienated nearly all classes (Source C: \"nearly all social classes backed [the revolution] either for its program or as the most effective anti-Batista force\"), the 26th of July Movement could mobilize nationwide support after years of guerrilla war from the Sierra Maestra. The 1957 US arms embargo on Batista was \"a severe psychological blow\" to his army. Batista fled 1 January 1959, Castro and Cienfuegos entered Havana — and now a communist-aligned regime sat 90 miles from Florida."},{event:"US hostility pushes Cuba toward USSR (1959–61)",detail:"Castro's nationalization of US-owned property triggered a US embargo and broken diplomatic relations. Excluded from US markets, Cuba had no alternative but to seek Soviet protection — the USSR began buying Cuban sugar at subsidized prices and supplying oil, machinery, and weapons. The CIA, meanwhile, planned an invasion using Cuban exiles."},{event:"Bay of Pigs (Apr 1961) backfires catastrophically",detail:"Kennedy inherited the CIA's invasion plan and modified it — fatally — by withdrawing the promised US air support to maintain plausible deniability. The 1,500 exiles were crushed within 72 hours. The disaster had three consequences crucial to the missile crisis: it (1) validated Castro's warnings about US imperialism and rallied the entire population behind the revolution; (2) made Kennedy look weak — particularly to Khrushchev, who began to test him; (3) pushed Cuba decisively into Soviet arms. Castro declared himself Marxist-Leninist in December 1961 — a reversal from his February 1959 denial that the revolution was communist."},{event:"Khrushchev's gamble (summer 1962)",detail:"Because Kennedy looked weak after the Bay of Pigs and Khrushchev wanted to (a) defend Cuba from invasion, (b) close the strategic missile gap with the US, and (c) match the US Jupiter missiles already deployed in Turkey, Khrushchev secretly began deploying medium-range nuclear missiles to Cuba in summer 1962. They could reach most US cities within minutes — a dramatic shift in the strategic balance."},{event:"Discovery and the 13 days (Oct 1962)",detail:"On 14 October a US U-2 spy plane photographed missile sites under construction. ExComm debated invasion vs airstrike vs blockade for six days; Kennedy chose a naval \"quarantine\" (deliberately avoiding the legal implications of \"blockade\"). For 13 days the world stood on the brink. Soviet ships sailed toward the line; a US U-2 was shot down over Cuba; Castro urged Khrushchev to launch a first strike. The deal: Soviets remove Cuba missiles, US publicly promises not to invade Cuba and SECRETLY removes Jupiter missiles from Turkey. Outcomes: the Washington-Moscow hotline (1963), Limited Test Ban Treaty (1963), Nuclear Non-Proliferation Treaty (1968), and Khrushchev's domestic humiliation — a major contributor to his removal in 1964."}]},{id:"chain_cw_berlin",title:"Why the Berlin Wall Went Up",topic:"coldWar",steps:[{event:"Two Germanys diverge after 1949",detail:"The 1949 partition created starkly unequal countries. West Germany received Marshall Aid, had a larger population, larger industrial base, and experienced an \"economic miracle\" with rising living standards. East Germany suffered forced collectivization and rapid socialization; in June 1953 East German workers rioted against poor conditions and Soviet tanks crushed the protests. The contrast — one capitalist, prosperous, free; one communist, struggling, controlled — was visible to anyone living near the inner-German border."},{event:"The brain drain becomes existential (1949–61)",detail:"Because Berlin was governed jointly and skilled workers could simply walk into West Berlin for higher pay in identical positions, by the late 1950s over 300,000 East Germans were fleeing each year — disproportionately doctors, engineers, teachers, technicians. East Germany was hemorrhaging the very people needed to make socialism work. There was a second economic problem: West Berliners crossed east to buy goods at subsidized communist prices, creating shortages for actual East Berliners."},{event:"Khrushchev's ultimatum (Nov 1958)",detail:"With East Germany's existence threatened, Khrushchev added a strategic worry: West Germany was now in NATO and equipped with US tactical nuclear weapons just 100 km from Soviet forces. Khrushchev demanded the withdrawal of Western troops and that Berlin become a demilitarized \"Free City\" within six months. He wanted to force the West to recognize the GDR's legitimacy — and stop the bleeding."},{event:"Geneva and Paris diplomacy fails (1959–60)",detail:"Because neither side would compromise — the West refused to recognize East Germany and would not abandon West Berlin (a symbol of Western credibility); the Soviets would not accept the brain drain — both the 1959 Geneva and 1960 Paris conferences ended without resolution. The Paris summit collapsed entirely after a US U-2 spy plane was shot down over the USSR. By 1961, with Kennedy looking weak after the Bay of Pigs, Khrushchev decided he could act unilaterally."},{event:"Wall built overnight (13 Aug 1961)",detail:"Khrushchev and East German leader Walter Ulbricht met in early August. On the morning of 13 August, barbed wire went up between East and West Berlin, quickly replaced by a permanent concrete wall. The decision was an admission of failure: communism could not compete with capitalism if people were free to choose. But the Wall solved East Germany's immediate crisis — the brain drain stopped overnight."},{event:"Checkpoint Charlie + tacit recognition (Oct 1961)",detail:"In October 1961 US and Soviet tanks faced off directly at Checkpoint Charlie for 16 hours — the closest direct military confrontation between the two superpowers during the entire Cold War. The standoff de-escalated when both sides quietly withdrew. Long-term: the Wall achieved Khrushchev's goal — the GDR's existence was assured, and Western powers, by tolerating the Wall, implicitly recognized East Germany. Berlin was no longer a constant pressure point. But the propaganda damage was vast — the Wall became the defining symbol of the Cold War, a permanent confession that communism trapped its citizens."}]},{id:"chain_cw_end",title:"How the Cold War Ended",topic:"coldWar",steps:[{event:"Soviet economic crisis (1970s–80s)",detail:"Under Brezhnev, ~25% of Soviet GDP went to military spending versus ~6% in the US — a structural imbalance that drained the civilian economy and starved consumer goods, technology, and infrastructure. Soviet GDP growth fell from 5% in the 1960s to under 2% by the late 1970s. Without a fix, the system could not sustain superpower competition indefinitely. The 1979 Afghanistan invasion, the war's high cost, and the OPEC oil price collapse of 1986 (the USSR's main hard-currency export) made the crisis acute."},{event:"Reagan's pressure campaign (1981–83)",detail:"Because the Soviets were strategically vulnerable, Reagan increased the pressure dramatically. Defence spending rose from $144B (1980) to $290B (1985), a 50% real increase. He called the USSR an \"evil empire,\" supported anti-Soviet insurgencies in Afghanistan and Nicaragua, and in March 1983 announced SDI (\"Star Wars\") — a proposed space-based missile defence. Whether SDI would actually work was almost irrelevant: it threatened to undermine MAD and forced the USSR into an arms race it could not afford. Historians Deudney and Ikenberry argue SDI gave the US a \"decisive technological advantage.\""},{event:"Gorbachev takes power (Mar 1985)",detail:"Because three Soviet leaders had died in three years (Brezhnev 1982, Andropov 1984, Chernenko 1985) and the system was visibly failing, the Politburo elevated Mikhail Gorbachev — a younger reformer — to General Secretary. Gorbachev recognized what his predecessors had not: the USSR could not match Reagan's spending without complete economic collapse. His response was reformist not confrontational."},{event:"Perestroika and Glasnost (1985–86)",detail:"Gorbachev launched two interlocking reforms: Perestroika (\"restructuring\") to introduce market mechanisms, decentralize planning, and reduce military burden; and Glasnost (\"openness\") to allow public scrutiny and criticism. Glasnost was a calculated gamble — Gorbachev believed transparent debate would expose inefficiency and build pressure for reform. Instead, it unleashed criticism that delegitimized the entire system. The 1986 Chernobyl disaster, initially covered up then exposed under Glasnost, accelerated the loss of public faith."},{event:"INF Treaty + arms control (Dec 1987)",detail:"Because Reagan was a far better negotiator than his hardline rhetoric suggested and Gorbachev needed urgent relief from defence spending, the two leaders met five times (1985–88) and signed the INF Treaty in December 1987 — eliminating all intermediate-range nuclear missiles (500–5,500 km) from Europe. It was the first arms control treaty to actually reduce nuclear arsenals rather than just cap their growth. Both leaders had reversed core positions: Reagan abandoned \"evil empire\" rhetoric; Gorbachev accepted intrusive on-site inspections."},{event:"Sinatra Doctrine + 1989 revolutions",detail:"In 1988 Gorbachev abandoned the Brezhnev Doctrine — the policy that the USSR would use military force to keep Eastern Europe communist. In its place came what was jokingly called the \"Sinatra Doctrine\" (after \"My Way\"): Eastern European countries could now choose their own path. Once that promise was credible, satellite states erupted. Poland's Solidarity won elections (June 1989); Hungary opened its border with Austria (May 1989), letting East Germans flee; Czechoslovakia's Velvet Revolution (November); Romania's violent overthrow of Ceaușescu (December). The Berlin Wall fell on 9 November 1989, demolished by ordinary Germans with hammers."},{event:"Soviet collapse (1991)",detail:"Gorbachev's reforms had unleashed forces he could not control. The 1990 secession of the Baltic states, an August 1991 hardliner coup attempt against Gorbachev (defeated by Yeltsin standing on a tank), and the December 1991 Belavezha Accords dissolving the USSR ended Soviet power for good. The Cold War's defining institutions — the Warsaw Pact, COMECON, the USSR itself — all dissolved. Capitalism appeared to have triumphed; international politics became uni-polar with the US as sole superpower; Cuba lost its Soviet subsidies and entered its devastating \"Special Period.\""}]},{id:"chain_mu_rise",title:"Mussolini's Path to Power",topic:"authStates",steps:[{event:"Weak Italian parliament (1871–1914)",detail:"Italy was unified on paper but politically dysfunctional. The 1848 Statuto gave the king broad powers; only ~2% of adult men could vote initially, and \"transformism\" — politicians switching alliances for office — meant 30+ governments came and went between 1871 and 1914 (a new government every 18 months on average). Voter turnout stayed around 50% even after suffrage expansion. Italians had no deep loyalty to the parliamentary system; democracy was seen as corrupt and unresponsive. This left the door open for any authoritarian \"saviour\" who could promise stability."},{event:"WWI Mutilated Victory (1915–19)",detail:"Italy entered WWI in May 1915 lured by the secret Treaty of London, which promised South Tyrol, Trieste, Istria, parts of Dalmatia, and colonies in exchange for joining the Allies. After ~600,000 Italian dead and over 1 million wounded — worse casualties relative to population than Britain or France — Versailles delivered far less than promised. Italy got South Tyrol and Trieste but Fiume and most of Dalmatia were denied (US President Wilson's principle of self-determination cut against Italian claims). The poet D'Annunzio coined \"vittoria mutilata\" (Mutilated Victory) and seized Fiume by force in 1919. The grievance discredited liberal democratic politicians as weak national betrayers — exactly the opening Mussolini exploited."},{event:"Red Biennium (1919–20)",detail:"Because the war's economic toll was catastrophic — 2 million unemployed by late 1919, prices rising 50% per year, savings wiped out, returning soldiers (many radicalized) finding no jobs — workers and peasants exploded in two \"red years.\" Over 1 million workers occupied factories in northern industrial cities (Turin, Milan, Genoa); landless peasants seized estates in the south. The PSI (Socialist Party) won 156 seats in the November 1919 elections (the largest single party). To Italy's middle class, industrialists, and landowners, it looked like the Russian Revolution had crossed the Alps. They were terrified — and they began to look for a counter-force willing to use violence."},{event:"Fascist violence + legal manoeuvres (1919–22)",detail:"Mussolini, who had broken from socialism in 1914 over WWI and founded the Fasci di Combattimento (March 1919), exploited the panic perfectly. His Blackshirt squads (squadristi) attacked socialist offices, broke strikes, beat opponents, destroyed leftist printing presses. Industrialists and landowners funded the squads precisely because they crushed worker organization. Simultaneously Mussolini played the parliamentary game — the November 1921 deal with liberal PM Giolitti's bloc gave Fascists 35 parliamentary seats. The dual strategy of legality + terror was deliberate: legality bought elite tolerance; violence kept his radical base loyal and demonstrated Fascism could \"restore order\" where the state could not."},{event:"Establishment lets him win (Oct 1922)",detail:"By autumn 1922, Mussolini commanded a paramilitary army and 35 deputies. He demanded power. About 30,000 Blackshirts converged on Rome (the \"March on Rome,\" 27–29 October 1922) — far less impressive than Fascist propaganda would later claim. King Victor Emmanuel III could have declared martial law and the army would almost certainly have crushed the march. But the king feared civil war, doubted his own position, and was advised that PM Facta could not form a stable government anyway. On 29 October he invited 39-year-old Mussolini to form a government. Mussolini took the night train, arrived in Rome the next day in a sleeping car, and only THEN had his Blackshirts march in for the propaganda photos. The \"seizure of power\" was a bluff that worked — because the king, the army, the Church and big business all decided to let it work."}]},{id:"chain_mu_dictator",title:"Mussolini Becomes Dictator",topic:"authStates",steps:[{event:"Mussolini in 1922 was PM, not dictator",detail:"His cabinet had only 4 Fascists out of 14 ministers; he relied on liberals, nationalists, and Catholic Popolari. Parliament still functioned. The king could dismiss him. He needed a way to entrench Fascist control without provoking the establishment to remove him."},{event:"Acerbo Law (1923)",detail:"Because winning a clean parliamentary majority would be hard with liberals, socialists, and Catholics splitting the vote, Mussolini engineered a rigged electoral system. The Acerbo Law (passed November 1923) gave whichever party won at least 25% of the vote a guaranteed two-thirds of parliamentary seats. He justified it as ensuring \"stable government\" after decades of weak coalitions. Liberals and Catholics supported it — partly out of fear of Fascist violence, partly out of naive belief they could control Mussolini within parliament. The April 1924 election (under Acerbo's rules and amid widespread Fascist intimidation) gave the Fascist list 64% — a manufactured supermajority."},{event:"Matteotti denounces fraud (May–Jun 1924)",detail:"Because the April 1924 election had been so brazenly rigged, socialist deputy Giacomo Matteotti — leader of the Reformist Socialist Party — gathered documented evidence and on 30 May 1924 delivered a scathing speech in parliament listing specific Fascist intimidation, fraud, and violence. He said before the speech: \"Now you may write my eulogy.\" His attack threatened to expose and discredit the entire regime — at exactly the moment Mussolini was still consolidating control."},{event:"Matteotti murdered (10 June 1924)",detail:"Eleven days after the speech, Matteotti was kidnapped in broad daylight by a five-man Fascist squad including Amerigo Dumini and bundled into a car. His body was found two months later in a shallow grave outside Rome. Public outrage was massive — for several weeks Mussolini was politically vulnerable; police seized incriminating evidence implicating high Fascist officials; the king received petitions calling for Mussolini's dismissal."},{event:"Aventine Secession backfires (Jun–Dec 1924)",detail:"Most opposition deputies — socialists, Popolari, liberals — withdrew from parliament in protest, retreating to the \"Aventine Hill\" (referencing Roman plebeians' protest of 494 BC). They hoped public outrage would force the king to act. It did not. Without an organised opposition INSIDE parliament, the king and elites were left with a stark choice: back Mussolini, or face chaos and possibly civil war or socialist revolution. They chose Mussolini. By withdrawing, the opposition had handed him a free hand."},{event:"Dictatorship declared (Jan 1925–26)",detail:"On 3 January 1925 Mussolini gave a defiant speech in parliament accepting \"political, moral, and historical\" responsibility for everything that had happened — daring his opponents to act. They didn't. Over the following 18 months Mussolini systematically dismantled parliamentary democracy: opposition parties banned (Nov 1926), free press abolished, the OVRA secret police established (1927), the Special Tribunal for State Security created, mayors replaced by appointed podestà, trade unions absorbed into Fascist syndicates, the Aventine deputies expelled. By 1926 Mussolini was responsible only to the king (in theory) and \"Il Duce\" (in fact)."}]},{id:"chain_pe_rise",title:"Perón's Rise to Power",topic:"authStates",steps:[{event:"Infamous Decade + Depression (1930–43)",detail:"Argentina's \"golden age\" ended with the 1929 Wall Street Crash. As commodity prices collapsed, beef and grain exports plunged ~70% — devastating an economy built on agricultural exports to Europe. The 1930 military coup overthrew Hipólito Yrigoyen's elected government, beginning the \"Infamous Decade\" of corrupt autocratic rule, rigged elections, and government by oligarchic agreement (the \"Concordancia\"). The 1933 Roca-Runciman Pact with Britain was widely seen as a humiliating sellout of national sovereignty for export quotas. Argentine politics rotted from within; people lost faith in democracy itself, creating fertile ground for any populist offering an alternative."},{event:"GOU military coup (4 June 1943)",detail:"Because the Infamous Decade had discredited civilian politics and WWII threatened to end Argentina's neutrality, a secret military lodge — the GOU (Grupo de Oficiales Unidos), young nationalist anti-communist ultra-Catholic officers including Colonel Juan Perón — seized power. Their stated aims: end corruption, restore the constitution, strengthen Argentine industry to reduce dependency, maintain WWII neutrality, and crucially — prevent the spread of communism by improving workers' conditions FROM ABOVE. Perón understood what most officers did not: the working class was the decisive untapped political force."},{event:"Perón at the Labour Department (1943–45)",detail:"Perón asked for and got a backwater post: Secretary of Labour and Welfare. Before him, no laws protecting workers' rights existed — to employers' total advantage. Perón changed everything in 24 months: paid vacations, severance pay, minimum wages, pensions, the 8-hour workday enforced, agricultural workers' statute (Estatuto del Peón). His genius — Source C's \"He was using them, not the reverse\" — was to make union recognition and resources flow personally through HIM, not through the unions' own institutions. Workers gained more in two years than in the previous 50, and they understood: if Perón fell, their gains went with him. This was no longer ordinary patronage; it was personal loyalty bonded by self-interest."},{event:"17 October 1945 — workers awaken",detail:"Because Perón had built such personal loyalty in the working class, and because military and industrial elites recognized he was building a power base outside their control, they had him arrested on 9 October 1945 and held him on Martín García island. Eight days later, on 17 October, a massive spontaneous demonstration of workers — the descamisados (\"shirtless ones\") — flooded into the Plaza de Mayo demanding his release. Estimates ranged from 200,000 to over 1 million. The army stood down rather than fire on workers. Perón was released that evening and addressed the crowd from the Casa Rosada balcony. Argentine working-class political consciousness had been born — and 17 October became the sacred day of Peronism."},{event:"1946 election landslide (Feb 1946)",detail:"With workers as his organized base and the Labour Party (CGT-aligned) plus dissident Radicals and military backing, Perón ran for president. The US ambassador Spruille Braden's clumsy public denunciation of Perón as a fascist allowed Perón to frame the election as \"Braden or Perón\" — turning anti-Yankee nationalism into votes. He won 52%–43%, took all national senators except two, two-thirds of the Chamber of Deputies, and every provincial governorship except Corrientes. Despite this overwhelming mandate, Perón still felt insecure — he lacked complete endorsement from all sectors of the armed forces and civilian establishment. His next move would be to consolidate this electoral victory into permanent control."}]},{id:"chain_pe_fall",title:"Perón's Fall",topic:"authStates",steps:[{event:"Economic boom turns to bust (1946–51)",detail:"Perón's first years were funded by exceptional post-WWII conditions. Wartime trade had left Argentina with ~$1.7B in foreign reserves; European reconstruction kept beef and grain prices high; the IAPI (Argentine Trade Promotion Institute) skimmed export profits to fund urban industrialization. By 1949–50, the boom ended — European recovery and Marshall Aid restored European agriculture, prices fell. Perón's nationalizations had drained reserves (railways from Britain alone cost ~$600M, paying premium prices). By 1951–52 inflation passed 30%, real wages began to fall, and a serious drought devastated agriculture."},{event:"Eva dies (26 July 1952)",detail:"Because Eva Perón had been the regime's emotional bridge to the descamisados — running the FEP (Eva Perón Foundation, by then larger than most ministries with $200M assets and 14,000 employees), personally attending the poor, embodying Peronism's moral mission — her death from cervical cancer at age 33 removed Perón's most effective connection to the working class at exactly the moment economic decline was eroding their material gains."},{event:"Perón attacks the Church (1954–55)",detail:"Because the Catholic Church had grown increasingly critical of Perón's personality cult (Eva's portrait next to the Virgin Mary, \"Peronist saints\"), and competing for influence over Catholic Action youth groups, Perón escalated against an institution that had previously tolerated him. He legalized divorce (December 1954), legalized prostitution, ended state subsidies for Catholic schools, expelled two bishops in June 1955. The Church responded by excommunicating him. He had now alienated his most powerful traditional ally — for nothing."},{event:"Repression and lost legitimacy (1949–55)",detail:"Perón had already shut La Prensa (Argentina's most prestigious newspaper) in 1951, closed 110 publications between 1943–46, purged the Supreme Court (3 justices impeached), and built a single-party Partido Justicialista with mandatory membership for civil servants. The 1949 Constitution (allowing his re-election) had been controversial; the 1951 La Prensa expropriation had embarrassed even sympathetic foreign press. By the mid-1950s authoritarianism could no longer be disguised as social reform."},{event:"Bombing of Plaza de Mayo (16 June 1955)",detail:"A naval aviation revolt attempted to assassinate Perón by bombing his Casa Rosada office while he gave a speech. About 30 navy aircraft dropped bombs and strafed the plaza for hours; ~308 killed (mostly civilians and bystanders), over 700 wounded — the worst peacetime massacre in Argentine history. Perón survived (he had left through a tunnel). Peronist mobs retaliated by burning down churches in Buenos Aires that night. The bombing showed how deep the opposition ran — including within the armed forces."},{event:"Military coup (16 September 1955)",detail:"General Eduardo Lonardi led the \"Revolución Libertadora.\" After three days of fighting, Perón resigned on 19 September and took refuge on a Paraguayan gunboat. He went into 18 years of exile (Paraguay, Venezuela, Spain). The new junta banned even mentioning his name. But by destroying his political organization rather than addressing the underlying inequality, the junta only deepened Peronism as a permanent identity for millions of workers — guaranteeing his eventual return in 1973."}]},{id:"chain_ca_revolution",title:"Castro's Revolution",topic:"authStates",steps:[{event:"Pre-1952 Cuba — semi-colonial paradox",detail:"Cuba had high per capita income but extreme inequality and was effectively a US economic dependency. The Platt Amendment (1901–34) had granted the US legal right to intervene; the Guantánamo naval base lease was permanent. US companies (United Fruit, Esso, Texaco, Cuban Electric) controlled sugar, oil, utilities, telecom; Meyer Lansky's mob ran Havana's casinos under Batista's protection. 200,000 peasant families had no land; unemployment hit 17%; sugar work was seasonal, leaving rural workers idle for months. As Hugh Thomas wrote, Cuban nationalism was inherently anti-American."},{event:"Batista coup ends democracy (10 March 1952)",detail:"Batista had been a relatively populist president (1940–44) who legalized the Communist Party. He returned to politics in 1952 — but realizing he would lose the upcoming election, he seized power in a bloodless military coup, cancelling elections. Among the candidates whose campaigns ended that day was a young lawyer named Fidel Castro. With legal politics closed, Castro turned to armed insurrection."},{event:"Moncada attack fails but creates a manifesto (26 July 1953)",detail:"Castro led 140 rebels in an attack on Cuba's second-largest barracks (Moncada in Santiago) hoping to seize weapons and trigger a national uprising. It failed catastrophically — the diversion truck got lost, surprise was lost, Batista's army responded immediately; about half the attackers were killed (many tortured to death after capture), Castro and a few others escaped to the mountains and were captured later. But Castro's defence speech at trial — \"History Will Absolve Me\" (October 1953) — laid out specific reform demands using statistics on landlessness, illiteracy, hunger, and disease. Distributed clandestinely as a pamphlet, it became the revolution's manifesto. The 26th of July Movement took its name from the failed attack."},{event:"Granma — only 12 survive (Dec 1956)",detail:"After amnesty (May 1955) and exile to Mexico, Castro recruited about 80 fighters (including his brother Raúl, the Argentine doctor Che Guevara, and Camilo Cienfuegos) for a return invasion. The yacht Granma, designed for 12 passengers, was overloaded and arrived 2 December 1956 two days late and in the wrong place — a swamp. Batista's forces ambushed them at Alegría de Pío. Of ~82 who landed, only 12 survived to regroup in the Sierra Maestra mountains. Newspapers reported Castro dead. The disaster looked like a finishing blow."},{event:"Sierra Maestra guerrilla war (1957–58)",detail:"The 12 survivors built a guerrilla force. Three factors made the rebellion succeed: (1) familiar rugged terrain ideal for guerrilla warfare; (2) ideologically motivated soldiers fighting for cause not pay; (3) Castro's deliberate humane treatment of captured enemies (publicized to demoralize Batista's troops and recruit defectors). New York Times reporter Herbert Matthews's February 1957 interview with Castro in the Sierra electrified Cuban opinion — proving Castro was alive and resisting. Cross-class urban resistance (the 26th of July Movement's underground cells, especially in Santiago) bombed power stations, sabotaged railways, and assassinated police informants."},{event:"US arms embargo + army collapse (1957–58)",detail:"The 14 March 1958 US arms embargo on Batista was, in his own words, \"a severe psychological blow.\" Even his American backers had lost confidence. As Source C noted, \"nearly all social classes backed [the revolution]\" by 1958, either for its program or as the most effective anti-Batista force. Batista's army, demoralized and corrupt, suffered defeats throughout 1958. On New Year's Eve 1958, Batista fled to the Dominican Republic with stolen millions. Castro reached Havana on 8 January 1959."}]},{id:"chain_ca_communism",title:"Cuba Becomes Communist",topic:"authStates",steps:[{event:"Castro initially denies communism (Feb 1959)",detail:"In February 1959 Castro explicitly told Cuban TV: \"the thinking of the movement is not communist thinking.\" The new government included liberals and moderates as well as 26th of July veterans. The revolution was framed as nationalist, anti-imperialist, and reformist — NOT as communist. This may have been strategic concealment, or genuine ideological flexibility, or both. Either way, it bought time and political space."},{event:"Agrarian Reform alienates US property holders (May 1959)",detail:"The Agrarian Reform Law limited landholdings, expropriated estates over 1,000 acres (mostly US-owned sugar plantations) with compensation in 20-year bonds at 4.5% interest based on TAX-VALUE assessments (which owners had under-reported for tax purposes). US sugar interests furious. By 1960, US firms had lost an estimated $1B in property. Eisenhower retaliated by suspending the Cuban sugar quota (July 1960) — a devastating blow since 56% of Cuba's sugar exports had gone to the US."},{event:"USSR steps into the vacuum (1960)",detail:"Because Cuba had to sell its sugar somewhere or starve, the USSR offered to buy 5 million tons over 5 years at world prices, plus $100M in credits. Soviet oil began flowing in (after US oil refineries refused to process it, Castro nationalized them). This in turn pushed the US toward a full embargo (October 1960) and broken diplomatic relations (January 1961). Each step on each side made the next step inevitable."},{event:"Bay of Pigs (April 1961) — humiliating US defeat",detail:"Eisenhower had approved a CIA invasion plan; Kennedy inherited and modified it. About 1,500 trained Cuban exiles landed at Playa Girón on 17 April 1961. The plan depended on (a) US air cover, which Kennedy withdrew to maintain plausible deniability; (b) a popular uprising against Castro, which never materialized. Castro's forces (with intelligence from Cuban infiltrators in the exile groups) crushed the landing in 72 hours. Result: ~118 exiles killed, ~1,200 captured. Three crucial consequences: validated Castro's warnings about US imperialism (rallying the population behind the revolution), made Kennedy look weak (encouraging Khrushchev to test him in Berlin and then Cuba), and pushed Cuba decisively into Soviet arms."},{event:"Communism declared (Dec 1961)",detail:"On 2 December 1961, Castro publicly proclaimed himself a Marxist-Leninist and announced Cuba's intention to build socialism. The reasons converged: (1) US hostility (embargo, Bay of Pigs, ongoing CIA Operation Mongoose) made Soviet protection essential; (2) Soviet aid required ideological alignment; (3) liberals and moderates had been pushed out of government — the PSP (Communist Party), with administrative experience and USSR ties, filled the vacuum; (4) Che Guevara and other committed Marxists pushed radicalization; (5) Marxism-Leninism justified one-party rule, useful for consolidating Castro's personal control; (6) the Bay of Pigs victory had emboldened him — there was no longer any reason to maintain ideological ambiguity."},{event:"PCC and Soviet integration (1962–65)",detail:"In 1962 Castro merged the 26th of July Movement, the PSP, and the Revolutionary Directorate into the ORI (Integrated Revolutionary Organisations); in 1965 this became the PCC (Cuban Communist Party) — the only legal party. The October 1962 Cuban Missile Crisis (Soviets removed missiles WITHOUT consulting Castro — bitter humiliation) showed Cuba was a bargaining chip, but the US \"no invasion\" pledge secured the regime. Soviet subsidies (worth ~$5B/year by the 1980s) sustained Cuba for nearly three decades — until the 1991 collapse triggered the Special Period."}]},{id:"chain_rc_711",title:"The Easy Conquest of 711",topic:"reconquest",steps:[{event:"Visigothic Spain politically broken",detail:"Since the Visigoths arrived in Iberia (5th century AD) the kingship had been elective, not hereditary — meaning every royal succession risked civil war between rival noble factions. By the late 7th century the Goths had also alienated key minorities: the Jews (forcibly converted under King Sisebut, 612–620) and the Hispano-Roman peasantry (heavily taxed). When King Wittiza died in 710, the throne was disputed: nobles elected Roderick, but Wittiza's family contested. The Visigothic state was fragile precisely when an external threat appeared."},{event:"Roderick distracted by Basque rebellion in the north",detail:"Because the kingdom's northern frontier was unstable, Roderick took the bulk of his army north in summer 711 to suppress a Basque rebellion. This left the southern coast almost undefended at the worst possible moment. The Visigothic crisis-management system was overwhelmed."},{event:"Tariq lands at Gibraltar (April 711)",detail:"Tariq ibn Ziyad, a Berber commander serving the Umayyad governor of North Africa Musa ibn Nusayr, crossed the Strait of Gibraltar with ~7,000 men, mostly Berber troops (the rock would be named after him: \"Jabal Tariq\" = Tariq's mountain → Gibraltar). Initially this was likely planned as a raid, not a full conquest. Roderick learned of the landing and force-marched south."},{event:"Local collaboration enables the advance",detail:"Because Visigothic rule had alienated key groups, the Muslim invaders found unexpected allies. Jews, persecuted under the Goths, often welcomed the Muslims and were reportedly given charge of captured cities while Muslim armies advanced. Disaffected Hispano-Roman peasants saw little to defend in a Gothic kingdom that had taxed them heavily. Wittiza's family allegedly defected at the decisive battle. Without local cooperation, 7,000 Berbers could not have controlled territory — the conquest worked because much of the population accepted or welcomed the new rulers."},{event:"Battle of Guadalete (July 711)",detail:"At the Guadalete river (or possibly Lake La Janda — sources are unclear), Roderick met the Muslim army with what may have been a numerically superior force (estimates 20,000–40,000 Visigoths against Tariq's ~7,000–12,000 Muslims, though numbers in early sources are unreliable). According to chronicles, Wittiza's allies among the Visigothic nobles defected at a critical moment. Roderick was defeated and likely killed (his fate is unclear; later legend has him drowning in the river). The Visigothic state collapsed with him — there was no effective national authority left."},{event:"Almost the whole peninsula taken in a few years (711–718)",detail:"With the Visigothic central authority destroyed, Muslim forces reinforced from Africa rapidly took city after city. Toledo (the Visigothic capital) fell 712. By 714 most of the peninsula was under Muslim control. Resistance survived only in the rugged north — the kingdom of Asturias under Pelayo (Battle of Covadonga, ~722, the symbolic start of the Reconquest). The conquest's speed reflected Visigothic weakness rather than overwhelming Muslim military strength — confirmed by the SLOWNESS of the parallel Muslim conquest of North Africa (which had taken decades against Berber resistance and Byzantine garrisons)."}]},{id:"chain_rc_fall_islam",title:"How Muslim Spain Was Lost",topic:"reconquest",steps:[{event:"Umayyad Caliphate of Córdoba breaks into taifas (1031)",detail:"For 250 years al-Andalus had been ruled from Córdoba — first as an emirate (756–929), then a caliphate (929–1031) under rulers like Abd ar-Rahman III and al-Hakam II, who turned Córdoba into the largest, wealthiest, and most learned city in Western Europe. But after dictator Almanzor's death (1002) and a destructive civil war (fitna, 1009–31), the caliphate dissolved into ~30 competing taifa kingdoms — Seville, Toledo, Zaragoza, Valencia, Badajoz, etc. Individually, each was militarily weak. Christian kingdoms in the north could now play them off against each other and demand tribute (parias)."},{event:"Almoravids and Almohads slow but cannot stop Christian advance (1086, 1147)",detail:"When Toledo fell to Castile (1085), the panicking taifas invited Berber Almoravid warriors from North Africa. The Almoravids defeated Alfonso VI at Sagrajas (1086) and unified al-Andalus — but as religious puritans they were unpopular with sophisticated Andalusi Muslims. By the 1140s Almoravid power collapsed; the Almohads (another North African Berber dynasty) replaced them. Both temporarily restored Muslim military strength, but neither could prevent long-term territorial loss. Internal rebellions in 1144–45 shattered any remaining unity."},{event:"Battle of Las Navas de Tolosa (16 July 1212)",detail:"A coalition of Christian kingdoms — Castile (Alfonso VIII), Aragon, Navarre, plus knights from across Europe under a papal crusade indulgence — decisively defeated Almohad forces at Las Navas de Tolosa (Sierra Morena, central Iberia). Estimates: ~70,000 Christians vs ~125,000 Muslims (numbers unreliable but Christian victory uncontested). Almohad military power was permanently broken. Soon after, Córdoba fell (1236) and Seville (1248) to Castile under Ferdinand III. The Reconquest accelerated dramatically."},{event:"Granada survives as Castile's tributary (1232–1492)",detail:"By 1252 the Nasrid Kingdom of Granada was the only remaining sovereign Muslim state. Muhammad I, founder of the Nasrid dynasty, secured his position in 1232 by agreeing to become a tributary vassal of Castile under Ferdinand III — paying tribute (mostly in gold), offering military support when called, recognizing Castilian suzerainty. This made Granada a useful buffer state. Castilian kings often preferred the steady tribute revenue over the cost and casualties of conquest. Internal noble revolts and succession crises in Castile repeatedly delayed any final aggression. Granada also exploited Christian rivalries — in 1406, Granada even supplied troops for a JOINT operation with Castile against the Marinids in North Africa."},{event:"Ottoman capture of Constantinople (29 May 1453)",detail:"Sultan Mehmed II's conquest of Constantinople ended the Eastern Roman Empire and shocked Christendom. Two consequences for Spain: (1) it sharpened Christian–Muslim identities, providing political cover for crusading rhetoric; (2) the Ottomans now controlled key trade routes to Asia, motivating European powers (especially Spain after 1492) to seek alternative routes — Columbus's voyage 39 years later was a direct response. Granada's strategic and economic importance was simultaneously fading because Portugal had opened direct sea routes to Sub-Saharan Africa in the 1450s–60s, bypassing North African Muslim middlemen entirely."},{event:"Ferdinand and Isabella unite Castile and Aragon (1469)",detail:"Their dynastic marriage created a unified Christian force that Granada could not balance. Isabella inherited Castile (1474) after a civil war against the supporters of her niece \"La Beltraneja\"; Ferdinand inherited Aragon (1479). Together they commanded the resources of nearly all Iberia. They reorganized royal finances, broke down feudal autonomy, founded the Spanish Inquisition (1478), and turned attention south. The 1481 Granada War began when Granada refused to pay tribute."},{event:"Boabdil's civil war within Granada (1482–92)",detail:"Internal betrayal proved fatal. Muhammad XII (Boabdil) rebelled against his father Abu'l-Hasan Ali in 1482, plunging Granada into civil war between father, son, and uncle (al-Zaghal). Boabdil was captured by Castile (1483) and released as a Castilian client — splitting Granada's already inadequate forces in three. Ferdinand exploited this masterfully, systematically reducing the kingdom: Alhama (1482), Ronda (1485), Loja (1486), Málaga (1487, with massacre of defenders), then encircling Granada itself. The 7-month siege of Granada (1491–92) ended with negotiated surrender on 25 November 1491; Boabdil formally handed the keys of the city to Ferdinand on 2 January 1492. His mother allegedly told him: \"You should weep like a woman for the land you could not defend like a man.\""},{event:"1492 — three world-changing events",detail:"The fall of Granada (2 January) ended 781 years of Muslim presence in Iberia. The Edict of Expulsion of the Jews (31 March) ordered all unbaptized Jews out of Spain by 31 July. Columbus reached the Americas (12 October), opening the Americas to Spanish colonization. The three events were deeply connected: the Reconquista freed resources for overseas conquest; religious zeal drove the expulsions and became the engine of colonization; the empire was born \"half-crippled\" by the loss of Jewish economic and intellectual capital, and would now build a NEW empire that re-applied the Reconquista's templates of conquest, conversion, and exclusion to the New World."}]},{id:"chain_rc_expulsion",title:"The Expulsions",topic:"reconquest",steps:[{event:"Spanish Inquisition founded (1478)",detail:"Ferdinand and Isabella obtained papal authorization (Sixtus IV's bull \"Exigit sincerae devotionis affectus\") to establish a Spanish Inquisition under royal control. Its initial target: conversos — Jews who had converted to Christianity (often under earlier pressure or violence, especially after 1391 anti-Jewish riots) but were suspected of secretly continuing Jewish practices. The 1480 first auto-da-fé in Seville executed several conversos. The ideology of \"limpieza de sangre\" (purity of blood) demanded a Spain genuinely cleansed of non-Christian elements — even baptized descendants of Jews and Muslims faced ongoing suspicion. Tomás de Torquemada, appointed Grand Inquisitor 1483, intensified persecution."},{event:"Fall of Granada (Jan 1492) creates pressure to act on remaining minorities",detail:"With Muslim political power eliminated for the first time in 781 years, the religious unification of the peninsula could finally be completed. The Catholic Monarchs were now free to act against the Jewish community without strategic constraints. The momentum of conquest fed directly into the momentum of expulsion."},{event:"Edict of Expulsion of the Jews (31 March 1492)",detail:"Issued from the Alhambra Palace just 3 months after Granada's fall. The text accused Jews of enticing Christians back to Judaism — \"instructing them in ceremonies, performing circumcisions, providing prayer books, telling them there is no other law or truth.\" Previous more limited measures (banishing from Andalusia 1483) had failed. Jews had until 31 July to convert or leave. ~150,000–300,000 Jews left (estimates vary widely); many went to North Africa, the Ottoman Empire (Sultan Bayezid II reportedly said: \"You call Ferdinand a wise king — he who has impoverished his country to enrich mine?\"), Portugal (where they were expelled 1497), the Netherlands. Spain lost a community that had dominated medicine, finance, tax administration, and trade for centuries — Carlos Fuentes wrote the empire was born \"half-crippled.\""},{event:"Treaty of Granada promises Muslims religious tolerance (1491)",detail:"The Capitulations of Granada, signed November 1491 between Boabdil and the Catholic Monarchs to secure peaceful surrender, promised Muslims preservation of their mosques, religious institutions, language, laws, and customs. Boabdil and his followers received an estate in the Alpujarras mountains. For about 8 years, this promise was largely kept. Then it broke."},{event:"Cisneros's mass conversions and book-burnings (1499)",detail:"Cardinal Francisco Jiménez de Cisneros — Isabella's confessor and Archbishop of Toledo — was sent to Granada in 1499 with sweeping authority. Frustrated by slow voluntary conversion, he organized mass forced baptisms, declared Muslim books heretical, and ordered the burning of over 5,000 priceless Arabic manuscripts in Granada's main square — an irreplaceable cultural catastrophe (centuries of philosophy, science, medicine destroyed). When one of his agents was assassinated, he had a pretext: the assassination was treated as breaking the Treaty's terms."},{event:"First Alpujarras Rebellion (1499–1500)",detail:"Outraged Muslims rose against the broken treaty. Royal forces crushed the rebellion. The Crown declared the Treaty of Granada void: now Muslims faced a stark choice — exile or baptism. Most accepted forced baptism rather than abandon their lands; they became \"Moriscos\" (the converted Muslim community). The same choice was extended to Castile in 1502 and to Aragon in 1525."},{event:"Second Alpujarras Rebellion (1567–71)",detail:"Philip II issued an edict (Jan 1567) banning Arabic language, Islamic religious practice, traditional Muslim dress, traditional names, and cultural customs — attempting to erase Moorish identity entirely from Spain. Moriscos who outwardly conformed to Christianity but secretly maintained festivals and rituals were now criminalized for cultural identity even after religious compliance. The Granada Moriscos rose in revolt in 1568. The crown's response was savage: Don John of Austria (Philip's half-brother) led the suppression — at Galera (October 1569), he razed the town entirely, sprinkled salt over the ruins, slaughtered 2,500 including 400 women and children. After the rebellion, ~80,000 Moriscos were forcibly relocated from Granada to other parts of Castile (1570), breaking up the cohesive community."},{event:"Morisco Expulsion (1609)",detail:"Philip III's decree of 4 April 1609 ordered the expulsion of all remaining Moriscos. Beginning October 1609, ~300,000 were expelled over the next several years, mostly to North Africa where they were often viewed with suspicion as Christianized Muslims. Aragon (Valencia, particularly) lost up to 1/3 of its agricultural workforce — vineyards and irrigation systems collapsed; the Aragonese economy never fully recovered. Spain had now achieved \"limpieza\" — a religiously homogeneous Christian state — at the cost of having driven out two of its most economically productive minorities, the consequences of which would reverberate through Spain's relative decline against England and the Netherlands over the following century."}]},{id:"chain_rc_mexico",title:"How Cortés Conquered the Aztecs",topic:"reconquest",steps:[{event:"Aztec empire built on subjugation, not loyalty",detail:"The Mexica (Aztecs) had risen from migrant outsiders to imperial rulers in just ~200 years (founding Tenochtitlán in 1325; reaching imperial peak under Moctezuma II by 1502). Their empire was not a unified state but a hegemony — they extracted tribute and human sacrifices from subject peoples through \"flower wars\" (xochiyaoyotl) — ritualized but real conflicts whose primary purpose was capturing victims. The system was so resented by subject peoples (Tlaxcalans, Cempoalans, Totonacs) that when an outside threat offered alliance, they were ready to switch sides."},{event:"First Spanish expeditions confirm Mexico's wealth (1517–18)",detail:"Hernández de Córdoba's 1517 expedition reached the Yucatán; he was killed by Maya resistance, but his survivors brought back gold artifacts. Grijalva's 1518 follow-up explored the eastern coast, traded with Moctezuma's emissaries (who were monitoring the strangers), and confirmed reports of a vast wealthy empire inland. These reports made the mainland irresistible to Spanish adventurers."},{event:"Cortés defies orders (Feb 1519)",detail:"Hernán Cortés had permission from Cuban governor Diego Velázquez to explore and trade — but EXPLICITLY not to colonize. (Cortés's appointment had been engineered by Velázquez's accountant Amador de Lares and merchant Andrés de Duero, who had taken a financial stake in the expedition.) When Velázquez tried to revoke the appointment days before departure, Cortés sailed early (10 February 1519) with 11 ships, ~500 men, 16 horses, 32 crossbows, 13 arquebuses, and 14 small cannons. Once in Mexico, Cortés's only path to legal legitimacy was to conquer enough wealth to buy royal forgiveness directly from Charles V — bypassing Velázquez. Returning to Cuba empty-handed meant prison or death."},{event:"The Quetzalcoatl prophecy gives Cortés a fortunate myth",detail:"Aztec religious tradition held that the feathered-serpent god Quetzalcoatl had been driven into exile and would return in a calendar year One-Reed (Ce Acatl) to reclaim his rule, described as a fair-skinned, bearded figure arriving from the east. By coincidence, 1519 was a One-Reed year. Whether Moctezuma genuinely believed Cortés was Quetzalcoatl is debated (some sources have him initially uncertain but later concluding Cortés was not divine). What matters is the psychological hesitation it caused — Moctezuma, when he could have crushed the small Spanish force, instead sent gifts and dithered. The hesitation was fatal."},{event:"Malintzin (La Malinche) — translation as power",detail:"When Cortés landed at Tabasco (March 1519), local Maya offered him 20 enslaved women including a young woman named Malinalli (later baptized Marina, called Malintzin or La Malinche). She spoke Nahuatl (the Aztec language) and Mayan; combined with the Spaniard Jerónimo de Aguilar (who had been shipwrecked among the Maya in 1511 and spoke Mayan and Spanish), the chain Spanish→Aguilar→Mayan→Malintzin→Nahuatl gave Cortés communication with the Aztec world. She quickly learned Spanish too, becoming Cortés's chief interpreter, advisor, and lover (their son Martín was one of the first mestizos). Without her, Cortés could not have negotiated alliances or understood Aztec politics. She remains one of the most controversial figures in Mexican history — both traitor and survivor."},{event:"Tlaxcalan alliance (Sept 1519)",detail:"The Tlaxcalan confederacy had been an Aztec rival for ~100 years, surrounded but unconquered. After initial battles in which Tlaxcalan warriors fought the Spanish to a draw and impressed each other, the Tlaxcalans concluded the Spaniards were the better immediate option against their hated Aztec enemies. They provided the crucial military manpower — eventually thousands of indigenous warriors fighting alongside Cortés's few hundred Spaniards. Cortés could never have conquered alone."},{event:"Cholula massacre (Oct 1519) — terror as strategy",detail:"On the road to Tenochtitlán, Cortés stopped at Cholula (a Toltec religious center loyal to the Aztecs). Warned by Malintzin of an alleged ambush plan, Cortés ordered a preemptive massacre — killing thousands of unarmed Cholulans in the city's main square. The terror sent a message to all of Mexico: the Spaniards were not bound by ritual warfare's restraints. Some historians see Cholula as Cortés's most coldly strategic act."},{event:"Entry into Tenochtitlán (8 Nov 1519)",detail:"Cortés entered the Aztec capital — one of the world's largest cities (~250,000 people, larger than any city in Spain) — by invitation. Moctezuma greeted him on the Iztapalapa Causeway. For ~7 months Spanish forces were guests in Tenochtitlán. Cortés took Moctezuma hostage in his own palace (mid-November), ruling Tenochtitlán through him while sending shipments of gold to Charles V."},{event:"Noche Triste (30 June 1520) — temporary disaster",detail:"While Cortés was on the coast confronting a punitive expedition sent by Velázquez (which Cortés bribed to defect to him), his lieutenant Pedro de Alvarado massacred ~600 Aztec nobles during a religious festival at the Templo Mayor. The Aztecs revolted. Cortés returned, brought Moctezuma to a balcony to calm the crowd; Moctezuma was killed (sources disagree — Cortés says by his own people's stones; Bernal Díaz says one stone struck him fatally; some indigenous accounts blame the Spanish). The Spanish had to flee on the night of 30 June–1 July 1520 across the Tacuba Causeway. ~600 Spaniards drowned under the weight of stolen gold. Cortés survived; the situation looked like total defeat."},{event:"Smallpox arrives (1520) — disease changes everything",detail:"A Spanish soldier with smallpox (probably brought from Cuba) infected the Aztec population, which had no acquired immunity. The disease swept through Mexico, killing perhaps 1/3 of the population in the first year — including the new emperor Cuitláhuac (who had organized the resistance). Smallpox arguably killed more Aztecs than the Spanish swords ever could."},{event:"Siege and fall of Tenochtitlán (May–Aug 1521)",detail:"Cortés rebuilt his force with Tlaxcalan reinforcements (eventually ~150,000 indigenous warriors) and constructed 13 brigantines (small ships) on Lake Texcoco to control the water. The siege began 22 May 1521. The Aztecs, weakened by smallpox and starvation, fought desperately for 75 days. Tenochtitlán fell on 13 August 1521 — Cuauhtémoc, the last emperor, was captured trying to escape by canoe. He was tortured (his feet burned) to reveal the location of hidden treasure, kept alive as a puppet for years, and finally executed in 1525. The Aztec Empire was over; Spanish Mexico (New Spain) had begun."}]},{id:"chain_rc_peru",title:"How Pizarro Conquered the Incas",topic:"reconquest",steps:[{event:"Inca Empire at its imperial peak (1438–1525)",detail:"Tawantinsuyu (\"Four Quarters\") was the largest pre-Columbian empire — over 25,000 miles of roads, suspension bridges, terraced agriculture, an administrative system without writing (using quipu knotted-string records), without money (relying on labour tax — mit'a), without slavery as Europeans understood it. The Sapa Inca was a divine ruler descended from the sun god Inti. At its peak under Huayna Capac (~1493–1525), it stretched from southern Colombia to central Chile."},{event:"Smallpox kills Huayna Capac (~1525) — disease arrives before the Spanish",detail:"A smallpox epidemic — brought by earlier European contact in Central America and spread through indigenous trade networks — reached the Inca Empire around 1525, BEFORE any Spaniard arrived in Peru. Emperor Huayna Capac and his designated heir died. The empire was suddenly without a clear leader; estimates suggest the disease killed up to half the population in some regions. The strongest pre-conquest blow had already fallen."},{event:"Inca civil war (Atahualpa vs Huáscar, 1529–32)",detail:"Two of Huayna Capac's sons claimed the throne: Huáscar in the south (with Cuzco's traditional power base) and Atahualpa in the north (Quito, with the loyalty of the army that had been campaigning there). The civil war was bitter and devastating — armies marched across the empire, towns were sacked. Atahualpa won decisively at the battle of Quipaipan (April 1532), capturing Huáscar. The empire was reunified — but exhausted, divided in loyalty, and depleted in manpower at the worst possible moment."},{event:"Pizarro lands and exploits the timing (Apr 1532)",detail:"Francisco Pizarro had been preparing this expedition for nearly a decade. Born ~1471 in Trujillo (Extremadura), illiterate, he had served under Balboa in Panama. After two reconnaissance voyages (1524, 1526–28) he had returned to Spain (1529) and obtained royal authorization (the Capitulación de Toledo, with Charles V) to conquer Peru. He landed at Tumbes with 168 men (62 horse, 106 foot) — a tiny force compared to Cortés's. But unlike Cortés, Pizarro arrived as a divided empire was just emerging from civil war."},{event:"Cajamarca ambush (16 Nov 1532)",detail:"Pizarro had marched inland to the highland town of Cajamarca where Atahualpa was camped with ~80,000 troops, having just won the civil war. Pizarro requested a meeting in the town's plaza. Atahualpa came, in great dignity, with several thousand mostly unarmed retainers — having dismissed the small Spanish force as no threat. The Dominican friar Vicente de Valverde delivered the Requerimiento (a legalistic Spanish demand to accept Christianity and Spanish rule). The interpreter Felipillo translated badly — La Vega's chronicle says the translation distorted Valverde's speech. Atahualpa, presented with a Bible, examined and discarded it. Valverde signaled Pizarro to attack. Spanish cannons, harquebuses, steel swords, and cavalry charging into the unarmed crowd massacred thousands within minutes. Atahualpa was captured alive — a hostage worth more than dead."},{event:"Atahualpa's ransom and execution (1532–33)",detail:"Atahualpa offered an extraordinary ransom for his release: filling a room ~22 ft × 17 ft × 8 ft once with gold and twice with silver — ultimately ~13,000 lbs of 22-carat gold and ~26,000 lbs of silver delivered, worth ~$300M+ in modern equivalent. Pizarro took the ransom, then on 26 July 1533 had Atahualpa executed by garrote (after Atahualpa accepted last-rites baptism to avoid being burned alive). The pretext: alleged conspiracy to rebel. Sources broadly agree on strangulation, though details vary."},{event:"Capture of Cuzco (Nov 1533) and puppet rule",detail:"Pizarro marched on Cuzco, the Inca capital, taking it without serious resistance — many Incas saw the Spanish as liberators from Atahualpa's victorious northern faction. Pizarro installed Manco Inca (Huáscar's brother) as a puppet emperor."},{event:"Manco's rebellion (1536) — the Spanish nearly lose",detail:"Manco escaped Spanish control and led a massive insurrection. He besieged Cuzco for ~10 months (May 1536–March 1537), nearly starving out the Spanish defenders. Lima was besieged simultaneously. With reinforcements arriving and Inca armies unable to maintain a long siege (Inca soldiers were also farmers needing to return for harvest), the Spanish broke out and crushed the rebellion. Manco retreated to Vilcabamba, founding a small \"neo-Inca state\" that would survive until 1572."},{event:"Pizarro–Almagro feud (1538–41)",detail:"The conquistadors then turned on each other. Pizarro and his junior partner Diego de Almagro had quarreled over the division of spoils since the start. After Almagro's failed Chilean expedition (1535–37), open war erupted over control of Cuzco. At the Battle of Las Salinas (1538), Pizarro's forces defeated Almagro; Almagro was strangled. His embittered son and supporters (\"knights of the cape\") assassinated Francisco Pizarro in his Lima palace on 26 June 1541."},{event:"Gonzalo Pizarro's revolt against the New Laws (1544–48)",detail:"When Las Casas's New Laws (1542–43) restricted the encomienda (banned indigenous slavery, prevented inheritance of encomiendas), the Peruvian encomenderos revolted against the Crown. Gonzalo Pizarro (Francisco's half-brother) led the rebellion, killed the new viceroy Blasco Núñez Vela at the Battle of Iñaquito (1546), and briefly ruled Peru. Charles V sent Pedro de la Gasca, a priest with sweeping powers, who turned Pizarro's lieutenants by offering pardons; Gonzalo was defeated and beheaded at Jaquijahuana (April 1548). The Crown had reasserted authority — but only by learning that conquistadors, once enriched, were as dangerous as enemies. Subsequent Spanish administration would rely on professional bureaucrats (viceroys, audiencias) rather than conqueror-governors."}]},{id:"chain_rc_lascasas",title:"From Encomendero to Reformer",topic:"reconquest",steps:[{event:"Las Casas arrives in Hispaniola (1502) — an ordinary colonist",detail:"Bartolomé de Las Casas was born in Seville ~1484 and accompanied Nicolás de Ovando's expedition to Hispaniola in 1502. He participated in colonial life — receiving an encomienda (a grant of indigenous tributaries), participating in the brutal pacification campaigns. He was ordained a Catholic priest in 1510 — the first European ordained in the Americas. Initially he saw nothing wrong with the encomienda system. He moved to Cuba in 1512, again as encomendero."},{event:"Antonio de Montesinos sermon (Dec 1511) plants the seed",detail:"Las Casas was present in Hispaniola when Dominican friar Antonio de Montesinos delivered a furious 1511 Christmas sermon denouncing colonial abuses: \"Are these Indians not men? Have they not rational souls?\" The sermon outraged colonists (who got it suppressed) but planted seeds of doubt. Montesinos's protest also led directly to the Laws of Burgos (1512), the first attempt to regulate Spanish treatment of indigenous peoples — though weakly enforced."},{event:"Las Casas's conversion (1514)",detail:"While preparing a Pentecost sermon in Cuba, Las Casas was reading Ecclesiasticus 34: \"If one sacrifices ill-gotten goods, the offering is blemished... To take away a neighbor's living is to murder him; to deprive an employee of wages is to shed blood.\" Combined with what he had personally witnessed (a Spanish massacre at Caonao in Cuba, ~1513), the passage struck him with the force of revelation. He renounced his encomienda, freed his indigenous laborers, and committed to defending Native rights. He later wrote: \"I saw with my own eyes things so cruel that no kind of cruelty could equal them.\""},{event:"Becomes a Dominican friar (1522)",detail:"After joining the Dominicans (~1522), Las Casas had institutional backing — the Dominican Order in Spain was sympathetic to indigenous rights. He spent decades traveling between the New World and Spain, lobbying the Crown, drafting reform proposals, and writing voluminously (his unpublished \"History of the Indies\" was a major source)."},{event:"A Short Account of the Destruction of the Indies (Brevísima Relación, 1542)",detail:"Written and submitted to Crown Prince Philip (later Philip II), this short polemic documented colonial atrocities region by region — the destruction of Hispaniola, Cuba, Tierra Firme, Yucatán, Guatemala — with vivid, sometimes exaggerated descriptions of cruelty. It listed staggering casualty figures (eg, ~20 million indigenous deaths to 1542 — modern estimates are smaller but still catastrophic). Aimed at moving the Crown to reform."},{event:"The New Laws (1542–43)",detail:"Charles V, influenced by Las Casas, enacted comprehensive reform: new encomiendas were prohibited, existing ones could not be inherited (would revert to the Crown on the holder's death), indigenous slavery banned, labour burdens reduced, Crown officials to inspect colonial conditions. Las Casas was briefly appointed Bishop of Chiapas (1544) to enforce them — but encomenderos refused to confess to him, and he had to retreat to Mexico."},{event:"Gonzalo Pizarro's revolt (1544–48) forces Crown retreat",detail:"The encomenderos of Peru — and similarly outraged colonists across the Americas — could not be reformed by laws alone because they had armies. Gonzalo Pizarro killed the viceroy in Peru (1546) over the New Laws. Mexico's encomenderos lobbied furiously through the Council of the Indies. The Crown — desperate not to lose its colonies — quietly retreated: the inheritance restriction was effectively suspended (1545–46); indigenous labour continued under different names. Las Casas had won laws but not enforcement."},{event:"The Valladolid Debate (1550–51)",detail:"The high-profile theoretical confrontation. In Valladolid, Spain, Las Casas debated Juan Ginés de Sepúlveda before a junta of theologians and jurists. Sepúlveda (citing Aristotle's \"natural slavery\" arguments) defended just war against indigenous peoples on grounds of their \"barbarism\" — practices like human sacrifice — and argued they would benefit from Spanish rule. Las Casas argued indigenous peoples were rational humans with inherent rights deserving peaceful evangelization, and that Spanish atrocities had been worse than anything indigenous societies had done. The debate had no formal verdict but Las Casas's arguments influenced subsequent Crown policy and planted seeds of modern human-rights discourse."},{event:"The Black Legend (paradoxical legacy)",detail:"The Brevísima Relación was translated and published in Protestant countries (England, Netherlands, France, Germany) from the 1570s onward, exaggerated and weaponized as anti-Spanish propaganda — depicting Spaniards as uniquely cruel barbaric Catholics. This \"Black Legend\" (Leyenda Negra) served the imperial interests of Spain's rivals and persisted into modern times. Las Casas's reformist intent was thus turned against Spain itself."},{event:"Liberation Theology (20th-century legacy)",detail:"In the 20th century, Latin American liberation theologians (Gustavo Gutiérrez and others) cited Las Casas as their direct precursor — a Christian commitment to defending the poor and oppressed against systemic violence. Las Casas died in Madrid in 1566, having spent ~50 years fighting for indigenous rights. He was sometimes called \"Defender of the Indians\" — and his battle is still ongoing."}]}];

const SRS_INTERVALS=[
  2*60*1000,5*60*1000,15*60*1000,60*60*1000,4*3600000,12*3600000,
  86400000,3*86400000,7*86400000,14*86400000,30*86400000
];
const SRS_LABELS=['2m','5m','15m','1h','4h','12h','1d','3d','1w','2w','1mo'];

function formatCountdown(ms){
  if(ms<=0)return'now';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24);
  if(d>0)return`${d}d ${h%24}h`;if(h>0)return`${h}h ${m%60}m`;if(m>0)return`${m}m ${s%60}s`;return`${s}s`;
}

// ─── STATS STORE — subtopic SRS ───
function createStatsStore(){
  const KEY='ib_history_sl_stats_v3';
  let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
  if(!data.attempts)data.attempts=[];if(!data.srs)data.srs={};
  if(!data.totalSessions)data.totalSessions=0;if(!data.firstOpened)data.firstOpened=Date.now();
  data.totalSessions++;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  let _pt=null;
  const saveAndSync=()=>{save();if(CloudSync.isConfigured()){clearTimeout(_pt);_pt=setTimeout(()=>CloudSync.push(data),2000)}};
  save();
  return{
    record(cat,mode,score,total,detail){data.attempts.push({cat,mode,score,total,detail,ts:Date.now()});saveAndSync()},
    updateSubtopicSrs(catId,score,total){
      const ratio=score/Math.max(total,1);
      let c=data.srs[catId]||{level:0,next:0,streak:0,lastReview:0,totalReviews:0};
      c.lastReview=Date.now();c.totalReviews++;
      if(ratio>=0.6){c.streak++;c.level=Math.min(c.level+1,SRS_INTERVALS.length-1)}
      else{c.streak=0;c.level=Math.max(0,c.level-2)}
      c.next=Date.now()+SRS_INTERVALS[c.level];
      data.srs[catId]=c;saveAndSync();
    },
    getSrs(catId){return data.srs[catId]||null},
    getAllSrs(){return data.srs},
    getDueCats(){const now=Date.now();return Object.entries(data.srs).filter(([,v])=>v.next<=now).map(([k])=>k)},
    getSubtopicProf(catId){
      const a=data.attempts.filter(x=>x.cat===catId);if(!a.length)return 0;
      return Math.round(a.slice(-5).reduce((s,x)=>s+x.score/x.total,0)/Math.min(a.length,5)*100);
    },
    getGrade(catId){
      const p=this.getSubtopicProf(catId);
      if(p>=90)return{g:'A',c:'var(--green)',l:'Excellent'};if(p>=75)return{g:'B',c:'#86efac',l:'Strong'};
      if(p>=60)return{g:'C',c:'var(--accent2)',l:'Okay'};if(p>=40)return{g:'D',c:'var(--orange)',l:'Needs Work'};
      if(p>0)return{g:'E',c:'var(--red)',l:'Weak'};return{g:'—',c:'var(--text3)',l:'New'};
    },
    proficiency(){
      const cats=Object.keys(CATEGORIES);
      const sc=cats.map(c=>{const a=data.attempts.filter(x=>x.cat===c);return a.length?a.reduce((s,x)=>s+x.score/x.total,0)/a.length:0});
      const acc=sc.reduce((s,v)=>s+v,0)/cats.length;
      const cov=cats.filter(c=>data.attempts.some(x=>x.cat===c)).length/cats.length;
      const rec=data.attempts.slice(-10),old=data.attempts.slice(-20,-10);
      const rA=rec.length?rec.reduce((s,x)=>s+x.score/x.total,0)/rec.length:0;
      const oA=old.length?old.reduce((s,x)=>s+x.score/x.total,0)/old.length:rA;
      return Math.round((acc*.45+cov*.25+(.5+.5*(rA-oA))*.15+Math.min(1,data.attempts.length/30)*.15)*100)
    },
    getAttempts(){return data.attempts},getByCat(c){return data.attempts.filter(x=>x.cat===c)},getByMode(m){return data.attempts.filter(x=>x.mode===m)},
    reset(){data.attempts=[];data.srs={};data.totalSessions=1;data.firstOpened=Date.now();saveAndSync();try{sessionStorage.setItem('ib_history_just_reset','1')}catch(e){}},
    exportData(){return JSON.stringify(data,null,2)},
    importData(json){try{const p=JSON.parse(json);if(!p.attempts&&!p.srs)throw new Error('Invalid');data.attempts=p.attempts||[];data.srs=p.srs||{};data.totalSessions=p.totalSessions||1;data.firstOpened=p.firstOpened||Date.now();saveAndSync();return{success:true,cards:Object.keys(data.srs).length,attempts:data.attempts.length}}catch(e){return{success:false,error:e.message}}},
    async pullFromCloud(){const r=await CloudSync.pull();if(!r.ok)return r;if(!r.data||r.empty)return{ok:true,msg:'No cloud data'};const cl=r.data,lA=data.attempts.length,cA=(cl.attempts||[]).length;if(cA>lA||(cA===lA&&Object.keys(cl.srs||{}).length>Object.keys(data.srs).length)){data.attempts=cl.attempts||[];data.srs=cl.srs||{};data.totalSessions=Math.max(data.totalSessions,cl.totalSessions||0);data.firstOpened=Math.min(data.firstOpened,cl.firstOpened||Date.now());save();return{ok:true,msg:`Pulled ${cA} rounds from cloud`,replaced:true}}return{ok:true,msg:`Local is newer.`,replaced:false}},
    async pushToCloud(){return await CloudSync.push(data)},
    get data(){return data}
  }
}

const StatsContext=createContext();const MobileContext=createContext(false);const SessionContext=createContext({reviewed:0,add:()=>{}});

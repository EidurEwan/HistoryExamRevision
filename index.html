spect. The Inquisition investigated conversos' sincerity; wealth was often seized under heresy accusations. This went beyond religion into racial thinking, foreshadowing later European racial theories. Religious minorities could never truly be accepted.",cat:"rc_expulsions"},{id:"rc43",q:"What did Bettany Hughes reveal about the Moorish legacy?",a:"In her documentary \"When the Moors Ruled Europe,\" Hughes argued the Moorish period \"has been systematically written out of history.\" Portraying the Moors as foreign invaders rather than acknowledging their deep influence on Spanish culture was done to solidify a Christian identity. After the fall of Granada, around 300,000 Muslims were expelled and approximately 1 million books were burned. The image of Moors as \"barbaric, savage, uncivilized and dirty aliens\" has persisted since the Crusades — despite overwhelming evidence of their cultural and scientific sophistication.",cat:"rc_expulsions"},{id:"rc127",q:"What did the Edict of Expulsion (Alhambra Decree) say?",a:"Issued by Ferdinand and Isabella from the Alhambra on 31 March 1492. Gave Spanish Jews until 31 July 1492 to convert to Christianity or leave Spain forever — taking no gold, silver, or coined money out. ~80,000–200,000 left (estimates vary widely); ~50,000–100,000 converted (becoming conversos). Officially blamed Jewish \"subversion\" of conversos through \"instruction in their religion.\" Tomás de Torquemada (Inquisitor General) had pushed for the decree. Officially revoked only in 1968.",cat:"rc_expulsions"},{id:"rc128",q:"Where did the expelled Jews go and what became of them?",a:"Refugees scattered to: Portugal (~120,000 admitted, then forcibly converted in 1497); North Africa (Morocco, Algeria); Italy (Rome, Naples, Venice); the Ottoman Empire — Sultan Bayezid II reportedly mocked Ferdinand for \"impoverishing his country and enriching ours.\" Salonika (Thessaloniki) became the largest Jewish city in the world. The Sephardim (from Hebrew Sefarad, \"Spain\") preserved Judeo-Spanish (Ladino) into the 20th century. Spain lost concentrations of skilled physicians, financiers, scholars, and translators — a brain drain Fuentes called \"half-crippling.\"",cat:"rc_expulsions"},{id:"rc129",q:"Why did the Inquisition target conversos?",a:"Conversos (also called \"marranos\" or \"New Christians\") were Jews who had converted, mostly during the violent pogroms of 1391 and the disputation of Tortosa (1413–14). By the 1470s many held high office (royal advisers, bishops, even some inquisitors). Inquisition rhetoric accused them of \"judaising\" — secretly practising Judaism. Real motives mixed: religious paranoia, popular envy of converso wealth, the Crown's interest in confiscated property (an estimated ~50% of Inquisition revenues from confiscation funded its expansion). Estimates: ~2,000 conversos burned 1480–1530 in Castile alone.",cat:"rc_expulsions"},{id:"rc130",q:"How did Cisneros provoke the 1499 Granada revolt?",a:"Cardinal Cisneros, dissatisfied with the slow pace of voluntary conversion under the Treaty of Granada, arrived in Granada in 1499. He launched mass forced baptisms (~3,000 converts in one day in the Albaicín), burned ~5,000 Arabic books and Qur'ans in public squares, and imprisoned dissenters. The Albaicín revolted in December 1499; the revolt spread to the Alpujarras mountains. Cisneros and Ferdinand used the revolt to declare the Treaty of Granada null — Muslims must convert or leave. Most converted (becoming Moriscos); ~200,000 Muslims left.",cat:"rc_expulsions"},{id:"rc131",q:"What was the 1502 decree?",a:"Ferdinand and Isabella issued a decree on 12 February 1502 ordering all unconverted Muslims in Castile (mostly Mudéjars who had lived under Christian rule for centuries) to convert or leave. Conditions for departure were so onerous (no children under 14, no gold, only certain ports allowed) that most ~300,000 Castilian Muslims chose conversion — becoming Moriscos. Aragon's Muslims were not affected until 1525 (Charles V), but the principle was set: Spain would have no openly Muslim population.",cat:"rc_expulsions"},{id:"rc132",q:"Who were the Moriscos and how were they treated 1502–1609?",a:"Moriscos were Muslims (and their descendants) forcibly converted to Christianity after 1499–1525. Estimates: ~325,000 in 1600, concentrated in Aragon, Valencia, and Granada. Officially Christian, in practice many maintained Islamic practices secretly. Treated as religious and ethnic suspects: forbidden Arabic books and dress (1567 decree); their children sometimes removed for Christian upbringing. The 1568 Pragmatica banned Arabic, Moorish dress, and traditional baths in Granada. Resented as \"fake Christians\" while denied real assimilation.",cat:"rc_expulsions"},{id:"rc133",q:"What was the Second Rebellion of the Alpujarras?",a:"A Morisco uprising against the 1567 Pragmatica banning Moorish culture. Led by Aben Humeya (a Morisco descendant of Umayyad caliphs), broke out Christmas Eve 1568 in the Alpujarras mountains south of Granada. Nearly 200,000 Moriscos joined; rebellion lasted three years. Crown forces under Don John of Austria (illegitimate brother of Philip II) crushed it brutally — ~80,000 Moriscos killed or sold into slavery. The remaining Granadan Moriscos were dispersed across Castile to break their concentration — failing to integrate them, only spreading suspicion.",cat:"rc_expulsions"},{id:"rc134",q:"How was the 1609 expulsion organised and what was the impact?",a:"King Philip III's decree (April 1609) ordered ~300,000 Moriscos expelled in stages 1609–14: starting with Valencia (~117,000), then Andalusia, Castile, and Aragon. Galleys ferried them to North Africa where many were robbed or killed by Berbers; ~30% perished. Economic impact was severe in Valencia and Aragon: agriculture (sugar, rice, irrigation networks) collapsed; some Aragonese estates lost ~70% of their tenants. The Duke of Lerma (Philip III's favourite) personally profited from confiscated Morisco property. Driven by elite religious fanaticism rather than popular demand — and arguably the single most damaging act of Spanish economic history.",cat:"rc_expulsions"},{id:"rc135",q:"What were the demographic costs of the expulsions?",a:"1492 Jewish expulsion: ~80,000–200,000 leave; ~50,000–100,000 convert. 1499–1502 Granada/Castile: ~200,000 Muslims leave; ~300,000 convert. 1525 Aragon: ~50,000 forcibly converted. 1609–14 Morisco expulsion: ~300,000 expelled. Cumulative loss: ~600,000–800,000 people from a peninsular population of perhaps 8 million — i.e. up to 10% of the population, concentrated in skilled trades, agriculture, and finance. Spain's 17th-century population declined while England, France, and the Netherlands grew — partly the legacy of expulsions.",cat:"rc_expulsions"},{id:"rc136",q:"How have historians explained the persecution of Jews?",a:"TRADITIONAL CATHOLIC: religious unity required for political unity. ECONOMIC (Américo Castro): Jewish economic dominance bred resentment that the Crown exploited. RACIAL/PROTO-RACIST (Yitzhak Baer, Benzion Netanyahu): limpieza de sangre invented \"blood\" as religious category — a precursor of modern racism. Netanyahu controversially argued most \"judaising\" conversos were already sincere Christians; the Inquisition manufactured the heresy it claimed to fight. RECENT (David Nirenberg, Henry Kamen): emphasises broader European antisemitic context — Spain was extreme but not unique.",cat:"rc_expulsions"},{id:"rc137",q:"How did Cervantes engage with the Morisco issue in Don Quixote?",a:"Cervantes, who had been an Algerian captive (1575–80), portrayed the Morisco Ricote in Don Quixote Part II (1615) sympathetically — a Morisco who returns secretly to Spain after expulsion, lamenting his attachment to his homeland. Cervantes formally praised the expulsion (politically necessary in 1615) but his fiction conveyed pathos. The Quixote's chapters are among the most direct contemporary literary responses to expulsion — and a window into Spanish discomfort with what the Crown had done.",cat:"rc_expulsions"},{id:"rc138",q:"When and how was the Edict of Expulsion revoked?",a:"The 1492 Alhambra Decree had no expiry; legally Jews were still forbidden in Spain. Some returned during the 18th–19th centuries de facto. Franco's regime gave refuge to ~40,000 Jews fleeing Nazi Europe (controversial Spanish role). In December 1968, with the Catholic Church's Vatican II reforms (Nostra Aetate, 1965), Spain formally revoked the 1492 decree. In 2015 Spain offered citizenship to descendants of expelled Sephardim — over 130,000 applied by 2019. A reckoning with 500-year-old wounds, late but real.",cat:"rc_expulsions"},{id:"rc44",q:"Who was Hernán Cortés?",a:"Born in Extremadura (Spain's poorest region). Enrolled at Salamanca's law faculty aged 14 — his legal training proved as important as military skill: every letter to Charles V was a carefully crafted legal argument. Had permission from Governor Velázquez to explore and trade — but NOT colonize. After defying Velázquez, returning empty-handed meant death. His plan: conquer Mexico fast and secure Charles V's backing to outweigh Velázquez's grievances.",cat:"rc_mexico"},{id:"rc45",q:"How did Cortés use his legal training to legitimize his conquest?",a:"Cortés enrolled at Salamanca law faculty at age 14. His legal training proved as important as his military skill: every letter to Charles V was a carefully crafted legal argument for why his unauthorized conquest should be legitimized. He had permission from Velázquez to explore and trade but NOT to colonize. His partners Amador de Lares (Velázquez's accountant) and merchant Andrés de Duero helped secure his appointment through money and influence.",cat:"rc_mexico"},{id:"rc46",q:"Why did Velázquez allow Cortés to command his fleet?",a:"Amador de Lares (Velázquez's contador/accountant) and the merchant Andrés de Duero entered into a partnership with Cortés and used their money and influence to bring about his appointment. So Velázquez's own people — for their own profit — helped install the man who would defy him.",cat:"rc_mexico"},{id:"rc47",q:"What were the expeditions before Cortés?",a:"HERNÁNDEZ DE CÓRDOBA (1517) led the first Spanish expedition to the Yucatán coast. He discovered the riches of mainland Mexico but was mortally wounded in fierce Maya resistance. GRIJALVA led a follow-up expedition, discovering Cozumel and trading with locals who reported the Aztec Empire's vast wealth through Moctezuma's emissaries. These expeditions confirmed that the mainland held far greater riches than the Caribbean islands — setting the stage for Cortés's unauthorized expedition.",cat:"rc_mexico"},{id:"rc48",q:"What was the Prophecy of Quetzalcoatl?",a:"The feathered serpent god was prophesied to return in a specific calendar year to reclaim his rule. 1519 — when Cortés arrived — corresponded to that year. The prophecy described a fair-skinned, bearded figure from the east, matching Cortés. Whether Moctezuma truly believed Cortés was Quetzalcoatl is debated, but the psychological impact of myth meeting reality was devastating for the Aztec response.",cat:"rc_mexico"},{id:"rc49",q:"What were the Aztec origins?",a:"According to Aztec tradition, they migrated from Chicomoztoc (\"Place of Seven Caves\") and Aztlan (possibly meaning \"Place of Herons\" — the origin of the name \"Aztec\"). After a long migration, they founded Tenochtitlán in 1325 on an island in Lake Texcoco, where they saw their prophesied sign: an eagle perched on a cactus devouring a serpent. This image remains on Mexico's flag today. From this humble island beginning, the Aztecs built one of the largest empires in the Americas within 200 years.",cat:"rc_mexico"},{id:"rc50",q:"Describe Tenochtitlán.",a:"One of the world's greatest cities in 1519. Built on a salt lake, 250,000+ inhabitants. Cortés described wide streets — half land, half canals. Marketplace comparable to Salamanca: 60,000 daily traders in sections for gold, silver, feathers, vegetables, pottery. Items sold by number and size, not weight. 40 towers (some taller than Seville's cathedral). Chapultepec aqueduct for fresh water. Bernal Díaz: the soldiers wondered \"whether what we saw was real.\"",cat:"rc_mexico"},{id:"rc51",q:"What advantage did Tenochtitlán's design give the Aztecs?",a:"The design — built on a salt lake with the city half on land and half on canals — allowed the inhabitants to remove the bridges connecting it to the mainland, potentially starving the Spanish to death if needed. This is exactly what happened during the Noche Triste (1520) when the Aztecs cut off Spanish escape routes. The water-based defenses turned out to be more powerful than Cortés had appreciated.",cat:"rc_mexico"},{id:"rc52",q:"Who was Malintzin (La Malinche)?",a:"One of 20 enslaved women given to Cortés after a Tabasco battle (1519). Fluent in Nahuatl and Mayan — became Cortés's interpreter, advisor, and key to all communication with the Aztecs and potential allies. Without her, he couldn't have negotiated with Moctezuma's emissaries or recruited the Tlaxcalans. Most controversial figure in Mexican history — seen as both traitor and survivor.",cat:"rc_mexico"},{id:"rc53",q:"Why did the Tlaxcalans ally with Cortés?",a:"The Aztecs maintained perpetual \"flower wars\" with the Tlaxcalans — ritual conflicts providing human sacrifices. This was \"so hateful\" that when Cortés arrived, the Tlaxcalans became his most loyal allies. They provided the crucial military manpower that made the siege of Tenochtitlán possible — Cortés's few hundred Spaniards could never have conquered the empire alone.",cat:"rc_mexico"},{id:"rc54",q:"How did Cortés greet Moctezuma?",a:"Cortés attempted to embrace Moctezuma but was stopped by the lords. He then placed a necklace of pearls and cut glass around Moctezuma's neck. Moctezuma offered necklaces of red snails' shells with golden shrimp figures. Cortés noted the inferiority (in his view) of the Aztec gifts compared to his own pearls and glass. These exchanges reveal the collision of two diplomatic traditions — and Cortés's bias.",cat:"rc_mexico"},{id:"rc55",q:"What Aztec omens foretold the Spanish arrival?",a:"According to The Broken Spears and indigenous codices: a pillar of fire appeared in the sky; the Temple of Huitzilopochtli was struck by lightning (interpreted as their protective deity abandoning them); Lake Texcoco boiled spontaneously; a woman's voice wailed through the night \"My children, we must flee!\"; and monstrous beings appeared. Whether these omens were recorded before or after the conquest is debated, but they shaped how the Aztecs understood their defeat as divinely ordained.",cat:"rc_mexico"},{id:"rc56",q:"What was the Night of Sorrows?",a:"1520: after the Spanish massacred Aztec nobles during a festival, a revolt drove Cortés out via the Tacuba Causeway. Many Spaniards drowned under the weight of stolen gold. Moctezuma died — Cortés says killed by arrows and stones from his own people; Díaz says a single stone strike killed him. The Aztecs' ritualistic warfare — prioritizing live capture over killing — prevented them from destroying the Spanish when they had the chance.",cat:"rc_mexico"},{id:"rc57",q:"How did Moctezuma die — and how do the sources disagree?",a:"Cortés claimed Moctezuma was on the roof to speak to his people; the Mexicans shot arrows and stones, wounding him gravely; Cortés tried to protect him but Mexicans killed him with a sword; he died unexpectedly after refusing food. Bernal Díaz says he died from a single stone thrown by the Mexicans, NOT a sword. Footnote #89 in the Cortés letters acknowledges these two versions. Cortés may have wanted to deflect blame for the death.",cat:"rc_mexico"},{id:"rc58",q:"How did Tenochtitlán fall?",a:"Cortés returned in 1521 with Tlaxcalan allies and laid siege to the city. After months of brutal fighting, disease (smallpox had devastated the defenders), and starvation, the city fell on August 13, 1521. The Broken Spears — a collection of indigenous accounts using surviving codices — records these events from the perspective of the conquered, preserving what the conquerors' accounts leave out.",cat:"rc_mexico"},{id:"rc59",q:"What is The Broken Spears and why is it important?",a:"A compilation of indigenous accounts of the Conquest from the conquered perspective, drawn from surviving codices (most were burned by conquistadors and churchmen — only ~40 survive). It records omens, the meeting with Cortés, the massacre, the siege, and the fall — preserving what Spanish accounts leave out. Equal in historical value to Cortés's letters and Bernal Díaz's memoir as a source for the Conquest.",cat:"rc_mexico"},{id:"rc60",q:"How reliable are the different sources on the Conquest of Mexico?",a:"CORTÉS'S LETTERS — self-aggrandizing and strategic, aimed at impressing Charles V; every detail chosen to justify his unauthorized conquest. BERNAL DÍAZ DEL CASTILLO — a common soldier whose memoir is more raw and detailed; considered more reliable because he had less motive to distort for political reasons. THE BROKEN SPEARS — indigenous accounts compiled from surviving codices, providing the conquered perspective. All three are valuable but biased in different ways.",cat:"rc_mexico"},{id:"rc61",q:"What was Cortés's plan after defying Velázquez?",a:"To quickly conquer Mexico and secure Charles V's backing, using wealth and territory to outweigh Velázquez's grievances. His options were narrow; pushing forward was the only path that aligned with his ambition and survival. Returning to Cuba empty-handed was not an option — Velázquez's wrath and his men's expectations made failure a death sentence.",cat:"rc_mexico"},{id:"rc62",q:"How did the Crown treat the conquistadors?",a:"Initially: rewarded with encomiendas and governorships (Cortés: Governor of New Spain; Pizarro: Governor of Peru) and noble titles. Then: curbed their autonomy through the Council of the Indies (1524) and viceroys, fearing they'd become rival powers. Many rank-and-file received little. The Crown learned conquistadors were as dangerous as enemies — professional administrators replaced them.",cat:"rc_mexico"},{id:"rc139",q:"Why did Cortés scuttle his ships at Veracruz?",a:"After landing in April 1519 at Veracruz, Cortés sank or scuttled most of his 11 ships, leaving only one as a messenger to Spain. He told his men they could not retreat — only victory or death lay ahead. Practical: prevented mutiny and return to Velázquez. Strategic: turned a small force (~500 Spaniards, 16 horses, 10 cannon) into a committed army. The act became legendary as the moment Cortés transformed expedition into conquest.",cat:"rc_mexico"},{id:"rc140",q:"Why did Cortés found Veracruz and what did it achieve legally?",a:"Cortés founded the town of \"Villa Rica de la Vera Cruz\" on the Mexican coast, then had the new town council elect him \"Captain General.\" This sleight of hand reset his legal authority: he was no longer Velázquez's subordinate but the elected leader of an autonomous Spanish town reporting directly to King Charles V. His First Letter to the king justified his independence on this fiction. Showed Cortés's mastery of Spanish municipal law as a weapon.",cat:"rc_mexico"},{id:"rc141",q:"How decisive was smallpox?",a:"Brought to Mexico in April 1520 by an enslaved African in the Narváez expedition. Aztecs had no immunity. The first epidemic (Sept–Dec 1520) killed an estimated 25–50% of the central Mexican population — including Emperor Cuitláhuac, Moctezuma's successor, in December 1520. While Cortés regrouped at Tlaxcala after the Noche Triste, smallpox killed his enemies for him. The chronicler Toribio Motolinía wrote that in some districts only 1 in 5 survived. Without smallpox, the siege of Tenochtitlán (May–Aug 1521) might have failed.",cat:"rc_mexico"},{id:"rc142",q:"How was Tenochtitlán actually conquered?",a:"After the Noche Triste retreat (June 1520), Cortés rebuilt his force at Tlaxcala. He commissioned 13 brigantines (small warships) constructed in pieces inland and carried overland for 80 km to Lake Texcoco. The siege began in May 1521 with ~700 Spaniards and ~75,000 Tlaxcalan and other allied warriors against ~200,000 Aztecs. Brigantines blockaded the city; Spaniards systematically demolished houses to fill canals and create a flat killing field. Cuauhtémoc was captured 13 August 1521. Tenochtitlán was a smoking ruin — Spanish allies plundered, raped, and massacred for days.",cat:"rc_mexico"},{id:"rc143",q:"What was the structure of Aztec power before Cortés?",a:"The \"Aztec Empire\" was actually the Triple Alliance of three city-states: Mexica-Tenochtitlán (dominant), Texcoco, and Tlacopan, formed 1428. They controlled a tribute empire of perhaps 5–6 million people across central Mexico through fear, tribute, and human-sacrifice demands rather than direct rule. Subject peoples (Totonacs, Cholulans, and especially the unconquered Tlaxcalans) hated Aztec rule. Cortés's genius was identifying this structural weakness — many of his \"indigenous allies\" against the Aztecs were really subjects in revolt.",cat:"rc_mexico"},{id:"rc144",q:"What was the Cholula massacre?",a:"At Cholula in October 1519, en route to Tenochtitlán, Cortés gathered the city's nobles in the temple courtyard and — alleging an Aztec-ordered ambush — slaughtered 3,000–6,000 unarmed nobles in a few hours. Cortés justified it as pre-emptive defence; Bernal Díaz says la Malinche warned of the plot; Las Casas later denounced it as deliberate terror. Cholula was a sacred city; news of the massacre broke resistance ahead of his march. Either a defensive necessity or a calculated atrocity — historians disagree.",cat:"rc_mexico"},{id:"rc145",q:"How decisive was European technology?",a:"Useful but not always decisive. Steel swords, pikes, and crossbows clearly outperformed Aztec obsidian-edged macuahuitl in close combat. Horses (16 in Cortés's force) provided shock and mobility. Cannon (10 in 1519) and harquebuses caused panic but were unreliable, slow to reload, and easily overwhelmed. Aztec defensive padded armour was effective against bullets at range. Mass production of Tlaxcalan-style obsidian arrows eventually broke Spanish phalanxes (the Noche Triste killed ~870 Spaniards). The real Spanish edge was political-strategic: alliance, disease, brigantines, siege engineering.",cat:"rc_mexico"},{id:"rc146",q:"What replaced Aztec rule?",a:"The Viceroyalty of New Spain, formally established 1535 with Antonio de Mendoza as the first viceroy. Tenochtitlán was rebuilt as Mexico City on top of the Aztec ruins. The traza (Spanish quarter) replaced the central precinct; indigenous areas (the parcialidades) ringed it. Indigenous nobility kept some power but were progressively marginalised. By 1600 New Spain produced ~80% of the world's silver and was the most valuable possession of the Spanish crown.",cat:"rc_mexico"},{id:"rc147",q:"How did encomiendas function in early Mexico?",a:"Cortés distributed the first encomiendas after 1521, granting Spanish veterans (encomenderos) labour and tribute rights over indigenous communities. By 1525 ~500 encomenderos held grants over ~6 million indigenous people. In theory, encomenderos provided protection and Christian instruction; in practice, forced labour, often deadly. Cortés gave himself the largest grant — 23,000 vassals across 22 towns. The encomienda was the first colonial institution and the seed of three centuries of inequality.",cat:"rc_mexico"},{id:"rc148",q:"How bad were Spanish losses in the Noche Triste?",a:"Night of 30 June – 1 July 1520. After Moctezuma's death, Cortés tried to evacuate Tenochtitlán via the Tlacopan causeway in heavy rain. Aztec warriors attacked from canoes and broken bridges. Roughly 600 Spaniards (out of ~1,300) and 4,000 Tlaxcalan allies died. Many drowned weighed down by the Aztec gold they refused to drop. Most cannons, horses, and gunpowder were lost. Cortés reportedly wept on the \"Noche Triste\" tree the next day. The defeat made the conquest an open question for over a year.",cat:"rc_mexico"},{id:"rc149",q:"What is the Codex Mendoza and why does it matter?",a:"An indigenous-painted manuscript commissioned around 1541 by Viceroy Antonio de Mendoza for the Spanish Crown — captured by French pirates and now in Oxford's Bodleian Library. 71 painted folios depict pre-conquest Aztec history, tribute, and daily life with Spanish glosses. A primary source for the Aztec tribute empire — listing rulers, conquered provinces, and the goods (cocoa beans, feathers, gold dust, jaguar pelts) demanded. Demonstrates how Spaniards relied on indigenous knowledge to administer their conquests.",cat:"rc_mexico"},{id:"rc150",q:"What is the Florentine Codex?",a:"The \"General History of the Things of New Spain\" — a 12-volume bilingual (Nahuatl and Spanish) ethnography compiled by Franciscan friar Bernardino de Sahagún with indigenous co-authors at the College of Santa Cruz de Tlatelolco between ~1545 and 1590. The most important source for pre-conquest Aztec religion, medicine, language, and the Conquest itself (Book XII). Repressed by Philip II in 1577 (suspected of preserving paganism); rediscovered in Florence's Laurentian Library. The Conquest narrative differs sharply from Cortés — and humanises the conquered.",cat:"rc_mexico"},{id:"rc151",q:"What happened to the last Aztec emperor?",a:"Cuauhtémoc became Tenochtitlán's last ruler in mid-1521 after Cuitláhuac died of smallpox. Defended the city to the end; captured by brigantine on Lake Texcoco on 13 August 1521 trying to escape with his family. Cortés tortured him by burning his feet, demanding the location of supposed hidden gold. Kept alive as a puppet ruler for years. Hanged by Cortés in 1525 during an expedition to Honduras on charges of plotting rebellion. Modern Mexico made Cuauhtémoc a national hero — his statue dominates Mexico City's Reforma avenue.",cat:"rc_mexico"},{id:"rc152",q:"How catastrophic was the demographic collapse in Mexico?",a:"Pre-conquest central Mexico population estimates range from ~6 to ~25 million (Cook & Borah's high estimate). By 1568 ~3 million; by 1605 ~1 million. Whatever the starting point, ~80–95% of the indigenous population died within 100 years. Causes: smallpox (1520), measles (1531), plague/typhus/cocoliztli (1545–48 — possibly indigenous haemorrhagic fever, killing perhaps 5–15 million), influenza, salmonella, and brutal labour conditions. Whole languages disappeared. The deadliest demographic event in human history.",cat:"rc_mexico"},{id:"rc153",q:"How have historians interpreted the Conquest of Mexico?",a:"TRADITIONAL (Prescott, 1843): heroic Spanish achievement, Aztecs as cruel sacrificers redeemed by Christianity. INDIGENISTA (early 20th-century Mexican): the Conquest as catastrophe — celebrated indigenous resistance. NEW CULTURAL (Inga Clendinnen, James Lockhart): Aztec rationality, Spanish-indigenous misunderstanding, the conquest as misread on both sides. MATERIALIST (Charles Mann, Jared Diamond): disease, ecology, and Eurasian disease pool determined outcomes. POSTCOLONIAL (Matthew Restall, \"Seven Myths of the Spanish Conquest\" 2003): debunks heroic narrative — emphasises indigenous allies, female agency, and gradual rather than instant conquest.",cat:"rc_mexico"},{id:"rc63",q:"Who was Francisco Pizarro?",a:"Ambitious, illiterate soldier of fortune from Extremadura (Spain's poorest region). Unlike law-educated Cortés, he couldn't sign his own name. His Cajamarca force included 51-76 literate men (30-45%) with notaries handling administration. Unequal reward distribution strained his partnership with Diego de Almagro. The image: gritty, wealth-obsessed opportunists — skilled but brutal — led by an uneducated commander whose poor alliances led to civil war among the conquerors themselves.",cat:"rc_peru"},{id:"rc64",q:"Who was Diego de Almagro?",a:"An adventurer with obscure origins, Pizarro's partner in the conquest of Peru. Bold collaborator who became resentful of Pizarro's perceived slights — Pizarro distributed rewards unequally. Their feud over control of Cusco erupted into open war. Almagro was defeated and strangled in 1538; his embittered supporters (\"knights of the cape\") assassinated Pizarro in 1541.",cat:"rc_peru"},{id:"rc65",q:"What was the Inca civilization like?",a:"Largest pre-Columbian empire — Tawantinsuyu (\"Four Quarters\"), Ecuador to Chile. 25,000+ miles of roads, suspension bridges. No writing: quipus (knotted strings) for records. No money: labour tax. No slavery as Europeans knew it. Mastered high-altitude farming: terraced fields, irrigation. Sapa Inca: divine ruler, descendant of sun god Inti, absolute power. Worship of Inti, Viracocha, Pachamama. Rituals (rare human sacrifice) reinforced the Sapa Inca's divine status. Army of tens of thousands — but slings, clubs, bronze weapons were fatally outmatched by Spanish steel.",cat:"rc_peru"},{id:"rc66",q:"How did the situation in Peru favour the advancement of the Spaniards?",a:"Two catastrophes before Pizarro arrived: (1) Smallpox — brought by earlier European contact — swept through the population, killing Emperor Huayna Capac himself. (2) Devastating civil war between his sons: Atahualpa (north) vs Huáscar (south). Divided loyalties, depleted resources, fragmented empire. Pizarro's timing was as important as his technology.",cat:"rc_peru"},{id:"rc67",q:"Who were the sons of Huayna Capac and what was happening in Peru when the Spaniards arrived?",a:"Peru was in chaos from a civil war between Huayna Capac's sons after his death and a smallpox epidemic that weakened the Inca Empire. Atahualpa ruled the north; Huáscar controlled the south; others like Manco Inca were also relevant. Atahualpa won the civil war just before Pizarro's arrival — but his victory was hollow, the empire fragmented, his rule contested.",cat:"rc_peru"},{id:"rc68",q:"What happened at Cajamarca?",a:"History's most audacious ambush. Pizarro lured Atahualpa to the plaza with a force of largely unarmed warriors — Atahualpa came with curiosity or a show of power rather than aggression. Fray Valverde demanded Christianity and submission, presenting a Bible. Atahualpa discarded it (La Vega notes interpreter Felipillo badly distorted Valverde's speech). Valverde signaled the attack: 168 Spaniards with cannons, cavalry, and steel slaughtered thousands of lightly armed Incas. Atahualpa captured.",cat:"rc_peru"},{id:"rc69",q:"Who was Felipillo and why does he matter?",a:"Felipillo was the first interpreter used by the Spanish in Peru. According to the chronicler La Vega, Felipillo's poor translation of Fray Valverde's speech to Atahualpa at Cajamarca badly distorted its meaning, contributing to the violence that followed. When Atahualpa discarded the Bible, it may have been partly due to miscommunication rather than deliberate rejection. Highlights how language barriers and cultural misunderstandings shaped the conquest.",cat:"rc_peru"},{id:"rc70",q:"What was Atahualpa's ransom and how did he die?",a:"Atahualpa offered an extraordinary ransom — enough gold to fill a room — and Huáscar tried to match it. The Spanish took both offers and then executed Atahualpa anyway, after a mock trial on charges of rebellion. He was garroted in Cajamarca's plaza after accepting baptism (1533). Sources broadly agree on strangulation though details vary.",cat:"rc_peru"},{id:"rc71",q:"How was Fray Valverde connected to the attack of the Spaniards?",a:"He delivered a religious ultimatum to Atahualpa, demanding acceptance of Christianity and Spanish rule under Charles V, presenting a Bible. When Atahualpa rejected it by discarding the Bible (or perhaps misunderstanding due to Felipillo's bad translation), Valverde signaled Pizarro to launch the ambush. A calculated move — the speech provided a legal and moral pretext for violence, reflecting the conquistadors' blend of faith and opportunism.",cat:"rc_peru"},{id:"rc72",q:"What were the \"Post-Conquest Troubles\" in Peru?",a:"Revealed conquistadors' true nature. Pizarro installed Manco (a brother of Huáscar) as puppet ruler. Manco rebelled 1536. Pizarro vs Almagro feud over Cusco: Almagro strangled 1538; his \"knights of the cape\" assassinated Pizarro 1541. Gonzalo Pizarro revolted against the New Laws, killed Viceroy Blasco Núñez Vela 1546, briefly ruled Peru — defeated by Pedro de la Gasca 1548. Conquistadors driven by personal gain, not loyalty to Spain.",cat:"rc_peru"},{id:"rc73",q:"How did \"a handful of Spaniards\" win two empires?",a:"Five factors — ALL needed: (1) Superior technology — steel, guns, horses. (2) Indigenous alliances — Tlaxcalans vs Aztecs, rival Inca factions. (3) Disease — smallpox devastated both empires before fighting. (4) Centralized rule — capturing the divine ruler paralyzed the entire command structure. (5) Religious/cultural misunderstandings — Quetzalcoatl prophecy, ritual warfare prioritizing capture. Remove any single factor and the conquests might have failed.",cat:"rc_peru"},{id:"rc74",q:"What sort of men were the conquistadors?",a:"A varied mix: soldiers, hidalgos, commoners, artisans, and fugitives — mostly ambitious, ruthless men shaped by Spain's violent and unequal society. Castilians dominated; Andalusians led the Caribbean phase, Extremadurans (Pizarro, Cortés) the mainland phase. Extremadura's poverty drove its men to seek wealth abroad. Pizarro was illiterate; Cortés had a law education — but both were driven by the same trinity: God, Gold, Glory.",cat:"rc_peru"},{id:"rc75",q:"Explain the trinity of motives: God, Gold, and Glory.",a:"Gold was the primary driver, with conquistadors like Pizarro openly prioritizing wealth. Glory motivated status-seekers — turning themselves from poor hidalgos into noblemen with titles. God was a distant third, often a rhetorical cover for material aims. The Reconquista's templates of crusade and conversion provided legal and ideological justification for what was overwhelmingly economic plunder.",cat:"rc_peru"},{id:"rc76",q:"Who was Agustín de Zárate?",a:"A Spanish historian and royal auditor (born ~1492) who arrived in Peru in 1543 to audit the colonial accounts. He wrote one of the key chronicles of the Conquest of Peru — Historia del descubrimiento y conquista del Perú (1556). He delayed writing while in Peru because Gonzalo Pizarro's rebellion (1544–48) made it dangerous to produce any politically sensitive account. His position as a royal official also meant he had to present events favorably to the Crown.",cat:"rc_peru"},{id:"rc77",q:"What does J.M. Cohen say about the relationship between the conquistadors and the Spanish State?",a:"Conquistadors operated semi-autonomously under royal contracts, gaining wealth (Atahualpa's ransom) but clashing over rewards (Pizarro–Almagro feud) and defying reforms (New Laws, Gonzalo's revolt). The crown, initially weak, relied on them for conquest but reasserted control through officials like Vaca de Castro and Gasca, punishing rebels to enforce loyalty.",cat:"rc_peru"},{id:"rc78",q:"How are the Moors mentioned in the context of the conquistadors?",a:"\"The frontier wars against the Moors had bred a race of gentlemen proud of their Christian blood but without a penny. Their one resource was to go to the wars.\" Their poverty, coupled with a warrior ethos forged in anti-Moorish campaigns, drove them to the New World, where conquest offered wealth and status unavailable in Spain. Cortés explicitly compared indigenous architecture to Granada.",cat:"rc_peru"},{id:"rc154",q:"What was the Capitulación de Toledo?",a:"A 1529 contract between Pizarro and the Crown (negotiated by his half-brother Hernando in Spain). Granted Pizarro the title Adelantado, Governor, and Captain General of \"New Castile\" extending 200 leagues south from Panama. Diego de Almagro got a lesser title. Pizarro's brothers got governorships and pensions. The document deliberately gave Pizarro the better territory, sowing the seeds of the later civil war with Almagro. Showed how royal contracts converted private adventurers into licensed agents of conquest.",cat:"rc_peru"},{id:"rc155",q:"What infrastructure did the Inca Empire have?",a:"~40,000 km of stone-paved roads (the Qhapaq Ñan) crossing deserts, mountains, and rainforest — comparable to the Roman road network. Tambos (waystations) every ~20 km supplied chasquis (relay runners) who could carry messages 240 km/day. The Incas had no writing but recorded census, tax, and historical data on quipus — knotted cord systems that encoded numbers and possibly narratives (still partly undeciphered). The roads and tambos paradoxically enabled rapid Spanish movement after conquest. Bureaucracy without writing — and Spaniards used it.",cat:"rc_peru"},{id:"rc156",q:"How did the Inca civil war prepare the way for Pizarro?",a:"Emperor Huayna Capac died ~1527, probably of smallpox (which had spread overland from Mexico ahead of European arrival). His designated heir Ninan Cuyochi died simultaneously. The throne was disputed by half-brothers: Atahualpa (based in Quito, supported by the army) and Huáscar (based in Cusco, supported by the priestly caste). After ~5 years of civil war, Atahualpa's generals captured and executed Huáscar in April 1532 — just as Pizarro landed. The empire was fractured, exhausted, and bitterly divided when 168 Spaniards arrived.",cat:"rc_peru"},{id:"rc157",q:"How did 168 Spaniards capture an emperor surrounded by 80,000 men?",a:"16 November 1532. Pizarro hid 168 Spaniards (62 cavalry, 106 infantry, 12 cannon) inside Cajamarca's stone buildings. Atahualpa entered the town square with ~6,000 lightly armed retainers (his army camped outside). After Valverde's Bible exchange and Atahualpa's rejection, the Spaniards fired cannon and charged. Trumpets and gunfire panicked the Inca attendants in the enclosed square; 2,000–7,000 were slaughtered without a single Spanish death. Atahualpa was seized. The empire's command-and-control structure collapsed instantly because all decision-making passed through the captive emperor.",cat:"rc_peru"},{id:"rc158",q:"How big was Atahualpa's ransom?",a:"Atahualpa offered to fill a room (~6 × 5 m) once with gold and twice with silver to a height of ~2.5 m. Eight months of caravans brought ~6,000 kg of gold and ~12,000 kg of silver — worth perhaps $1.5–2 billion in today's value. The royal fifth (quinto) for Charles V was paid; Pizarro and his men split the rest, with horsemen receiving twice the share of footmen. Pizarro himself received an additional ~70 kg of gold and Atahualpa's throne. Despite payment, Pizarro had Atahualpa executed on 26 July 1533 — a notorious betrayal.",cat:"rc_peru"},{id:"rc159",q:"What was the Manco Inca rebellion?",a:"Pizarro installed Manco Inca (a son of Huayna Capac) as puppet emperor in 1533. Disillusioned by Spanish abuse — his wives raped, his treasures looted — Manco escaped Cusco in 1536 and led an army of perhaps 100,000 to besiege the city. Hernando Pizarro and ~190 Spaniards held out for 10 months. The rebels burned the Coricancha and pushed the Spaniards into a single corner. Spanish cavalry sallies broke the besiegers (Battle of Sacsayhuamán, May 1536). Manco retreated to the jungle stronghold of Vilcabamba, where his successors held out until 1572.",cat:"rc_peru"},{id:"rc160",q:"How did Pizarro and Almagro fall out?",a:"Almagro had been promised territory south of Pizarro's grant. His exploration of Chile (1535–37) found no gold. Returning, he claimed Cusco was within his territory and seized it (1537). Battle of Las Salinas (April 1538) saw Hernando Pizarro defeat Almagro, who was garrotted in Cusco. Almagro's mestizo son (\"the Lad\") swore vengeance: 26 June 1541, his \"Knights of the Cape\" assassinated Francisco Pizarro in his Lima palace — Pizarro reportedly drew his cross in his own blood as he died. Conquerors murdered each other faster than they died fighting Incas.",cat:"rc_peru"},{id:"rc161",q:"What was the Neo-Inca State at Vilcabamba?",a:"After Manco's 1536 retreat, an independent Inca state survived in the rainforest at Vilcabamba (in the cloud forest north-west of Cusco) for 36 years under Manco, Sayri Tupac, Titu Cusi, and Tupac Amaru I. Conducted hit-and-run raids, sheltered refugees, kept the Inca religion. Tupac Amaru I was finally captured and beheaded in Cusco's Plaza de Armas on 24 September 1572 by Viceroy Toledo. Vilcabamba's existence shows the conquest was a long, unfinished process, not a single dramatic moment in 1532–33.",cat:"rc_peru"},{id:"rc162",q:"Who was Tupac Amaru II and how big was his rebellion?",a:"José Gabriel Condorcanqui, a wealthy mestizo cacique who claimed descent from Tupac Amaru I, took the name Tupac Amaru II and led the largest indigenous uprising in colonial Latin America (1780–83). The rebellion mobilised ~100,000 indigenous combatants across southern Peru, Bolivia, and Argentina. ~100,000 deaths overall (including civilian massacres). Tupac Amaru II was executed by quartering in Cusco on 18 May 1781; his wife Micaela Bastidas was strangled. The rebellion accelerated Spanish reform and inspired creole independence movements. Modern Andean indigenous movements still invoke his memory.",cat:"rc_peru"},{id:"rc163",q:"How important was Potosí?",a:"Cerro Rico (\"rich hill\") in modern Bolivia — the world's largest silver source from 1545 to ~1700. Yielded ~50,000 tonnes of silver during the colonial period (~80% of all New World silver). Potosí's population peaked at ~160,000 around 1610 — larger than London or Paris at the time. Powered by the mita system: ~13,500 indigenous men annually conscripted from a 200 km radius. Mortality was horrific. The Spanish phrase \"vale un Potosí\" (\"worth a Potosí\") meant priceless. Funded the Habsburg empire — and inflated European prices through the silver flood.",cat:"rc_peru"},{id:"rc164",q:"How did the Spaniards use the Inca infrastructure?",a:"Pizarro and his successors used Inca roads, tambos, and chasqui networks immediately. They imposed Spanish administrative geography on top: Lima (founded 1535) replaced Cusco as capital because it had a port. Inca tambos became Spanish tax-collection points; quipucamayocs (quipu-keepers) were retained as colonial accountants until ~1580 when the Crown ordered Spanish-trained scribes. The conquest preserved Inca infrastructure precisely because it was efficient — turning the world's most centralised pre-Columbian state into a colonial machine.",cat:"rc_peru"},{id:"rc165",q:"How do historians view Pizarro's conquest?",a:"TRADITIONAL (Prescott, 1847): a great Spanish achievement; Atahualpa's death tragic but legalistic. INDIGENISTA (early 20th-century Peruvian, José Carlos Mariátegui): Conquest as catastrophe; calls for return to Inca communalism. NEW PHILOLOGY (John Rowe, John Murra): close reading of Andean sources to recover indigenous categories. POSTCOLONIAL (Karen Spalding, Susan Ramirez): emphasises indigenous agency, hybrid identities, and slow rather than instant conquest. ENVIRONMENTAL (Charles Mann): smallpox arrived ahead of Pizarro and caused the civil war that opened the door — biology, not biography.",cat:"rc_peru"},{id:"rc166",q:"How do the conquests of Mexico and Peru compare?",a:"SIMILARITIES: small Spanish forces; capture of supreme ruler paralysed central command; smallpox devastated indigenous populations; conquistadors clashed with each other after victory. DIFFERENCES: (1) Mexico had pre-existing rivals (Tlaxcalans); Peru's resistance came from Manco's later rebellion. (2) Tenochtitlán was destroyed; Cusco preserved (initially). (3) Mexican Conquest was led by literate Cortés; Peruvian by illiterate Pizarro. (4) Mexican Aztec language (Nahuatl) survived as a lingua franca; Quechua likewise. (5) Peruvian conquistadors fought among themselves more violently. Mexico's Conquest produced one viceroy; Peru's produced civil war.",cat:"rc_peru"},{id:"rc167",q:"Why was capturing the emperor decisive in both empires?",a:"Both Aztec and Inca rulers were divine intermediaries — Moctezuma was tlatoani (\"speaker\") of the gods; the Sapa Inca was \"Son of the Sun.\" Religious and political authority were fused; subordinates derived legitimacy from the emperor in person. Capturing him paralysed not just political command but cosmic order. Spaniards (perhaps unintentionally) struck at the regime's spiritual centre. The decentralised Maya states by contrast resisted Spanish conquest for ~200 years (the Itzá Maya were not subdued until 1697).",cat:"rc_peru"},{id:"rc168",q:"Who were Cieza de León and Garcilaso de la Vega?",a:"Pedro Cieza de León (1520–54) was a Spanish foot soldier turned chronicler whose Crónica del Perú (1553) is the most balanced contemporary account — interviewed surviving Inca nobles before the war's bitterness silenced them. Inca Garcilaso de la Vega (1539–1616) was the mestizo son of a Spanish captain and an Inca princess; his Royal Commentaries of the Incas (1609) gave Europe its first internal portrait of pre-conquest Inca life. Both shaped subsequent historiography — and both are cautionary cases for source criticism.",cat:"rc_peru"},{id:"rc79",q:"What was the Encomienda system?",a:"Backbone of colonial exploitation. Encomenderos granted authority over indigenous groups — required labour/tribute/goods in exchange for supposed protection and Christian instruction. Legally not slavery, but the distinction was often meaningless. Mirrored feudal arrangements from the Reconquista transplanted to a new continent. The Mita system in the Andes went further — rotational mine labour that frequently killed workers.",cat:"rc_colonial"},{id:"rc80",q:"What was the Mita system?",a:"A colonial labour system in Spanish America, particularly in the Andes, adapted from the Inca mit'a tax. Indigenous communities were required to provide a certain number of workers for a set period to work in mines (especially Potosí silver mines), plantations, or public projects, often under harsh conditions. Intended as rotational labour but frequently led to forced displacement, exploitation, and death. A key mechanism of colonial wealth extraction.",cat:"rc_colonial"},{id:"rc81",q:"How did the encomienda change at the end of the 16th century?",a:"A combination of laws and economic factors. The New Laws (1542–43) prohibited indigenous enslavement, limited inheritance, and increased royal oversight. Indigenous population decline due to disease and overwork reduced labour availability. The rise of silver mining and other industries shifted economic priorities toward systems like the mita and wage labour. By the late 16th century, the encomienda became more about tribute collection than direct labour control.",cat:"rc_colonial"},{id:"rc82",q:"Who was Bartolomé de Las Casas?",a:"Arrived 1502 as colonist and encomendero. In 1514, dramatic conversion after witnessing atrocities and hearing a sermon denouncing the encomienda. Became Dominican friar, \"Protector of the Indians.\" Wrote A Short Account of the Destruction of the Indies (1542) documenting colonial horrors. Influenced the New Laws (1542–43). Debated Sepúlveda at Valladolid (1550–51). His mature position: indigenous people should be free subjects of the Crown, evangelized peacefully.",cat:"rc_colonial"},{id:"rc83",q:"What did Las Casas think of the Encomienda?",a:"Fundamentally unjust and un-Christian. Encomenderos prioritized profit over their supposed duty to protect and convert. He saw the system as a betrayal of Spain's religious mission. His mature position: indigenous people should be free subjects of the Crown, evangelized peacefully without coercion. He briefly served as \"Protector of the Indians.\" His writings influenced the New Laws (1542–43), which were rolled back after Gonzalo Pizarro's rebellion.",cat:"rc_colonial"},{id:"rc84",q:"What were the New Laws?",a:"Enacted under Charles V, heavily influenced by Las Casas. Key provisions: encomiendas could NOT be inherited (ending their permanence); indigenous enslavement banned; labour burdens reduced. Las Casas briefly appointed \"Protector of the Indians.\" BUT: Gonzalo Pizarro led a rebellion in Peru (1544–48), killing the Viceroy. The Crown was forced to weaken enforcement — revealing the limits of reform when those profiting had armies.",cat:"rc_colonial"},{id:"rc85",q:"Why were the nobles and old conquistadors threatened by Las Casas?",a:"His arguments directly challenged the encomienda system, which granted them wealth and power through indigenous labour and tribute. His advocacy for humane treatment, indigenous rights, and abolition of encomiendas risked dismantling their economic and social dominance, potentially redistributing power to the crown and undermining their privileged status in colonial society. Cortés among others responded with hostility.",cat:"rc_colonial"},{id:"rc86",q:"What was the Valladolid Debate?",a:"Intellectual climax of the colonial moral crisis. Sepúlveda (citing Aristotle): indigenous peoples were \"natural slaves,\" justifying conquest/forced conversion due to alleged inferiority and idolatry. Las Casas: they were rational humans with inherent rights, advocating peaceful evangelization. Sepúlveda backed by colonial elites (encomenderos) and humanists. Las Casas by Dominican/Franciscan missionaries and parts of the Crown. No clear winner declared, but Las Casas's arguments planted seeds of modern human rights discourse.",cat:"rc_colonial"},{id:"rc87",q:"How was the Conquest of the New World a continuation of the Reconquest in Iberia?",a:"Direct continuation. The Reconquista aimed to erase Muslim and Jewish influences and impose a uniform Christian identity on Iberia — this impulse carried over to the Americas, where Spain sought to overwrite Indigenous cultures. Carlos Fuentes: Reconquista's focus on domination/exclusion became the template. \"The frontier wars against the Moors had bred a race of gentlemen proud of their Christian blood but without a penny.\" Cortés compared indigenous architecture to Granada. Extremaduran poverty drove men abroad. The trinity: God, Gold, Glory. Encomienda echoed Reconquista feudalism. The Requerimiento mirrored crusading ideology.",cat:"rc_colonial"},{id:"rc88",q:"What did Fuentes mean by \"America was invented\"?",a:"When Columbus arrived in 1492 and Cortés, Pizarro, and others followed, they didn't merely uncover a static land — they actively shaped it into something new through imagination, violence, and imposition. They dismantled empires (Moctezuma's Aztecs, Atahualpa's Incas) and rebuilt them as colonial domains like New Spain and Peru. The conquistadors might have founded democracy, as later settlers did elsewhere, but Spain's authoritarianism buried that possibility.",cat:"rc_colonial"},{id:"rc89",q:"What was the Black Legend?",a:"\"Leyenda negra\" — narrative of unique Spanish cruelty. Ironically fueled by Las Casas's own writings, translated by Spain's Protestant rivals (England, Netherlands) as anti-Spanish propaganda. Las Casas described atrocities to reform the system, not destroy it. His vivid accounts were exaggerated by rivals to depict Spaniards as barbaric and fanatical, boosting anti-Spanish propaganda — despite Las Casas's reformist intent.",cat:"rc_colonial"},{id:"rc90",q:"Who wrote A Short Account of the Destruction of the Indies (1542) and what did it do?",a:"Bartolomé de Las Casas. It denounces the brutal Spanish conquest and colonisation, detailing massacres, enslavement, and exploitation of indigenous peoples under the encomienda. Aimed at the Spanish crown, it sought reforms to protect indigenous rights and promote peaceful evangelisation. Translated and spread by Spain's rivals, its vivid accounts of atrocities were exaggerated to fuel the Black Legend — ironic, given Las Casas's reformist intent.",cat:"rc_colonial"},{id:"rc91",q:"What was the Church's role in the colonies?",a:"Complex. Initial friars — shaped by Cardinal Cisneros's reforms — were elite, driven by missionary zeal. Some (Vasco de Quiroga, Las Casas) envisioned utopian indigenous communities. But reformist attitudes clashed with encomenderos' exploitation. Under the patronato, the Spanish Crown had absolute authority over colonial clergy — the Church served the state. Power rivalled royalty under Habsburgs (1516–1700), later curbed by Bourbons.",cat:"rc_colonial"},{id:"rc92",q:"Why were the early friars in the New World of unusually high quality?",a:"They were an elite group, shaped by a revival of asceticism and discipline in the Spanish Church. Driven by reforms of the catholic sovereigns and Cardinal Cisneros's strict enforcement of discipline and asceticism. Characterised by missionary zeal and social conscience. The unprecedented opportunity to evangelise a new population drew passionate, reform-minded clergy who saw their work as a divine calling.",cat:"rc_colonial"},{id:"rc93",q:"What did Vasco de Quiroga and Las Casas attempt — and why was it doomed?",a:"They admired the indigenous people's simplicity and virtues, envisioning a fusion of cultures under Christianity to create utopian communities untainted by European corruption. Doomed because their reformist attitudes clashed with the exploitative Spanish encomenderos and colonial authorities, who prioritised profit over indigenous welfare. The encomenderos' political and economic power could not be overcome by isolated reformers.",cat:"rc_colonial"},{id:"rc94",q:"What did Burkhart observe about indigenous Christianity?",a:"The Aztecs \"were able to become just Christians enough to get by in the colonial setting without compromising their basic ideological and moral orientation.\" They adopted Christian practices to navigate the system while preserving core beliefs. The Day of the Dead — merging Aztec rituals honoring Mictecacihuatl (death goddess) with All Saints' Day and All Souls' Day — is living proof the conquered were never truly conquered in spirit.",cat:"rc_colonial"},{id:"rc95",q:"What is Latin American Liberation Theology and its link to Las Casas?",a:"A 20th-century theological movement among Catholic theologians and clergy in Latin America emphasising social justice — advocating for the poor and oppressed by interpreting Christian teachings through the lens of liberation. Las Casas is a significant historical precursor — known as \"Defender of the Indians,\" he criticised colonial exploitation and argued indigenous peoples were fully human with inherent rights. Theologians like Gustavo Gutiérrez cite Las Casas as an early example of Christian commitment to defending the oppressed.",cat:"rc_colonial"},{id:"rc96",q:"What was the Requerimiento?",a:"A Spanish legal document read aloud to indigenous peoples before attacking them. It demanded they accept Christianity and submit to Spanish rule, threatening war if they refused. Read in Spanish (which no indigenous person understood), often from a distance — a legal fiction justifying conquest. It recycled the same crusading ideology used against Muslims during the Reconquista against indigenous peoples of the Americas.",cat:"rc_colonial"},{id:"rc97",q:"What did Fuentes mean: the conquistadors \"might have been the fathers of their own political democracy\"?",a:"He's contrasting their actual legacy — colonial domination — with a hypothetical one. The conquistadors' boldness and independence could have sparked a New World democracy, as later English settlers did. Their grit and ambition pointed in that direction. But Spain's authoritarianism and the Crown's bureaucratic centralization buried that possibility, locking Spanish America into rigid hierarchies that shaped its political development for centuries.",cat:"rc_colonial"},{id:"rc169",q:"What was the Consejo de Indias?",a:"Established 1524, the Council of the Indies was the supreme administrative body governing Spanish America from Madrid. Members appointed by the Crown advised on legislation, judicial appeals, and viceregal appointments. Issued the Recopilación de Leyes de Indias (1681) — a massive 9-book code of colonial law. Centralised colonial policy and ensured the Crown — not the conquistadors — set the rules. The most powerful colonial bureaucracy of the early-modern world; lasted until 1834.",cat:"rc_colonial"},{id:"rc170",q:"What was the Casa de Contratación?",a:"The \"House of Trade\" established 1503 in Seville (moved to Cádiz 1717). Monopolised all trade and migration between Spain and the Americas. Licensed every ship, recorded every cargo, trained pilots, and held the Padrón Real (the official world map updated by every returning navigator). All gold and silver from the Americas passed through its accounts. Made Seville Europe's wealthiest city in the 16th century — and made the Spanish empire ferociously over-centralised and inefficient.",cat:"rc_colonial"},{id:"rc171",q:"How was Spanish America administered?",a:"Two original viceroyalties: New Spain (1535, Mexico City — included today's Mexico, Central America, Caribbean, Philippines) and Peru (1542, Lima — included most of South America). Two more added in the 18th century: New Granada (1717, Bogotá) and Río de la Plata (1776, Buenos Aires). Each viceroy was the king's direct representative, served ~3–5 years, and was checked by audiencias (royal courts) and visitas (royal inspections). Designed to prevent any colonial power base from rivalling Madrid.",cat:"rc_colonial"},{id:"rc172",q:"What was the repartimiento?",a:"A system replacing the encomienda after the New Laws (1542). Royal officials (corregidores), not encomenderos, conscripted indigenous labour for set periods at fixed wages — for mines, public works, and agriculture. In Mexico called repartimiento; in Peru called mita (with deeper Inca roots). Officially better than encomienda — workers paid, time-limited — but in practice corregidores extorted more labour, often colluded with miners, and ran the abusive \"repartimiento de mercancías\" forcing indigenous to buy overpriced goods. Lasted until ~1812.",cat:"rc_colonial"},{id:"rc173",q:"How brutal was the mita system at Potosí?",a:"Implemented by Viceroy Toledo (1572). Each year ~13,500 indigenous men aged 18–50 (the \"mitayos\") were drafted from a 200-km area, walking up to 1,000 km to Potosí. Term: 1 year of work, then 6 years off (in theory). Conditions: 8-day shifts deep underground, constant exposure to mercury vapour and silica dust, extreme cold at altitude (~4,000 m). Mortality: estimates range from 10% to 30% per term. Many never returned home. Whole indigenous communities depopulated. Acosta wrote: \"The mines are like maws that consume men.\"",cat:"rc_colonial"},{id:"rc174",q:"What was the Asiento and how did Africans enter Spanish America?",a:"As indigenous populations collapsed, Spain imported enslaved Africans. Spain itself had no African coast colonies, so it sold the asiento (a slave-trade monopoly) to Portuguese, Dutch, French, and finally British contractors (the Treaty of Utrecht 1713 gave it to British South Sea Company). ~1.5 million enslaved Africans were shipped to Spanish America (~1500–1820), concentrated in Caribbean sugar plantations, Mexican silver towns, and Peruvian coast haciendas. Less than the British Caribbean (~3 million) but produced significant Afro-Hispanic populations in Cuba, Venezuela, Colombia.",cat:"rc_colonial"},{id:"rc175",q:"What was the casta system?",a:"A hierarchical racial classification developed in 18th-century Spanish America. Categories included: peninsulares (Spanish-born), criollos (American-born Spaniards), mestizos (Spanish + indigenous), mulatos (Spanish + African), zambos (African + indigenous), and ~16 finer mixtures (each painted in famous \"casta paintings\"). Rights and taxes varied by category; colonial offices reserved for peninsulares; tributes demanded only from indigenous and (sometimes) Afro-descendants. Racial classification fundamentally shaped Latin American social structure into the 20th century.",cat:"rc_colonial"},{id:"rc176",q:"What were the Bourbon Reforms?",a:"After Charles III (1759–88), Spain attempted to modernise the empire on French lines. Created the new viceroyalties (New Granada, Río de la Plata); restructured the army; expelled the Jesuits (1767, ~2,500 expelled); replaced creole-favouring intendant system; raised taxes (the alcabala); freed intra-imperial trade (Reglamento de Comercio Libre 1778). Doubled colonial revenues by 1790 — but alienated criollos by reasserting peninsular dominance. The reforms helped fund Spain's recovery but planted the grievances that exploded in 1810–25 independence wars.",cat:"rc_colonial"},{id:"rc177",q:"What was the Manila Galleon and why did it matter?",a:"1565–1815: annual ships sailed Acapulco–Manila across the Pacific, exchanging Mexican silver for Chinese silk, porcelain, and spices. ~250 years of operation made Mexico City the hub of an Atlantic-Pacific commercial system. Mexican silver underwrote the global early-modern economy: ~1/3 of Potosí silver ended up in China by 1700. Created Filipino-Mexican cultural exchanges (chocolate to Asia, mango to America). Showed Spain's empire was not just Atlantic — it was the first truly global commercial system.",cat:"rc_colonial"},{id:"rc178",q:"How did mestizaje (racial mixing) reshape Spanish America?",a:"From 1521 onwards Spanish conquistadors and settlers (overwhelmingly male) had children with indigenous, then African, women. Cortés had a son with Malintzin (Martín Cortés \"el mestizo\"). By 1810 Mexico had ~1 million peninsulares, ~3.5 million criollos, ~1.3 million mestizos, ~3.7 million indigenous, ~600,000 Afro-Mexicans. Mestizaje was both biological reality and political ideology: 20th-century Mexican intellectuals (José Vasconcelos, La raza cósmica 1925) celebrated it as a national virtue. Spanish America became fundamentally hybrid in a way that British North America did not.",cat:"rc_colonial"},{id:"rc179",q:"How did Catholic missions function?",a:"Franciscans, Dominicans, Augustinians, and (after 1572) Jesuits established missions across the empire — from California to Patagonia. Missions concentrated dispersed indigenous populations into reducciones / pueblos for \"Christianisation\" and labour control. Famous examples: California's 21 Franciscan missions (1769–1833); Paraguay's Jesuit reductions (~30 Guaraní towns, 1609–1767, sheltered ~150,000); Florida's missions; Texas. Mixed legacy: protected some indigenous from colonists' worst abuses, but enforced labour discipline and accelerated cultural loss. Missions were also the front line of colonial expansion.",cat:"rc_colonial"},{id:"rc180",q:"Why were the Paraguayan reductions exceptional?",a:"30 Jesuit-run mission towns of the Guaraní (modern Paraguay, Argentina, Brazil) flourished 1609–1767. Self-governing under Jesuit supervision; Guaraní language, music, and printed books in Guaraní. Resisted Portuguese slave-raiders (\"bandeirantes\") with their own indigenous militias armed with firearms. Population: ~150,000 at peak. Expelled by Charles III in 1767 alongside all Jesuits in the empire. Their dissolution unleashed the slave-raiding the missions had blocked. The 1986 film \"The Mission\" dramatises the system. Voltaire and Rousseau called it the most successful experiment in benevolent government.",cat:"rc_colonial"},{id:"rc181",q:"Who was Sor Juana Inés de la Cruz?",a:"A Mexican Hieronymite nun (1648–95), self-taught polymath — poet, philosopher, and proto-feminist. Her Respuesta a Sor Filotea (1691) defended women's right to study. Wrote dozens of plays, theological treatises, and love poetry praised across the Spanish-speaking world. The Bishop of Puebla forced her to abandon her library in 1694; she died nursing plague victims a year later. Now an icon of Mexican feminism (her face on the 200-peso bill). Showed colonial America could produce world-class intellectuals — and how the Church could silence them.",cat:"rc_colonial"},{id:"rc182",q:"Who was Guaman Poma and why is he important?",a:"Andean noble (~1535–1616) who wrote and illustrated the 1,200-page Nueva corónica y buen gobierno around 1615 — addressed to King Philip III. 398 line drawings depict pre-conquest Inca life, conquest, and colonial abuses. His critique: Spanish conquerors and priests had perverted both Inca order and Christian doctrine; he proposed a restored Andean kingdom under Spanish suzerainty. The manuscript vanished into Copenhagen's Royal Library, rediscovered 1908. Now a foundational source for indigenous perspectives on colonisation.",cat:"rc_colonial"},{id:"rc183",q:"What was the Black Legend (Leyenda Negra)?",a:"Anti-Spanish propaganda emerging in 16th-century Protestant Europe (Dutch, English, German). Portrayed Spaniards as uniquely cruel, fanatical, lazy, and racially mixed. Drew on Las Casas's Brevísima relación (1552) — translated into Dutch, French, English, German with lurid illustrations by Theodor de Bry. Reinforced by Spain's Catholic-Habsburg geopolitical role. Persisted into modern textbooks. Counter-arguments (the \"White Legend\" by Spanish nationalists, or \"neutral\" treatments by Henry Kamen): Spanish colonialism was no more brutal than English/Dutch — Las Casas himself was a Spanish friar.",cat:"rc_colonial"},{id:"rc184",q:"How was the Requerimiento actually used?",a:"From 1513, conquistadors were legally required to read the Requerimiento (drafted by jurist Palacios Rubios) to indigenous peoples before attacking — informing them of papal donation of the Americas to Spain and demanding submission. Surrender = vassalage; refusal = legal slavery and conquest. In practice it was read in Latin/Spanish to non-speakers, often from a hilltop, sometimes muttered into a beard, sometimes read to empty villages, sometimes to chained captives at night. Even Spanish jurists found it absurd: chronicler Oviedo reportedly laughed when told to read it. Pure legal fiction — but the fiction mattered.",cat:"rc_colonial"},{id:"rc185",q:"What was Las Casas's full trajectory?",a:"Born 1484, arrived in Hispaniola 1502 as a young encomendero. Ordained 1510 (first priest in the Americas). Renounced his encomienda 1514, becoming the great defender of indigenous rights. Helped draft the New Laws (1542). Bishop of Chiapas (1544–47) — refused absolution to encomenderos. Won the formal Valladolid Debate against Sepúlveda (1550–51). Wrote Brevísima relación de la destrucción de las Indias (1552) and the longer Historia de las Indias (published posthumously). Died 1566 still petitioning the Crown. Saved many lives but made the Black Legend's case unintentionally.",cat:"rc_colonial"},{id:"rc186",q:"Why did the New Laws of 1542 fail?",a:"Issued by Charles V at Las Casas's urging (28 November 1542). Banned indigenous slavery, future encomienda grants, and inheritance of existing encomiendas; required treatment of indigenous as Crown subjects. Encomenderos rebelled: in Peru, Gonzalo Pizarro killed the first viceroy enforcing the laws (1546); in Mexico, Viceroy Mendoza simply suspended enforcement. By 1545 inheritance clauses were repealed; encomiendas effectively continued for two more generations. Showed how colonial elites could veto Crown reforms when geography put them out of reach.",cat:"rc_colonial"},{id:"rc187",q:"What is the long-term legacy of Spanish colonialism in Latin America?",a:"ECONOMIC: persistent inequality (highest in the world by the late 20th century — the \"extractive institutions\" trap of Acemoglu & Robinson); commodity dependence; weak fiscal capacity. POLITICAL: centralised executives, weak rule of law, persistent caudillismo, gaps between formal law and informal practice. CULTURAL: dominant Spanish language (~480 million speakers, the world's #2 native language); Catholic majority; Spanish-indigenous-African mestizaje; the casta legacy in racial hierarchies. RELIGIOUS: vibrant Catholic-indigenous syncretism (Virgin of Guadalupe, Day of the Dead). 200 years after independence, the colonial era's structures still shape Latin American development.",cat:"rc_colonial"}];
